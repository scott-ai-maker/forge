<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forge Athletic — Master Exercise Library Visual Audit Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #080C14;
      --card-bg: #101726;
      --card-border: #1E293B;
      --card-hover: #26334D;
      --accent-cyan: #06B6D4;
      --accent-indigo: #6366F1;
      --accent-emerald: #10B981;
      --accent-amber: #F59E0B;
      --accent-rose: #F43F5E;
      --text-main: #F8FAFC;
      --text-muted: #94A3B8;
      --text-dim: #64748B;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg-dark);
      color: var(--text-main);
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      background: rgba(16, 23, 38, 0.95);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--card-border);
      position: sticky;
      top: 0;
      z-index: 100;
      padding: 16px 24px;
    }
    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      flex-wrap: wrap;
      gap: 16px;
    }
    .brand-title {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .brand-title h1 {
      font-size: 1.25rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      background: linear-gradient(135deg, #FFFFFF, #94A3B8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .brand-badge {
      font-size: 0.75rem;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 9999px;
      background: rgba(99, 102, 241, 0.15);
      border: 1px solid rgba(99, 102, 241, 0.3);
      color: #A5B4FC;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .stats-bar {
      display: flex;
      gap: 12px;
      font-size: 0.8rem;
      flex-wrap: wrap;
    }
    .stat-pill {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 12px;
      border-radius: 8px;
      background: #172033;
      border: 1px solid var(--card-border);
    }
    .stat-pill strong { font-weight: 800; color: #fff; }
    .stat-pill.baseline strong { color: var(--accent-cyan); }
    .stat-pill.approved strong { color: var(--accent-emerald); }
    .stat-pill.kept strong { color: #818CF8; }
    .stat-pill.flagged strong { color: var(--accent-rose); }
    .stat-pill.warnings strong { color: var(--accent-amber); }

    .header-controls {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      align-items: center;
    }
    .search-box {
      flex: 1;
      min-width: 260px;
      position: relative;
    }
    .search-box input {
      width: 100%;
      background: #0B111E;
      border: 1px solid var(--card-border);
      color: #fff;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 0.85rem;
      outline: none;
      transition: border-color 0.15s;
    }
    .search-box input:focus {
      border-color: var(--accent-cyan);
    }
    select, button {
      background: #0B111E;
      border: 1px solid var(--card-border);
      color: var(--text-main);
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      outline: none;
      transition: all 0.15s;
    }
    select:focus, button:hover {
      border-color: var(--accent-cyan);
    }
    button.btn-primary {
      background: linear-gradient(135deg, #0284C7, #2563EB);
      border: none;
      color: #fff;
    }
    button.btn-primary:hover {
      opacity: 0.9;
    }
    button.btn-export {
      background: #1E293B;
      border: 1px solid var(--card-border);
    }
    button.btn-toggle-all {
      background: rgba(99, 102, 241, 0.15);
      border: 1px solid rgba(99, 102, 241, 0.4);
      color: #C7D2FE;
    }
    button.btn-toggle-all:hover {
      background: rgba(99, 102, 241, 0.3);
    }

    main {
      flex: 1;
      padding: 24px;
      max-width: 1680px;
      margin: 0 auto;
      width: 100%;
    }
    .keyboard-hint {
      display: flex;
      gap: 16px;
      font-size: 0.75rem;
      color: var(--text-dim);
      margin-bottom: 20px;
      font-family: 'JetBrains Mono', monospace;
      flex-wrap: wrap;
    }
    .keyboard-hint kbd {
      background: #1E293B;
      color: #E2E8F0;
      padding: 2px 6px;
      border-radius: 4px;
      border: 1px solid #334155;
    }

    .exercise-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      margin-bottom: 24px;
      overflow: hidden;
      display: grid;
      grid-template-columns: 400px 420px 1fr;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .exercise-card:hover {
      border-color: var(--card-hover);
    }
    .exercise-card.is-approved-photo {
      border-left: 4px solid var(--accent-emerald);
    }
    .exercise-card.is-kept-video {
      border-left: 4px solid var(--accent-cyan);
    }
    .exercise-card.is-flagged {
      border-left: 4px solid var(--accent-rose);
      background: rgba(244, 63, 94, 0.03);
    }
    .exercise-card.has-warning {
      border-top: 2px solid var(--accent-amber);
    }

    /* Col 1: Image Asset */
    .media-col {
      padding: 20px;
      border-right: 1px solid var(--card-border);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .media-title-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .media-title {
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .source-tag {
      font-size: 0.68rem;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 4px;
      letter-spacing: 0.02em;
    }
    .source-tag.video {
      background: rgba(6, 182, 212, 0.15);
      border: 1px solid rgba(6, 182, 212, 0.3);
      color: #67E8F9;
    }
    .source-tag.photo {
      background: rgba(99, 102, 241, 0.15);
      border: 1px solid rgba(99, 102, 241, 0.3);
      color: #A5B4FC;
    }

    .image-mode-toggle {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 4px;
      background: #080C14;
      padding: 3px;
      border-radius: 6px;
      border: 1px solid var(--card-border);
    }
    .mode-pill {
      background: transparent;
      border: none;
      color: var(--text-dim);
      font-size: 0.72rem;
      font-weight: 700;
      padding: 6px 8px;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .mode-pill:hover:not(.disabled) {
      color: #fff;
    }
    .mode-pill.active {
      background: #1E293B;
      color: var(--accent-cyan);
    }
    .mode-pill.disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    .image-preview-container {
      width: 100%;
      height: 240px;
      background: #080C14;
      border-radius: 8px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--card-border);
      position: relative;
    }
    .image-preview-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      cursor: zoom-in;
      transition: transform 0.2s;
    }
    .image-preview-container img:hover {
      transform: scale(1.02);
    }
    .inspect-hint {
      position: absolute;
      bottom: 8px;
      right: 8px;
      background: rgba(8, 12, 20, 0.85);
      backdrop-filter: blur(4px);
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 0.65rem;
      font-weight: 600;
      color: var(--text-muted);
      pointer-events: none;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .image-meta-details {
      background: #0A101D;
      border: 1px solid var(--card-border);
      border-radius: 6px;
      padding: 8px 10px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      font-size: 0.7rem;
    }
    .meta-row {
      display: flex;
      gap: 6px;
      align-items: baseline;
      word-break: break-all;
    }
    .meta-label {
      color: var(--text-dim);
      font-weight: 700;
      min-width: 65px;
    }
    .meta-val {
      color: #CBD5E1;
      font-family: 'JetBrains Mono', monospace;
    }

    /* Col 2: Video */
    .video-col {
      padding: 20px;
      border-right: 1px solid var(--card-border);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .video-frame-container {
      width: 100%;
      height: 240px;
      background: #000;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid var(--card-border);
    }
    .video-frame-container iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
    .yt-meta-badge {
      background: #0A101D;
      border: 1px solid var(--card-border);
      border-radius: 6px;
      padding: 8px 12px;
      font-size: 0.75rem;
    }
    .yt-title-row {
      font-weight: 700;
      color: #E2E8F0;
      margin-bottom: 2px;
      line-height: 1.3;
    }
    .yt-author-row {
      color: var(--accent-cyan);
      font-size: 0.7rem;
    }

    /* Col 3: Details & Action Controls */
    .details-col {
      padding: 20px 24px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .exercise-header {
      margin-bottom: 12px;
    }
    .exercise-name {
      font-size: 1.25rem;
      font-weight: 800;
      letter-spacing: -0.01em;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .tags-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 6px;
    }
    .tag {
      font-size: 0.7rem;
      padding: 3px 8px;
      border-radius: 4px;
      background: #1E293B;
      color: #CBD5E1;
      font-weight: 600;
    }
    .tag.prime-mover {
      background: rgba(99, 102, 241, 0.15);
      color: #C7D2FE;
      border: 1px solid rgba(99, 102, 241, 0.3);
    }
    .tag.equipment {
      background: rgba(6, 182, 212, 0.15);
      color: #A5F3FC;
      border: 1px solid rgba(6, 182, 212, 0.3);
    }

    .warning-alert {
      background: rgba(245, 158, 11, 0.1);
      border: 1px solid rgba(245, 158, 11, 0.3);
      color: #FCD34D;
      border-radius: 6px;
      padding: 8px 12px;
      font-size: 0.78rem;
      margin-bottom: 12px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .warning-item {
      display: flex;
      align-items: flex-start;
      gap: 6px;
      line-height: 1.3;
    }

    .steps-container {
      background: #080C14;
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 12px 16px;
      max-height: 200px;
      overflow-y: auto;
      font-size: 0.82rem;
      line-height: 1.5;
      color: #CBD5E1;
      margin-bottom: 12px;
    }
    .step-item {
      margin-bottom: 8px;
    }
    .step-item:last-child {
      margin-bottom: 0;
    }
    .step-label {
      font-weight: 700;
      color: var(--accent-cyan);
    }

    .checkpoints-box {
      background: #0B111E;
      border-radius: 6px;
      padding: 8px 12px;
      font-size: 0.75rem;
      color: var(--text-muted);
      line-height: 1.4;
      border: 1px dashed var(--card-border);
      margin-bottom: 16px;
    }

    .action-panel {
      display: flex;
      align-items: center;
      gap: 10px;
      border-top: 1px solid var(--card-border);
      padding-top: 16px;
      flex-wrap: wrap;
    }
    .btn-action {
      padding: 8px 14px;
      border-radius: 6px;
      font-size: 0.82rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .btn-action.btn-keep-video {
      background: rgba(6, 182, 212, 0.12);
      border: 1px solid rgba(6, 182, 212, 0.4);
      color: #67E8F9;
    }
    .btn-action.btn-keep-video:hover, .btn-action.btn-keep-video.active {
      background: var(--accent-cyan);
      color: #080C14;
      border-color: var(--accent-cyan);
    }
    .btn-action.btn-approve {
      background: rgba(16, 185, 129, 0.12);
      border: 1px solid rgba(16, 185, 129, 0.4);
      color: #34D399;
    }
    .btn-action.btn-approve:hover, .btn-action.btn-approve.active {
      background: var(--accent-emerald);
      color: #fff;
      border-color: var(--accent-emerald);
    }
    .btn-action.btn-flag {
      background: rgba(244, 63, 94, 0.12);
      border: 1px solid rgba(244, 63, 94, 0.4);
      color: #FB7185;
    }
    .btn-action.btn-flag:hover, .btn-action.btn-flag.active {
      background: var(--accent-rose);
      color: #fff;
      border-color: var(--accent-rose);
    }
    .notes-input {
      flex: 1;
      min-width: 220px;
      background: #080C14;
      border: 1px solid var(--card-border);
      color: #F8FAFC;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 0.8rem;
      outline: none;
    }
    .notes-input:focus {
      border-color: var(--accent-cyan);
    }

    /* Lightbox modal */
    .lightbox {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.92);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      cursor: zoom-out;
      flex-direction: column;
      gap: 12px;
      padding: 24px;
    }
    .lightbox.active { display: flex; }
    .lightbox img {
      max-width: 90vw;
      max-height: 85vh;
      border-radius: 8px;
      border: 1px solid #334155;
      object-fit: contain;
    }
    .lightbox-caption {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.8rem;
      color: #94A3B8;
      background: rgba(16, 23, 38, 0.8);
      padding: 6px 14px;
      border-radius: 6px;
    }

    @media (max-width: 1200px) {
      .exercise-card {
        grid-template-columns: 1fr;
      }
      .media-col, .video-col {
        border-right: none;
        border-bottom: 1px solid var(--card-border);
      }
    }
  </style>
</head>
<body>
  <header>
    <div class="header-top">
      <div class="brand-title">
        <h1>Forge Athletic — Master Exercise Library Audit Studio</h1>
        <span class="brand-badge">273 Canonical Movements</span>
      </div>
      <div class="stats-bar">
        <div class="stat-pill baseline">Default Baseline: <strong id="stat-baseline">273 Video Frames</strong></div>
        <div class="stat-pill kept">Keep Video: <strong id="stat-kept">0</strong></div>
        <div class="stat-pill approved">Photos Approved: <strong id="stat-approved">0</strong></div>
        <div class="stat-pill flagged">Flagged: <strong id="stat-flagged">0</strong></div>
        <div class="stat-pill warnings">Warnings: <strong id="stat-warnings">0</strong></div>
      </div>
    </div>
    <div class="header-controls">
      <div class="search-box">
        <input type="text" id="search-input" placeholder="Search exercises, equipment, muscles, or YouTube titles..." autofocus>
      </div>
      <select id="filter-status">
        <option value="all">All Movements (273)</option>
        <option value="unreviewed">Unreviewed / In Progress</option>
        <option value="kept-video">Keep Video Default</option>
        <option value="approved-photo">Approved Studio Photo</option>
        <option value="flagged">Flagged Issues / Needs Reshoot</option>
        <option value="warnings">Heuristic Warnings (0)</option>
      </select>
      <select id="filter-category">
        <option value="all">All Categories</option>
        <option value="chest">Chest</option>
        <option value="back">Back</option>
        <option value="shoulders">Shoulders</option>
        <option value="legs">Legs / Glutes</option>
        <option value="arms">Arms / Biceps / Triceps</option>
        <option value="core">Core / Abdominals</option>
        <option value="balance">Balance / Stabilization</option>
        <option value="stretch">Flexibility / SMR / Stretch</option>
      </select>
      <button class="btn-toggle-all" id="btn-toggle-all" title="Toggle between Video Frame and Candidate Photo for all visible cards">
        Toggle All to Photos
      </button>
      <button class="btn-export" id="btn-export">Export Decisions (JSON)</button>
      <button class="btn-primary" id="btn-save">Save Progress</button>
    </div>
  </header>

  <main>
    <div class="keyboard-hint">
      <span>Shortcuts:</span>
      <span><kbd>V</kbd> Keep Video Default</span>
      <span><kbd>A</kbd> Approve Studio Photo</span>
      <span><kbd>F</kbd> Flag Issue</span>
      <span><kbd>T</kbd> Toggle Photo/Video</span>
      <span><kbd>J</kbd> / <kbd>K</kbd> Next/Prev</span>
      <span><kbd>/</kbd> Search</span>
    </div>

    <div id="exercise-list">
      <!-- Injected by JavaScript -->
    </div>
  </main>

  <div class="lightbox" id="lightbox" onclick="this.classList.remove('active')">
    <img id="lightbox-img" src="" alt="Enlarged Asset View">
    <div class="lightbox-caption" id="lightbox-caption"></div>
  </div>

p.","2. Brace/Position Engage your core, maintain an upright posture, and shift your weight onto your heels.","3. Execute Jump explosively to the right, rotating your hips and shoulders 180 degrees while extending your legs.","4. Return/Repeat Land softly on the balls of your feet, stabilize your position, and immediately prepare for the next jump in the opposite direction."]}},{"id":"2153e45b-8c72-4b27-a0a3-5654fa102ab1","name":"4 Point Quadruped T Drill","slug":"4-point-quadruped-t-drill-0003","description":"Step 1: Setup Assume an all-four quadruped position on your hands and the balls of your feet with hands directly beneath shoulders, knees under hips, and two cones set up laterally.\n\nStep 2: Brace/Position Engage your core with the drawing-in maneuver, level your pelvis, and maintain a neutral spine with knees hovering slightly off the ground.\n\nStep 3: Execute Crawl forward under control to the midpoint between the two cones, then crawl laterally to touch each cone.\n\nStep 4: Return/Repeat Return to the midpoint and crawl backward in the quadruped position to the start, maintaining a flat back throughout.","coachingCues":[],"primaryEquipment":[],"muscleGroups":["quadriceps"],"imageUrl":"https://img.youtube.com/vi/N7p0Le1WdJE/hqdefault.jpg","videoId":"N7p0Le1WdJE","videoUrl":"https://www.youtube.com/watch?v=N7p0Le1WdJE","videoThumbnailUrl":"https://img.youtube.com/vi/N7p0Le1WdJE/hqdefault.jpg","candidatePhotoUrl":"/images/exercises/4-point-quadruped-t-drill.jpg","hasCandidatePhoto":true,"warnings":[],"ytTitle":"How to do a 4-Point Quadruped T-Drill","ytAuthor":"National Academy of Sports Medicine (NASM)","ytStatus":"OK","card":{"category":"Legs","phase":"Phase 1: Stabilization · Phase 2: Strength Endurance · Phase 3: Hypertrophy","primeMover":"Quadriceps & Gluteus Maximus","kineticCheckpoints":{"feetAnkles":"Shoulder-width, firmly planted on ground.","knees":"Aligned with second and third toes.","lphc":"Neutral lumbar spine; core braced.","shoulders":"Retracted and depressed into athletic posture.","headNeck":"Neutral cervical spine, chin packed."},"clinicalCues":["Maintain neutral kinetic chain checkpoints throughout.","Control the 2-second eccentric lowering phase.","Exhale on exertion while maintaining intra-abdominal brace."],"howToSteps":["1. Setup Assume an all-four quadruped position on your hands and the balls of your feet with hands directly beneath shoulders, knees under hips, and two cones set up laterally.","2. Brace/Position Engage your core with the drawing-in maneuver, level your pelvis, and maintain a neutral spine with knees hovering slightly off the ground.","3. Execute Crawl forward under control to the midpoint between the two cones, then crawl laterally to touch each cone.","4. Return/Repeat Return to the midpoint and crawl backward in the quadruped position to the start, maintaining a flat back throughout."]}},{"id":"2afbd3c8-c248-4d8d-b34e-9f7d10893888","name":"Activation Anterior Tibialis","slug":"activation-anterior-tibialis-0005","description":"Step 1: Setup Sit on a chair or bench with your feet flat on the ground and knees bent at 90 degrees.\n\nStep 2: Brace/Position Keep your back straight and engage your core while ensuring your feet are hip-width apart.\n\nStep 3: Execute Lift your toes towards your shins while keeping your heels on the ground, focusing on contracting the anterior tibialis.\n\nStep 4: Return/Repeat Lower your toes back to the starting position and repeat for the desired number of repetitions.","coachingCues":[],"primaryEquipment":[],"muscleGroups":["calves"],"imageUrl":"https://img.youtube.com/vi/CeFbXhifvvA/hqdefault.jpg","videoId":"CeFbXhifvvA","videoUrl":"https://www.youtube.com/watch?v=CeFbXhifvvA","videoThumbnailUrl":"https://img.youtube.com/vi/CeFbXhifvvA/hqdefault.jpg","candidatePhotoUrl":"/images/exercises/activation-anterior-tibialis.jpg","hasCandidatePhoto":true,"warnings":[],"ytTitle":"How to do a Activation Anterior Tibialis","ytAuthor":"National Academy of Sports Medicine (NASM)","ytStatus":"OK","card":{"category":"Legs","phase":"Phase 1: Stabilization · Phase 2: Strength Endurance · Phase 3: Hypertrophy","primeMover":"Quadriceps & Gluteus Maximus","kineticCheckpoints":{"feetAnkles":"Shoulder-width, firmly planted on ground.","knees":"Aligned with second and third toes.","lphc":"Neutral lumbar spine; core braced.","shoulders":"Retracted and depressed into athletic posture.","headNeck":"Neutral cervical spine, chin packed."},"clinicalCues":["Maintain neutral kinetic chain checkpoints throughout.","Control the 2-second eccentric lowering phase.","Exhale on exertion while maintaining intra-abdominal brace."],"howToSteps":["1. Setup Sit on a chair or bench with your feet flat on the ground and knees bent at 90 degrees.","2. Brace/Position Keep your back straight and engage your core while ensuring your feet are hip-width apart.","3. Execute Lift your toes towards your shins while keeping your heels on the ground, focusing on contracting the anterior tibialis.","4. Return/Repeat Lower your toes back to the starting position and repeat for the desired number of repetitions."]}},{"id":"449f7ec4-a9da-41b3-8243-961cd1cc2dc5","name":"Activation Ball Prone Shoulder Ext Rotation","slug":"activation-ball-prone-shoulder-ext-rotation-0006","description":"Step 1: Setup Lie prone over a stability ball with hips and pelvis supported on the ball and toes planted on the floor for stability.\n\nStep 2: Brace/Position Contract your glutes and push your hips firmly into the ball while maintaining neutral spinal alignment from head to heels.\n\nStep 3: Execute Start with elbows bent at a 90-degree right angle parallel with your shoulders; rotate your forearms and hands upward toward the ceiling by contracting your rotator cuff.\n\nStep 4: Return/Repeat Hold the peak external rotation for 1–2 seconds, then slowly lower your forearms back to parallel with control.","coachingCues":[],"primaryEquipment":["Medicine Ball"],"muscleGroups":["deltoids","rotator cuff","shoulders","upper back"],"imageUrl":"https://img.youtube.com/vi/Ck26oIpb6tg/hqdefault.jpg","videoId":"Ck26oIpb6tg","videoUrl":"https://www.youtube.com/watch?v=Ck26oIpb6tg","videoThumbnailUrl":"https://img.youtube.com/vi/Ck26oIpb6tg/hqdefault.jpg","candidatePhotoUrl":"/images/exercises/activation-ball-prone-shoulder-ext-rotation.jpg","hasCandidatePhoto":true,"warnings":[],"ytTitle":"How to do a Activation Ball Prone Shoulder Ext Rotation","ytAuthor":"National Academy of Sports Medicine (NASM)","ytStatus":"OK","card":{"category":"Back","phase":"Phase 1: Stabilization · Phase 2: Strength Endurance · Phase 3: Hypertrophy","primeMover":"Latissimus Dorsi, Rhomboids & Middle Trapezius","kineticCheckpoints":{"feetAnkles":"Shoulder-width, firmly planted on ground.","knees":"Aligned with second and third toes.","lphc":"Neutral lumbar spine; core braced.","shoulders":"Retracted and depressed into athletic posture.","headNeck":"Neutral cervical spine, chin packed."},"clinicalCues":["Maintain neutral kinetic chain checkpoints throughout.","Control the 2-second eccentric lowering phase.","Exhale on exertion while maintaining intra-abdominal brace."],"howToSteps":["1. Setup Lie prone over a stability ball with hips and pelvis supported on the ball and toes planted on the floor for stability.","2. Brace/Position Contract your glutes and push your hips firmly into the ball while maintaining neutral spinal alignment from head to heels.","3. Execute Start with elbows bent at a 90-degree right angle parallel with your shoulders; rotate your forearms and hands upward toward the ceiling by contracting your rotator cuff.","4. Return/Repeat Hold the peak external rotation for 1–2 seconds, then slowly lower your forearms back to parallel with control."]}},{"id":"572d0c5c-5e5d-4f2d-91e1-0b9490918f1e","name":"Activation Ball Prone Shoulder Press","slug":"activation-ball-prone-shoulder-press-0007","description":"Step 1: Setup Lie face down over a stability ball with hips and pelvis resting on the ball and legs extended behind you.\n\nStep 2: Brace/Position Contract your glutes and push your hips into the stability ball while maintaining neutral alignment throughout your cervical and lumbar spine.\n\nStep 3: Execute Start with elbows bent at a right angle and parallel with your shoulders; press your hands and arms forward away from your head within a comfortable pain-free range.\n\nStep 4: Return/Repeat Slowly return your elbows back to shoulder level under control, squeezing your scapular retractors, and repeat.","coachingCues":[],"primaryEquipment":[],"muscleGroups":["shoulders","triceps"],"imageUrl":"https://img.youtube.com/vi/VZJ0PHuNrYI/hqdefault.jpg","videoId":"VZJ0PHuNrYI","videoUrl":"https://www.youtube.com/watch?v=VZJ0PHuNrYI","videoThumbnailUrl":"https://img.youtube.com/vi/VZJ0PHuNrYI/hqdefault.jpg","candidatePhotoUrl":"/images/exercises/activation-ball-prone-shoulder-press.jpg","hasCandidatePhoto":true,"warnings":[],"ytTitle":"How to do a Activation Ball Prone Shoulder Press","ytAuthor":"National Academy of Sports Medicine (NASM)","ytStatus":"OK","card":{"category":"Shoulders","phase":"Phase 1: Stabilization · Phase 2: Strength Endurance · Phase 3: Hypertrophy","primeMover":"Deltoids & Upper Trapezius","kineticCheckpoints":{"feetAnkles":"Shoulder-width, firmly planted on ground.","knees":"Aligned with second and third toes.","lphc":"Neutral lumbar spine; core braced.","shoulders":"Retracted and depressed into athletic posture.","headNeck":"Neutral cervical spine, chin packed."},"clinicalCues":["Maintain neutral kinetic chain checkpoints throughout.","Control the 2-second eccentric lowering phase.","Exhale on exertion while maintaining intra-abdominal brace."],"howToSteps":["1. Setup Lie face down over a stability ball with hips and pelvis resting on the ball and legs extended behind you.","2. Brace/Position Contract your glutes and push your hips into the stability ball while maintaining neutral alignment throughout your cervical and lumbar spine.","3. Execute Start with elbows bent at a right angle and parallel with your shoulders; press your hands and arms forward away from your head within a comfortable pain-free range.","4. Return/Repeat Slowly return your elbows back to shoulder level under control, squeezing your scapular retractors, and repeat."]}},{"id":"a8ce935d-47f8-4056-ab5a-98e32591d59d","name":"Activation Ball Prone Wide Row","slug":"activation-ball-prone-wide-row-0008","description":"Step 1: Setup Lie face down over a stability ball with hips supported and feet anchored to the floor shoulder-width apart.\n\nStep 2: Brace/Position Contract your glutes and push your hips into the ball, bracing your core to keep your spine straight and neutral.\n\nStep 3: Execute Contract the muscles of your upper back and posterior deltoids to pull your hands and elbows wide toward your torso, keeping elbows out at 90 degrees.\n\nStep 4: Return/Repeat Hold peak contraction for 1 second, then slowly extend your arms back to the starting position with control.","coachingCues":[],"primaryEquipment":[],"muscleGroups":["back","biceps"],"imageUrl":"https://img.youtube.com/vi/qSqFFlidCXo/hqdefault.jpg","videoId":"qSqFFlidCXo","videoUrl":"https://www.youtube.com/watch?v=qSqFFlidCXo","videoThumbnailUrl":"https://img.youtube.com/vi/qSqFFlidCXo/hqdefault.jpg","candidatePhotoUrl":"/images/exercises/activation-ball-prone-wide-row.jpg","hasCandidatePhoto":true,"warnings":[],"ytTitle":"How to do a Activation Ball Prone Wide Row","ytAuthor":"National Academy of Sports Medicine (NASM)","ytStatus":"OK","card":{"category":"Back","phase":"Phase 1: Stabilization · Phase 2: Strength Endurance · Phase 3: Hypertrophy","primeMover":"Latissimus Dorsi, Rhomboids & Middle Trapezius","kineticCheckpoints":{"feetAnkles":"Shoulder-width, firmly planted on ground.","knees":"Aligned with second and third toes.","lphc":"Neutral lumbar spine; core braced.","shoulders":"Retracted and depressed into athletic posture.","headNeck":"Neutral cervical spine, chin packed."},"clinicalCues":["Maintain neutral kinetic chain checkpoints throughout.","Control the 2-second eccentric lowering phase.","Exhale on exertion while maintaining intra-abdominal brace."],"howToSteps":["1. Setup Lie face down over a stability ball with hips supported and feet anchored to the floor shoulder-width apart.","2. Brace/Position Contract your glutes and push your hips into the ball, bracing your core to keep your spine straight and neutral.","3. Execute Contract the muscles of your upper back and posterior deltoids to pull your hands and elbows wide toward your torso, keeping elbows out at 90 degrees.","4. Return/Repeat Hold peak contraction for 1 second, then slowly extend your arms back to the starting position with control."]}},{"id":"0cd109a3-8952-4b84-ac0c-5559c2e9cd67","name":"Activation Medial Gastrocnemius","slug":"activation-medial-gastrocnemius-0010","description":"Step 1: Setup Stand upright on the edge of a step or platform with your toes pointing slightly inward toward the midline.\n\nStep 2: Brace/Position Engage your core and maintain an upright posture with knees straight but not hyperextended.\n\nStep 3: Execute Push forcefully through the balls of your feet to lift your heels upward into full plantarflexion, targeting the medial head of the calves.\n\nStep 4: Return/Repeat Hold the top contraction for 1 second, then lower your heels under control to the start position and repeat.","coachingCues":[],"primaryEquipment":[],"muscleGroups":["back"],"imageUrl":"https://img.youtube.com/vi/gipvE9-iSzU/hqdefault.jpg","videoId":"gipvE9-iSzU","videoUrl":"https://www.youtube.com/watch?v=gipvE9-iSzU","videoThumbnailUrl":"https://img.youtube.com/vi/gipvE9-iSzU/hqdefault.jpg","candidatePhotoUrl":"/images/exercises/activation-medial-gastrocnemius.jpg","hasCandidatePhoto":true,"warnings":[],"ytTitle":"How to do a Activation Medial Gastrocnemius","ytAuthor":"National Academy of Sports Medicine (NASM)","ytStatus":"OK","card":{"category":"Back","phase":"Phase 1: Stabilization · Phase 2: Strength Endurance · Phase 3: Hypertrophy","primeMover":"Latissimus Dorsi, Rhomboids & Middle Trapezius","kineticCheckpoints":{"feetAnkles":"Shoulder-width, firmly planted on ground.","knees":"Aligned with second and third toes.","lphc":"Neutral lumbar spine; core braced.","shoulders":"Retracted and depressed into athletic posture.","headNeck":"Neutral cervical spine, chin packed."},"clinicalCues":["Maintain neutral kinetic chain checkpoints throughout.","Control the 2-second eccentric lowering phase.","Exhale on exertion while maintaining intra-abdominal brace."],"howToSteps":["1. Setup Stand upright on the edge of a step or platform with your toes pointing slightly inward toward the midline.","2. Brace/Position Engage your core and maintain an upright posture with knees straight but not hyperextended.","3. Execute Push forcefully through the balls of your feet to lift your heels upward into full plantarflexion, targeting the medial head of the calves.","4. Return/Repeat Hold the top contraction for 1 second, then lower your heels under control to the start position and repeat."]}},{"id":"193fd9f5-3d76-4c9f-81be-e0be75ff374a","name":"Activation Medial Hamstring","slug":"activation-medial-hamstring-0011","description":"Step 1: Setup Lie prone or position yourself in a hamstring curl station with the resistance pad resting against the back of your lower legs.\n\nStep 2: Brace/Position Maintain alignment across your hips and lumbar spine without arching your lower back, and internally rotate your feet slightly inward.\n\nStep 3: Execute Perform a hamstring curl by flexing your knees, driving your heels toward your glutes while maintaining slight internal tibial rotation.\n\nStep 4: Return/Repeat Hold peak contraction for 1 second, then slowly lower the resistance through a 3-second eccentric return.","coachingCues":[],"primaryEquipment":[],"muscleGroups":["glutes","hamstrings","quadriceps"],"imageUrl":"https://img.youtube.com/vi/ksd36rrxgtE/hqdefault.jpg","videoId":"ksd36rrxgtE","videoUrl":"https://www.youtube.com/watch?v=ksd36rrxgtE","videoThumbnailUrl":"https://img.youtube.com/vi/ksd36rrxgtE/hqdefault.jpg","candidatePhotoUrl":"/images/exercises/activation-medial-hamstring.jpg","hasCandidatePhoto":true,"warnings":[],"ytTitle":"How to do a Activation Medial Hamstring","ytAuthor":"National Academy of Sports Medicine (NASM)","ytStatus":"OK","card":{"category":"Legs","phase":"Phase 1: Stabilization · Phase 2: Strength Endurance · Phase 3: Hypertrophy","primeMover":"Hamstrings Complex & Gluteus Maximus","kineticCheckpoints":{"feetAnkles":"Shoulder-width, firmly planted on ground.","knees":"Aligned with second and third toes.","lphc":"Neutral lumbar spine; core braced.","shoulders":"Retracted and depressed into athletic posture.","headNeck":"Neutral cervical spine, chin packed."},"clinicalCues":["Maintain neutral kinetic chain checkpoints throughout.","Control the 2-second eccentric lowering phase.","Exhale on exertion while maintaining intra-abdominal brace."],"howToSteps":["1. Setup Lie prone or position yourself in a hamstring curl station with the resistance pad resting against the back of your lower legs.","2. Brace/Position Maintain alignment across your hips and lumbar spine without arching your lower back, and internally rotate your feet slightly inward.","3. Execute Perform a hamstring curl by flexing your knees, driving your heels toward your glutes while maintaining slight internal tibial rotation.","4. Return/Repeat Hold peak contraction for 1 second, then slowly lower the resistance through a 3-second eccentric return."]}},{"id":"37a3355d-b67e-4fc1-b578-ef3c51a70a1f","name":"Activation Posterior Tibialis","slug":"activation-posterior-tibialis-0013","description":"Step 1: Setup Sit comfortably on a bench or chair with your working foot elevated slightly off the floor.\n\nStep 2: Brace/Position Maintain an upright posture and keep your lower leg still to isolate movement at the ankle joint.\n\nStep 3: Execute Point your toe downward into plantarflexion and sweep your foot inward toward the midline of your body, as if drawing the letter \"J\" with your big toe.\n\nStep 4: Return/Repeat Hold the peak inversion contraction for 1–2 seconds, then slowly return to the neutral starting position and repeat.","coachingCues":[],"primaryEquipment":[],"muscleGroups":["calves"],"imageUrl":"https://img.youtube.com/vi/O1LxD0L9pR4/hqdefault.jpg","videoId":"O1LxD0L9pR4","videoUrl":"https://www.youtube.com/watch?v=O1LxD0L9pR4","videoThumbnailUrl":"https://img.youtube.com/vi/O1LxD0L9pR4/hqdefault.jpg","candidatePhotoUrl":"/images/exercises/activation-posterior-tibialis.jpg","hasCandidatePhoto":true,"warnings":[],"ytTitle":"How to do a Activation Posterior Tibialis","ytAuthor":"National Academy of Sports Medicine (NASM)","ytStatus":"OK","card":{"category":"Legs","phase":"Phase 1: Stabilization · Phase 2: Strength Endurance · Phase 3: Hypertrophy","primeMover":"Quadriceps & Gluteus Maximus","kineticCheckpoints":{"feetAnkles":"Shoulder-width, firmly planted on ground.","knees":"Aligned with second and third toes.","lphc":"Neutral lumbar spine; core braced.","shoulders":"Retracted and depressed into athletic posture.","headNeck":"Neutral cervical spine, chin packed."},"clinicalCues":["Maintain neutral kinetic chain checkpoints throughout.","Control the 2-second eccentric lowering phase.","Exhale on exertion while maintaining intra-abdominal brace."],"howToSteps":["1. Setup Sit comfortably on a bench or chair with your working foot elevated slightly off the floor.","2. Brace/Position Maintain an upright posture and keep your lower leg still to isolate movement at the ankle joint.","3. Execute Point your toe downward into plantarflexion and sweep your foot inward toward the midline of your body, as if drawing the letter \"J\" with your big toe.","4. Return/Repeat Hold the peak inversion contraction for 1–2 seconds, then slowly return to the neutral starting position and repeat."]}},{"id":"32ef47c5-86ab-42f1-83a4-34a3b9d451e9","name":"Activation Serratus Push Up","slug":"activation-serratus-push-up-0014","description":"Step 1: Setup Assume a standard push-up plank position with arms fully extended and hands directly beneath your shoulders.\n\nStep 2: Brace/Position Maintain rigid alignment from your head through your spine and hips with your core braced and glutes squeezed.\n\nStep 3: Execute Without bending your elbows, push your hands forcefully into the floor to protract your shoulder blades and raise your upper torso toward the ceiling.\n\nStep 4: Return/Repeat Allow your shoulder blades to retract back together under control while keeping your arms straight throughout, then repeat.","coachingCues":[],"primaryEquipment":[],"muscleGroups":["chest","shoulders","triceps"],"imageUrl":"https://img.youtube.com/vi/E-_YOEeaIu0/hqdefault.jpg","videoId":"E-_YOEeaIu0","videoUrl":"https://www.youtube.com/watch?v=E-_YOEeaIu0","videoThumbnailUrl":"https://img.youtube.com/vi/E-_YOEeaIu0/hqdefault.jpg","candidatePhotoUrl":"/images/exercises/activation-serratus-push-up.jpg","hasCandidatePhoto":true,"warnings":[],"ytTitle":"How to do a Activation Serratus Push Up","ytAuthor":"National Academy of Sports Medicine (NASM)","ytStatus":"OK","card":{"category":"Chest","phase":"Phase 1 (Stabilization Endurance), Phase 2 (Strength Endurance)","primeMover":"Pectoralis Major","kineticCheckpoints":{"feetAnkles":"Together or hip-width apart, dorsiflexed on balls of feet.","knees":"Fully extended with active quadriceps contraction.","lphc":"Neutral pelvis; no sagging hips (anterior tilt) or pike (excessive flexion).","shoulders":"Hands placed slightly wider than shoulder-width, fingers pointing forward.","headNeck":"Neutral cervical spine, chin tucked, gaze looking 6 inches ahead."},"clinicalCues":["Engage glutes and brace core to maintain rigid plank posture.","Do not allow lower back to sag or head to jut forward toward the floor.","Push the ground away at the top of the rep to engage serratus anterior."],"howToSteps":["1. Setup Assume a standard push-up plank position with arms fully extended and hands directly beneath your shoulders.","2. Brace/Position Maintain rigid alignment from your head through your spine and hips with your core braced and glutes squeezed.","3. Execute Without bending your elbows, push your hands forcefully into the floor to protract your shoulder blades and raise your upper torso toward the ceiling.","4. Return/Repeat Allow your shoulder blades to retract back together under control while keeping your arms straight throughout, then repeat."]}},{"id":"f3909b4d-a5a3-4d27-85f9-d48a7220c888","name":"Activation Standing Glute Max","slug":"activation-standing-glute-max-0015","description":"Step 1: Setup Stand with your feet hip-width apart, weight evenly distributed on both feet, and engage your core.\n\nStep 2: Brace/Position Shift your weight onto your right leg, slightly bending the knee, while lifting your left leg behind you, keeping it straight and in line with your body.\n\nStep 3: Execute Squeeze your glute on the right side as you lift your left leg to a height of about 12-15 inches, maintaining a neutral spine and avoiding arching your back.\n\nStep 4: Return/Repeat Lower your left leg back to the starting position, then switch sides and repeat the movement on the right leg.","coachingCues":[],"primaryEquipment":[],"muscleGroups":["glutes","hamstrings","quadriceps"],"imageUrl":"https://img.youtube.com/vi/_kHFPUcelRI/hqdefault.jpg","videoId":"_kHFPUcelRI","videoUrl":"https://www.youtube.com/watch?v=_kHFPUcelRI","videoThumbnailUrl":"https://img.youtube.com/vi/_kHFPUcelRI/hqdefault.jpg","candidatePhotoUrl":"/images/exercises/activation-standing-glute-max.jpg","hasCandidatePhoto":true,"warnings":[],"ytTitle":"How to do a Activation Standing Glute Max","ytAuthor":"National Academy of Sports Medicine (NASM)","ytStatus":"OK","card":{"category":"Legs","phase":"Phase 1: Stabilization · Phase 2: Strength Endurance · Phase 3: Hypertrophy","primeMover":"Quadriceps & Gluteus Maximus","kineticCheckpoints":{"feetAnkles":"Shoulder-width, firmly planted on ground.","knees":"Aligned with second and third toes.","lphc":"Neutral lumbar spine; core braced.","shoulders":"Retracted and depressed into athletic posture.","headNeck":"Neutral cervical spine, chin packed."},"clinicalCues":["Maintain neutral kinetic chain checkpoints throughout.","Control the 2-second eccentric lowering phase.","Exhale on exertion while maintaining intra-abdominal brace."],"howToSteps":["1. Setup Stand with your feet hip-width apart, weight evenly distributed on both feet, and engage your core.","2. Brace/Position Shift your weight onto your right leg, slightly bending the knee, while lifting your left leg behind you, keeping it straight and in line with your body.","3. Execute Squeeze your glute on the right side as you lift your left leg to a height of about 12-15 inches, maintaining a neutral spine and avoiding arching your back.","4. Return/Repeat Lower your left leg back to the starting position, then switch sides and repeat the movement on the right leg."]}},{"id":"c5e0d99e-02f0-431a-b0db-91a2b71a998f","name":"Activation Standing Shoulder Ext Rotation","slug":"activation-standing-shoulder-ext-rotation-0016","description":"Step 1: Setup Stand tall with your feet shoulder-width apart, holding a resistance band with both hands at hip level, palms facing up.\n\nStep 2: Brace/Position Engage your core and retract your shoulder blades, keeping your elbows close to your body at a 90-degree angle.\n\nStep 3: Execute Rotate your shoulders externally by pulling the band apart, keeping your elbows fixed at your sides and squeezing your shoulder blades together.\n\nStep 4: Return/Repeat Slowly return to the starting position, maintaining control, and repeat for the desired number of repetitions.","coachingCues":[],"primaryEquipment":[],"muscleGroups":["back"],"imageUrl":  your core and maintain an upright torso, ensuring your hips are squared forward and your pelvis is tucked slightly under.\n\nStep 3: Execute Shift your weight forward into your left hip, feeling a stretch in the right hip flexor while keeping your back straight and chest lifted.\n\nStep 4: Return/Repeat Slowly return to the starting position and repeat for the desired number of repetitions before switching sides.","coachingCues":[],"primaryEquipment":[],"muscleGroups":["back"],"imageUrl":"https://img.youtube.com/vi/OJ8qQQRxYz8/hqdefault.jpg","videoId":"OJ8qQQRxYz8","videoUrl":"https://www.youtube.com/watch?v=OJ8qQQRxYz8","videoThumbnailUrl":"https://img.youtube.com/vi/OJ8qQQRxYz8/hqdefault.jpg","candidatePhotoUrl":"/images/exercises/active-kneeling-hip-flexor.jpg","hasCandidatePhoto":true,"warnings":[],"ytTitle":"How to do a Active Kneeling Hip Flexor","ytAuthor":"National Academy of Sports Medicine (NASM)","ytStatus":"OK","card":{"category":"Flexibility/SMR","phase":"Phase 1: Stabilization · Phase 2: Strength Endurance · Phase 3: Hypertrophy","primeMover":"Target Neuromuscular / Fascial System","kineticCheckpoints":{"feetAnkles":"Shoulder-width, firmly planted on ground.","knees":"Aligned with second and third toes.","lphc":"Neutral lumbar spine; core braced.","shoulders":"Retracted and depressed into athletic posture.","headNeck":"Neutral cervical spine, chin packed."},"clinicalCues":["Maintain neutral kinetic chain checkpoints throughout.","Control the 2-second eccentric lowering phase.","Exhale on exertion while maintaining intra-abdominal brace."],"howToSteps":["1. Setup Begin in a kneeling position with your right knee on the ground and your left foot in front, forming a 90-degree angle at both knees.","2. Brace/Position Engage your core and maintain an upright torso, ensuring your hips are squared forward and your pelvis is tucked slightly under.","3. Execute Shift your weight forward into your left hip, feeling a stretch in the right hip flexor while keeping your back straight and chest lifted.","4. Return/Repeat Slowly return to the starting position and repeat for the desired number of repetitions before switching sides."]}},{"id":"5156b6c9-9102-4aa7-93ad-b9854184c683","name":"Active Lat Ball","slug":"active-lat-ball-0019","description":"Step 1: Setup Stand with your feet shoulder-width apart, holding a stability ball with both hands at chest level, arms extended forward.\n\nStep 2: Brace/Position Engage your core, slightly bend your knees, and maintain a neutral spine as you position the ball directly in front of your body.\n\nStep 3: Execute Press the ball outward by extending your arms while simultaneously engaging your lats, keeping your elbows slightly bent throughout the movement.\n\nStep 4: Return/Repeat Slowly retract the ball back to the starting position at chest level, maintaining control and tension in your lats, and repeat for the desired number of repetitions.","coachingCues":[],"primaryEquipment":[],"muscleGroups":["back"],"imageUrl":"https://img.youtube.com/vi/w_mDsWxtVng/hqdefault.jpg","videoId":"w_mDsWxtVng","videoUrl":"https://www.youtube.com/watch?v=w_mDsWxtVng","videoThumbnailUrl":"https://img.youtube.com/vi/w_mDsWxtVng/hqdefault.jpg","candidatePhotoUrl":"/images/exercises/active-lat-ball.jpg","hasCandidatePhoto":true,"warnings":[],"ytTitle":"How to do a Active Lat Ball","ytAuthor":"National Academy of Sports Medicine (NASM)","ytStatus":"OK","card":{"category":"Flexibility/SMR","phase":"Phase 1: Stabilization · Phase 2: Strength Endurance · Phase 3: Hypertrophy","primeMover":"Target Neuromuscular / Fascial System","kineticCheckpoints":{"feetAnkles":"Shoulder-width, firmly planted on ground.","knees":"Aligned with second and third toes.","lphc":"Neutral lumbar spine; core braced.","shoulders":"Retracted and depressed into athletic posture.","headNeck":"Neutral cervical spine, chin packed."},"clinicalCues":["Maintain neutral kinetic chain checkpoints throughout.","Control the 2-second eccentric lowering phase.","Exhale on exertion while maintaining intra-abdominal brace."],"howToSteps":["1. Setup Stand with your feet shoulder-width apart, holding a stability ball with both hands at chest level, arms extended forward.","2. Brace/Position Engage your core, slightly bend your knees, and maintain a neutral spine as you position the ball directly in front of your body.","3. Execute Press the ball outward by extending your arms while simultaneously engaging your lats, keeping your elbows slightly bent throughout the movement.","4. Return/Repeat Slowly retract the ball back to the starting position at chest level, maintaining control and tension in your lats, and repeat for the desired number of repetitions."]}},{"id":"190e3325-7df2-4cac-8ee0-db79c195d3a1","name":"Active Standing Adductor","slug":"active-standing-adductor-0022","description":"Step 1: Setup Stand with your feet hip-width apart, weight evenly distributed on both legs, and engage your core.\n\nStep 2: Brace/Position Shift your weight onto your right leg, slightly bending the knee, while lifting your left leg out to the side, keeping it straight.\n\nStep 3: Execute Actively lift your left leg to the side, engaging your adductor muscles, and hold for a moment at the top of the movement.\n\nStep 4: Return/Repeat Lower your left leg back to the starting position and repeat for the desired number of repetitions before switching to the right leg.","coachingCues":[],"primaryEquipment":[],"muscleGroups":["glutes","hamstrings","quadriceps"],"imageUrl":"https://img.youtube.com/vi/1opPpdhFabY/hqdefault.jpg","videoId":"1opPpdhFabY","videoUrl":"https://www.youtube.com/watch?v=1opPpdhFabY","videoThumbnailUrl":"https://img.youtube.com/vi/1opPpdhFabY/hqdefault.jpg","candidatePhotoUrl":"/images/exercises/active-standing-adductor.jpg","hasCandidatePhoto":true,"warnings":[],"ytTitle":"How to do a Active Standing Adductor","ytAuthor":"National Academy of Sports Medicine (NASM)","ytStatus":"OK","card":{"category":"Flexibility/SMR","phase":"Phase 1: Stabilization · Phase 2: Strength Endurance · Phase 3: Hypertrophy","primeMover":"Target Neuromuscular / Fascial System","kineticCheckpoints":{"feetAnkles":"Shoulder-width, firmly planted on ground.","knees":"Aligned with second and third toes.","lphc":"Neutral lumbar spine; core braced.","shoulders":"Retracted and depressed into athletic posture.","headNeck":"Neutral cervical spine, chin packed."},"clinicalCues":["Maintain neutral kinetic chain checkpoints throughout.","Control the 2-second eccentric lowering phase.","Exhale on exertion while maintaining intra-abdominal brace."],"howToSteps":["1. Setup Stand with your feet hip-width apart, weight evenly distributed on both legs, and engage your core.","2. Brace/Position Shift your weight onto your right leg, slightly bending the knee, while lifting your left leg out to the side, keeping it straight.","3. Execute Actively lift your left leg to the side, engaging your adductor muscles, and hold for a moment at the top of the movement.","4. Return/Repeat Lower your left leg back to the starting position and repeat for the desired number of repetitions before switching to the right leg."]}},{"id":"2626f35c-d839-45fb-9c9e-4208ae157584","name":"Active Standing Hip Flexor","slug":"active-standing-hip-flexor-0024","description":"Step 1: Setup Stand tall with your feet hip-width apart, engaging your core and ensuring your posture is upright.\n\nStep 2: Brace/Position Shift your weight onto your left leg, lifting your right knee towards your chest while keeping your left knee slightly bent.\n\nStep 3: Execute Extend your right leg forward, straightening it while maintaining balance on your left leg, and engage your hip flexors.\n\nStep 4: Return/Repeat Bring your right leg back to the starting position, then switch to the left leg and repeat the movement.","coachingCues":[],"primaryEquipment":[],"muscleGroups":["glutes","hamstrings","quadriceps"],"imageUrl":"https://img.youtube.com/vi/VY0FyyIHrPo/
