 the floor with control and repeat for the desired number of repetitions before switching legs.","coachingCues":[],"primaryEquipment":[],"muscleGroups":["core","glutes"],"imageUrl":"https://img.youtube.com/vi/lHXShY-FivU/hqdefault.jpg","videoId":"lHXShY-FivU","videoUrl":"https://www.youtube.com/watch?v=lHXShY-FivU","videoThumbnailUrl":"https://img.youtube.com/vi/lHXShY-FivU/hqdefault.jpg","candidatePhotoUrl":"/images/exercises/single-leg-floor-bridge.jpg","hasCandidatePhoto":true,"warnings":[],"ytTitle":"How to do a Single-Leg Floor Bridge","ytAuthor":"National Academy of Sports Medicine (NASM)","ytStatus":"OK","card":{"category":"Legs","phase":"Phase 1: Stabilization · Phase 2: Strength Endurance · Phase 3: Hypertrophy","primeMover":"Quadriceps & Gluteus Maximus","kineticCheckpoints":{"feetAnkles":"Shoulder-width, firmly planted on ground.","knees":"Aligned with second and third toes.","lphc":"Neutral lumbar spine; core braced.","shoulders":"Retracted and depressed into athletic posture.","headNeck":"Neutral cervical spine, chin packed."},"clinicalCues":["Maintain neutral kinetic chain checkpoints throughout.","Control the 2-second eccentric lowering phase.","Exhale on exertion while maintaining intra-abdominal brace."],"howToSteps":["1. Setup Lie on your back with your knees bent and feet flat on the floor, hip-width apart. Extend one leg straight up toward the ceiling.","2. Brace/Position Engage your core and press your heel into the floor, ensuring your shoulder blades are retracted and your arms are at your sides for stability.","3. Execute Push through your heel to lift your hips off the ground, creating a straight line from your shoulders to your extended knee.","4. Return/Repeat Lower your hips back to the floor with control and repeat for the desired number of repetitions before switching legs."]}},{"id":"b1506d50-3463-43c5-a501-7bd5cf5fbe23","name":"Single Leg Hammer Curl","slug":"single-leg-hammer-curl-0114","description":"Step 1: Setup Stand on your right leg with a slight bend in the knee, holding a dumbbell in your right hand at your side, palm facing your body.\n\nStep 2: Brace/Position Engage your core and maintain a straight posture, keeping your left leg lifted slightly behind you.\n\nStep 3: Execute Curl the dumbbell up towards your shoulder while keeping your elbow close to your body, squeezing your bicep at the top of the movement.\n\nStep 4: Return/Repeat Lower the dumbbell back to the starting position with control, then repeat for the desired number of repetitions before switching to the left leg.","coachingCues":[],"primaryEquipment":[],"muscleGroups":["biceps","core","glutes"],"imageUrl":"https://img.youtube.com/vi/unRU3oVX3PU/hqdefault.jpg","videoId":"unRU3oVX3PU","videoUrl":"https://www.youtube.com/watch?v=unRU3oVX3PU","videoThumbnailUrl":"https://img.youtube.com/vi/unRU3oVX3PU/hqdefault.jpg","candidatePhotoUrl":"/images/exercises/single-leg-hammer-curl.jpg","hasCandidatePhoto":true,"warnings":[],"ytTitle":"How to do a Single-Leg Hammer Curl","ytAuthor":"National Academy of Sports Medicine (NASM)","ytStatus":"OK","card":{"category":"Arms","phase":"Phase 1 (Stabilization Endurance), Phase 2 (Strength Endurance), Phase 3 (Hypertrophy)","primeMover":"Brachioradialis & Brachialis","kineticCheckpoints":{"feetAnkles":"Hip-width apart, straight and parallel, weight evenly distributed through tripod foot (heels and midfoot).","knees":"Soft athletic micro-bend (never hyperextended or locked), aligned over second and third toes.","lphc":"Neutral pelvis and lumbar lordosis; core braced to prevent sagittal trunk sway, swinging, or lumbar hyperextension.","shoulders":"Scapulae retracted and depressed; elbows pinned firmly against lateral ribcage as stationary hinges; strict neutral grip (palms facing inward toward each other, thumbs pointing straight up toward ceiling, dumbbell heads vertical, strictly zero supination or twisting).","headNeck":"Neutral cervical spine, chin packed/tucked, gaze directed straight ahead."},"clinicalCues":["Maintain strict neutral grip with palms facing inward and thumbs pointing up—strictly zero wrist twisting or supination.","Dumbbell orientation must remain strictly vertical (top head pointing at ceiling, bottom head at floor).","Lock elbows against lateral ribcage as fixed hinges; avoid elbow flare or anterior drift into shoulder flexion.","Brace core and engage glutes to eliminate backward torso sway or momentum."],"howToSteps":["1. Setup Stand on your right leg with a slight bend in the knee, holding a dumbbell in your right hand at your side, palm facing your body.","2. Brace/Position Engage your core and maintain a straight posture, keeping your left leg lifted slightly behind you.","3. Execute Curl the dumbbell up towards your shoulder while keeping your elbow close to your body, squeezing your bicep at the top of the movement.","4. Return/Repeat Lower the dumbbell back to the starting position with control, then repeat for the desired number of repetitions before switching to the left leg."]}},{"id":"8c7f84ba-d917-4674-810e-4dd14f79c793","name":"Single Leg Hop Stabilization Level 1","slug":"single-leg-hop-stabilization-level-1-0213","description":"Step 1: Setup Stand on one leg in an athletic posture with a slight knee bend, lifting the opposite foot off the ground with hips level.\n\nStep 2: Brace/Position Draw in your abdominal wall, contract the gluteus medius of your stance leg, and pack your shoulders down.\n\nStep 3: Execute Hop forward a short distance, landing softly on the entire foot with weight evenly distributed from heel to toe, ensuring the knee tracks over your second and third toes.\n\nStep 4: Return/Repeat Hold the single-leg landing position for 2 full seconds to stabilize without wobbling or letting your knee cave inward, then reset and repeat.","coachingCues":[],"primaryEquipment":[],"muscleGroups":["calves","core","glutes","hamstrings","quadriceps"],"imageUrl":"https://img.youtube.com/vi/6BkwOUl3fAw/hqdefault.jpg","videoId":"6BkwOUl3fAw","videoUrl":"https://www.youtube.com/watch?v=6BkwOUl3fAw","videoThumbnailUrl":"https://img.youtube.com/vi/6BkwOUl3fAw/hqdefault.jpg","candidatePhotoUrl":"/images/exercises/single-leg-hop-stabilization-level-1.jpg","hasCandidatePhoto":true,"warnings":[],"ytTitle":"How to do a Single-Leg Hop Stabilization Level 1","ytAuthor":"National Academy of Sports Medicine (NASM)","ytStatus":"OK","card":{"category":"Plyometrics","phase":"Phase 1: Stabilization · Phase 2: Strength Endurance · Phase 3: Hypertrophy","primeMover":"Quadriceps, Gluteus Maximus & Gastrocnemius (Triple Extension)","kineticCheckpoints":{"feetAnkles":"Shoulder-width, firmly planted on ground.","knees":"Aligned with second and third toes.","lphc":"Neutral lumbar spine; core braced.","shoulders":"Retracted and depressed into athletic posture.","headNeck":"Neutral cervical spine, chin packed."},"clinicalCues":["Maintain neutral kinetic chain checkpoints throughout.","Control the 2-second eccentric lowering phase.","Exhale on exertion while maintaining intra-abdominal brace."],"howToSteps":["1. Setup Stand on one leg in an athletic posture with a slight knee bend, lifting the opposite foot off the ground with hips level.","2. Brace/Position Draw in your abdominal wall, contract the gluteus medius of your stance leg, and pack your shoulders down.","3. Execute Hop forward a short distance, landing softly on the entire foot with weight evenly distributed from heel to toe, ensuring the knee tracks over your second and third toes.","4. Return/Repeat Hold the single-leg landing position for 2 full seconds to stabilize without wobbling or letting your knee cave inward, then reset and repeat."]}},{"id":"4ae0d03a-ba2c-41b0-8d04-a2cbd8998acf","name":"Single Leg Hop Stabilization Level 2","slug":"single-leg-hop-stabilization-level-2-0214","description":"Step 1: Setup Stand on one leg in an athletic stance with knee softly unlocked and core braced.\n\nStep 2: Brace/Position Engage your gluteals and abdominal wall, keeping your pelvis level and opposite knee lifted.\n\nStep 3: Execute Hop forward landing softly on the opposite leg with weight centered over the midfoot, holding the landing for 2 seconds to establish complete dynamic stabilization.\n\nStep 4: Return/Repeat Immediately hop backward to the starting leg, holding the landing for 2 seconds before initiating the next repetition.","coachingCues":[],"primaryEquipment":[],"muscleGroups":["calves","core","glutes","hamstrings","quadriceps"],"imageUrl":"https://img.youtube.com/vi/cps6tCcJNJA/hqdefault.jpg","videoId":"cps6tCcJNJA","videoUrl":"https://www.youtube.com/watch?v=cps6tCcJNJA","videoThumbnailUrl":"https://img.youtube.com/vi/cps6tCcJNJA/hqdefault.jpg","candidatePhotoUrl":"/images/exercises/single-leg-hop-stabilization-level-2.jpg","hasCandidatePhoto":true,"warnings":[],"ytTitle":"How to do a Single-Leg Hop Stabilization Level 2","ytAuthor":"National Academy of Sports Medicine (NASM)","ytStatus":"OK","card":{"category":"Plyometrics","phase":"Phase 1: Stabilization · Phase 2: Strength Endurance · Phase 3: Hypertrophy","primeMover":"Quadriceps, Gluteus Maximus & Gastrocnemius (Triple Extension)","kineticCheckpoints":{"feetAnkles":"Shoulder-width, firmly planted on ground.","knees":"Aligned with second and third toes.","lphc":"Neutral lumbar spine; core braced.","shoulders":"Retracted and depressed into athletic posture.","headNeck":"Neutral cervical spine, chin packed."},"clinicalCues":["Maintain neutral kinetic chain checkpoints throughout.","Control the 2-second eccentric lowering phase.","Exhale on exertion while maintaining intra-abdominal brace."],"howToSteps":["1. Setup Stand on one leg in an athletic stance with knee softly unlocked and core braced.","2. Brace/Position Engage your gluteals and abdominal wall, keeping your pelvis level and opposite knee lifted.","3. Execute Hop forward landing softly on the opposite leg with weight centered over the midfoot, holding the landing for 2 seconds to establish complete dynamic stabilization.","4. Return/Repeat Immediately hop backward to the starting leg, holding the landing for 2 seconds before initiating the next repetition."]}},{"id":"56d3cd35-3c3f-4c4b-a92f-370739627b57","name":"Single Leg Lift And Chop","slug":"single-leg-lift-and-chop-0030","description":"Step 1: Setup Stand on your right leg with your left knee lifted to hip height, holding a medicine ball or weight with both hands at your chest.\n\nStep 2: Brace/Position Engage your core and maintain a straight posture, keeping your shoulders back and down.\n\nStep 3: Execute Rotate your torso to the left while extending your left leg out to the side, simultaneously bringing the weight down towards your left foot in a controlled motion.\n\nStep 4: Return/Repeat Reverse the movement by bringing the weight back to your chest while lifting your left leg back to hip height; repeat for the desired number of repetitions before switching legs.","coachingCues":[],"primaryEquipment":[],"muscleGroups":["calves","core","glutes","hamstrings","quadriceps"],"imageUrl":"https://img.youtube.com/vi/YGU8ONAmjIE/hqdefault.jpg","videoId":"YGU8ONAmjIE","videoUrl":"https://www.youtube.com/watch?v=YGU8ONAmjIE","videoThumbnailUrl":"https://img.youtube.com/vi/YGU8ONAmjIE/hqdefault.jpg","candidatePhotoUrl":"/images/exercises/single-leg-lift-and-chop.jpg","hasCandidatePhoto":true,"warnings":[],"ytTitle":"How to do a Single Leg Lift and Chop","ytAuthor":"National Academy of Sports Medicine (NASM)","ytStatus":"OK","card":{"category":"Plyometrics","phase":"Phase 1: Stabilization · Phase 2: Strength Endurance · Phase 3: Hypertrophy","primeMover":"Quadriceps, Gluteus Maximus & Gastrocnemius (Triple Extension)","kineticCheckpoints":{"feetAnkles":"Shoulder-width, firmly planted on ground.","knees":"Aligned with second and third toes.","lphc":"Neutral lumbar spine; core braced.","shoulders":"Retracted and depressed into athletic posture.","headNeck":"Neutral cervical spine, chin packed."},"clinicalCues":["Maintain neutral kinetic chain checkpoints throughout.","Control the 2-second eccentric lowering phase.","Exhale on exertion while maintaining intra-abdominal brace."],"howToSteps":["1. Setup Stand on your right leg with your left knee lifted to hip height, holding a medicine ball or weight with both hands at your chest.","2. Brace/Position Engage your core and maintain a straight posture, keeping your shoulders back and down.","3. Execute Rotate your torso to the left while extending your left leg out to the side, simultaneously bringing the weight down towards your left foot in a controlled motion.","4. Return/Repeat Reverse the movement by bringing the weight back to your chest while lifting your left leg back to hip height; repeat for the desired number of repetitions before switching legs."]}},{"id":"f72a4814-62c0-4b20-8e6f-21abbda384d3","name":"Single Leg Press","slug":"single-leg-press","description":"Step 1: Setup Stand on one leg with a slight knee bend, lifting the opposite foot off the floor, Sit in the leg press machine with feet hip to shoulder width apart and straight ahead on the leg press platform. Ensure foot height placement allows for good range of movement at both the hip and knee. Let one foot rest on the foot rest below. Draw in and brace the abs. Lock the shoulder blades back and down. Stabilize the upper body by grasping the handles.\n\nStep 2: Brace/Position Engage your core, level your pelvis with your stance glute, and maintain single-leg balance. Lower the platform down toward the body ensuring the knee stays aligned with the middle toes and weight is distributed evenly across the foot. Move through a maximum range without losing technique or bottoming out the thighs into the rib cage.\n\nStep 3: Reverse the pattern and return to starting position.\n\nStep 4: Repeat. Maintain posture throughout. Avoid locking the working knee, bouncing at the bottom of the movement to create momentum, rounding the spine or letting the hips come off the pad, or collapsing the knee inward. Do not let the hips or torso rotate.","coachingCues":[],"primaryEquipment":["Leg Press Machine"],"muscleGroups":["core","glutes","hamstrings","quadriceps"],"imageUrl":"https://img.youtube.com/vi/3aYsOsBA7ZE/hqdefault.jpg","videoId":"3aYsOsBA7ZE","videoUrl":"https://www.youtube.com/watch?v=3aYsOsBA7ZE","videoThumbnailUrl":"https://img.youtube.com/vi/3aYsOsBA7ZE/hqdefault.jpg","candidatePhotoUrl":"/images/exercises/single-leg-press.jpg","hasCandidatePhoto":true,"warnings":[],"ytTitle":"How to do a Single Leg Press  | Proper Form & Technique | NASM","ytAuthor":"National Academy of Sports Medicine (NASM)","ytStatus":"OK","card":{"category":"Legs","phase":"Phase 2 (Strength Endurance), Phase 3 (Hypertrophy), Phase 4 (Max Strength)","primeMover":"Quadriceps (Vastus Lateralis, Medialis, Intermedius, Rectus Femoris) & Gluteus Maximus","kineticCheckpoints":{"feetAnkles":"Hip-to-shoulder width on platform, toes straight ahead or slightly turned out.","knees":"Tracking over second and third toes; strictly avoid inward valgus collapse.","lphc":"Hips, sacrum, and lower back firmly glued to seat back pad throughout entire ROM.","shoulders":"Shoulder blades back against seat pad; grip side handles firmly.","headNeck":"Head resting comfortably against pad, neutral neck."},"clinicalCues":["Never allow hips or lower back to curl off the seat at bottom depth (prevents lumbar disc herniation).","Do not hyperextend or forcefully slam knees into lockout at the top.","Keep knees tracking directly in line with second and third toes."],"howToSteps":["1. Setup Stand on one leg with a slight knee bend, lifting the opposite foot off the floor, Sit in the leg press machine with feet hip to shoulder width apart and straight ahead on the leg press platform. Ensure foot height placement allows for good range of movement at both the hip and knee. Let one foot rest on the foot rest below. Draw in and brace the abs. Lock the shoulder blades back and down. Stabilize the upper body by grasping the handles.","2. Brace/Position Engage your core, level your pelvis with your stance glute, and maintain single-leg balance. Lower the platform down toward the body ensuring the knee stays aligned with the middle toes and weight is distributed evenly across the foot. Move through a maximum range without losing technique or bottoming out the thighs into the rib cage.","3. Reverse the pattern and return to starting position.","4. Repeat. Maintain posture throughout. Avoid locking the working knee, bouncing at the bottom of the movement to create momentum, rounding the spine or letting the hips come off the pad, or collapsing the knee inward. Do not let the hips or torso rotate."]}},{"id":"d1f683df-3f27-4fdd-a10b-0406484dc291","name":"Single Leg Reach Sagittal","slug":"single-leg-reach-sagittal-0033","description":"Step 1: Setup Stand on one leg with a slight bend in the knee, keeping the opposite leg extended behind you and arms at your sides.\n\nStep 2: Brace/Position Engage your core, maintaining a neutral spine, and focus on balancing on the standing leg while keeping your hips level.\n\nStep 3: Execute Slowly hinge forward at the hips, extending the rear leg straight back while reaching your arms forward, maintaining balance and control.\n\nStep 4: Return/Repeat Return to the starting position by driving through the standing leg, bringing the torso upright and the rear leg forward, then repeat for the desired number of repetitions.","coachingCues":[],"primaryEquipment":[],"muscleGroups":["core","glutes"],"imageUrl":"https://img.youtube.com/vi/1sbENKqlslg/hqdefault.jpg","videoId":"1sbENKqlslg","videoUrl":"https://www.youtube.com/watch?v=1sbENKqlslg","videoThumbnailUrl":"https://img.youtube.com/vi/1sbENKqlslg/hqdefault.jpg","candidatePhotoUrl":"/images/exercises/single-leg-reach-sagittal.jpg","hasCandidatePhoto":true,"warnings":[],"ytTitle":"How to do a Single-Leg Reach Sagittal","ytAuthor":"National Academy of Sports Medicine (NASM)","ytStatus":"OK","card":{"category":"Legs","phase":"Phase 1: Stabilization · Phase 2: Strength Endurance · Phase 3: Hypertrophy","primeMover":"Quadriceps & Gluteus Maximus","kineticCheckpoints":{"feetAnkles":"Shoulder-width, firmly planted on ground.","knees":"Aligned with second and third toes.","lphc":"Neutral lumbar spine; core braced.","shoulders":"Retracted and depressed into athletic posture.","headNeck":"Neutral cervical spine, chin packed."},"clinicalCues":["Maintain neutral kinetic chain checkpoints throughout.","Control the 2-second eccentric lowering phase.","Exhale on exertion while maintaining intra-abdominal brace."],"howToSteps":["1. Setup Stand on one leg with a slight bend in the knee, keeping the opposite leg extended behind you and arms at your sides.","2. Brace/Position Engage your core, maintaining a neutral spine, and focus on balancing on the standing leg while keeping your hips level.","3. Execute Slowly hinge forward at the hips, extending the rear leg straight back while reaching your arms forward, maintaining balance and control.","4. Return/Repeat Return to the starting position by driving through the standing leg, bringing the torso upright and the rear leg forward, then repeat for the desired number of repetitions."]}},{"id":"29d45ad2-3eb3-418b-84e3-6590a300006f","name":"Single Leg Romanian Deadlift","slug":"single-leg-romanian-deadlift-0218","description":"Step 1: Setup Stand on your right leg with a slight bend in the knee, holding a dumbbell in your left hand, and engage your core.\n\nStep 2: Brace/Position Hinge at the hip, extending your left leg straight back while lowering the dumbbell toward the ground, keeping your back flat and shoulders retracted.\n\nStep 3: Execute Lower the dumbbell until you feel a stretch in your right hamstring, maintaining balance on your right leg.\n\nStep 4: Return/Repeat Drive through your right heel to return to the starting position, then repeat for the desired number of repetitions before switching legs.","coachingCues":[],"primaryEquipment":[],"muscleGroups":["back","core","glutes","hamstrings"],"imageUrl":"https://img.youtube.com/vi/6pEL3KxnlEo/hqdefault.jpg","videoId":"6pEL3KxnlEo","videoUrl":"https://www.youtube.com/watch?v=6pEL3KxnlEo","videoThumbnailUrl":"https://img.youtube.com/vi/6pEL3KxnlEo/hqdefault.jpg","candidatePhotoUrl":"/images/exercises/single-leg-romanian-deadlift.jpg","hasCandidatePhoto":true,"warnings":[],"ytTitle":"How to do a Single-Leg Romanian Deadlift","ytAuthor":"National Academy of Sports Medicine (NASM)","ytStatus":"OK","card":{"category":"Legs","phase":"Phase 1 (Stabilization Endurance), Phase 2 (Strength Endurance)","primeMover":"Hamstrings Complex & Gluteus Maximus (Stance Leg)","kineticCheckpoints":{"feetAnkles":"Stance foot straight ahead, active tripod foot pressure (heel, 1st MTP, 5th MTP).","knees":"Soft 15°–20° bend in stance knee, tracking over second toe.","lphc":"Pelvis level and square to floor; avoid opening or rotating non-stance hip upward.","shoulders":"Scapulae retracted and depressed; spine long and neutral.","headNeck":"Neutral cervical spine, chin packed, gaze 6–8 feet ahead on floor."},"clinicalCues":["Keep floating foot toes pointed straight down toward the floor to prevent pelvic rotation.","Hinge through hip crease while maintaining flat neutral spine.","Maintain steady tripod foot contact (heel, 1st MTP, 5th MTP)."],"howToSteps":["1. Setup Stand on your right leg with a slight bend in the knee, holding a dumbbell in your left hand, and engage your core.","2. Brace/Position Hinge at the hip, extending your left leg straight back while lowering the dumbbell toward the ground, keeping your back flat and shoulders retracted.","3. Execute Lower the dumbbell until you feel a stretch in your right hamstring, maintaining balance on your right leg.","4. Return/Repeat Drive through your right heel to return to the starting position, then repeat for the desired number of repetitions before switching legs."]}},{"id":"779d781a-e3e0-40eb-a7ab-a84b36048485","name":"Single Leg Romanian Deadlift Curl To Overhead Press","slug":"single-leg-romanian-deadlift-curl-to-overhead-press-0220","description":"Step 1: Setup Stand on one leg with a slight bend in the knee, lifting the opposite foot slightly off the ground, holding dumbbells at your sides.\n\nStep 2: Brace/Position Engage your core and gluteals, level your pelvis, and maintain a neutral spine with your chest proud.\n\nStep 3: Execute Hinge forward at the hips to lower the weights along your shins while extending the non-working leg straight back; return to upright balance, curl the weights to your shoulders, and press overhead.\n\nStep 4: Return/Repeat Lower the weights under control back to your shoulders, uncurl them to your sides, and repeat for the desired repetitions before switching legs.","coachingCues":[],"primaryEquipment":[],"muscleGroups":["back","biceps","core","glutes","hamstrings","shoulders","triceps"],"imageUrl":"https://img.youtube.com/vi/CqLKOZCOFLU/hqdefault.jpg","videoId":"CqLKOZCOFLU","videoUrl":"https://www.youtube.com/watch?v=CqLKOZCOFLU","videoThumbnailUrl":"https://img.youtube.com/vi/CqLKOZCOFLU/hqdefault.jpg","candidatePhotoUrl":"/images/exercises/single-leg-romanian-deadlift-curl-to-overhead-press.jpg","hasCandidatePhoto":true,"warnings":[],"ytTitle":"How to do a Single-Leg Romanian Deadlift, Curl to Overhead Press","ytAuthor":"National Academy of Sports Medicine (NASM)","ytStatus":"OK","card":{"category":"Legs","phase":"Phase 1 (Stabilization Endurance), Phase 2 (Strength Endurance)","primeMover":"Hamstrings Complex & Gluteus Maximus (Stance Leg)","kineticCheckpoints":{"feetAnkles":"Stance foot straight ahead, active tripod foot pressure (heel, 1st MTP, 5th MTP).","knees":"Soft 15°–20° bend in stance knee, tracking over second toe.","lphc":"Pelvis level and square to floor; avoid opening or rotating non-stance hip upward.","shoulders":"Scapulae retracted and depressed; spine long and neutral.","headNeck":"Neutral cervical spine, chin packed, gaze 6–8 feet ahead on floor."},"clinicalCues":["Keep floating foot toes pointed straight down toward the floor to prevent pelvic rotation.","Hinge through hip crease while maintaining flat neutral spine.","Maintain steady tripod foot contact (heel, 1st MTP, 5th MTP)."],"howToSteps":["1. Setup Stand on one leg with a slight bend in the knee, lifting the opposite foot slightly off the ground, holding dumbbells at your sides.","2. Brace/Position Engage your core and gluteals, level your pelvis, and maintain a neutral spine with your chest proud.","3. Execute Hinge forward at the hips to lower the weights along your shins while extending the non-working leg straight back; return to upright balance, curl the weights to your shoulders, and press overhead.","4. Return/Repeat Lower the weights under control back to your shoulders, uncurl them to your sides, and repeat for the desired repetitions before switching legs."]}},{"id":"699b18dc-9c33-4420-bf4f-0ab2ccd71452","name":"Single Leg Romanian Deadlift Single Arm Curl To Overhead Press","slug":"single-leg-romanian-deadlift-single-arm-curl-to-overhead-press-0043","description":"Step 1: Setup Stand on your stance leg with a slight knee bend, holding a dumbbell in the opposite hand, lifting the non-working foot slightly off the floor.\n\nStep 2: Brace/Position Engage your core and gluteals, keeping your hips and shoulders squared to prevent trunk rotation.\n\nStep 3: Execute Hinge at the hips, lowering the dumbbell toward your stance foot while extending the non-working leg back; return upright, perform a single-arm bicep curl, and press the dumbbell overhead.\n\nStep 4: Return/Repeat Lower the dumbbell with control back to shoulder height, uncurl to the start, and repeat before alternating sides.","coachingCues":[],"primaryEquipment":[],"muscleGroups":["back","biceps","core","glutes","hamstrings","shoulders","triceps"],"imageUrl":"https://img.youtube.com/vi/SKl4_fSJeh0/hqde  Romanian Deadlift To Pnf Pattern 1","slug":"single-leg-romanian-deadlift-to-pnf-pattern-1-0221","description":"Step 1: Setup Stand on your right leg with a slight bend in the knee, holding a dumbbell in your left hand, and engage your core.\n\nStep 2: Brace/Position Hinge at the hips while extending your left leg straight back, keeping your back flat and lowering the dumbbell toward the ground.\n\nStep 3: Execute Once you reach the bottom of the movement, rotate your torso to the left and lift the dumbbell diagonally across your body, engaging your core and glutes.\n\nStep 4: Return/Repeat Lower the dumbbell back down to the starting position, return to the single-leg stance, and repeat for the desired number of repetitions before switching legs.","coachingCues":[],"primaryEquipment":[],"muscleGroups":["back","core","glutes","hamstrings"],"imageUrl":"https://img.youtube.com/vi/ZmI4DRACNTg/hqdefault.jpg","videoId":"ZmI4DRACNTg","videoUrl":"https://www.youtube.com/watch?v=ZmI4DRACNTg","videoThumbnailUrl":"https://img.youtube.com/vi/ZmI4DRACNTg/hqdefault.jpg","candidatePhotoUrl":"/images/exercises/single-leg-romanian-deadlift-to-pnf-pattern-1.jpg","hasCandidatePhoto":true,"warnings":[],"ytTitle":"How to do a Single-Leg Romanian Deadlift to PNF Pattern 1","ytAuthor":"National Academy of Sports Medicine (NASM)","ytStatus":"OK","card":{"category":"Legs","phase":"Phase 1 (Stabilization Endurance), Phase 2 (Strength Endurance)","primeMover":"Hamstrings Complex & Gluteus Maximus (Stance Leg)","kineticCheckpoints":{"feetAnkles":"Stance foot straight ahead, active tripod foot pressure (heel, 1st MTP, 5th MTP).","knees":"Soft 15°–20° bend in stance knee, tracking over second toe.","lphc":"Pelvis level and square to floor; avoid opening or rotating non-stance hip upward.","shoulders":"Scapulae retracted and depressed; spine long and neutral.","headNeck":"Neutral cervical spine, chin packed, gaze 6–8 feet ahead on floor."},"clinicalCues":["Keep floating foot toes pointed straight down toward the floor to prevent pelvic rotation.","Hinge through hip crease while maintaining flat neutral spine.","Maintain steady tripod foot contact (heel, 1st MTP, 5th MTP)."],"howToSteps":["1. Setup Stand on your right leg with a slight bend in the knee, holding a dumbbell in your left hand, and engage your core.","2. Brace/Position Hinge at the hips while extending your left leg straight back, keeping your back flat and lowering the dumbbell toward the ground.","3. Execute Once you reach the bottom of the movement, rotate your torso to the left and lift the dumbbell diagonally across your body, engaging your core and glutes.","4. Return/Repeat Lower the dumbbell back down to the starting position, return to the single-leg stance, and repeat for the desired number of repetitions before switching legs."]}},{"id":"b82e6160-d83b-4c3b-b9bf-2ba5305da2d2","name":"Single Leg Romanian Deadlift To Pnf Pattern 2","slug":"single-leg-romanian-deadlift-to-pnf-pattern-2-0222","description":"Step 1: Setup Stand on one leg with a slight knee bend, holding a light dumbbell or cable handle at the opposite hip, lifting the non-working foot off the ground.\n\nStep 2: Brace/Position Engage your core and level your pelvis, maintaining single-leg stabilization throughout the movement.\n\nStep 3: Execute Hinge forward at the hips into a single-leg deadlift; as you return to upright standing, draw your arm diagonally upward across your body into PNF Pattern 2 (external rotation and abduction).\n\nStep 4: Return/Repeat Lower the weight diagonally back across your torso to the opposite hip under control, and repeat before switching legs.","coachingCues":[],"primaryEquipment":[],"muscleGroups":["back","core","glutes","hamstrings"],"imageUrl":"https://img.youtube.com/vi/znQ41ErG4Wk/hqdefault.jpg","videoId":"znQ41ErG4Wk","videoUrl":"https://www.youtube.com/watch?v=znQ41ErG4Wk","videoThumbnailUrl":"https://img.youtube.com/vi/znQ41ErG4Wk/hqdefault.jpg","candidatePhotoUrl":"/images/exercises/single-leg-romanian-deadlift-to-pnf-pattern-1.jpg","hasCandidatePhoto":true,"warnings":[],"ytTitle":"How to do a Single-Leg Romanian Deadlift to PNF Pattern 2","ytAuthor":"National Academy of Sports Medicine (NASM)","ytStatus":"OK","card":{"category":"Legs","phase":"Phase 1 (Stabilization Endurance), Phase 2 (Strength Endurance)","primeMover":"Hamstrings Complex & Gluteus Maximus (Stance Leg)","kineticCheckpoints":{"feetAnkles":"Stance foot straight ahead, active tripod foot pressure (heel, 1st MTP, 5th MTP).","knees":"Soft 15°–20° bend in stance knee, tracking over second toe.","lphc":"Pelvis level and square to floor; avoid opening or rotating non-stance hip upward.","shoulders":"Scapulae retracted and depressed; spine long and neutral.","headNeck":"Neutral cervical spine, chin packed, gaze 6–8 feet ahead on floor."},"clinicalCues":["Keep floating foot toes pointed straight down toward the floor to prevent pelvic rotation.","Hinge through hip crease while maintaining flat neutral spine.","Maintain steady tripod foot contact (heel, 1st MTP, 5th MTP)."],"howToSteps":["1. Setup Stand on one leg with a slight knee bend, holding a light dumbbell or cable handle at the opposite hip, lifting the non-working foot off the ground.","2. Brace/Position Engage your core and level your pelvis, maintaining single-leg stabilization throughout the movement.","3. Execute Hinge forward at the hips into a single-leg deadlift; as you return to upright standing, draw your arm diagonally upward across your body into PNF Pattern 2 (external rotation and abduction).","4. Return/Repeat Lower the weight diagonally back across your torso to the opposite hip under control, and repeat before switching legs."]}},{"id":"904b7635-e724-4291-b0f5-81e42762a957","name":"Single Leg Scaption","slug":"single-leg-scaption-0216","description":"Step 1: Setup Stand on one leg with a slight bend in the knee, lifting the non-stance foot off the floor, holding light dumbbells at your sides with thumbs pointing upward.\n\nStep 2: Brace/Position Engage your core, level your pelvis by contracting the gluteus medius of your stance leg, and maintain an upright posture with shoulders packed.\n\nStep 3: Execute Raise your arms diagonally forward in the scapular plane at a 30-to-45-degree angle until they reach shoulder height, keeping thumbs up.\n\nStep 4: Return/Repeat Lower the dumbbells slowly back to your sides in a 4-second controlled eccentric motion, maintaining single-leg balance throughout before switching legs.","coachingCues":[],"primaryEquipment":["Dumbbells"],"muscleGroups":["core","deltoids","glutes","rotator cuff","shoulders"],"imageUrl":"https://img.youtube.com/vi/PKjDGnwpB_o/hqdefault.jpg","videoId":"PKjDGnwpB_o","videoUrl":"https://www.youtube.com/watch?v=PKjDGnwpB_o","videoThumbnailUrl":"https://img.youtube.com/vi/PKjDGnwpB_o/hqdefault.jpg","candidatePhotoUrl":"/images/exercises/single-leg-scaption.jpg","hasCandidatePhoto":true,"warnings":[],"ytTitle":"How to do a Single-Leg Scaption","ytAuthor":"National Academy of Sports Medicine (NASM)","ytStatus":"OK","card":{"category":"Shoulders","phase":"Phase 1 (Stabilization Endurance)","primeMover":"Anterior Deltoid & Supraspinatus","kineticCheckpoints":{"feetAnkles":"Single-leg stance on balance leg; foot pointing straight ahead with active arch.","knees":"Soft 10°–15° knee bend on stance leg; knee tracking directly over second and third toes.","lphc":"Level pelvis; gluteus medius contracted to prevent contralateral hip drop (Trendelenburg).","shoulders":"Scapulae retracted and depressed; elevate arms in scapular plane (30°–45° forward) with thumbs up.","headNeck":"Neutral cervical spine packed with eyes focused straight ahead."},"clinicalCues":["Elevate arms strictly in the scapular plane (30°–45° angle) to prevent subacromial impingement.","Keep thumbs pointing up toward the ceiling throughout the entire rep.","Maintain single-leg balance from the foot tripod and gluteus medius; avoid knee valgus.","Do not allow upper trapezius to shrug toward the ears."],"howToSteps":["1. Setup Stand on one leg with a slight bend in the knee, lifting the non-stance foot off the floor, holding light dumbbells at your sides with thumbs pointing upward.","2. Brace/Position Engage your core, level your pelvis by contracting the gluteus medius of your stance leg, and maintain an upright posture with shoulders packed.","3. Execute Raise your arms diagonally forward in the scapular plane at a 30-to-45-degree angle until they reach shoulder height, keeping thumbs up.","4. Return/Repeat Lower the dumbbells slowly back to your sides in a 4-second controlled eccentric motion, maintaining single-leg balance throughout before switching legs."]}},{"id":"6d011e56-693c-4202-88b6-34f90521cda8","name":"Single Leg Seated Leg Curl","slug":"single-leg-seated-leg-curl","description":"Step 1: Sit in the leg curl machine with feet hip width apart, abs drawn in and braced and toe pulled toward the nose. Ensure setup positions knee close to hinge on the machine and pad resting on lower calf/achilles. Hang one leg straight down. Position head in line with the back and lock shoulder blades back and down.\n\nStep 2: Drive the heels down toward the glutes as far as possible without arching the lower back.\n\nStep 3: Reverse the pattern and lower the weight back to the starting position. Maintain posture throughout.\n\nStep 4: Repeat for the desired number of repetitions. Avoid overarching the lower back, pointing or turning the toes out or jutting the chin forward.","coachingCues":[],"primaryEquipment":["Leg Curl Machine"],"muscleGroups":["core","glutes","hamstrings"],"imageUrl":"https://img.youtube.com/vi/PXNJ71rksvU/hqdefault.jpg","videoId":"PXNJ71rksvU","videoUrl":"https://www.youtube.com/watch?v=PXNJ71rksvU","videoThumbnailUrl":"https://img.youtube.com/vi/PXNJ71rksvU/hqdefault.jpg","candidatePhotoUrl":"/images/exercises/single-leg-seated-leg-curl.jpg","hasCandidatePhoto":true,"warnings":[],"ytTitle":"Single-Leg Seated Leg Curl | Proper Form & Technique | NASM","ytAuthor":"National Academy of Sports Medicine (NASM)","ytStatus":"OK","card":{"category":"Arms","phase":"Phase 1: Stabilization · Phase 2: Strength Endurance · Phase 3: Hypertrophy","primeMover":"Biceps Brachii","kineticCheckpoints":{"feetAnkles":"Shoulder-width, firmly planted on ground.","knees":"Aligned with second and third toes.","lphc":"Neutral lumbar spine; core braced.","shoulders":"Retracted and depressed into athletic posture.","headNeck":"Neutral cervical spine, chin packed."},"clinicalCues":["Maintain neutral kinetic chain checkpoints throughout.","Control the 2-second eccentric lowering phase.","Exhale on exertion while maintaining intra-abdominal brace."],"howToSteps":["1. Sit in the leg curl machine with feet hip width apart, abs drawn in and braced and toe pulled toward the nose. Ensure setup positions knee close to hinge on the machine and pad resting on lower calf/achilles. Hang one leg straight down. Position head in line with the back and lock shoulder blades back and down.","2. Drive the heels down toward the glutes as far as possible without arching the lower back.","3. Reverse the pattern and lower the weight back to the starting position. Maintain posture throughout.","4. Repeat for the desired number of repetitions. Avoid overarching the lower back, pointing or turning the toes out or jutting the chin forward."]}},{"id":"a5804a85-9548-4ce1-afb6-cf0b73c4f4b8","name":"Single Leg Single Arm Scaption","slug":"single-leg-single-arm-scaption-0215","description":"Step 1: Setup Stand on your right leg with your left knee lifted to hip height, holding a dumbbell in your right hand at your side.\n\nStep 2: Brace/Position Engage your core, maintain a neutral spine, and slightly bend your right knee while keeping your left leg stable.\n\nStep 3: Execute Raise the dumbbell diagonally in front of you at a 45-degree angle, lifting it to shoulder height while keeping your elbow slightly bent.\n\nStep 4: Return/Repeat Lower the dumbbell back to the starting position with control, then repeat for the desired number of repetitions before switching to the left leg.","coachingCues":[],"primaryEquipment":["Dumbbells"],"muscleGroups":["core","deltoids","glutes","rotator cuff","shoulders"],"imageUrl":"https://img.youtube.com/vi/ikMg_3_jAWE/hqdefault.jpg","videoId":"ikMg_3_jAWE","videoUrl":"https://www.youtube.com/watch?v=ikMg_3_jAWE","videoThumbnailUrl":"https://img.youtube.com/vi/ikMg_3_jAWE/hqdefault.jpg","candidatePhotoUrl":"/images/exercises/single-leg-single-arm-scaption.jpg","hasCandidatePhoto":true,"warnings":[],"ytTitle":"How to do a Single-Leg Single-Arm Scaption","ytAuthor":"National Academy of Sports Medicine (NASM)","ytStatus":"OK","card":{"category":"Shoulders","phase":"Phase 1 (Stabilization Endurance), Phase 2 (Strength Endurance)","primeMover":"Anterior Deltoid & Supraspinatus","kineticCheckpoints":{"feetAnkles":"Single-leg stance or hip-width parallel; foot pointing straight ahead with active arch.","knees":"Soft knee bend on stance leg; knee tracking directly over second and third toes.","lphc":"Neutral pelvis; engage core and glutes to avoid pelvic rotation or lumbar hyperextension.","shoulders":"Scapulae depressed and retracted; elevate arms in scapular plane (30°–45° anterior to frontal plane) with thumbs pointing upward.","headNeck":"Neutral cervical spine, chin tucked, eyes forward."},"clinicalCues":["Elevate arms strictly in the scapular plane (30°–45° anterior to frontal plane) to clear the subacromial space.","Maintain thumbs pointing up toward the ceiling throughout the entire range of motion.","Depress shoulders away from ears; do not shrug upper trapezius to elevate weights.","Keep core braced and stance leg stable without knee valgus collapse."],"howToSteps":["1. Setup Stand on your right leg with your left knee lifted to hip height, holding a dumbbell in your right hand at your side.","2. Brace/Position Engage your core, maintain a neutral spine, and slightly bend your right knee while keeping your left leg stable.","3. Execute Raise the dumbbell diagonally in front of you at a 45-degree angle, lifting it to shoulder height while keeping your elbow slightly bent.","4. Return/Repeat Lower the dumbbell back to the starting position with control, then repeat for the desired number of repetitions before switching to the left leg."]}},{"id":"6f4a1aad-5374-428f-ba3a-b82abb53d606","name":"Single Leg Squat","slug":"single-leg-squat","description":"Step 1: Stand on one leg with your knee slightly bent and your other leg extended in front of you.\n\nStep 2: Engage your core and lower your body by bending the standing leg at the knee, keeping your chest upright.\n\nStep 3: Go down as low as you can while maintaining balance, ensuring your knee stays aligned with your toes.\n\nStep 4: Push through your heel to return to the starting position, fully extending your standing leg.","coachingCues":[],"primaryEquipment":["None"],"muscleGroups":["core","glutes","hamstrings","quadriceps"],"imageUrl":"https://img.youtube.com/vi/sSXnaFyhiZs/hqdefault.jpg","videoId":"sSXnaFyhiZs","videoUrl":"https://www.youtube.com/watch?v=sSXnaFyhiZs","videoThumbnailUrl":"https://img.youtube.com/vi/sSXnaFyhiZs/hqdefault.jpg","candidatePhotoUrl":"/images/exercises/single-leg-squat.jpg","hasCandidatePhoto":true,"warnings":[],"ytTitle":"How to do a Single-Leg Squat | Proper Form & Technique | NASM","ytAuthor":"National Academy of Sports Medicine (NASM)","ytStatus":"OK","card":{"category":"Legs","phase":"Phase 1: Stabilization · Phase 2: Strength Endurance · Phase 3: Hypertrophy","primeMover":"Quadriceps & Gluteus Maximus","kineticCheckpoints":{"feetAnkles":"Shoulder-width, firmly planted on ground.","knees":"Aligned with second and third toes.","lphc":"Neutral lumbar spine; core braced.","shoulders":"Retracted and depressed into athletic posture.","headNeck":"Neutral cervical spine, chin packed."},"clinicalCues":["Maintain neutral kinetic chain checkpoints throughout.","Control the 2-second eccentric lowering phase.","Exhale on exertion while maintaining intra-abdominal brace."],"howToSteps":["1. Stand on one leg with your knee slightly bent and your other leg extended in front of you.","2. Engage your core and lower your body by bending the standing leg at the knee, keeping your chest upright.","3. Go down as low as you can while maintaining balance, ensuring your knee stays aligned with your toes.","4. Push through your heel to return to the starting position, fully extending your standing leg."]}},{"id":"5663480d-a2a8-4bee-b0e5-a3153c4b4d32","name":"Single Leg Squat To Row","slug":"single-leg-squat-to-row","description":"Step 1: Adjust the cable machine to a low position and attach a single handle.\n\nStep 2: Stand on one leg, holding the handle with the opposite hand, and engage your core.\n\nStep 3: Lower into a single-leg squat while simultaneously pulling the handle towards your torso.\n\nStep 4: Return to the starting position by pushing through your heel and extending your leg while releasing the handle.","coachingCues":[],"primaryEquipment":["Cable Machine"],"muscleGroups":["back","biceps","core","glutes","hamstrings","quadriceps"],"imageUrl":"https://img.youtube.com/vi/LmGbrgGJS6E/hqdefault.jpg","videoId":"LmGbrgGJS6E","videoUrl":"https://www.youtube.com/watch?v=LmGbrgGJS6E","videoThumbnailUrl":"https://img.youtube.com/vi/LmGbrgGJS6E/hqdefault.jpg","candidatePhotoUrl":"/images/exercises/single-leg-squat-to-row.jpg","hasCandidatePhoto":true,"warnings":[],"ytTitle":"Single-Leg Squat to Row","ytAuthor":"National Academy of Sports Medicine (NASM)","ytStatus":"OK","card":{"category":"Back","phase":"Phase 1: Stabilization · Phase 2: Strength Endurance · Phase 3: Hypertrophy","primeMover":"Latissimus Dorsi, Rhomboids & Middle Trapezius","kineticCheckpoints":{"feetAnkles":"Shoulder-width, firmly planted on ground.","knees":"Aligned with second and third toes.","lphc":"Neutral lumbar spine; core braced."," maintain an upright posture with a neutral spine.\n\nStep 3: Execute Press the dumbbells vertically overhead until your arms are fully extended beside your ears, maintaining single-leg balance and avoiding arching your lower back or flaring your ribs.\n\nStep 4: Return/Repeat Lower the dumbbells back to shoulder height in a slow, controlled 4-second motion, then repeat for the desired number of repetitions before switching legs.","coachingCues":["Keep lower back neutral and avoid arching lumbar spine during the press","Maintain level pelvis and avoid letting opposite hip drop","Drive through the center of the stance foot tripod with a soft knee"],"primaryEquipment":["Dumbbells"],"muscleGroups":["shoulders","triceps","core","glutes"],"imageUrl":"https://img.youtube.com/vi/8o79mSC7ZZQ/hqdefault.jpg","videoId":"8o79mSC7ZZQ","videoUrl":"https://www.youtube.com/watch?v=8o79mSC7ZZQ","videoThumbnailUrl":"https://img.youtube.com/vi/8o79mSC7ZZQ/hqdefault.jpg","candidatePhotoUrl":"/images/exercises/single-leg-dumbbell-overhead-press.jpg","hasCandidatePhoto":true,"warnings":[],"ytTitle":"Dumbbell Single Leg Shoulder Press Demo","ytAuthor":"Steph Gaudreau - Fuel Your Strength","ytStatus":"OK","card":{"category":"Shoulders","phase":"Phase 1 (Stabilization Endurance)","primeMover":"Anterior & Medial Deltoids","kineticCheckpoints":{"feetAnkles":"Single-leg stance on balance leg; tripod foot pressure (heel, first MTP, fifth MTP) pointing straight ahead with active arch.","knees":"Soft 10°–15° knee bend on stance leg; knee tracking directly over second and third toes (no valgus collapse).","lphc":"Pelvis level and square; gluteus medius contracted to prevent contralateral hip drop; core engaged to prevent lumbar hyperextension.","shoulders":"Scapulae depressed and retracted; elbows slightly forward in scapular plane (30° anterior); press vertically overhead without trap shrugging.","headNeck":"Cervical spine neutral with chin packed; eyes fixed on an eye-level focal point to preserve vestibular balance."},"clinicalCues":["Strictly avoid arching the lower back or flaring the ribcage as dumbbells reach overhead lockout.","Maintain level hips throughout the entire movement; do not allow the non-standing hip to drop (prevent Trendelenburg sign).","Press through the center of the stance foot tripod with a soft knee to stabilize the lower kinetic chain.","Keep shoulders depressed away from the ears; do not shrug the upper trapezius to finish the press."],"howToSteps":["1. Setup Stand on one leg with a slight bend in the knee, holding a dumbbell in each hand at shoulder height with your palms facing forward or neutral, elbows bent and forearms vertical, lifting the non-stance foot off the floor.","2. Brace/Position Engage your core with the drawing-in maneuver, level your pelvis by contracting the gluteus medius of the stance leg, and maintain an upright posture with a neutral spine.","3. Execute Press the dumbbells vertically overhead until your arms are fully extended beside your ears, maintaining single-leg balance and avoiding arching your lower back or flaring your ribs.","4. Return/Repeat Lower the dumbbells back to shoulder height in a slow, controlled 4-second motion, then repeat for the desired number of repetitions before switching legs."]}},{"id":"2b02edfb-8e49-45af-a3b4-1b2a832758a0","name":"Slalom","slug":"slalom-0156","description":"Step 1: Setup Stand with your feet hip-width apart, knees slightly bent, and weight evenly distributed on both feet.\n\nStep 2: Brace/Position Engage your core and maintain an upright posture, keeping your chest lifted and shoulders relaxed.\n\nStep 3: Execute Shift your weight to one foot and push off, jumping laterally to the opposite side while landing softly on the other foot, maintaining balance.\n\nStep 4: Return/Repeat Immediately push off from the landing foot and jump back to the starting side, continuing to alternate sides for the desired number of repetitions.","coachingCues":[],"primaryEquipment" pine, and position your feet in a staggered stance with one foot slightly forward.\n\nStep 3: Execute Dip slightly by bending your knees, then explosively extend your hips and knees while pressing the barbell overhead, splitting your feet into a lunge position.\n\nStep 4: Return/Repeat Lower the barbell back to your upper chest, return to the starting stance, and prepare for the next repetition.","coachingCues":[],"primaryEquipment":[],"muscleGroups":["glutes","hamstrings","quadriceps"],"imageUrl":"https://img.youtube.com/vi/UcYVQWjygSw/hqdefault.jpg","videoId":"UcYVQWjygSw","videoUrl":"https://www.youtube.com/watch?v=UcYVQWjygSw","videoThumbnailUrl":"https://img.youtube.com/vi/UcYVQWjygSw/hqdefault.jpg","candidatePhotoUrl":"/images/exercises/split-jerk.jpg","hasCandidatePhoto":true,"warnings":[],"ytTitle":"How to do a Split Jerk","ytAuthor":"National Academy of Sports Medicine (NASM)","ytStatus":"OK","card":{"category":"Legs","phase":"Phase 1: Stabilization · Phase 2: Strength Endurance · Phase 3: Hypertrophy","primeMover":"Quadriceps & Gluteus Maximus","kineticCheckpoints":{"feetAnkles":"Shoulder-width, firmly planted on ground.","knees":"Aligned with second and third toes.","lphc":"Neutral lumbar spine; core braced.","shoulders":"Retracted and depressed into athletic posture.","headNeck":"Neutral cervical spine, chin packed."},"clinicalCues":["Maintain neutral kinetic chain checkpoints throughout.","Control the 2-second eccentric lowering phase.","Exhale on exertion while maintaining intra-abdominal brace."],"howToSteps":["1. Setup Stand with your feet shoulder-width apart, barbell resting on your upper chest with elbows slightly in front, and grip the barbell just outside shoulder width.","2. Brace/Position Engage your core, maintain a neutral spine, and position your feet in a staggered stance with one foot slightly forward.","3. Execute Dip slightly by bending your knees, then explosively extend your hips and knees while pressing the barbell overhead, splittin ping your chest up and back straight.\n\nStep 3: Execute As you rise from the squat, pull the dumbbells towards your torso, squeezing your shoulder blades together to perform a row.\n\nStep 4: Return/Repeat Lower the dumbbells back to the starting position as you descend into the squat again, maintaining control throughout the movement.","coachingCues":[],"primaryEquipment":[],"muscleGroups":["back","biceps","glutes","hamstrings","quadriceps"],"imageUrl":"https://img.youtube.com/vi/qZn-_dXCP2s/hqdefault.jpg","videoId":"qZn-_dXCP2s","videoUrl":"https://www.youtube.com/watch?v=qZn-_dXCP2s","videoThumbnailUrl":"https://img.youtube.com/vi/qZn-_dXCP2s/hqdefault.jpg","candidatePhotoUrl":"/images/exercises/squat-to-row.jpg","hasCandidatePhoto":true,"warnings":[],"ytTitle":"How to do a Squat to Row","ytAuthor":"National Academy of Sports Medicine (NASM)","ytStatus":"OK","card":{"category":"Back","phase":"Phase 1: Stabilization · Phase 2: Strength Endurance · Phase 3: Hypertrophy","primeMover":"Latissimus Dorsi, Rhomboids & Middle Trapezius","kineticCheckpoints":{"feetAnkles":"Shoulder-width, firmly planted on ground.","knees":"Aligned with second and third toes.","lphc":"Neutral lumbar spine; core braced.","shoulders":"Retracted and depressed into athletic posture.","headNeck":"Neutral cervical spine, chin packed."},"clinicalCues":["Maintain neutral kinetic chain checkpoints throughout.","Control the 2-second eccentric lowering phase.","Exhale on exertion while maintaining intra-abdominal brace."],"howToSteps":["1. Setup Stand with feet shoulder-width apart, holding a dumbbell in each hand with palms facing your body, arms fully extended at your sides.","2. Brace/Position Engage your core and hinge at the hips, lowering your body into a squat while keeping your chest up and back straight.","3. Execute As you rise from the squat, pull the dumbbells towards your torso, squeezing your shoulder blades together to perform a row.","4. Return/Repeat Lower the dumbbells back to the starting position as you descend into the squat again, maintaining control throughout the movement."]}},{"id":"54ca19a3-be1a-4a67-8809-60274f3d10a4","name":"Squat To Single Arm Row","slug":"squat-to-single-arm-row-0243","description":"Step 1: Setup Stand with your feet shoulder-width apart, holding a dumbbell in your right hand with your arm fully extended toward the floor.\n\nStep 2: Brace/Position Engage your core, keeping your chest up and shoulders back, and initiate the squat by bending at the hips and knees while lowering your body.\n\nStep 3: Execute As you reach the bottom of the squat, pull the dumbbell towards your ribcage with your right arm, squeezing your shoulder blade at the top of the movement.\n\nStep 4: Return/Repeat Lower the dumbbell back to the starting position as you rise from the squat, then repeat for the desired number of repetitions before switching to the left arm.","coachingCues":[],"primaryEquipment":[],"muscleGroups":["back","biceps","glutes","hamstrings","quadriceps"],"imageUrl":"https://img.youtube.com/vi/dSf1abuGONU/hqdefault.jpg","videoId":"dSf1abuGONU","videoUrl":"https://www.youtube.com/watch?v=dSf1abuGONU","videoThumbnailUrl":"https://img.youtube.com/vi/dSf1abuGONU/hqdefault.jpg","candidatePhotoUrl":"/images/exercises/squat-to-single-arm-row.jpg","hasCandidatePhoto":true,"warnings":[],"ytTitle":"How to do a Squat to Single-Arm Row","ytAuthor":"National Academy of Sports Medicine (NASM)","ytStatus":"OK","card":{"category":"Back","phase":"Phase 1: Stabilization · Phase 2: Strength Endurance · Phase 3: Hypertrophy","primeMover":"Latissimus Dorsi, Rhomboids & Middle Trapezius","kineticCheckpoints":{"feetAnkles":"Shoulder-width, firmly planted on ground.","knees":"Aligned with second and third toes.","lphc":"Neutral lumbar spine; core braced.","shoulders":"Retracted and depressed into athletic posture.","headNeck":"Neutral cervical spine, chin packed."},"clinicalCues":["Maintain neutral kinetic chain checkpoints throughout.","Contro he step, ensuring your knee is aligned with your ankle.\n\nStep 3: Execute Press through your right heel to step up onto the platform, bringing your left knee up towards your chest to balance.\n\nStep 4: Return/Repeat Lower your left leg back to the ground, step down with your right foot, and repeat the movement for the desired number of repetitions before switching sides.","coachingCues":[],"primaryEquipment":["Box or Step"],"muscleGroups":["core","glutes","hamstrings","quadriceps"],"imageUrl":"https://img.youtube.com/vi/fVRKGAp1iHw/hqdefault.jpg","videoId":"fVRKGAp1iHw","videoUrl":"https://www.youtube.com/watch?v=fVRKGAp1iHw","videoThumbnailUrl":"https://img.youtube.com/vi/fVRKGAp1iHw/hqdefault.jpg","candidatePhotoUrl":"/images/exercises/step-up-to-balance-frontal.jpg","hasCandidatePhoto":true,"warnings":[],"ytTitle":"How to do a Step-Up to Balance Frontal","ytAuthor":"National Academy of Sports Medicine (NASM)","ytStatus":"OK","card":{"category":"Legs","phase":"Phase 1: Stabilization · Phase 2: Strength Endurance · Phase 3: Hypertrophy","primeMover":"Quadriceps & Gluteus Maximus","kineticCheckpoints":{"feetAnkles":"Shoulder-width, firmly planted on ground.","knees":"Aligned with second and third toes.","lphc":"Neutral lumbar spine; core braced.","shoulders":"Retracted and depressed into athletic posture.","headNeck":"Neutral cervical spine, chin packed."},"clinicalCues":["Maintain neutral kinetic chain checkpoints throughout.","Control the 2-second eccentric lowering phase.","Exhale on exertion while maintaining intra-abdominal brace."],"howToSteps":["1. Setup Stand in front of a sturdy step or platform with your feet hip-width apart and your weight evenly distributed.","2. Brace/Position Engage your core and place your right foot firmly on the step, ensuring your knee is aligned with your ankle.","3. Execute Press through your right heel to step up onto the platform, bringing your left knee up towards your chest to balance.","4. Return/Repeat Lower your left leg back to the ground, step down with your right foot, and repeat the movement for the desired number of repetitions before switching sides."]}},{"id":"5a25ec16-625e-4b5f-bd74-f69910f4ac6e","name":"Step Up To Balance Frontal Curl To Overhead Press","slug":"step-up-to-balance-frontal-curl-to-overhead-press-0048","description":"Step 1: Setup Stand in front of a sturdy step or platform with your feet hip-width apart, holding a dumbbell in each hand at your sides.\n\nStep 2: Brace/Position Step up onto the platform with your right foot, ensuring your knee is aligned over your ankle, and curl the dumbbells to shoulder height as you balance on your right leg.\n\nStep 3: Execute Press the dumbbells overhead while maintaining your balance on the right leg, engaging your core and keeping your back straight.\n\nStep 4: Return/Repeat Lower the dumbbells back to shoulder height, step down with your right foot, and repeat the movement on the left leg.","coachingCues":[],"primaryEquipment":["Box or Step"],"muscleGroups":["biceps","core","glutes","hamstrings","quadriceps","shoulders","triceps"],"imageUrl":"https://img.youtube.com/vi/gjigcqa_ufo/hqdefault.jpg","videoId":"gjigcqa_ufo","videoUrl":"https://www.youtube.com/watch?v=gjigcqa_ufo","videoThumbnailUrl":"https://img.youtube.com/vi/gjigcqa_ufo/hqdefault.jpg","candidatePhotoUrl":"/images/exercises/step-up-to-balance-frontal-curl-to-overhead-press.jpg","hasCandidatePhoto":true,"warnings":[],"ytTitle":"How to do a Step-Up to Balance Frontal, Curl to Overhead Press","ytAuthor":"National Academy of Sports Medicine (NASM)","ytStatus":"OK","card":{"category":"Shoulders","phase":"Phase 2 (Strength Endurance), Phase 4 (Max Strength)","primeMover":"Anterior Deltoid & Middle Deltoid","kineticCheckpoints":{"feetAnkles":"Hip-width apart, firmly rooted.","knees":"Soft extension without locking or hyperextending.","lphc":"Glutes and abs fully engaged to prevent lumbar hyperextension.","shoulders":"Elbows positioned slightly in front of bar in l flexing the glutes. Hold.","3. Return to the starting position. Maintain posture throughout.","4. Repeat for the desired number of repetitions or time. Avoid feet collapsing inward, shoulder blades winging or chin falling toward the floor."]}},{"id":"fa74ec24-373c-4137-a240-93b7775eade8","name":"Supine Biceps Femoris Stretch","slug":"supine-biceps-femoris-stretch-0264","description":"Step 1: Setup Lie on your back on a flat surface with your legs extended straight and arms at your sides.\n\nStep 2: Brace/Position Bend your right knee and place your right foot flat on the ground, keeping your left leg straight.\n\nStep 3: Execute Using a strap or your hands, gently pull your left leg towards your chest while keeping it straight, feeling a stretch in the back of your thigh.\n\nStep 4: Return/Repeat Hold the stretch for 15-30 seconds, then slowly lower your left leg back to the ground and switch to the right leg.","coachingCues":[],"primaryEquipment":[],"muscleGroups":["glutes","hamstrings","quadriceps"],"imageUrl":"https://img.youtube.com/vi/xO8CZWtfKDU/hqdefault.jpg","videoId":"xO8CZWtfKDU","videoUrl":"https://www.youtube.com/watch?v=xO8CZWtfKDU","videoThumbnailUrl":"https://img.youtube.com/vi/xO8CZWtfKDU/hqdefault.jpg","candidatePhotoUrl":"/images/exercises/active-supine-biceps-femoris.jpg","hasCandidatePhoto":true,"warnings":[],"ytTitle":"How to do a Supine Biceps Femoris Stretch","ytAuthor":"National Academy of Sports Medicine (NASM)","ytStatus":"OK","card":{"category":"Flexibility/SMR","phase":"Phase 1: Stabilization · Phase 2: Strength Endurance · Phase 3: Hypertrophy","primeMover":"Target Neuromuscular / Fascial System","kineticCheckpoints":{"feetAnkles":"Shoulder-width, firmly planted on ground.","knees":"Aligned with second and third toes.","lphc":"Neutral lumbar spine; core braced.","shoulders":"Retracted and depressed into athletic posture.","headNeck":"Neutral cervical spine, chin packed."},"clinicalCues":["Maintain neutral kinetic chain checkpoints throughout.","Control the 2-second eccentric lowering phase.","Exhale on exertion while maintaining intra-abdominal brace."],"howToSteps":["1. Setup Lie on your back on a flat surface with your legs extended straight and arms at your sides.","2. Brace/Position Bend your right knee and place your right foot flat on the ground, keeping your left leg straight.","3. Execute Using a strap or your hands, gently pull your left leg towards your chest while keeping it straight, feeling a stretch in the back of your thigh.","4. Return/Repeat Hold the stretch for 15-30 seconds, then slowly lower your left leg back to the ground and switch to the right leg."]}},{"id":"7ccaef6d-3131-4cb1-8bae-92d8f0e9a858","name":"Supine Dumbbell Extension","slug":"supine-dumbbell-extension-0117","description":"Step 1: Setup Lie on your back on a flat bench with a dumbbell in each hand, arms extended above your chest, palms facing each other.\n\nStep 2: Brace/Position Engage your core and maintain a neutral spine, ensuring your feet are flat on the floor or resting on the bench.\n\nStep 3: Execute Slowly bend your elbows to lower the dumbbells towards your forehead, keeping your upper arms stationary and your elbows close to your head.\n\nStep 4: Return/Repeat Extend your arms back to the starting position, fully straightening your elbows while maintaining control, and repeat for the desired number of repetitions.","coachingCues":[],"primaryEquipment":["Dumbbells"],"muscleGroups":["back"],"imageUrl":"https://img.youtube.com/vi/fwExa2A1Plc/hqdefault.jpg","videoId":"fwExa2A1Plc","videoUrl":"https://www.youtube.com/watch?v=fwExa2A1Plc","videoThumbnailUrl":"https://img.youtube.com/vi/fwExa2A1Plc/hqdefault.jpg","candidatePhotoUrl":"/images/exercises/supine-dumbbell-extension.jpg","hasCandidatePhoto":true,"warnings":[],"ytTitle":"How to do a Supine Dumbbell Extension","ytAuthor":"National Academy of Sports Medicine (NASM)","ytStatus":"OK","card":{"category":"Back","phase":"Phase 1: Stabilization · Phase 2: Strength Endurance · Phase 3: Hypertrophy","primeMover":"Latissimus Dorsi, Rhomboids & Middle Trapezius","kineticCheckpoints":{"feetAnkles":"Shoulder-width, firmly planted on ground.","knees":"Aligned with second and third toes.","lphc":"Neutral lumbar spine; core braced.","shoulders":"Retracted and depressed into athletic posture.","headNeck":"Neutral cervical spine, chin packed."},"clinicalCues":["Maintain neutral kinetic chain checkpoints throughout.","Control the 2-second eccentric lowering phase.","Exhale on exertion while maintaining intra-abdominal brace."],"howToSteps":["1. Setup Lie on your back on a flat bench with a dumbbell in each hand, arms extended above your chest, palms facing each other.","2. Brace/Position Engage your core and maintain a neutral spine, ensuring your feet are flat on the floor or resting on the bench.","3. Execute Slowly bend your elbows to lower the dumbbells towards your forehead, keeping your upper arms stationary and your elbows close to your head.","4. Return/Repeat Extend your arms back to the starting position, fully straightening your elbows while maintaining control, and repeat for the desired number of repetitions."]}},{"id":"bfbcab76-8996-469b-8b97-12e71e0f3e57","name":"Supported Bent Over Dumbbell Extension","slug":"supported-bent-over-dumbbell-extension-0118","description":"Step 1: Setup Stand with your feet shoulder-width apart, holding a dumbbell in each hand. Bend at the hips and knees, resting your torso on a bench or support surface, keeping your back flat and head in a neutral position.\n\nStep 2: Brace/Position Engage your core and retract your shoulder blades, allowing your arms to hang straight down toward the floor with a slight bend in your elbows.\n\nStep 3: Execute While keeping your elbows stationary, extend your arms back by squeezing your shoulder blades together and lifting the dumbbells until your arms are parallel to the ground.\n\nStep 4: Return/Repeat Slowly lower the dumbbells back to the starting position, maintaining control, and repeat for the desired number of repetitions.","coachingCues":[],"primaryEquipment":["Dumbbells"],"muscleGroups":["back"],"imageUrl":"https://img.youtube.com/vi/iRaoz2hbOXU/hqdefault.jpg","videoId":"iRaoz2hbOXU","videoUrl":"https://www.youtube.com/watch?v=iRaoz2hbOXU","videoThumbnailUrl":"https://img.youtube.com/vi/iRaoz2hbOXU/hqdefault.jpg","candidatePhotoUrl":"/images/exercises/supported-bent-over-dumbbell-extension.jpg","hasCandidatePhoto":true,"warnings":[],"ytTitle":"How to do a Supported Bent-Over Dumbbell Extension","ytAuthor":"National Academy of Sports Medicine (NASM)","ytStatus":"OK","card":{"category":"Arms","phase":"Phase 1 (Stabilization Endurance), Phase 2 (Strength Endurance), Phase 3 (Hypertrophy)","primeMover":"Triceps Brachii (Lateral, Long, and Medial Heads)","kineticCheckpoints":{"feetAnkles":"Stance foot rooted firmly on floor.","knees":"Support knee directly under hip on bench.","lphc":"Neutral spine parallel to floor, core drawn in.","shoulders":"Upper arm pinned parallel against ribcage; shoulder depressed.","headNeck":"Neutral cervical spine aligned with torso."},"clinicalCues":["Keep elbow pinned against ribcage; do not allow upper arm to swing.","Lock out forearm without dropping elbow below torso plane.","Maintain neutral cervical spine and level shoulders throughout."],"howToSteps":["1. Setup Stand with your feet shoulder-width apart, holding a dumbbell in each hand. Bend at the hips and knees, resting your torso on a bench or support surface, keeping your back flat and head in a neutral position.","2. Brace/Position Engage your core and retract your shoulder blades, allowing your arms to hang straight down toward the floor with a slight bend in your elbows.","3. Execute While keeping your elbows stationary, extend your arms back by squeezing your shoulder blades together and lifting the dumbbells until your arms are parallel to the ground.","4. Return/Repeat Slowly lower the dumbbells back to the starting position, maintaining control, and repeat for the desired number of repetitions."]}},{"id":"b1c8503f-6883-4f6b-8501-3103ee2e7f9a","name":"Supported Bent Over Dumbbell Row","slug":"supported-bent-over-dumbbell-row-0119","description":"Step 1: Setup Stand with your feet shoulder-width apart, holding a dumbbell in each hand, and hinge at the hips to lower your torso until it's nearly parallel to the floor, keeping a slight bend in your knees.\n\nStep 2: Brace/Position Engage your core, maintain a flat back, and allow the dumbbells to hang directly below your shoulders with your palms facing each other.\n\nStep 3: Execute Pull the dumbbells towards your hips by driving your elbows back, squeezing your shoulder blades together at the top of the movement.\n\nStep 4: Return/Repeat Lower the dumbbells back to the starting position in a controlled manner, fully extending your arms before repeating the movement.","coachingCues":[],"primaryEquipment":["Dumbbells"],"muscleGroups":["back","biceps"],"imageUrl":"https://img.youtube.com/vi/DmUX88nWClo/hqdefault.jpg","videoId":"DmUX88nWClo","videoUrl":"https://www.youtube.com/watch?v=DmUX88nWClo","videoThumbnailUrl":"https://img.youtube.com/vi/DmUX88nWClo/hqdefault.jpg","candidatePhotoUrl":"/images/exercises/supported-bent-over-dumbbell-row.jpg","hasCandidatePhoto":true,"warnings":[],"ytTitle":"How to do a Supported Bent-Over Dumbbell Row","ytAuthor":"National Academy of Sports Medicine (NASM)","ytStatus":"OK","card":{"category":"Back","phase":"Phase 2 (Strength Endurance), Phase 3 (Hypertrophy)","primeMover":"Latissimus Dorsi, Rhomboids & Middle Trapezius","kineticCheckpoints":{"feetAnkles":"Stance foot firmly planted, flat on floor.","knees":"Support knee on bench directly under hip; stance knee soft.","lphc":"Torso parallel to floor; pelvis level without rotation.","shoulders":"Scapula retracts and depresses smoothly without anterior shoulder dump.","headNeck":"Neutral cervical spine in line with thoracic spine; eyes toward bench."},"clinicalCues":["Keep torso parallel to bench without rotating shoulders or hips.","Lead the pull with the elbow rather than the hand.","Do not round lumbar spine or crane neck upward."],"howToSteps":["1. Setup Stand with your feet shoulder-width apart, holding a dumbbell in each hand, and hinge at the hips to lower your torso until it's nearly parallel to the floor, keeping a slight bend in your knees.","2. Brace/Position Engage your core, maintain a flat back, and allow the dumbbells to hang directly below your shoulders with your palms facing each other.","3. Execute Pull the dumbbells towards your hips by driving your elbows back, squeezing your shoulder blades together at the top of the movement.","4. Return/Repeat Lower the dumbbells back to the starting position in a controlled manner, fully extending your arms before repeating the movement."]}},{"id":"b1279e98-e533-43f2-8d26-9ef66229b7fc","name":"Transverse Box Jump Down To Tuck Jump","slug":"transverse-box-jump-down-to-tuck-jump-0169","description":"Step 1: Stand on top of the box or step with your feet shoulder-width apart and your knees slightly bent.\n\nStep 2: Jump off the box laterally, landing softly on the ground with your feet shoulder-width apart.\n\nStep 3: Immediately transition into a tuck jump by bending your knees and driving your knees toward your chest as you jump upward.\n\nStep 4: Land softly with your knees slightly bent, ready to repeat the movement.","coachingCues":[],"primaryEquipment":["Box or Step"],"muscleGroups":["calves","glutes","hamstrings","quadriceps"],"imageUrl":"https://img.youtube.com/vi/tYfXItmoX1s/hqdefault.jpg","videoId":"tYfXItmoX1s","videoUrl":"https://www.youtube.com/watch?v=tYfXItmoX1s","videoThumbnailUrl":"https://img.youtube.com/vi/tYfXItmoX1s/hqdefault.jpg","candidatePhotoUrl":"/images/exercises/transverse-box-jump-down-to-tuck-jump.jpg","hasCandidatePhoto":true,"warnings":[],"ytTitle":"How to do a Transverse Box Jump-Down to Tuck Jump","ytAuthor":"National Academy of Sports Medicine (NASM)","ytStatus":"OK","card":{"category":"Plyometrics","phase":"Phase 5 (Power) or Phase 1 (Stabilization hold)","primeMover":"Quadriceps, Gluteus Maximus & Gastrocnemius / Soleus (Explosive Triple Extension)","kineticCheckpoints":{"feetAnkles":"Shoulder-width takeoff; land softly with entire foot (heels and forefeet) on box.","knees":"Drive knees straight forward over toes; strictly avoid knee valgus (caving inward) on landing.","lphc":"Absorb landing force in a quarter-to-half squat with neutral spine and chest proud.","shoulders":"Arms swing aggressively upward to generate vertical momentum.","headNeck":"Gaze focused on landing zone on top of box, chin neutral."},"clinicalCues":["Land as softly and quietly as possible to absorb impact through muscles rather than joints.","Always step down one foot at a time; never jump backward down from the box.","Ensure knees track directly in line with middle toes upon landing without caving inward (valgus)."],"howToSteps":["1. Stand on top of the box or step with your feet shoulder-width apart and your knees slightly bent.","2. Jump off the box laterally, landing softly on the ground with your feet shoulder-width apart.","3. Immediately transition into a tuck jump by bending your knees and driving your knees toward your chest as you jump upward.","4. Land softly with your knees slightly bent, ready to repeat the movement."]}},{"id":"06773f37-8083-4cdd-be86-2cf5ebde2e3b","name":"Transverse Slalom","slug":"transverse-slalom-0157","description":"Step 1: Setup Stand with your feet shoulder-width apart, knees slightly bent, and hold a medicine ball at chest level.\n\nStep 2: Brace/Position Engage your core, keeping your back straight and shoulders relaxed, while positioning the medicine ball close to your body.\n\nStep 3: Execute Rotate your torso to one side, pivoting on your feet, and then quickly shift your weight to the opposite side while moving the medicine ball across your body in a slalom eft foot, then bring your right foot to meet it, returning to the starting position.\n\nStep 4: Return/Repeat Repeat the sequence for the desired number of repetitions, ensuring to maintain proper posture throughout the movement.","coachingCues":[],"primaryEquipment":[],"muscleGroups":["back"],"imageUrl":"https://img.youtube.com/vi/6rkW1Mmz4Ak/hqdefault.jpg","videoId":"6rkW1Mmz4Ak","videoUrl":"https://www.youtube.com/watch?v=6rkW1Mmz4Ak","videoThumbnailUrl":"https://img.youtube.com/vi/6rkW1Mmz4Ak/hqdefault.jpg","candidatePhotoUrl":"/images/exercises/w-in-in-out-out.jpg","hasCandidatePhoto":true,"warnings":[],"ytTitle":"How to do a W-In-In-Out-Out","ytAuthor":"National Academy of Sports Medicine (NASM)","ytStatus":"OK","card":{"category":"Back","phase":"Phase 1: Stabilization · Phase 2: Strength Endurance · Phase 3: Hypertrophy","primeMover":"Latissimus Dorsi, Rhomboids & Middle Trapezius","kineticCheckpoints":{"feetAnkles":"Shoulder-width, firmly planted on ground.","knees":"Aligned with second and third toes.","lphc":"Neutral lumbar spine; core braced.","shoulders":"Retracted and depressed into athletic posture.","headNeck":"Neutral cervical spine, chin packed."},"clinicalCues":["Maintain neutral kinetic chain checkpoints throughout.","Control the 2-second eccentric lowering phase.","Exhale on exertion while maintaining intra-abdominal brace."],"howToSteps":["1. Setup Stand with your feet hip-width apart and arms extended in front of you at shoulder height, palms facing down.","2. Brace/Position Engage your core and maintain a slight bend in your knees while keeping your back straight.","3. Execute Step out to the right with your right foot, then bring your left foot to meet it, forming a 'W' shape. Next, step out to the left with your left foot, then bring your right foot to meet it, returning to the starting position.","4. Return/Repeat Repeat the sequence for the desired number of repetitions, ensuring to maintain proper posture throughout the movement."]}},{"id
