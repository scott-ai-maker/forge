the bell. Slowly lower the kettlebell performing a bicep curl.\n\nStep 3: Once elbows have reached full extension, reverse the pattern and curl the weight up to the chest through a full range.\n\nStep 4: Repeat. Maintain posture throughout. Minimize shoulder forward roll or elbow swing behind or in front of body. Do not bottom out on the squat or let the hamstrings rest on the calves.","coachingCues":[],"primaryEquipment":["Kettlebell"],"muscleGroups":["biceps","glutes","hamstrings","quadriceps"],"imageUrl":"https://img.youtube.com/vi/BPGOyQKy9R0/hqdefault.jpg","videoId":"BPGOyQKy9R0","videoUrl":"https://www.youtube.com/watch?v=BPGOyQKy9R0","videoThumbnailUrl":"https://img.youtube.com/vi/BPGOyQKy9R0/hqdefault.jpg","candidatePhotoUrl":"/images/exercises/kettlebell-crush-curl-with-squat.jpg","hasCandidatePhoto":true,"warnings":[],"ytTitle":"Kettlebell Crush Curl with Squat","ytAuthor":"National Academy of Sports Medicine (NASM)","ytStatus":"OK","card":{"category":"Arms","phase":"Phase 1: Stabilization · Phase 2: Strength Endurance · Phase 3: Hypertrophy","primeMover":"Biceps Brachii","kineticCheckpoints":{"feetAnkles":"Shoulder-width, firmly planted on ground.","knees":"Aligned with second and third toes.","lphc":"Neutral lumbar spine; core braced.","shoulders":"Retracted and depressed into athletic posture.","headNeck":"Neutral cervical spine, chin packed."},"clinicalCues":["Maintain neutral kinetic chain checkpoints throughout.","Control the 2-second eccentric lowering phase.","Exhale on exertion while maintaining intra-abdominal brace."],"howToSteps":["1. Squat into a deep squat position with feet wider than shoulder width and toes rotated slightly out. Lock shoulder blades back and down and brace core.","2. Grip the kettlebell bottoms up (upside down) with handle positioned between forearms and hands wrapped around the bell. Slowly lower the kettlebell performing a bicep curl.","3. Once elbows have reached full extension, reverse the pattern and curl the weight up to the chest through a full range.","4. Repeat. Maintain posture throughout. Minimize shoulder forward roll or elbow swing behind or in front of body. Do not bottom out on the squat or let the hamstrings rest on the calves."]}},{"id":"de3e78aa-3189-447c-971d-be81570c42c1","name":"Kettlebell Deadlift","slug":"kettlebell-deadlift","description":"Step 1: Stand in athletic posture with feet hip to shoulder width apart and toes pointing forward. Hinge at the hips and bend the knees to grab onto the kettlebell which is positioned between the midfeet. Brace the abs.\n\nStep 2: With the back flat and chin tucked, push into the floor to lift the kettlebell until the body is full upright.\n\nStep 3: Reverse the pattern, hinging at the hips to initiate, to return the bell to its starting position.\n\nStep 4: Repeat for the desired number of repetitions. Avoid rounding the spine, losing head position, letting the knees collapse inward or rounding the shoulders.","coachingCues":[],"primaryEquipment":["Kettlebell"],"muscleGroups":["back","glutes","hamstrings"],"imageUrl":"https://img.youtube.com/vi/LnIMaf-XOpM/hqdefault.jpg","videoId":"LnIMaf-XOpM","videoUrl":"https://www.youtube.com/watch?v=LnIMaf-XOpM","videoThumbnailUrl":"https://img.youtube.com/vi/LnIMaf-XOpM/hqdefault.jpg","candidatePhotoUrl":"/images/exercises/kettlebell-deadlift.jpg","hasCandidatePhoto":true,"warnings":[],"ytTitle":"How to do a Kettlebell Deadlift  | Proper Form & Technique | NASM","ytAuthor":"National Academy of Sports Medicine (NASM)","ytStatus":"OK","card":{"category":"Back","phase":"Phase 1: Stabilization · Phase 2: Strength Endurance · Phase 3: Hypertrophy","primeMover":"Latissimus Dorsi, Rhomboids & Middle Trapezius","kineticCheckpoints":{"feetAnkles":"Shoulder-width, firmly planted on ground.","knees":"Aligned with second and third toes.","lphc":"Neutral lumbar spine; core braced.","shoulders":"Retracted and depressed into athletic posture.","headNeck":"Neutral cervical spine, chin packed."},"clinicalCues":["Maintain neutral kinetic chain checkpoints throughout.","Control the 2-second eccentric lowering phase.","Exhale on exertion while maintaining intra-abdominal brace."],"howToSteps":["1. Stand in athletic posture with feet hip to shoulder width apart and toes pointing forward. Hinge at the hips and bend the knees to grab onto the kettlebell which is positioned between the midfeet. Brace the abs.","2. With the back flat and chin tucked, push into the floor to lift the kettlebell until the body is full upright.","3. Reverse the pattern, hinging at the hips to initiate, to return the bell to its starting position.","4. Repeat for the desired number of repetitions. Avoid rounding the spine, losing head position, letting the knees collapse inward or rounding the shoulders."]}},{"id":"1c0d00aa-b1f2-4abe-8170-f68d9973ec7b","name":"Kettlebell Floor Press","slug":"kettlebell-floor-press-0136","description":"Step 1: Setup Lie on your back on the floor with your knees bent and feet flat, holding a kettlebell in one hand at chest level, elbow bent at 90 degrees.\n\nStep 2: Brace/Position Engage your core, press your lower back into the floor, and keep your opposite arm extended out to the side for stability.\n\nStep 3: Execute Press the kettlebell upward until your arm is fully extended, keeping your wrist straight and elbow close to your body.\n\nStep 4: Return/Repeat Lower the kettlebell back to the starting position with control, ensuring your elbow returns to the 90-degree angle before repeating the movement.","coachingCues":[],"primaryEquipment":["Kettlebell"],"muscleGroups":["back"],"imageUrl":"https://img.youtube.com/vi/yXstm050X84/hqdefault.jpg","videoId":"yXstm050X84","videoUrl":"https://www.youtube.com/watch?v=yXstm050X84","videoThumbnailUrl":"https://img.youtube.com/vi/yXstm050X84/hqdefault.jpg","candidatePhotoUrl":"/images/exercises/kettlebell-floor-press.jpg","hasCandidatePhoto":true,"warnings":[],"ytTitle":"How to do a Kettlebell Floor Press","ytAuthor":"National Academy of Sports Medicine (NASM)","ytStatus":"OK","card":{"category":"Back","phase":"Phase 1: Stabilization · Phase 2: Strength Endurance · Phase 3: Hypertrophy","primeMover":"Latissimus Dorsi, Rhomboids & Middle Trapezius","kineticCheckpoints":{"feetAnkles":"Shoulder-width, firmly planted on ground.","knees":"Aligned with second and third toes.","lphc":"Neutral lumbar spine; core braced.","shoulders":"Retracted and depressed into athletic posture.","headNeck":"Neutral cervical spine, chin packed."},"clinicalCues":["Maintain neutral kinetic chain checkpoints throughout.","Control the 2-second eccentric lowering phase.","Exhale on exertion while maintaining intra-abdominal brace."],"howToSteps":["1. Setup Lie on your back on the floor with your knees bent and feet flat, holding a kettlebell in one hand at chest level, elbow bent at 90 degrees.","2. Brace/Position Engage your core, press your lower back into the floor, and keep your opposite arm extended out to the side for stability.","3. Execute Press the kettlebell upward until your arm is fully extended, keeping your wrist straight and elbow close to your body.","4. Return/Repeat Lower the kettlebell back to the starting position with control, ensuring your elbow returns to the 90-degree angle before repeating the movement."]}},{"id":"ea373dd2-d352-4459-8576-2fbc095e0bd1","name":"Kettlebell Front Squat","slug":"kettlebell-front-squat","description":"Step 1: Stand in athletic posture with feet hip to shoulder width apart and toes forward. Draw in and brace the abs. Pull the shoulder blades back and down and lock the elbows into the side of the body. Hold the kettlebells on the sides of the handles.\n\nStep 2: Drive the hips back and squat down to a maximum depth that posture and alignment can be maintained (typically between 90˚ at the knee and thigh parallel to the floor). Keep the weight balanced from heel to ball of foot and torso fairly upright.\n\nStep 3: Reverse the pattern and return to the starting position. Maintain posture throughout.\n\nStep 4: Repeat for the desired number of repetitions. Avoid slouching the back or shoulders, letting the elbows flare out, knees caving in or toes excessively turning out.","coachingCues":[],"primaryEquipment":["Kettlebell"],"muscleGroups":["glutes","hamstrings","quadriceps"],"imageUrl":"https://img.youtube.com/vi/-TeEMXoHQPM/hqdefault.jpg","videoId":"-TeEMXoHQPM","videoUrl":"https://www.youtube.com/watch?v=-TeEMXoHQPM","videoThumbnailUrl":"https://img.youtube.com/vi/-TeEMXoHQPM/hqdefault.jpg","candidatePhotoUrl":"/images/exercises/kettlebell-front-squat.jpg","hasCandidatePhoto":true,"warnings":[],"ytTitle":"How to do a Kettlebell Front Squat  | Proper Form & Technique | NASM","ytAuthor":"National Academy of Sports Medicine (NASM)","ytStatus":"OK","card":{"category":"Legs","phase":"Phase 2 (Strength Endurance), Phase 3 (Hypertrophy), Phase 4 (Max Strength)","primeMover":"Quadriceps (Vastus Lateralis, Medialis, Intermedius, Rectus Femoris) & Gluteus Maximus","kineticCheckpoints":{"feetAnkles":"Shoulder-width apart, toes forward or slightly flared (5°–10°), heels flat on ground.","knees":"Track directly over second and third toes; avoid valgus collapse.","lphc":"Maintain upright thoracic spine and neutral lumbar lordosis; core braced.","shoulders":"Elbows driven high and forward parallel to floor in front rack position.","headNeck":"Neutral cervical spine, chin packed, eyes looking straight forward."},"clinicalCues":["Drive elbows high toward the ceiling throughout the lift to prevent forward torso dump.","Maintain an upright chest and vertical spine to direct load to quadriceps.","Keep knees tracking over second toes and heels flat on floor."],"howToSteps":["1. Stand in athletic posture with feet hip to shoulder width apart and toes forward. Draw in and brace the abs. Pull the shoulder blades back and down and lock the elbows into the side of the body. Hold the kettlebells on the sides of the handles.","2. Drive the hips back and squat down to a maximum depth that posture and alignment can be maintained (typically between 90˚ at the knee and thigh parallel to the floor). Keep the weight balanced from heel to ball of foot and torso fairly upright.","3. Reverse the pattern and return to the starting position. Maintain posture throughout.","4. Repeat for the desired number of repetitions. Avoid slouching the back or shoulders, letting the elbows flare out, knees caving in or toes excessively turning out."]}},{"id":"66a31fc6-12e0-478a-ac80-5c9259ce8c42","name":"Kettlebell Goblet Squat","slug":"kettlebell-goblet-squat-0138","description":"Step 1: Setup Hold a kettlebell by the handles with both hands, positioning it close to your chest, elbows pointing down. Stand with your feet shoulder-width apart and toes slightly turned out.\n\nStep 2: Brace/Position Engage your core, keeping your chest up and shoulders back. Ensure your weight is distributed evenly across your feet.\n\nStep 3: Execute Initiate the squat by bending at the hips and knees, lowering your body until your thighs are parallel to the ground while keeping the kettlebell close to your chest.\n\nStep 4: Return/Repeat Push through your heels to return to the starting position, fully extending your hips and knees. Repeat for the desired number of repetitions.","coachingCues":[],"primaryEquipment":["Kettlebell"],"muscleGroups":["glutes","hamstrings","quadriceps"],"imageUrl":"https://img.youtube.com/vi/MWHIs0zxkCU/hqdefault.jpg","videoId":"MWHIs0zxkCU","videoUrl":"https://www.youtube.com/watch?v=MWHIs0zxkCU","videoThumbnailUrl":"https://img.youtube.com/vi/MWHIs0zxkCU/hqdefault.jpg","candidatePhotoUrl":"/images/exercises/goblet-squat.jpg","hasCandidatePhoto":true,"warnings":[],"ytTitle":"How to do a Kettlebell Goblet Squat","ytAuthor":"National Academy of Sports Medicine (NASM)","ytStatus":"OK","card":{"category":"Legs","phase":"Phase 1 (Stabilization Endurance), Phase 2 (Strength Endurance)","primeMover":"Quadriceps & Gluteus Maximus","kineticCheckpoints":{"feetAnkles":"Shoulder-width apart, toes pointing straight or angled 5°–10°.","knees":"Pushed out tracking over second/third toes.","lphc":"Upright torso; anterior counterbalance prevents excessive forward lean.","shoulders":"Dumbbell/Kettlebell held vertically against sternum with elbows tucked in.","headNeck":"Eyes level, neutral spine."},"clinicalCues":["Keep weight glued to sternum throughout the entire descent.","Use elbows as a tactile guide inside thighs to open hip adductors.","Maintain vertical spine with active abdominal bracing."],"howToSteps":["1. Setup Hold a kettlebell by the handles with both hands, positioning it close to your chest, elbows pointing down. Stand with your feet shoulder-width apart and toes slightly turned out.","2. Brace/Position Engage your core, keeping your chest up and shoulders back. Ensure your weight is distributed evenly across your feet.","3. Execute Initiate the squat by bending at the hips and knees, lowering your body until your thighs are parallel to the ground while keeping the kettlebell close to your chest.","4. Return/Repeat Push through your heels to return to the starting position, fully extending your hips and knees. Repeat for the desired number of repetitions."]}},{"id":"9d992449-875f-451d-9653-009b9c13e6c2","name":"Kettlebell Jerk","slug":"kettlebell-jerk-0142","description":"Step 1: Setup Stand with your feet shoulder-width apart, holding a kettlebell in one hand at shoulder height with your elbow tucked close to your body.\n\nStep 2: Brace/Position Engage your core and maintain a neutral spine, keeping your opposite arm relaxed at your side.\n\nStep 3: Execute Dip slightly by bending your knees, then explosively extend your legs while pressing the kettlebell overhead, locking out your arm at the top.\n\nStep 4: Return/Repeat Lower the kettlebell back to shoulder height in a controlled manner, then repeat for the desired number of repetitions.","coachingCues":[],"primaryEquipment":["Kettlebell"],"muscleGroups":["glutes","hamstrings","quadriceps"],"imageUrl":"https://img.youtube.com/vi/9NFkYaviXgk/hqdefault.jpg","videoId":"9NFkYaviXgk","videoUrl":"https://www.youtube.com/watch?v=9NFkYaviXgk","videoThumbnailUrl":"https://img.youtube.com/vi/9NFkYaviXgk/hqdefault.jpg","candidatePhotoUrl":"/images/exercises/kettlebell-jerk.jpg","hasCandidatePhoto":true,"warnings":[],"ytTitle":"How to do a Kettlebell Jerk","ytAuthor":"National Academy of Sports Medicine (NASM)","ytStatus":"OK","card":{"category":"Legs","phase":"Phase 1: Stabilization · Phase 2: Strength Endurance · Phase 3: Hypertrophy","primeMover":"Quadriceps & Gluteus Maximus","kineticCheckpoints":{"feetAnkles":"Shoulder-width, firmly planted on ground.","knees":"Aligned with second and third toes.","lphc":"Neutral lumbar spine; core braced.","shoulders":"Retracted and depressed into athletic posture.","headNeck":"Neutral cervical spine, chin packed."},"clinicalCues":["Maintain neutral kinetic chain checkpoints throughout.","Control the 2-second eccentric lowering phase.","Exhale on exertion while maintaining intra-abdominal brace."],"howToSteps":["1. Setup Stand with your feet shoulder-width apart, holding a kettlebell in one hand at shoulder height with your elbow tucked close to your body.","2. Brace/Position Engage your core and maintain a neutral spine, keeping your opposite arm relaxed at your side.","3. Execute Dip slightly by bending your knees, then explosively extend your legs while pressing the kettlebell overhead, locking out your arm at the top.","4. Return/Repeat Lower the kettlebell back to shoulder height in a controlled manner, then repeat for the desired number of repetitions."]}},{"id":"459ac156-1ca4-437f-97c4-77b21b7c04e9","name":"Kettlebell Overhead Press","slug":"kettlebell-overhead-press-0145","description":"Step 1: Setup Stand with feet shoulder-width apart, holding a kettlebell in one hand at shoulder height with your elbow tucked close to your body.\n\nStep 2: Brace/Position Engage your core, keeping your back straight and your shoulder down and back to stabilize your torso.\n\nStep 3: Execute Press the kettlebell overhead in a straight line, fully extending your arm while keeping your wrist neutral and your elbow locked out at the top.\n\nStep 4: Return/Repeat Lower the kettlebell back to shoulder height in a controlled manner, ensuring your core remains engaged, and repeat for the desired number of repetitions.","coachingCues":[],"primaryEquipment":["Kettlebell"],"muscleGroups":["shoulders","triceps"],"imageUrl":"https://img.youtube.com/vi/X-uFqWtjpGI/hqdefault.jpg","videoId":"X-uFqWtjpGI","videoUrl":"https://www.youtube.com/watch?v=X-uFqWtjpGI","videoThumbnailUrl":"https://img.youtube.com/vi/X-uFqWtjpGI/hqdefault.jpg","candidatePhotoUrl":"/images/exercises/kettlebell-overhead-press.jpg","hasCandidatePhoto":true,"warnings":[],"ytTitle":"How to do a Kettlebell Overhead Press","ytAuthor":"National Academy of Sports Medicine (NASM)","ytStatus":"OK","card":{"category":"Shoulders","phase":"Phase 2 (Strength Endurance), Phase 4 (Max Strength)","primeMover":"Anterior Deltoid & Middle Deltoid","kineticCheckpoints":{"feetAnkles":"Hip-width apart, firmly rooted.","knees":"Soft extension without locking or hyperextending.","lphc":"Glutes and abs fully engaged to prevent lumbar hyperextension.","shoulders":"Elbows positioned slightly in front of bar in starting rack position.","headNeck":"Head tilts slightly back to clear bar path, then returns neutral under bar at top."},"clinicalCues":["Squeeze glutes hard to create a solid pelvic foundation and protect lumbar spine.","Do not lean backward or hyperextend lower back to press heavy loads.","Finish lockout with biceps next to ears."],"howToSteps":["1. Setup Stand with feet shoulder-width apart, holding a kettlebell in one hand at shoulder height with your elbow tucked close to your body.","2. Brace/Position Engage your core, keeping your back straight and your shoulder down and back to stabilize your torso.","3. Execute Press the kettlebell overhead in a straight line, fully extending your arm while keeping your wrist neutral and your elbow locked out at the top.","4. Return/Repeat Lower the kettlebell back to shoulder height in a controlled manner, ensuring your core remains engaged, and repeat for the desired number of repetitions."]}},{"id":"44f7a10c-2766-46b6-a769-7b98a8eeb9d3","name":"Kettlebell Push Press","slug":"kettlebell-push-press-0144","description":"Step 1: Setup Stand with your feet shoulder-width apart, holding a kettlebell in one hand at shoulder height with your elbow tucked close to your body.\n\nStep 2: Brace/Position Engage your core and maintain a neutral spine, ensuring your knees are slightly bent and your weight is evenly distributed on your feet.\n\nStep 3: Execute Press the kettlebell overhead by extending your arm while simultaneously using your legs to generate upward momentum, keeping your wrist straight and your shoulder stable.\n\nStep 4: Return/Repeat Lower the kettlebell back to shoulder height in a controlled manner, then repeat for the desired number of repetitions before switching arms.","coachingCues":[],"primaryEquipment":["Kettlebell"],"muscleGroups":["deltoids","glutes","hamstrings","quadriceps","shoulders","triceps"],"imageUrl":"https://img.youtube.com/vi/k4q6HkT99iA/hqdefault.jpg","videoId":"k4q6HkT99iA","videoUrl":"https://www.youtube.com/watch?v=k4q6HkT99iA","videoThumbnailUrl":"https://img.youtube.com/vi/k4q6HkT99iA/hqdefault.jpg","candidatePhotoUrl":"/images/exercises/kettlebell-push-press.jpg","hasCandidatePhoto":true,"warnings":[],"ytTitle":"How to do a Kettlebell Push Press","ytAuthor":"National Academy of Sports Medicine (NASM)","ytStatus":"OK","card":{"category":"Plyometrics","phase":"Phase 5 (Power)","primeMover":"Deltoids & Quadriceps / Gluteals (Triple Extension Transfer)","kineticCheckpoints":{"feetAnkles":"Shoulder-width apart, heels grounded through takeoff and landing.","knees":"Quick 2–3 inch dip tracking directly over second toes; avoid valgus cave.","lphc":"Vertical torso during dip-drive; no forward chest collapse or spinal arching.","shoulders":"Barbell or dumbbells racked securely across anterior deltoids.","headNeck":"Neutral cervical spine; head moves slightly back to clear bar path."},"clinicalCues":["Use explosive leg drive to initiate bar momentum before pressing arms.","Keep torso vertical during the shallow knee dip (avoid forward hinge).","Lock out weight overhead with biceps next to ears and core braced."],"howToSteps":["1. Setup Stand with your feet shoulder-width apart, holding a kettlebell in one hand at shoulder height with your elbow tucked close to your body.","2. Brace/Position Engage your core and maintain a neutral spine, ensuring your knees are slightly bent and your weight is evenly distributed on your feet.","3. Execute Press the kettlebell overhead by extending your arm while simultaneously using your legs to generate upward momentum, keeping your wrist straight and your shoulder stable.","4. Return/Repeat Lower the kettlebell back to shoulder height in a controlled manner, then repeat for the desired number of repetitions before switching arms."]}},{"id":"8bb200d0-5d72-4bc4-be20-1f74a7d4d1ae","name":"Kettlebell Renegade Row","slug":"kettlebell-renegade-row-0147","description":"Step 1: Setup Position a kettlebell on the floor between your hands and assume a high plank position with your feet shoulder-width apart and your body in a straight line from head to heels.\n\nStep 2: Brace/Position Engage your core and glutes to stabilize your body, ensuring your shoulders are directly over your wrists and your hips are level.\n\nStep 3: Execute With control, shift your weight to one side and row the kettlebell towards your hip, keeping your elbow close to your body while maintaining a stable plank position.\n\nStep 4: Return/Repeat Lower the kettlebell back to the floor, then switch sides and repeat the row with the opposite arm, maintaining core engagement throughout the movement.","coachingCues":[],"primaryEquipment":["Kettlebell"],"muscleGroups":["back","biceps"],"imageUrl":"https://img.youtube.com/vi/NNTpBlHRcA4/hqdefault.jpg","videoId":"NNTpBlHRcA4","videoUrl":"https://www.youtube.com/watch?v=NNTpBlHRcA4","videoThumbnailUrl":"https://img.youtube.com/vi/NNTpBlHRcA4/hqdefault.jpg","candidatePhotoUrl":"/images/exercises/kettlebell-renegade-row.jpg","hasCandidatePhoto":true,"warnings":[],"ytTitle":"How to do a Kettlebell Renegade Row","ytAuthor":"National Academy of Sports Medicine (NASM)","ytStatus":"OK","card":{"category":"Back","phase":"Phase 1: Stabilization · Phase 2: Strength Endurance · Phase 3: Hypertrophy","primeMover":"Latissimus Dorsi, Rhomboids & Middle Trapezius","kineticCheckpoints":{"feetAnkles":"Shoulder-width, firmly planted on ground.","knees":"Aligned with second and third toes.","lphc":"Neutral lumbar spine; core braced.","shoulders":"Retracted and depressed into athletic posture.","headNeck":"Neutral cervical spine, chin packed."},"clinicalCues":["Maintain neutral kinetic chain checkpoints throughout.","Control the 2-second eccentric lowering phase.","Exhale on exertion while maintaining intra-abdominal brace."],"howToSteps":["1. Setup Position a kettlebell on the floor between your hands and assume a high plank position with your feet shoulder-width apart and your body in a straight line from head to heels.","2. Brace/Position Engage your core and glutes to stabilize your body, ensuring your shoulders are directly over your wrists and your hips are level.","3. Execute With control, shift your weight to one side and row the kettlebell towards your hip, keeping your elbow close to your body while maintaining a stable plank position.","4. Return/Repeat Lower the kettlebell back to the floor, then switch sides and repeat the row with the opposite arm, maintaining core engagement throughout the movement."]}},{"id":"745368a6-cbcb-4578-a172-4bce71cbd22c","name":"Ladder Jumping Jacks"," lowering phase.","Exhale on exertion while maintaining intra-abdominal brace."],"howToSteps":["1. Setup Stand with your feet hip-width apart and place a resistance band around your legs, just above the knees.","2. Brace/Position Bend your knees slightly and hinge at the hips, keeping your chest up and core engaged.","3. Execute Step to the right with your right foot, followed by your left foot, maintaining tension in the band throughout the movement.","4. Return/Repeat Continue stepping to the right for a designated number of steps, then return to the left using the same pattern."]}},{"id":"c725120e-70dd-437f-8ea6-8bd258568285","name":"Latissimus Dorsi Ball Stretch","slug":"latissimus-dorsi-ball-stretch-0254","description":"Step 1: Setup Stand next to a stability ball with your feet shoulder-width apart and knees slightly bent.\n\nStep 2: Brace/Position Place one hand on the ball, extending your arm fully while keeping your opposite arm at your side.\n\nStep 3: Execute Gently lean into the ball, allowing your torso to stretch towards the ground while keeping your hips stable.\n\nStep 4: Return/Repeat Hold the stretch for 15-30 seconds, then switch sides and repeat the process.","coachingCues":[],"primaryEquipment":[],"muscleGroups":["full body"],"imageUrl":"https://img.youtube.com/vi/dg_gevWZuQM/hqdefault.jpg","videoId":"dg_gevWZuQM","videoUrl":"https://www.youtube.com/watch?v=dg_gevWZuQM","videoThumbnailUrl":"https://img.youtube.com/vi/dg_gevWZuQM/hqdefault.jpg","candidatePhotoUrl":"/images/exercises/static-latissimus-dorsi-ball-stretch.jpg","hasCandidatePhoto":true,"warnings":[],"ytTitle":"How to do a Latissimus Dorsi Ball Stretch","ytAuthor":"National Academy of Sports Medicine (NASM)","ytStatus":"OK","card":{"category":"Flexibility/SMR","phase":"Phase 1: Stabilization · Phase 2: Strength Endurance · Phase 3: Hypertrophy","primeMover":"Target Neuromuscular / Fascial System","kineticCheckpoints":{"feetAnkles":"Shoulder-width, firmly planted on ground.","knees":"Aligned with second and third toes.","lphc":"Neutral lumbar spine; core braced.","shoulders":"Retracted and depressed into athletic posture.","headNeck":"Neutral cervical spine, chin packed."},"clinicalCues":["Maintain neutral kinetic chain checkpoints throughout.","Control the 2-second eccentric lowering phase.","Exhale on exertion while maintaining intra-abdominal brace."],"howToSteps":["1. Setup Stand next to a stability ball with your feet shoulder-width apart and knees slightly bent.","2. Brace/Position Place one hand on the ball, extending your arm fully while keeping your opposite arm at your side.","3. Execute Gently lean into the ball, allowing your torso to stretch towards the ground while keeping your hips stable.","4. Return/Repeat Hold the stretch for 15-30 seconds, then switch sides and repeat the process."]}},{"id":"e2c6fe01-befe-4e67-be82-294323549359","name":"Leg Circuit","slug":"leg-circuit-0161","description":"Step 1: Setup Stand with your feet shoulder-width apart, holding a dumbbell in each hand at your sides.\n\nStep 2: Brace/Position Engage your core, keeping your chest up and shoulders back as you prepare to move.\n\nStep 3: Execute Lower into a squat by bending your knees and pushing your hips back, keeping your weight on your heels; then rise back to standing.\n\nStep 4: Return/Repeat Perform a series of lunges by stepping forward with one leg, lowering your back knee toward the ground, then return to standing and alternate legs.","coachingCues":[],"primaryEquipment":[],"muscleGroups":["glutes","hamstrings","quadriceps"],"imageUrl":"https://img.youtube.com/vi/nPHtf8q5PxM/hqdefault.jpg","videoId":"nPHtf8q5PxM","videoUrl":"https://www.youtube.com/watch?v=nPHtf8q5PxM","videoThumbnailUrl":"https://img.youtube.com/vi/nPHtf8q5PxM/hqdefault.jpg","candidatePhotoUrl":"/images/exercises/leg-circuit.jpg","hasCandidatePhoto":true,"warnings":[],"ytTitle":"How to do a Leg Circuit","ytAuthor":"National Academy of Sports Medicine (NASM)","ytStatus":"OK","card":{"category":"Legs","phase":"Phase 1: Stabilization · Phase 2: Strength Endurance · Phase 3: Hypertrophy","primeMover":"Quadriceps & Gluteus Maximus","kineticCheckpoints":{"feetAnkles":"Shoulder-width, firmly planted on ground.","knees":"Aligned with second and third toes.","lphc":"Neutral lumbar spine; core braced.","shoulders":"Retracted and depressed into athletic posture.","headNeck":"Neutral cervical spine, chin packed."},"clinicalCues":["Maintain neutral kinetic chain checkpoints throughout.","Control the 2-second eccentric lowering phase.","Exhale on exertion while maintaining intra-abdominal brace."],"howToSteps":["1. Setup Stand with your feet shoulder-width apart, holding a dumbbell in each hand at your sides.","2. Brace/Position Engage your core, keeping your chest up and shoulders back as you prepare to move.","3. Execute Lower into a squat by bending your knees and pushing your hips back, keeping your weight on your heels; then rise back to standing.","4. Return/Repeat Perform a series of lunges by stepping forward with one leg, lowering your back knee toward the ground, then return to standing and alternate legs."]}},{"id":"c2827d20-b823-456e-9167-8872de1b5e95","name":"Leg Circuit Frontal","slug":"leg-circuit-frontal-0162","description":"Step 1: Setup Stand with your feet shoulder-width apart, toes pointing forward, and engage your core.\n\nStep 2: Brace/Position Shift your weight onto your left leg, lifting your right leg to the side while keeping your hips level.\n\nStep 3: Execute Press through your left heel to lift your right leg higher, maintaining a straight leg and a controlled motion.\n\nStep 4: Return/Repeat Lower your right leg back to the starting position and repeat for the desired number of repetitions before switching to the left leg.","coachingCues":[],"primaryEquipment":[],"muscleGroups":["glutes","hamstrings","quadriceps"],"imageUrl":"https://img.youtube.com/vi/hV6ozNZJyWA/hqdefault.jpg","videoId":"hV6ozNZJyWA","videoUrl":"https://www.youtube.com/watch?v=hV6ozNZJyWA","videoThumbnailUrl":"https://img.youtube.com/vi/hV6ozNZJyWA/hqdefault.jpg","candidatePhotoUrl":"/images/exercises/leg-circuit-frontal.jpg","hasCandidatePhoto":true,"warnings":[],"ytTitle":"How to do a Leg Circuit Frontal","ytAuthor":"National Academy of Sports Medicine (NASM)","ytStatus":"OK","card":{"category":"Legs","phase":"Phase 1: Stabilization · Phase 2: Strength Endurance · Phase 3: Hypertrophy","primeMover":"Quadriceps & Gluteus Maximus","kineticCheckpoints":{"feetAnkles":"Shoulder-width, firmly planted on ground.","knees":"Aligned with second and third toes.","lphc":"Neutral lumbar spine; core braced.","shoulders":"Retracted and depressed into athletic posture.","headNeck":"Neutral cervical spine, chin packed."},"clinicalCues":["Maintain neutral kinetic chain checkpoints throughout.","Control the 2-second eccentric lowering phase.","Exhale on exertion while maintaining intra-abdominal brace."],"howToSteps":["1. Setup Stand with your feet shoulder-width apart, toes pointing forward, and engage your core.","2. Brace/Position Shift your weight onto your left leg, lifting your right leg to the side while keeping your hips level.","3. Execute Press through your left heel to lift your right leg higher, maintaining a straight leg and a controlled motion.","4. Return/Repeat Lower your right leg back to the starting position and repeat for the desired number of repetitions before switching to the left leg."]}},{"id":"4fc20801-509b-4f06-a148-0ee27de3de2f","name":"Leg Press","slug":"leg-press","description":"Step 1: Sit in the leg press machine with feet hip to shoulder width apart and straight ahead on the leg press platform. Ensure foot height placement allows for good range of movement at both the hip and knee. Draw in and brace the abs. Lock the shoulder blades back and down. Stabilize the upper body by grasping the handles.\n\nStep 2: Lower the platform down toward the body ensuring the knees stay aligned with the middle toes and weight is distributed evenly across the foot. Move through a maximum range without losing technique or bottoming out the thighs into the rib cage.\n\nStep 3: Reverse the pattern and return to starting position.\n\nStep 4: Repeat. Maintain posture throughout. Avoid locking the knees, bouncing at the bottom of the movement to create momentum, rounding the spine or letting the hips come off the pad, or collapsing the knees inward.","coachingCues":[],"primaryEquipment":["Leg Press Machine"],"muscleGroups":["glutes","hamstrings","quadriceps"],"imageUrl":"https://img.youtube.com/vi/cDGOn-yfKJA/hqdefault.jpg","videoId":"cDGOn-yfKJA","videoUrl":"https://www.youtube.com/watch?v=cDGOn-yfKJA","videoThumbnailUrl":"https://img.youtube.com/vi/cDGOn-yfKJA/hqdefault.jpg","candidatePhotoUrl":"/images/exercises/leg-press.jpg","hasCandidatePhoto":true,"warnings":[],"ytTitle":"How to do a Leg Press  | Proper Form & Technique | NASM","ytAuthor":"National Academy of Sports Medicine (NASM)","ytStatus":"OK","card":{"category":"Legs","phase":"Phase 2 (Strength Endurance), Phase 3 (Hypertrophy), Phase 4 (Max Strength)","primeMover":"Quadriceps (Vastus Lateralis, Medialis, Intermedius, Rectus Femoris) & Gluteus Maximus","kineticCheckpoints":{"feetAnkles":"Hip-to-shoulder width on platform, toes straight ahead or slightly turned out.","knees":"Tracking over second and third toes; strictly avoid inward valgus collapse.","lphc":"Hips, sacrum, and lower back firmly glued to seat back pad throughout entire ROM.","shoulders":"Shoulder blades back against seat pad; grip side handles firmly.","headNeck":"Head resting comfortably against pad, neutral neck."},"clinicalCues":["Never allow hips or lower back to curl off the seat at bottom depth (prevents lumbar disc herniation).","Do not hyperextend or forcefully slam knees into lockout at the top.","Keep knees tracking directly in line with second and third toes."],"howToSteps":["1. Sit in the leg press machine with feet hip to shoulder width apart and straight ahead on the leg press platform. Ensure foot height placement allows for good range of movement at both the hip and knee. Draw in and brace the abs. Lock the shoulder blades back and down. Stabilize the upper body by grasping the handles.","2. Lower the platform down toward the body ensuring the knees stay aligned with the middle toes and weight is distributed evenly across the foot. Move through a maximum range without losing technique or bottoming out the thighs into the rib cage.","3. Reverse the pattern and return to starting position.","4. Repeat. Maintain posture throughout. Avoid locking the knees, bouncing at the bottom of the movement to create momentum, rounding the spine or letting the hips come off the pad, or collapsing the knees inward."]}},{"id":"50392a04-b80c-41f9-b8df-bbbb51db86f9","name":"Leg Press Calf Raise","slug":"leg-press-calf-raise","description":"Step 1: Sit on the leg press machine with your back against the pad and feet positioned shoulder-width apart on the platform.\n\nStep 2: Push the platform away by extending your legs fully, keeping a slight bend in your knees at the top.\n\nStep 3: Shift your focus to your toes by raising your heels off the platform, engaging your calf muscles.\n\nStep 4: Lower your heels back down to the platform, then repeat the calf raise for the desired number of repetitions.","coachingCues":[],"primaryEquipment":["Leg Press Machine"],"muscleGroups":["calves","glutes","hamstrings","quadriceps"],"imageUrl":"https://img.youtube.com/vi/8k435cj30gc/hqdefault.jpg","videoId":"8k435cj30gc","videoUrl":"https://www.youtube.com/watch?v=8k435cj30gc","videoThumbnailUrl":"https://img.youtube.com/vi/8k435cj30gc/hqdefault.jpg","candidatePhotoUrl":"/images/exercises/leg-press-calf-raise.jpg","hasCandidatePhoto":true,"warnings":[],"ytTitle":"How to do a Leg Press Calf Raise | Proper Form & Technique | NASM","ytAuthor":"National Academy of Sports Medicine (NASM)","ytStatus":"OK","card":{"category":"Legs","phase":"Phase 2 (Strength Endurance), Phase 3 (Hypertrophy), Phase 4 (Max Strength)","primeMover":"Quadriceps (Vastus Lateralis, Medialis, Intermedius, Rectus Femoris) & Gluteus Maximus","kineticCheckpoints":{"feetAnkles":"Hip-to-shoulder width on platform, toes straight ahead or slightly turned out.","knees":"Tracking over second and third toes; strictly avoid inward valgus collapse.","lphc":"Hips, sacrum, and lower back firmly glued to seat back pad throughout entire ROM.","shoulders":"Shoulder blades back against seat pad; grip side handles firmly.","headNeck":"Head resting comfortably against pad, neutral neck."},"clinicalCues":["Never allow hips or lower back to curl off the seat at bottom depth (prevents lumbar disc herniation).","Do not hyperextend or forcefully slam knees into lockout at the top.","Keep knees tracking directly in line with second and third toes."],"howToSteps":["1. Sit on the leg press machine with your back against the pad and feet positioned shoulder-width apart on the platform.","2. Push the platform away by extending your legs fully, keeping a slight bend in your knees at the top.","3. Shift your focus to your toes by raising your heels off the platform, engaging your calf muscles.","4. Lower your heels back down to the platform, then repeat the calf raise for the desired number of repetitions."]}},{"id":"b7321bd5-f79d-4d52-8c50-4d3dcbf27ed1","name":"Long Lever Ball Crunch","slug":"long-lever-ball-crunch-0073","description":"Step 1: Setup Lie on your back on a mat with your knees bent and feet flat on the ground, holding a stability ball above your chest with both hands.\n\nStep 2: Brace/Position Engage your core by pulling your navel towards your spine and extend your arms and the ball overhead while keeping your elbows slightly bent.\n\nStep 3: Execute Lift your upper body off the mat by curling your torso towards your thighs, bringing the ball towards your knees while maintaining a neutral spine.\n\nStep 4: Return/Repeat Slowly lower your upper body back to the mat, extending your arms and the ball overhead to return to the starting position, and repeat for the desired number of repetitions.","coachingCues":[],"primaryEquipment":[],"muscleGroups":["core"],"imageUrl":"https://img.youtube.com/vi/YkEu2Hs3gw8/hqdefault.jpg","videoId":"YkEu2Hs3gw8","videoUrl":"https://www.youtube.com/watch?v=YkEu2Hs3gw8","videoThumbnailUrl":"https://img.youtube.com/vi/YkEu2Hs3gw8/hqdefault.jpg","candidatePhotoUrl":"/images/exercises/long-lever-ball-crunch.jpg","hasCandidatePhoto":true,"warnings":[],"ytTitle":"How to do a Long-Lever Ball Crunch","ytAuthor":"National Academy of Sports Medicine (NASM)","ytStatus":"OK","card":{"category":"Core","phase":"Phase 1: Stabilization · Phase 2: Strength Endurance · Phase 3: Hypertrophy","primeMover":"Transverse Abdominis & Deep Core Stabilizers","kineticCheckpoints":{"feetAnkles":"Shoulder-width, firmly planted on ground.","knees":"Aligned with second and third toes.","lphc":"Neutral lumbar spine; core braced.","shoulders":"Retracted and depressed into athletic posture.","headNeck":"Neutral cervical spine, chin packed."},"clinicalCues":["Maintain neutral kinetic chain checkpoints throughout.","Control the 2-second eccentric lowering phase.","Exhale on exertion while maintaining intra-abdominal brace."],"howToSteps":["1. Setup Lie on your back on a mat with your knees bent and feet flat on the ground, holding a stability ball above your chest with both hands.","2. Brace/Position Engage your core by pulling your navel towards your spine and extend your arms and the ball overhead while keeping your elbows slightly bent.","3. Execute Lift your upper body off the mat by curling your torso towards your thighs, bringing the ball towards your knees while maintaining a neutral spine.","4. Return/Repeat Slowly lower your upper body back to the mat, extending your arms and the ball overhead to return to the starting position, and repeat for the desired number of repetitions."]}},{"id":"e53d8b8f-1e98-4076-896f-ad300f7901cf","name":"Lunge Jump","slug":"lunge-jump","description":"Step 1: Start in a lunge position with arms pulled back, trail leg a few inches off the floor, and knees at approximately 90˚. Draw in the abs.\n\nStep 2: Rapidly explode upward off both legs and jump.\n\nStep 3: As you leave the ground, switch the legs in the air landing with the other leg out in front. Land as quietly as possible, keeping the feet, knees, and hips pointing straight ahead.\n\nStep 4: Upon impact immediately repeat. Maintain posture throughout. Avoid landing hard/loudly, letting the heels strike the ground hard, allowing the knees to collapse inward or your back to arch or slouch.","coachingCues":[],"primaryEquipment":["None"],"muscleGroups":["calves","glutes","hamstrings","quadriceps"],"imageUrl":"https://img.youtube.com/vi/_5kDxC0flg0/hqdefault.jpg","videoId":"_5kDxC0flg0","videoUrl":"https://www.youtube.com/watch?v=_5kDxC0flg0","videoThumbnailUrl":"https://img.youtube.com/vi/_5kDxC0flg0/hqdefault.jpg","candidatePhotoUrl":"/images/exercises/lunge-jump.jpg","hasCandidatePhoto":true,"warnings":[],"ytTitle":"How to do a Lunge Jump  | Proper Form & Technique | NASM","ytAuthor":"National Academy of Sports Medicine (NASM)","ytStatus":"OK","card":{"category":"Plyometrics","phase":"Phase 1: Stabilization · Phase 2: Strength Endurance · Phase 3: Hypertrophy","primeMover":"Quadriceps, Gluteus Maximus & Gastrocnemius (Triple Extension)","kineticCheckpoints":{"feetAnkles":"Shoulder-width, firmly planted on ground.","knees":"Aligned with second and third toes.","lphc":"Neutral lumbar spine; core braced.","shoulders":"Retracted and depressed into athletic posture.","headNeck":"Neutral cervical spine, chin packed."},"clinicalCues":["Maintain neutral kinetic chain checkpoints throughout.","Control the 2-second eccentric lowering phase.","Exhale on exertion while maintaining intra-abdominal brace."],"howToSteps":["1. Start in a lunge position with arms pulled back, trail leg a few inches off the floor, and knees at approximately 90˚. Draw in the abs.","2. Rapidly explode upward off both legs and jump.","3. As you leave the ground, switch the legs in the air landing with the other leg out in front. Land as quietly as possible, keeping the feet, knees, and hips pointing straight ahead.","4. Upon impact immediately repeat. Maintain posture throughout. Avoid landing hard/loudly, letting the heels strike the ground hard, allowing the knees to collapse inward or your back to arch or slouch."]}},{"id":"c4f776f5-fa6d-4623-b6ce-36ac635ae326","name":"Lunge To Balance","slug":"lunge-to-balance-0163","description":"Step 1: Setup Stand tall with your feet hip-width apart and engage your core.\n\nStep 2: Brace/Position Step forward with your right leg into a lunge, ensuring your knee is directly above your ankle and your left knee hovers just above the ground.\n\nStep 3: Execute Push through your right heel to rise up, bringing your left knee up towards your chest, balancing on your right leg.\n\nStep 4: Return/Repeat Lower your left leg back to the ground, step back into the starting position, and alternate legs for the desired repetitions.","coachingCues":[],"primaryEquipment":[],"muscleGroups":["core","glutes","hamstrings","quadriceps"],"imageUrl":"https://img.youtube.com/vi/UInwcEa5BH4/hqdefault.jpg","videoId":"UInwcEa5BH4","videoUrl":"https://www.youtube.com/watch?v=UInwcEa5BH4","videoThumbnailUrl":"https://img.youtube.com/vi/UInwcEa5BH4/hqdefault.jpg","candidatePhotoUrl":"/images/exercises/lunge-to-balance.jpg","hasCandidatePhoto":true,"warnings":[],"ytTitle":"How to do a Lunge to Balance","ytAuthor":"National Academy of Sports Medicine (NASM)","ytStatus":"OK","card":{"category":"Legs","phase":"Phase 1: Stabilization · Phase 2: Strength Endurance · Phase 3: Hypertrophy","primeMover":"Quadriceps & Gluteus Maximus","kineticCheckpoints":{"feetAnkles":"Shoulder-width, firmly planted on ground.","knees":"Aligned with second and third toes.","lphc":"Neutral lum ion, step back to the starting position, and repeat on the opposite side.","coachingCues":[],"primaryEquipment":[],"muscleGroups":["core","glutes","hamstrings","quadriceps"],"imageUrl":"https://img.youtube.com/vi/UG2Sf8ck1WI/hqdefault.jpg","videoId":"UG2Sf8ck1WI","videoUrl":"https://www.youtube.com/watch?v=UG2Sf8ck1WI","videoThumbnailUrl":"https://img.youtube.com/vi/UG2Sf8ck1WI/hqdefault.jpg","candidatePhotoUrl":"/images/exercises/lunge-to-balance-transverse.jpg","hasCandidatePhoto":true,"warnings":[],"ytTitle":"How to do a Lunge to Balance Transverse","ytAuthor":"National Academy of Sports Medicine (NASM)","ytStatus":"OK","card":{"category":"Legs","phase":"Phase 1: Stabilization · Phase 2: Strength Endurance · Phase 3: Hypertrophy","primeMover":"Quadriceps & Gluteus Maximus","kineticCheckpoints":{"feetAnkles":"Shoulder-width, firmly planted on ground.","knees":"Aligned with second and third toes.","lphc":"Neutral lumbar spine; core braced.","shoulders":"Retracted and depressed into athletic posture.","headNeck":"Neutral cervical spine, chin packed."},"clinicalCues":["Maintain neutral kinetic chain checkpoints throughout.","Control the 2-second eccentric lowering phase.","Exhale on exertion while maintaining intra-abdominal brace."],"howToSteps":["1. Setup Stand with your feet hip-width apart, engaging your core and maintaining a neutral spine.","2. Brace/Position Take a step forward with your right foot into a lunge, ensuring your knee is aligned over your ankle and your back knee is hovering just above the ground.","3. Execute Push through your right heel to rise up, bringing your left knee up towards your chest while rotating your torso to the right for balance.","4. Return/Repeat Lower your left leg back down into the lunge position, step back to the starting position, and repeat on the opposite side."]}},{"id":"1803225d-fedb-4c3b-ab56-e8f6d5b25a2d","name":"Lying Leg Curl","slug":"lying-leg-curl","description":"Step 1: Lie face down on the leg curl machine with feet hip width apart, abs drawn in and braced and glutes flexed. Ensure setup positions knee close to hinge on the machine and pad resting on lower calf/achilles. Position head in line with the back and lock shoulder blades back and down.\n\nStep 2: Pull toes toward the knees then drive the heels up toward the glutes as far as possible without arching the lower back or lifting the hips off of the pad.\n\nStep 3: Reverse the pattern and lower the weight back to the starting position. Maintain posture throughout.\n\nStep 4: Repeat for the desired number of repetitions. Avoid overarching the lower back, pointing or turning the toes out or letting the head fall toward the pad.","coachingCues":[],"primaryEquipment":["Lying Leg Curl Machine"],"muscleGroups":["glutes","hamstrings"],"imageUrl":"https://img.youtube.com/vi/Dq5y4WEcqqo/hqdefault.jpg","videoId":"Dq5y4WEcqqo","videoUrl":"https://www.youtube.com/watch?v=Dq5y4WEcqqo","videoThumbnailUrl":"https://img.youtube.com/vi/Dq5y4WEcqqo/hqdefault.jpg","candidatePhotoUrl":"/images/exercises/lying-leg-curl.jpg","hasCandidatePhoto":true,"warnings":[],"ytTitle":"How to Use a Lying Leg Curl | Proper Form & Technique | NASM","ytAuthor":"National Academy of Sports Medicine (NASM)","ytStatus":"OK","card":{"category":"Arms","phase":"Phase 1: Stabilization · Phase 2: Strength Endurance · Phase 3: Hypertrophy","primeMover":"Biceps Brachii","kineticCheckpoints":{"feetAnkles":"Shoulder-width, firmly planted on ground.","knees":"Aligned with second and third toes.","lphc":"Neutral lumbar spine; core braced.","shoulders":"Retracted and depressed into athletic posture.","headNeck":"Neutral cervical spine, chin packed."},"clinicalCues":["Maintain neutral kinetic chain checkpoints throughout.","Control the 2-second eccentric lowering phase.","Exhale on exertion while maintaining intra-abdominal brace."],"howToSteps":["1. Lie face down on the leg curl machine with feet hip width apart, abs drawn in and braced and glutes flexed. Ensure setup positions knee close to hinge on the machine and pad resting on lower calf/achilles. Position head in line with the back and lock shoulder blades back and down.","2. Pull toes toward the knees then drive the heels up toward the glutes as far as possible without arching the lower back or lifting the hips off of the pad.","3. Reverse the pattern and lower the weight back to the starting position. Maintain posture throughout.","4. Repeat for the desired number of repetitions. Avoid overarching the lower back, pointing or turning the toes out or letting the head fall toward the pad."]}},{"id":"db0d149a-7f08-488e-b90f-59e44f1d598d","name":"Lying Leg Curl Single Leg","slug":"lying-leg-curl-single-leg","description":"Step 1: Lie face down on the leg curl machine with feet hip width apart, abs drawn in and braced and glutes flexed. Ensure setup positions knee close to hinge on the machine and pad resting on lower calf/achilles. Position head in line with the back and lock shoulder blades back and down.\n\nStep 2: Pull toes toward the shin of the working leg (dorsiflexion) then drive the heel up toward the glutes as far as possible without arching the lower back or lifting the hips off of the pad. Leave the non-working leg lying extended on the pad.\n\nStep 3: Reverse the pattern and lower the weight back to the starting position. Maintain posture throughout.\n\nStep 4: Repeat for the desired number of repetitions. Avoid overarching the lower back, pointing or turning the toes out or letting the head fall toward the pad.","coachingCues":[],"primaryEquipment":["Lying Leg Curl Machine"],"muscleGroups":["core","glutes","hamstrings"],"imageUrl":"https://img.youtube.com/vi/kGIfh3hHY0w/hqdefault.jpg","videoId":"kGIfh3hHY0w","videoUrl":"https://www.youtube.com/watch?v=kGIfh3hHY0w","videoThumbnailUrl":"https://img.youtube.com/vi/kGIfh3hHY0w/hqdefault.jpg","candidatePhotoUrl":"/images/exercises/lying-leg-curl-single-leg.jpg","hasCandidatePhoto":true,"warnings":[],"ytTitle":"How to do a Single-Leg Lying Curl  | Proper Form & Technique | NASM","ytAuthor":"National Academy of Sports Medicine (NASM)","ytStatus":"OK","card":{"category":"Arms","phase":"Phase 1: Stabilization · Phase 2: Strength Endurance · Phase 3: Hypertrophy","primeMover":"Biceps Brachii","kineticCheckpoints":{"feetAnkles":"Shoulder-width, firmly planted on ground.","knees":"Aligned with second and third toes.","lphc":"Neutral lumbar spine; core braced.","shoulders":"Retracted and depressed into athletic posture.","headNeck":"Neutral cervical spine, chin packed."},"clinicalCues":["Maintain neutral kinetic chain checkpoints throughout.","Control the 2-second eccentric lowering phase.","Exhale on exertion while maintaining intra-abdominal brace."],"howToSteps":["1. Lie face down on the leg curl machine with feet hip width apart, abs drawn in and braced and glutes flexed. Ensure setup positions knee close to hinge on the machine and pad resting on lower calf/achilles. Position head in line with the back and lock shoulder blades back and down.","2. Pull toes toward the shin of the working leg (dorsiflexion) then drive the heel up toward the glutes as far as possible without arching the lower back or lifting the hips off of the pad. Leave the non-working leg lying extended on the pad.","3. Reverse the pattern and lower the weight back to the starting position. Maintain posture throughout.","4. Repeat for the desired number of repetitions. Avoid overarching the lower back, pointing or turning the toes out or letting the head fall toward the pad."]}},{"id":"a0607344-b5c1-4b9d-8454-17147e768e67","name":"Lying Leg Curl Two Leg Concentric Single Leg Eccentric","slug":"lying-leg-curl-two-leg-concentric-single-leg-eccentric","description":"Step 1: Adjust the machine so that the pad rests comfortably against your lower calves, ensuring your knees align with the pivot point.\n\nStep 2: Lie face down on the machine, grasp the handles, and engage your core while keeping your hips pressed against the 51-635f91334ae5","name":"Mb Figure 8","slug":"mb-figure-8-0120","description":"Step 1: Setup Stand with feet shoulder-width apart, holding a medicine ball with both hands at chest level.\n\nStep 2: Brace/Position Engage your core and maintain a slight bend in your knees, keeping your back straight and shoulders relaxed.\n\nStep 3: Execute Rotate your torso to the right, lowering the medicine ball towards your right hip, then smoothly move it in a figure 8 pattern across your body to the left side.\n\nStep 4: Return/Repeat Continue the figure 8 motion for the desired number of repetitions, ensuring to maintain control and stability throughout the movement.","coachingCues":[],"primaryEquipment":[],"muscleGroups":["back"],"imageUrl":"https://img.youtube.com/vi/iVmIrVNlKjI/hqdefault.jpg","videoId":"iVmIrVNlKjI","videoUrl":"https://www.youtube.com/watch?v=iVmIrVNlKjI","videoThumbnailUrl":"https://img.youtube.com/vi/iVmIrVNlKjI/hqdefault.jpg","candidatePhotoUrl":"/images/exercises/mb-figure-8.jpg","hasCandidatePhoto":true,"warnings":[],"ytTitle":"How to do a MB Figure 8","ytAuthor":"National Academy of Sports Medicine (NASM)","ytStatus":"OK","card":{"category":"Back","phase":"Phase 1: Stabilization · Phase 2: Strength Endurance · Phase 3: Hypertrophy","primeMover":"Latissimus Dorsi, Rhomboids & Middle Trapezius","kineticCheckpoints":{"feetAnkles":"Shoulder-width, firmly planted on ground.","knees":"Aligned with second and third toes.","lphc":"Neutral lumbar spine; core braced.","shoulders":"Retracted and depressed into athletic posture.","headNeck":"Neutral cervical spine, chin packed."},"clinicalCues":["Maintain neutral kinetic chain checkpoints throughout.","Control the 2-second eccentric lowering phase.","Exhale on exertion while maintaining intra-abdominal brace."],"howToSteps":["1. Setup Stand with feet shoulder-width apart, holding a medicine ball with both hands at chest level.","2. Brace/Position Engage your core and maintain a slight bend in your knees, keeping your back straight and shoulders relaxed.","3. Execute Rotate your torso to the right, lowering the medicine ball towards your right hip, then smoothly move it in a figure 8 pattern across your body to the left side.","4. Return/Repeat Continue the figure 8 motion for the desired number of repetitions, ensuring to maintain control and stability throughout the movement."]}},{"id":"d7decfc6-98b3-4def-a749-d53d6db8b772","name":"Medicine Ball Bent Over Chest Pass","slug":"medicine-ball-bent-over-chest-pass-0166","description":"Step 1: Stand with your feet shoulder-width apart, holding the medicine ball at chest level with both hands.\n\nStep 2: Hinge at your hips to bend forward slightly while keeping your back straight and core engaged.\n\nStep 3: Rotate your torso to one side and then explosively pass the medicine ball forward, aiming for a target.\n\nStep 4: Retrieve the ball and repeat the movement, alternating sides with each pass.","coachingCues":[],"primaryEquipment":["Medicine Ball"],"muscleGroups":["chest","shoulders","triceps"],"imageUrl":"https://img.youtube.com/vi/6Uuxb4h2N5I/hqdefault.jpg","videoId":"6Uuxb4h2N5I","videoUrl":"https://www.youtube.com/watch?v=6Uuxb4h2N5I","videoThumbnailUrl":"https://img.youtube.com/vi/6Uuxb4h2N5I/hqdefault.jpg","candidatePhotoUrl":"/images/exercises/medicine-ball-bent-over-chest-pass.jpg","hasCandidatePhoto":true,"warnings":[],"ytTitle":"How to do a Medicine Ball Bent-Over Chest Pass","ytAuthor":"National Academy of Sports Medicine (NASM)","ytStatus":"OK","card":{"category":"Shoulders","phase":"Phase 1: Stabilization · Phase 2: Strength Endurance · Phase 3: Hypertrophy","primeMover":"Deltoids & Upper Trapezius","kineticCheckpoints":{"feetAnkles":"Shoulder-width, firmly planted on ground.","knees":"Aligned with second and third toes.","lphc":"Neutral lumbar spine; core braced.","shoulders":"Retracted and depressed into athletic posture.","headNeck":"Neutral cervical spine, chin packed."},"clinicalCues":["Maintain neutral kinetic chain checkpoints throughout.","Control the 2-second eccentric lowering phase.","Exhale on exertion while maintaining intra-abdominal brace."],"howToSteps":["1. Stand with your feet shoulder-width apart, holding the medicine ball at chest level with both hands.","2. Hinge at your hips to bend forward slightly while keeping your back straight and core engaged.","3. Rotate your torso to one side and then explosively pass the medicine ball forward, aiming for a target.","4. Retrieve the ball and repeat the movement, alternating sides with each pass."]}},{"id":"ae881219-5a06-4f42-ab1b-5bc51ad8eaff","name":"Medicine Ball Push Up To 3 Point","slug":"medicine-ball-push-up-to-3-point-0199","description":"Step 1: Setup Place a medicine ball under one hand while in a push-up position, ensuring your body forms a straight line from head to heels.\n\nStep 2: Brace/Position Engage your core and maintain a neutral spine, keeping your feet shoulder-width apart for stability.\n\nStep 3: Execute Lower your body into a push-up by bending your elbows, then push back up to the starting position.\n\nStep 4: Return/Repeat After the push-up, rotate your torso and lift the opposite arm towards the ceiling, holding for a moment before returning to the push-up position and repeating.","coachingCues":[],"primaryEquipment":["Medicine Ball"],"muscleGroups":["chest","shoulders","triceps"],"imageUrl":"https://img.youtube.com/vi/pxpGo3EtwkM/hqdefault.jpg","videoId":"pxpGo3EtwkM","videoUrl":"https://www.youtube.com/watch?v=pxpGo3EtwkM","videoThumbnailUrl":"https://img.youtube.com/vi/pxpGo3EtwkM/hqdefault.jpg","candidatePhotoUrl":"/images/exercises/medicine-ball-push-up-to-3-point.jpg","hasCandidatePhoto":true,"warnings":[],"ytTitle":"How to do a Medicine Ball Push-Up to 3-Point","ytAuthor":"National Academy of Sports Medicine (NASM)","ytStatus":"OK","card":{"category":"Chest","phase":"Phase 1 (Stabilization Endurance), Phase 2 (Strength Endurance)","primeMover":"Pectoralis Major","kineticCheckpoints":{"feetAnkles":"Together or hip-width apart, dorsiflexed on balls of feet.","knees":"Fully extended with active quadriceps contraction.","lphc":"Neutral pelvis; no sagging hips (anterior tilt) or pike (excessive flexion).","shoulders":"Hands placed slightly wider than shoulder-width, fingers pointing forward.","headNeck":"Neutral cervical spine, chin tucked, gaze looking 6 inches ahead."},"clinicalCues":["Engage glutes and brace core to maintain rigid plank posture.","Do not allow lower back to sag or head to jut forward toward the floor.","Push the ground away at the top of the rep to engage serratus anterior."],"howToSteps":["1. Setup Place a medicine ball under one hand while in a push-up position, ensuring your body forms a straight line from head to heels.","2. Brace/Position Engage your core and maintain a neutral spine, keeping your feet shoulder-width apart for stability.","3. Execute Lower your body into a push-up by bending your elbows, then push back up to the starting position.","4. Return/Repeat After the push-up, rotate your torso and lift the opposite arm towards the ceiling, holding for a moment before returning to the push-up position and repeating."]}},{"id":"eaa123e7-2bd7-4d90-a3f3-c73d181fc6f4","name":"Medicine Ball Step Over Push Up","slug":"medicine-ball-step-over-push-up-0200","description":"Step 1: Setup Position a medicine ball on the floor in front of you and kneel beside it, placing one hand on the ball and the other on the ground.\n\nStep 2: Brace/Position Engage your core and maintain a straight line from your head to your knees, ensuring your shoulders are directly over your hands.\n\nStep 3: Execute Lower your chest towards the ground into a push-up, then push back up to the starting position. As you rise, step over the medicine ball with your opposite hand.\n\nStep 4: Return/Repeat Repeat the push-up and step over movement, alternating sides with each repetition for the desired number of sets.","coachingCues":[],"primaryEquipment":["Medicine Ball","Box or Step"],"muscleGroups":["chest","shoulders","triceps"],"imageUrl":"https://img.youtube.com/vi/-nuCpkC0I7s/hqdefault.jpg","videoId":"-nuCpkC0I7s","videoUrl":"https://www.youtube.com/watch?v=-nuCpkC0I7s","videoThumbnailUrl":"https://img.youtube.com/vi/-nuCpkC0I7s/hqdefault.jpg","candidatePhotoUrl":"/images/exercises/medicine-ball-step-over-push-up.jpg","hasCandidatePhoto":true,"warnings":[],"ytTitle":"How to do a Medicine Ball Step Over Push-Up","ytAuthor":"National Academy of Sports Medicine (NASM)","ytStatus":"OK","card":{"category":"Chest","phase":"Phase 1 (Stabilization Endurance), Phase 2 (Strength Endurance)","primeMover":"Pectoralis Major","kineticCheckpoints":{"feetAnkles":"Together or hip-width apart, dorsiflexed on balls of feet.","knees":"Fully extended with active quadriceps contraction.","lphc":"Neutral pelvis; no sagging hips (anterior tilt) or pike (excessive flexion).","shoulders":"Hands placed slightly wider than shoulder-width, fingers pointing forward.","headNeck":"Neutral cervical spine, chin tucked, gaze looking 6 inches ahead."},"clinicalCues":["Engage glutes and brace core to maintain rigid plank posture.","Do not allow lower back to sag or head to jut forward toward the floor.","Push the ground away at the top of the rep to engage serratus anterior."],"howToSteps":["1. Setup Position a medicine ball on the floor in front of you and kneel beside it, placing one hand on the ball and the other on the ground.","2. Brace/Position Engage your core and maintain a straight line from your head to your knees, ensuring your shoulders are directly over your hands.","3. Execute Lower your chest towards the ground into a push-up, then push back up to the starting position. As you rise, step over the medicine ball with your opposite hand.","4. Return/Repeat Repeat the push-up and step over movement, alternating sides with each repetition for the desired number of sets."]}},{"id":"b8115d6c-ba97-4967-989d-ae5686852a91","name":"Modified Push Up","slug":"modified-push-up","description":"Step 1: Assume a push up position on the knees with the body in a straight line from head to knee, feet/knees hip to shoulder width and hands 1.5-2x shoulder width. Brace the core and tighten the glutes. Press away from the floor to prevent the shoulder blades from winging.\n\nStep 2: Lower the chest toward the floor through a maximum range of motion until the chest is a few inches off the floor or shoulders have reached elbow depth.\n\nStep 3: Reverse the pattern and return to starting position.\n\nStep 4: Repeat. Maintain posture throughout. Keep the shoulders from elevating or rounding. Do not let the back round or arch or the hips sag or pike. Avoid letting the head jut forward.","coachingCues":[],"primaryEquipment":["None"],"muscleGroups":["chest","shoulders","triceps"],"imageUrl":"https://img.youtube.com/vi/PDr5B2jLUOw/hqdefault.jpg","videoId":"PDr5B2jLUOw","videoUrl":"https://www.youtube.com/watch?v=PDr5B2jLUOw","videoThumbnailUrl":"https://img.youtube.com/vi/PDr5B2jLUOw/hqdefault.jpg","candidatePhotoUrl":"/images/exercises/modified-push-up.jpg","hasCandidatePhoto":true,"warnings":[],"ytTitle":"How to do a Modified Push-Up | Proper Form & Technique | NASM","ytAuthor":"National Academy of Sports Medicine (NASM)","ytStatus":"OK","card":{"category":"Chest","phase":"Phase 1 (Stabilization Endurance), Phase 2 (Strength Endurance)","primeMover":"Pectoralis Major","kineticCheckpoints":{"feetAnkles":"Together or hip-width apart, dorsiflexed on balls of feet.","knees":"Fully extended with active quadriceps contraction.","lphc":"Neutral pelvis; no sagging hips (anterior tilt) or pike (excessive flexion).","shoulders":"Hands placed slightly wider than shoulder-width, fingers pointing forward.","headNeck":"Neutral cervical spine, chin tucked, gaze looking 6 inches ahead."},"clinicalCues":["Engage glutes and brace core to maintain rigid plank posture.","Do not allow lower back to sag or head to jut forward toward the floor.","Push the ground away at the top of the rep to engage serratus anterior."],"howToSteps":["1. Assume a push up position on the knees with the body in a straight line from head to knee, feet/knees hip to shoulder width and hands 1.5-2x shoulder width. Brace the core and tighten the glutes. Press away from the floor to prevent the shoulder blades from winging.","2. Lower the chest toward the floor through a maximum range of motion until the chest is a few inches off the floor or shoulders have reached elbow depth.","3. Reverse the pattern and return to starting position.","4. Repeat. Maintain posture throughout. Keep the shoulders from elevating or rounding. Do not let the back round or arch or the hips sag or pike. Avoid letting the head jut forward."]}},{"id":"7dc2764e-12ab-464f-a1ac-9134665686e4","name":"One Ins Ladder Drill","slug":"one-ins-ladder-drill-0150","description":"Step 1: Setup Stand with your feet hip-width apart, facing the ladder, ensuring the ladder is flat on the ground.\n\nStep 2: Brace/Position Engage your core, maintain a slight bend in your knees, and keep your chest up as you prepare to move.\n\nStep 3: Execute Step into the first square of the ladder with your right foot, followed by your left foot, then quickly step out with your right foot to the side of the ladder.\n\nStep 4: Return/Repeat Move back to the starting position by stepping back into the ladder with your left foot, followed by your right foot, and repeat the sequence for the desired duration.","coachingCues":[],"primaryEquipment":[],"muscleGroups":["back"],"imageUrl":"https://img.youtube.com/vi/em63lCvm9CM/hqdefault.jpg","videoId":"em63lCvm9CM","videoUrl":"https://www.youtube.com/watch?v=em63lCvm9CM","videoThumbnailUrl":"https://img.youtube.com/vi/em63lCvm9CM/hqdefault.jpg","candidatePhotoUrl":"/images/exercises/one-ins-ladder-drill.jpg","hasCandidatePhoto":true,"warnings":[],"ytTitle":"How to do One-Ins (Ladder Drill)","ytAuthor":"National Academy of Sports Medicine (NASM)","ytStatus":"OK","card":{"category":"Back","phase":"Phase 1: Stabilization · Phase 2: Strength Endurance · Phase 3: Hypertrophy","primeMover":"Latissimus Dorsi, Rhomboids & Middle Trapezius","kineticCheckpoints":{"feetAnkles":"Shoulder-width, firmly planted on ground.","knees":"Aligned with second and third toes.","lphc":"Neutral lumbar spine; core braced.","shoulders":"Retracted and depressed into athletic posture.","headNeck":"Neutral cervical spine, chin packed."},"clinicalCues":["Maintain neutral kinetic chain checkpoints throughout.","Control the 2-second eccentric lowering phase.","Exhale on exertion while maintaining intra-abdominal brace."],"howToSteps":["1. Setup Stand with your feet hip-width apart, facing the ladder, ensuring the ladder is flat on the ground.","2. Brace/Position Engage your core, maintain a slight bend in your knees, and keep your chest up as you prepare to move.","3. Execute Step into the first square of the ladder with your right foot, followed by your left foot, then quickly step out with your right foot to the side of the ladder.","4. Return/Repeat Move back to the starting position by stepping back into the ladder with your left foot, followed by your right foot, and repeat the sequence for the desired duration."]}},{"id":"6fad3c55-d0cd-416f-ad39-57f4f22aa794","name":"Pike Push Up","slug":"pike-push-up-0201","description":"Step 1: Setup Begin in a downward dog position with your hands shoulder-width apart and feet hip-width apart, hips raised towards the ceiling.\n\nStep 2: Brace/Position Engage your core and keep your head between your arms, ensuring your body forms a straight line from your hands to your feet.\n\nStep 3: Execute Bend your elbows to lower your head towards the ground, keeping your body in an inverted V-shape and your elbows pointing slightly outwards.\n\nStep 4: Return/Repeat Press through your hands to extend your elbows and return to the starting position, maintaining control throughout the movement.","coachingCues":[],"primaryEquipment":[],"muscleGroups":["chest","shoulders","triceps"],"imageUrl":"https://img.youtube.com/vi/XckEEwa1BPI/hqdefault.jpg","videoId":"XckEEwa1BPI","videoUrl":"https://www.youtube.com/watch?v=XckEEwa1BPI","videoThumbnailUrl":"https://img.youtube.com/vi/XckEEwa1BPI/hqdefault.jpg","candidatePhotoUrl":"/images/exercises/pike-push-up.jpg","hasCandidatePhoto":true,"warnings":[],"ytTitle":"How to do a Pike Push-Up","ytAuthor":"National Academy of Sports Medicine (NASM)","ytStatus":"OK","card":{"category":"Chest","phase":"Phase 1 (Stabilization Endurance), Phase 2 (Strength Endurance)","primeMover":"Pectoralis Major","kineticCheckpoints":{"feetAnkles":"Together or hip-width apart, dorsiflexed on balls of feet.","knees":"Fully extended with active quadriceps contraction.","lphc":"Neutral pelvis; no sagging hips (anterior tilt) or pike (excessive flexion).","shoulders":"Hands placed slightly wider than shoulder-width, fingers pointing forward.","headNeck":"Neutral cervical spine, chin tucked, gaze looking 6 inches ahead."},"clinicalCues":["Engage glutes and brace core to maintain rigid plank posture.","Do not allow lower back to sag or head to jut forward toward the floor.","Push the ground away at the top of the rep to engage serratus anterior."],"howToSteps":["1. Setup Begin in a downward dog position with your hands shoulder-width apart and feet hip-width apart, hips raised towards the ceiling.","2. Brace/Position Engage your core and keep your head between your arms, ensuring your body forms a straight line from your hands to your feet.","3. Execute Bend your elbows to lower your head towards the ground, keeping your body in an inverted V-shape and your elbows pointing slightly outwards.","4. Return/Repeat Press through your hands to extend your elbows and return to the starting position, maintaining control throughout the movement."]}},{"id":"6d3a88e1-0da0-4c91-af74-1e5192b0787a","name":"Plank","slug":"plank-0080","description":"Step 1: Setup Begin in a prone position on the floor, placing your forearms on the ground with elbows directly under your shoulders.\n\nStep 2: Brace/Position Engage your core, glutes, and legs, ensuring your body forms a straight line from head to heels.\n\nStep 3: Execute Hold the position, maintaining tension in your core and avoiding sagging or arching of the back.\n\nStep 4: Return/Repeat Hold for the desired duration, then lower your knees to the ground to release the position before repeating.","coachingCues":[],"primaryEquipment":[],"muscleGroups":["core"],"imageUrl":"https://img.youtube.com/vi/xhk1JkbF2lg/hqdefault.jpg","videoId":"xhk1JkbF2lg","videoUrl":"https://www.youtube.com/watch?v=xhk1JkbF2lg","videoThumbnailUrl":"https://img.youtube.com/vi/xhk1JkbF2lg/hqdefault.jpg","candidatePhotoUrl":"/images/exercises/plank.jpg","hasCandidatePhoto":true,"warnings":[],"ytTitle":"How to do a Plank","ytAuthor":"National Academy of Sports Medicine (NASM)","ytStatus":"OK","card":{"category":"Core","phase":"Phase 1 (Stabilization Endurance)","primeMover":"Transverse Abdominis & Rectus Abdominis","kineticCheckpoints":{"feetAnkles":"Dorsiflexed on balls of feet, hip-width apart.","knees":"Locked straight with active quadriceps contraction.","lphc":"Neutral pelvis with posterior pelvic tilt; zero sagging in lumbar spine.","shoulders":"Elbows directly under shoulders; push floor away to avoid winging.","headNeck":"Neutral cervical spine; chin tucked gazing at hands."},"clinicalCues":["Pull navel to spine and squeeze glutes hard to lock pelvis in neutral position.","Push floor away with forearms to prevent shoulder blades from collapsing.","Do not hold breath; breathe smoothly into abdomen."],"howToSteps":["1. Setup Begin in a prone position on the floor, placing your forearms on the ground with elbows directly under your shoulders.","2. Brace/Position Engage your core, glutes, and legs, ensuring your body forms a straight line from head to heels.","3. Execute Hold the position, maintaining tension in your core and avoiding sagging or arching of the back.","4. Return/Repeat Hold for the desired duration, then lower your knees to the ground to release the position before repeating."]}},{"id":"fed54790-62ea-4c80-951d-d940c226149a","name":"Plank Walkup","slug":"plank-walkup","description":"Step 1: Lie on the stomach with the feet together and the forearms on the ground with elbows under the shoulders. Draw in the belly button, brace, and squeeze the glute muscles. Lift the body off of the floor and form a straight line from head to heel.\n\nStep 2: Next, push up from the ground, one arm at a time, into a push up position.\n\nStep 3: Reverse the pattern and return to the starting position.\n\nStep 4: Repeat for the desired number of repetitions or time. Avoid feet collapsing inward, shoulder blades winging or chin falling toward the floor.","coachingCues":[],"primaryEquipment":["None"],"muscleGroups":["core"],"imageUrl":"https://img.youtube.com/vi/6Tv4xTRPtUc/hqdefault.jpg","videoId":"6Tv4xTRPtUc","videoUrl":"https://www.youtube.com/watch?v=6Tv4xTRPtUc","videoThumbnailUrl":"https://img.youtube.com/vi/6Tv4xTRPtUc/hqdefault.jpg","candidatePhotoUrl":"/images/exercises/plank-walkup.jpg","hasCandidatePhoto":true,"warnings":[],"ytTitle":"How to do a Plank Walkup  | Proper Form & Technique | NASM","ytAuthor":"National Academy of Sports Medicine (NASM)","ytStatus":"OK","card":{"category":"Core","phase":"Phase 1 (Stabilization Endurance)","primeMover":"Transverse Abdominis & Rectus Abdominis","kineticCheckpoints":{"feetAnkles":"Dorsiflexed on balls of feet, hip-width apart.","knees":"Locked straight with active quadriceps contraction.","lphc":"Neutral pelvis with posterior pelvic tilt; zero sagging in lumbar spine.","shoulders":"Elbows directly under shoulders; push floor away to avoid winging.","headNeck":"Neutral cervical spine; chin tucked gazing at hands."},"clinicalCues":["Pull navel to spine and squeeze glutes hard to lock pelvis in neutral position.","Push floor away with forearms to prevent shoulder blades from collapsing.","Do not hold breath; breathe smoothly into abdomen."],"howToSteps":["1. Lie on the stomach with the feet together and the forearms on the ground with elbows under the shoulders. Draw in the belly button, brace, and squeeze the glute muscles. Lift the body off of the floor and form a straight line from head to heel.","2. Next, push up from the ground, one arm at a time, into a push up position.","3. Reverse the pattern and return to the starting position.","4. Repeat for the desired number of repetitions or time. Avoid feet collapsing inward, shoulder blades winging or chin falling toward the floor."]}},{"id":"daa2f9d8-2af7-479f-81ba-cca48c4c2386","name":"Plank With Arm Reach","slug":"plank-with-arm-reach-0081","description":"Step 1: Setup Begin in a high plank position with your hands directly under your shoulders, legs extended, and feet hip-width apart.\n\nStep 2: Brace/Position Engage your core, keeping your body in a straight line from head to heels, and maintain a neutral spine.\n\nStep 3: Execute Reach your right arm forward, extending it in line with your shoulder while maintaining stability in your torso.\n\nStep 4: Return/Repeat Lower your right arm back to the starting position and repeat on the left side, alternating arms for the desired number of repetitions.","coachingCues":[],"primaryEquipment":[],"muscleGroups":["core"],"imageUrl":"https://img.youtube.com/vi/rFwsard85T8/hqdefault.jpg","videoId":"rFwsard85T8","videoUrl":"https://www.youtube.com/watch?v=rFwsard85T8","videoThumbnailUrl":"https://img.youtube.com/vi/rFwsard85T8/hqdefault.jpg","candidatePhotoUrl":"/images/exercises/plank-with-arm-reach.jpg","hasCandidatePhoto":true,"warnings":[],"ytTitle":"How to do a Plank with Arm Reach","ytAuthor":"National Academy of Sports Medicine (NASM)","ytStatus":"OK","card":{"category":"Core","phase":"Phase 1 (Stabilization Endurance)","primeMover":"Transverse Abdominis & Rectus Abdominis","kineticCheckpoi
