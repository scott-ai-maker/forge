heckpoints":{"feetAnkles":"Athletic staggered or parallel stance.","knees":"Soft knee bend.","lphc":"Neutral pelvis; ribcage down with core braced.","shoulders":"Externally rotated at peak contraction (thumbs pointing backward).","headNeck":"Neutral cervical spine."},"clinicalCues":["Focus on external rotation at the finish: knuckles back, thumbs pointed behind head.","Keep elbows high in line with ears.","Do not thrust hips forward or lean back to move the weight."],"howToSteps":["1. Position the cable slightly above the head and grasp the rope with the thumbs pointing toward you. Stand tall with your feet slightly staggered and toes pointing straight ahead. Draw your abs.","2. Pull the cable toward your face by bending your elbows out to the side and pinching your shoulder blades together attempting to drive your fists by your ears.","3. Reverse the pattern and return to the starting position.","4. Repeat. Maintain posture throughout. Avoid jutting the chin forward, arching the lower back, letting the ribs flare, or shrugging the shoulders."]}},{"id":"0e53ce20-892c-4eb0-b53f-e0281f03ecf5","name":"Floor Bridge","slug":"floor-bridge-0074","description":"Step 1: Setup Lie on your back on the floor with your knees bent and feet flat on the ground, hip-width apart.\n\nStep 2: Brace/Position Engage your core and press your shoulder blades into the floor, keeping your arms at your sides.\n\nStep 3: Execute Drive through your heels to lift your hips towards the ceiling, forming a straight line from your shoulders to your knees.\n\nStep 4: Return/Repeat Lower your hips back to the starting position, then repeat the movement for the desired number of repetitions.","coachingCues":[],"primaryEquipment":[],"muscleGroups":["back"],"imageUrl":"https://img.youtube.com/vi/Z3cY3d3BBo4/hqdefault.jpg","videoId":"Z3cY3d3BBo4","videoUrl":"https://www.youtube.com/watch?v=Z3cY3d3BBo4","videoThumbnailUrl":"https://img.youtube.com/vi/Z3cY3d3BBo4/hqdefault.jpg","candidatePhotoUrl":"/images/exercises/floor-bridge.jpg","hasCandidatePhoto":true,"warnings":[],"ytTitle":"How to do a Floor Bridge","ytAuthor":"National Academy of Sports Medicine (NASM)","ytStatus":"OK","card":{"category":"Back","phase":"Phase 1: Stabilization · Phase 2: Strength Endurance · Phase 3: Hypertrophy","primeMover":"Latissimus Dorsi, Rhomboids & Middle Trapezius","kineticCheckpoints":{"feetAnkles":"Shoulder-width, firmly planted on ground.","knees":"Aligned with second and third toes.","lphc":"Neutral lumbar spine; core braced.","shoulders":"Retracted and depressed into athletic posture.","headNeck":"Neutral cervical spine, chin packed."},"clinicalCues":["Maintain neutral kinetic chain checkpoints throughout.","Control the 2-second eccentric lowering phase.","Exhale on exertion while maintaining intra-abdominal brace."],"howToSteps":["1. Setup Lie on your back on the floor with your knees bent and feet flat on the ground, hip-width apart.","2. Brace/Position Engage your core and press your shoulder blades into the floor, keeping your arms at your sides.","3. Execute Drive through your heels to lift your hips towards the ceiling, forming a straight line from your shoulders to your knees.","4. Return/Repeat Lower your hips back to the starting position, then repeat the movement for the desired number of repetitions."]}},{"id":"1615d0bf-f76f-419d-ae62-a8924c5589f8","name":"Floor Prone Cobra","slug":"floor-prone-cobra-0075","description":"Step 1: Setup Lie face down on the floor with your arms extended straight out to the sides at shoulder height, palms facing down.\n\nStep 2: Brace/Position Engage your core and glutes, ensuring your body is in a straight line from head to heels, and keep your neck neutral.\n\nStep 3: Execute Slowly lift your chest and arms off the ground by squeezing your shoulder blades together, while rotating your thumbs up towards the ceiling.\n\nStep 4: Return/Repeat Lower your chest and arms back to the floor with control, then repeat the movement for the desired number of repetitions.","coachingCues":[],"primaryEquipment":[],"muscleGroups":["back"],"imageUrl":"https://img.youtube.com/vi/keErJXdp2lE/hqdefault.jpg","videoId":"keErJXdp2lE","videoUrl":"https://www.youtube.com/watch?v=keErJXdp2lE","videoThumbnailUrl":"https://img.youtube.com/vi/keErJXdp2lE/hqdefault.jpg","candidatePhotoUrl":"/images/exercises/floor-prone-cobra.jpg","hasCandidatePhoto":true,"warnings":[],"ytTitle":"How to do a Floor Prone Cobra","ytAuthor":"National Academy of Sports Medicine (NASM)","ytStatus":"OK","card":{"category":"Back","phase":"Phase 1: Stabilization · Phase 2: Strength Endurance · Phase 3: Hypertrophy","primeMover":"Latissimus Dorsi, Rhomboids & Middle Trapezius","kineticCheckpoints":{"feetAnkles":"Shoulder-width, firmly planted on ground.","knees":"Aligned with second and third toes.","lphc":"Neutral lumbar spine; core braced.","shoulders":"Retracted and depressed into athletic posture.","headNeck":"Neutral cervical spine, chin packed."},"clinicalCues":["Maintain neutral kinetic chain checkpoints throughout.","Control the 2-second eccentric lowering phase.","Exhale on exertion while maintaining intra-abdominal brace."],"howToSteps":["1. Setup Lie face down on the floor with your arms extended straight out to the sides at shoulder height, palms facing down.","2. Brace/Position Engage your core and glutes, ensuring your body is in a straight line from head to heels, and keep your neck neutral.","3. Execute Slowly lift your chest and arms off the ground by squeezing your shoulder blades together, while rotating your thumbs up towards the ceiling.","4. Return/Repeat Lower your chest and arms back to the floor with control, then repeat the movement for the desired number of repetitions."]}},{"id":"36cede00-2077-455e-a39c-ef3d6f940d5f","name":"Foam Roll Adductors","slug":"foam-roll-adductors","description":"Step 1: From a modified plank, position the foam roller underneath the groin with the thigh out to your side. Using your arms and other leg for support, increase the amount of pressure on the muscle until you feel a manageable level of tenderness.\n\nStep 2: Then, roll the length of the muscle area at about 1 inch per second looking for the most tender area.\n\nStep 3: Once you've found the most tender area, hold the position and pressure there for the recommended time. Maintain posture throughout.\n\nStep 4: Repeat on the other side. Avoid continuous movement, letting the head fall forward, collapsing the shoulders or spine, or holding your breath.","coachingCues":[],"primaryEquipment":["Foam Roller"],"muscleGroups":["glutes","hamstrings","quadriceps"],"imageUrl":"https://img.youtube.com/vi/Nqol0T6rKDg/hqdefault.jpg","videoId":"Nqol0T6rKDg","videoUrl":"https://www.youtube.com/watch?v=Nqol0T6rKDg","videoThumbnailUrl":"https://img.youtube.com/vi/Nqol0T6rKDg/hqdefault.jpg","candidatePhotoUrl":"/images/exercises/foam-roll-adductors.jpg","hasCandidatePhoto":true,"warnings":[],"ytTitle":"How to Foam Roll: Adductors","ytAuthor":"National Academy of Sports Medicine (NASM)","ytStatus":"OK","card":{"category":"Flexibility/SMR","phase":"Phase 1: Stabilization · Phase 2: Strength Endurance · Phase 3: Hypertrophy","primeMover":"Target Neuromuscular / Fascial System","kineticCheckpoints":{"feetAnkles":"Shoulder-width, firmly planted on ground.","knees":"Aligned with second and third toes.","lphc":"Neutral lumbar spine; core braced.","shoulders":"Retracted and depressed into athletic posture.","headNeck":"Neutral cervical spine, chin packed."},"clinicalCues":["Maintain neutral kinetic chain checkpoints throughout.","Control the 2-second eccentric lowering phase.","Exhale on exertion while maintaining intra-abdominal brace."],"howToSteps":["1. From a modified plank, position the foam roller underneath the groin with the thigh out to your side. Using your arms and other leg for support, increase the amount of pressure on the muscle until you feel a manageable level of tenderness.","2. Then, roll the length of the muscle area at about 1 inch per second looking for the most tender area.","3. Once you've found the most tender area, hold the position and pressure there for the recommended time. Maintain posture throughout.","4. Repeat on the other side. Avoid continuous movement, letting the head fall forward, collapsing the shoulders or spine, or holding your breath."]}},{"id":"5226d740-1bca-4229-8ac3-3800777646ea","name":"Foam Roll Calves","slug":"foam-roll-calves-0225","description":"Step 1: Setup Sit on the floor with your legs extended in front of you and place a foam roller under your calves, positioning it just above your ankles.\n\nStep 2: Brace/Position Place your hands on the floor behind you for support and lift your hips off the ground, creating a straight line from your shoulders to your feet.\n\nStep 3: Execute Slowly roll your calves over the foam roller by shifting your body weight forward and backward, applying pressure to any tight or sore areas.\n\nStep 4: Return/Repeat Continue rolling for 30 seconds to 1 minute, then switch to the other calf and repeat the process.","coachingCues":[],"primaryEquipment":["Foam Roller"],"muscleGroups":["glutes","hamstrings","quadriceps"],"imageUrl":"https://img.youtube.com/vi/6f2LO5EeB0I/hqdefault.jpg","videoId":"6f2LO5EeB0I","videoUrl":"https://www.youtube.com/watch?v=6f2LO5EeB0I","videoThumbnailUrl":"https://img.youtube.com/vi/6f2LO5EeB0I/hqdefault.jpg","candidatePhotoUrl":"/images/exercises/foam-roll-calves.jpg","hasCandidatePhoto":true,"warnings":[],"ytTitle":"Foam Roll: Calves","ytAuthor":"National Academy of Sports Medicine (NASM)","ytStatus":"OK","card":{"category":"Flexibility/SMR","phase":"Phase 1: Stabilization · Phase 2: Strength Endurance · Phase 3: Hypertrophy","primeMover":"Target Neuromuscular / Fascial System","kineticCheckpoints":{"feetAnkles":"Shoulder-width, firmly planted on ground.","knees":"Aligned with second and third toes.","lphc":"Neutral lumbar spine; core braced.","shoulders":"Retracted and depressed into athletic posture.","headNeck":"Neutral cervical spine, chin packed."},"clinicalCues":["Maintain neutral kinetic chain checkpoints throughout.","Control the 2-second eccentric lowering phase.","Exhale on exertion while maintaining intra-abdominal brace."],"howToSteps":["1. Setup Sit on the floor with your legs extended in front of you and place a foam roller under your calves, positioning it just above your ankles.","2. Brace/Position Place your hands on the floor behind you for support and lift your hips off the ground, creating a straight line from your shoulders to your feet.","3. Execute Slowly roll your calves over the foam roller by shifting your body weight forward and backward, applying pressure to any tight or sore areas.","4. Return/Repeat Continue rolling for 30 seconds to 1 minute, then switch to the other calf and repeat the process."]}},{"id":"715cd116-279b-4717-a7da-43c5c1a6b175","name":"Foam Roll Latissimus Dorsi","slug":"foam-roll-latissimus-dorsi","description":"Step 1: Lay down with the foam roller under your arm pit. Using your arms for support, increase the amount of pressure on the muscle until you feel a manageable level of tenderness.\n\nStep 2: Then, roll the length of the muscle to about mid rib area at about 1 inch per second looking for the most tender area.\n\nStep 3: Once you've found the most tender area, hold the position and pressure there for the recommended time. Maintain posture throughout.\n\nStep 4: Repeat on the other side. Avoid continuous movement, letting the head fall forward or holding your breath.","coachingCues":[],"primaryEquipment":["Foam Roller"],"muscleGroups":["chest"],"imageUrl":"https://img.youtube.com/vi/5S2suclGl7o/hqdefault.jpg","videoId":"5S2suclGl7o","videoUrl":"https://www.youtube.com/watch?v=5S2suclGl7o","videoThumbnailUrl":"https://img.youtube.com/vi/5S2suclGl7o/hqdefault.jpg","candidatePhotoUrl":"/images/exercises/foam-roll-latissimus-dorsi.jpg","hasCandidatePhoto":true,"warnings":[],"ytTitle":"How to Foam Roll: Latissimus Dorsi","ytAuthor":"National Academy of Sports Medicine (NASM)","ytStatus":"OK","card":{"category":"Flexibility/SMR","phase":"Phase 1: Stabilization · Phase 2: Strength Endurance · Phase 3: Hypertrophy","primeMover":"Target Neuromuscular / Fascial System","kineticCheckpoints":{"feetAnkles":"Shoulder-width, firmly planted on ground.","knees":"Aligned with second and third toes.","lphc":"Neutral lumbar spine; core braced.","shoulders":"Retracted and depressed into athletic posture.","headNeck":"Neutral cervical spine, chin packed."},"clinicalCues":["Maintain neutral kinetic chain checkpoints throughout.","Control the 2-second eccentric lowering phase.","Exhale on exertion while maintaining intra-abdominal brace."],"howToSteps":["1. Lay down with the foam roller under your arm pit. Using your arms for support, increase the amount of pressure on the muscle until you feel a manageable level of tenderness.","2. Then, roll the length of the muscle to about mid rib area at about 1 inch per second looking for the most tender area.","3. Once you've found the most tender area, hold the position and pressure there for the recommended time. Maintain posture throughout.","4. Repeat on the other side. Avoid continuous movement, letting the head fall forward or holding your breath."]}},{"id":"a2d8fd35-68b8-428e-8207-493536fc3cd4","name":"Forward And Back Band Walking","slug":"forward-and-back-band-walking-0127","description":"Step 1: Setup Stand with feet shoulder-width apart, placing a resistance band around your thighs just above the knees.\n\nStep 2: Brace/Position Engage your core and maintain a slight bend in your knees, ensuring your hips are aligned with your feet.\n\nStep 3: Execute Step forward with your right foot, followed by your left, maintaining tension in the band; then step backward with your right foot, followed by your left.\n\nStep 4: Return/Repeat Continue alternating between forward and backward steps for the desired number of repetitions, keeping your movements controlled and steady.","coachingCues":[],"primaryEquipment":["Band or Tube"],"muscleGroups":["back"],"imageUrl":"https://img.youtube.com/vi/9aLcb5a7390/hqdefault.jpg","videoId":"9aLcb5a7390","videoUrl":"https://www.youtube.com/watch?v=9aLcb5a7390","videoThumbnailUrl":"https://img.youtube.com/vi/9aLcb5a7390/hqdefault.jpg","candidatePhotoUrl":"/images/exercises/forward-and-back-band-walking.jpg","hasCandidatePhoto":true,"warnings":[],"ytTitle":"How to do a Forward and Back Band Walking","ytAuthor":"National Academy of Sports Medicine (NASM)","ytStatus":"OK","card":{"category":"Back","phase":"Phase 1: Stabilization · Phase 2: Strength Endurance · Phase 3: Hypertrophy","primeMover":"Latissimus Dorsi, Rhomboids & Middle Trapezius","kineticCheckpoints":{"feetAnkles":"Shoulder-width, firmly planted on ground.","knees":"Aligned with second and third toes.","lphc":"Neutral lumbar spine; core braced.","shoulders":"Retracted and depressed into athletic posture.","headNeck":"Neutral cervical spine, chin packed."},"clinicalCues":["Maintain neutral kinetic chain checkpoints throughout.","Control the 2-second eccentric lowering phase.","Exhale on exertion while maintaining intra-abdominal brace."],"howToSteps":["1. Setup Stand with feet shoulder-width apart, placing a resistance band around your thighs just above the knees.","2. Brace/Position Engage your core and maintain a slight bend in your knees, ensuring your hips are aligned with your feet.","3. Execute Step forward with your right foot, followed by your left, maintaining tension in the band; then step backward with your right foot, followed by your left.","4. Return/Repeat Continue alternating between forward and backward steps for the desired number of repetitions, keeping your movements controlled and steady."]}},{"id":"9eab002e-2d6e-4630-a80b-bf45e68fa884","name":"Frontal Box Jump Down To Tuck Jump","slug":"frontal-box-jump-down-to-tuck-jump-0168","description":"Step 1: Stand on top of the box with your feet shoulder-width apart and your knees slightly bent.\n\nStep 2: Jump off the box, landing softly on the ground with your feet together and knees bent to absorb the impact.\n\nStep 3: Immediately transition into a tuck jump by driving your knees towards your chest as you jump upward.\n\nStep 4: Land softly with your feet shoulder-width apart and prepare for the next repetition.","coachingCues":[],"primaryEquipment":["Box or Step"],"muscleGroups":["calves","glutes","hamstrings","quadriceps"],"imageUrl":"https://img.youtube.com/vi/NX-sjAtZco0/hqdefault.jpg","videoId":"NX-sjAtZco0","videoUrl":"https://www.youtube.com/watch?v=NX-sjAtZco0","videoThumbnailUrl":"https://img.youtube.com/vi/NX-sjAtZco0/hqdefault.jpg","candidatePhotoUrl":"/images/exercises/frontal-box-jump-down-to-tuck-jump.jpg","hasCandidatePhoto":true,"warnings":[],"ytTitle":"How to do a Frontal Box Jump-Down to Tuck Jump","ytAuthor":"National Academy of Sports Medicine (NASM)","ytStatus":"OK","card":{"category":"Plyometrics","phase":"Phase 5 (Power) or Phase 1 (Stabilization hold)","primeMover":"Quadriceps, Gluteus Maximus & Gastrocnemius / Soleus (Explosive Triple Extension)","kineticCheckpoints":{"feetAnkles":"Shoulder-width takeoff; land softly with entire foot (heels and forefeet) on box.","knees":"Drive knees straight forward over toes; strictly avoid knee valgus (caving inward) on landing.","lphc":"Absorb landing force in a quarter-to-half squat with neutral spine and chest proud.","shoulders":"Arms swing aggressively upward to generate vertical momentum.","headNeck":"Gaze focused on landing zone on top of box, chin neutral."},"clinicalCues":["Land as softly and quietly as possible to absorb impact through muscles rather than joints.","Always step down one foot at a time; never jump backward down from the box.","Ensure knees track directly in line with middle toes upon landing without caving inward (valgus)."],"howToSteps":["1. Stand on top of the box with your feet shoulder-width apart and your knees slightly bent.","2. Jump off the box, landing softly on the ground with your feet together and knees bent to absorb the impact.","3. Immediately transition into a tuck jump by driving your knees towards your chest as you jump upward.","4. Land softly with your feet shoulder-width apart and prepare for the next repetition."]}},{"id":"1c3bad06-74ec-4d8c-b65a-83930f7b1d4e","name":"Goblet Squat","slug":"goblet-squat","description":"Step 1: Stand in athletic posture with feet hip to shoulder width apart and toes forward. Draw in and brace the abs. Pull the shoulder blades back and down and lock the elbows into the side of the body.\n\nStep 2: Drive the hips back and squat down to a maximum depth that posture and alignment can be maintained (typically between 90˚ at the knee and thigh parallel to the floor). Keep the weight balanced from heel to ball of foot.\n\nStep 3: Reverse the pattern and return to the starting position. Maintain posture throughout.\n\nStep 4: Repeat for the desired number of repetitions. Avoid slouching the back or shoulders, letting the elbows flare out, knees caving in or toes turning out.","coachingCues":[],"primaryEquipment":["Kettlebell"],"muscleGroups":["glutes","hamstrings","quadriceps"],"imageUrl":"https://img.youtube.com/vi/nfX7IFK9UNI/hqdefault.jpg","videoId":"nfX7IFK9UNI","videoUrl":"https://www.youtube.com/watch?v=nfX7IFK9UNI","videoThumbnailUrl":"https://img.youtube.com/vi/nfX7IFK9UNI/hqdefault.jpg","candidatePhotoUrl":"/images/exercises/goblet-squat.jpg","hasCandidatePhoto":true,"warnings":[],"ytTitle":"How to do a Goblet Squat  | Proper Form & Technique | NASM","ytAuthor":"National Academy of Sports Medicine (NASM)","ytStatus":"OK","card":{"category":"Legs","phase":"Phase 1 (Stabilization Endurance), Phase 2 (Strength Endurance)","primeMover":"Quadriceps & Gluteus Maximus","kineticCheckpoints":{"feetAnkles":"Shoulder-width apart, toes pointing straight or angled 5°–10°.","knees":"Pushed out tracking over second/third toes.","lphc":"Upright torso; anterior counterbalance prevents excessive forward lean.","shoulders":"Dumbbell/Kettlebell held vertically against sternum with elbows tucked in.","headNeck":"Eyes level, neutral spine."},"clinicalCues":["Keep weight glued to sternum throughout the entire descent.","Use elbows as a tactile guide inside thighs to open hip adductors.","Maintain vertical spine with active abdominal bracing."],"howToSteps":["1. Stand in athletic posture with feet hip to shoulder width apart and toes forward. Draw in and brace the abs. Pull the shoulder blades back and down and lock the elbows into the side of the body.","2. Drive the hips back and squat down to a maximum depth that posture and alignment can be maintained (typically between 90˚ at the knee and thigh parallel to the floor). Keep the weight balanced from heel to ball of foot.","3. Reverse the pattern and return to the starting position. Maintain posture throughout.","4. Repeat for the desired number of repetitions. Avoid slouching the back or shoulders, letting the elbows flare out, knees caving in or toes turning out."]}},{"id":"883f8a42-af07-4ee9-9ee0-31049afbd88c","name":"Good Mornings","slug":"good-mornings","description":"Step 1: Set the barbell on your upper back, just below the neck, and stand with your feet shoulder-width apart.\n\nStep 2: Engage your core and slightly bend your knees while keeping your back straight.\n\nStep 3: Hinge at the hips to lower your torso forward until it's nearly parallel to the ground, maintaining a neutral spine.\n\nStep 4: Drive through your heels to return to the starting position, fully extending your hips at the top.","coachingCues":[],"primaryEquipment":["Barbell"],"muscleGroups":["glutes","hamstrings"],"imageUrl":"https://img.youtube.com/vi/Daq-wJMUnes/hqdefault.jpg","videoId":"Daq-wJMUnes","videoUrl":"https://www.youtube.com/watch?v=Daq-wJMUnes","videoThumbnailUrl":"https://img.youtube.com/vi/Daq-wJMUnes/hqdefault.jpg","candidatePhotoUrl":"/images/exercises/good-mornings.jpg","hasCandidatePhoto":true,"warnings":[],"ytTitle":"How to Do the Good Mornings","ytAuthor":"National Academy of Sports Medicine (NASM)","ytStatus":"OK","card":{"category":"Legs","phase":"Phase 1: Stabilization · Phase 2: Strength Endurance · Phase 3: Hypertrophy","primeMover":"Quadriceps & Gluteus Maximus","kineticCheckpoints":{"feetAnkles":"Shoulder-width, firmly planted on ground.","knees":"Aligned with second and third toes.","lphc":"Neutral lumbar spine; core braced.","shoulders":"Retracted and depressed into athletic posture.","headNeck":"Neutral cervical spine, chin packed."},"clinicalCues":["Maintain neutral kinetic chain checkpoints throughout.","Control the 2-second eccentric lowering phase.","Exhale on exertion while maintaining intra-abdominal brace."],"howToSteps":["1. Set the barbell on your upper back, just below the neck, and stand with your feet shoulder-width apart.","2. Engage your core and slightly bend your knees while keeping your back straight.","3. Hinge at the hips to lower your torso forward until it's nearly parallel to the ground, maintaining a neutral spine.","4. Drive through your heels to return to the starting position, fully extending your hips at the top."]}},{"id":"b72bb8fe-4b44-4805-9203-d05322b8a056","name":"Half Get Up With Kettlebell","slug":"half-get-up-with-kettlebell-0139","description":"Step 1: Setup Lie on your back with a kettlebell in your right hand, arm extended straight above you, and your right knee bent at 90 degrees with your foot flat on the floor.\n\nStep 2: Brace/Position Engage your core and press your left hand into the floor at a 45-degree angle from your body, keeping your left leg extended straight.\n\nStep 3: Execute Push through your right foot and left hand to lift your torso off the ground, rotating your body towards your left while keeping the kettlebell overhead.\n\nStep 4: Return/Repeat Lower your torso back to the ground in a controlled manner, returning to the starting position, and repeat for the desired number of repetitions before switching sides.","coachingCues":[],"primaryEquipment":["Kettlebell"],"muscleGroups":["glutes","hamstrings","quadriceps"],"imageUrl":"https://img.youtube.com/vi/WradwGWo554/hqdefault.jpg","videoId":"WradwGWo554","videoUrl":"https://www.youtube.com/watch?v=WradwGWo554","videoThumbnailUrl":"https://img.youtube.com/vi/WradwGWo554/hqdefault.jpg","candidatePhotoUrl":"/images/exercises/half-get-up-with-kettlebell.jpg","hasCandidatePhoto":true,"warnings":[],"ytTitle":"How to do a Half Get-Up with Kettlebell","ytAuthor":"National Academy of Sports Medicine (NASM)","ytStatus":"OK","card":{"category":"Legs","phase":"Phase 1: Stabilization · Phase 2: Strength Endurance · Phase 3: Hypertrophy","primeMover":"Quadriceps & Gluteus Maximus","kineticCheckpoints":{"feetAnkles":"Shoulder-width, firmly planted on ground.","knees":"Aligned with second and third toes.","lphc":"Neutral lumbar spine; core braced.","shoulders":"Retracted and depressed into athletic posture.","headNeck":"Neutral cervical spine, chin packed."},"clinicalCues":["Maintain neutral kinetic chain checkpoints throughout.","Control the 2-second eccentric lowering phase.","Exhale on exertion while maintaining intra-abdominal brace."],"howToSteps":["1. Setup Lie on your back with a kettlebell in your right hand, arm extended straight above you, and your right knee bent at 90 degrees with your foot flat on the floor.","2. Brace/Position Engage your core and press your left hand into the floor at a 45-degree angle from your body, keeping your left leg extended straight.","3. Execute Push through your right foot and left hand to lift your torso off the ground, rotating your body towards your left while keeping the kettlebell overhead.","4. Return/Repeat Lower your torso back to the ground in a controlled manner, returning to the starting position, and repeat for the desired number of repetitions before switching sides."]}},{"id":"608b30ce-2965-4150-90e0-103d7c0e0e28","name":"Half Kneeling Throw And Catch","slug":"half-kneeling-throw-and-catch-0077","description":"Step 1: Setup Begin in a half-kneeling position with your right knee on the ground and your left foot flat on the floor, ensuring your left knee is at a 90-degree angle.\n\nStep 2: Brace/Position Hold a medicine ball or weighted object with both hands at chest level, engaging your core and maintaining an upright posture.\n\nStep 3: Execute Rotate your torso to the left, then explosively throw the ball to a partner or against a wall, using your core and upper body to generate power.\n\nStep 4: Return/Repeat Catch the ball as it returns, then rotate back to the starting position, maintaining control and stability before repeating the throw.","coachingCues":[],"primaryEquipment":[],"muscleGroups":["back"],"imageUrl":"https://img.youtube.com/vi/WX6YNwM5ycU/hqdefault.jpg","videoId":"WX6YNwM5ycU","videoUrl":"https://www.youtube.com/watch?v=WX6YNwM5ycU","videoThumbnailUrl":"https://img.youtube.com/vi/WX6YNwM5ycU/hqdefault.jpg","candidatePhotoUrl":"/images/exercises/half-kneeling-throw-and-catch.jpg","hasCandidatePhoto":true,"warnings":[],"ytTitle":"How to do a Half-Kneeling Throw and Catch","ytAuthor":"National Academy of Sports Medicine (NASM)","ytStatus":"OK","card":{"category":"Plyometrics","phase":"Phase 1: Stabilization · Phase 2: Strength Endurance · Phase 3: Hypertrophy","primeMover":"Quadriceps, Gluteus Maximus & Gastrocnemius (Triple Extension)","kineticCheckpoints":{"feetAnkles":"Shoulder-width, firmly planted on ground.","knees":"Aligned with second and third toes.","lphc":"Neutral lumbar spine; core braced.","shoulders":"Retracted and depressed into athletic posture.","headNeck":"Neutral cervical spine, chin packed."},"clinicalCues":["Maintain neutral kinetic chain checkpoints throughout.","Control the 2-second eccentric lowering phase.","Exhale on exertion while maintaining intra-abdominal brace."],"howToSteps":["1. Setup Begin in a half-kneeling position with your right knee on the ground and your left foot flat on the floor, ensuring your left knee is at a 90-degree angle.","2. Brace/Position Hold a medicine ball or weighted object with both hands at chest level, engaging your core and maintaining an upright posture.","3. Execute Rotate your torso to the left, then explosively throw the ball to a partner or against a wall, using your core and upper body to generate power.","4. Return/Repeat Catch the ball as it returns, then rotate back to the starting position, maintaining control and stability before repeating the throw."]}},{"id":"89d65a69-d8c5-41a7-a0ae-574f3edc3b98","name":"Half Kneeling Tubing Rotation","slug":"half-kneeling-tubing-rotation-0079","description":"Step 1: Setup Position your right knee on the ground with your left foot flat on the floor in front of you, securing one end of the resistance tubing to a stable anchor at waist height on your right side.\n\nStep 2: Brace/Position Engage your core and maintain a neutral spine while holding the other end of the tubing with both hands, arms extended in front of you at chest height.\n\nStep 3: Execute Rotate your torso to the left, pulling the tubing across your body while keeping your hips stable and your knees aligned.\n\nStep 4: Return/Repeat Slowly return to the starting position, then repeat for the desired number of repetitions before switching sides.","coachingCues":[],"primaryEquipment":[],"muscleGroups":["back"],"imageUrl":"https://img.youtube.com/vi/CnF9Bf2pm4s/hqdefault.jpg","videoId":"CnF9Bf2pm4s","videoUrl":"https://www.youtube.com/watch?v=CnF9Bf2pm4s","videoThumbnailUrl":"https://img.youtube.com/vi/CnF9Bf2pm4s/hqdefault.jpg","candidatePhotoUrl":"/images/exercises/half-kneeling-tubing-rotation.jpg","hasCandidatePhoto":true,"warnings":[],"ytTitle":"How to do a Half-Kneeling Tubing Rotation","ytAuthor":"National Academy of Sports Medicine (NASM)","ytStatus":"OK","card":{"category":"Back","phase":"Phase 1: Stabilization · Phase 2: Strength Endurance · Phase 3: Hypertrophy","primeMover":"Latissimus Dorsi, Rhomboids & Middle Trapezius","kineticCheckpoints":{"feetAnkles":"Shoulder-width, firmly planted on ground.","knees":"Aligned with second and third toes.","lphc":"Neutral lumbar spine; core braced.","shoulders":"Retracted and depressed into athletic posture.","headNeck":"Neutral cervical spine, chin packed."},"clinicalCues":["Maintain neutral kinetic chain checkpoints throughout.","Control the 2-second eccentric lowering phase.","Exhale on exertion while maintaining intra-abdominal brace."],"howToSteps":["1. Setup Position your right knee on the ground with your left foot flat on the floor in front of you, securing one end of the resistance tubing to a stable anchor at waist height on your right side.","2. Brace/Position Engage your core and maintain a neutral spine while holding the other end of the tubing with both hands, arms extended in front of you at chest height.","3. Execute Rotate your torso to the left, pulling the tubing across your body while keeping your hips stable and your knees aligned.","4. Return/Repeat Slowly return to the starting position, then repeat for the desired number of repetitions before switching sides."]}},{"id":"e9813f4d-0ae5-4340-90db-6cd04f2adca8","name":"Hammer Curl To Lateral Raise","slug":"hammer-curl-to-lateral-raise-0099","description":"Step 1: Setup Stand with feet shoulder-width apart, holding a dumbbell in each hand with palms facing your body and arms fully extended at your sides.\n\nStep 2: Brace/Position Engage your core and maintain a slight bend in your knees, keeping your elbows close to your torso.\n\nStep 3: Execute Curl the dumbbells up towards your shoulders while keeping your palms facing each other, then rotate your arms to lift the weights laterally to shoulder height.\n\nStep 4: Return/Repeat Lower the dumbbells back to the starting position in a controlled manner, then repeat the movement for the desired number of repetitions.","coachingCues":[],"primaryEquipment":[],"muscleGroups":["biceps","shoulders"],"imageUrl":"https://img.youtube.com/vi/4P6tmzTV01A/hqdefault.jpg","videoId":"4P6tmzTV01A","videoUrl":"https://www.youtube.com/watch?v=4P6tmzTV01A","videoThumbnailUrl":"https://img.youtube.com/vi/4P6tmzTV01A/hqdefault.jpg","candidatePhotoUrl":"/images/exercises/hammer-curl-to-lateral-raise.jpg","hasCandidatePhoto":true,"warnings":[],"ytTitle":"How to do a Hammer Curl to Lateral Raise","ytAuthor":"National Academy of Sports Medicine (NASM)","ytStatus":"OK","card":{"category":"Arms","phase":"Phase 1 (Stabilization Endurance), Phase 2 (Strength Endurance), Phase 3 (Hypertrophy)","primeMover":"Brachioradialis & Brachialis","kineticCheckpoints":{"feetAnkles":"Hip-width apart, straight and parallel, weight evenly distributed through tripod foot (heels and midfoot).","knees":"Soft athletic micro-bend (never hyperextended or locked), aligned over second and third toes.","lphc":"Neutral pelvis and lumbar lordosis; core braced to prevent sagittal trunk sway, swinging, or lumbar hyperextension.","shoulders":"Scapulae retracted and depressed; elbows pinned firmly against lateral ribcage as stationary hinges; strict neutral grip (palms facing inward toward each other, thumbs pointing straight up toward ceiling, dumbbell heads vertical, strictly zero supination or twisting).","headNeck":"Neutral cervical spine, chin packed/tucked, gaze directed straight ahead."},"clinicalCues":["Maintain strict neutral grip with palms facing inward and thumbs pointing up—strictly zero wrist twisting or supination.","Dumbbell orientation must remain strictly vertical (top head pointing at ceiling, bottom head at floor).","Lock elbows against lateral ribcage as fixed hinges; avoid elbow flare or anterior drift into shoulder flexion.","Brace core and engage glutes to eliminate backward torso sway or momentum."],"howToSteps":["1. Setup Stand with feet shoulder-width apart, holding a dumbbell in each hand with palms facing your body and arms fully extended at your sides.","2. Brace/Position Engage your core and maintain a slight bend in your knees, keeping your elbows close to your torso.","3. Execute Curl the dumbbells up towards your shoulders while keeping your palms facing each other, then rotate your arms to lift the weights laterally to shoulder height.","4. Return/Repeat Lower the dumbbells back to the starting position in a controlled manner, then repeat the movement for the desired number of repetitions."]}},{"id":"03622b11-e63d-4ef7-b936-5ef4245f6763","name":"Hand To Hand Kettlebell Swing","slug":"hand-to-hand-kettlebell-swing-0140","description":"Step 1: Setup Stand with feet shoulder-width apart, holding a kettlebell in one hand with a neutral grip, arms extended in front of you.\n\nStep 2: Brace/Position Engage your core, hinge at the hips, and slightly bend your knees while allowing the kettlebell to swing back between your legs.\n\nStep 3: Execute Drive through your hips to propel the kettlebell forward, swinging it to shoulder height while switching hands at the top of the movement.\n\nStep 4: Return/Repeat Allow the kettlebell to swing back down between your legs, switch hands again, and repeat the movement for the desired number of repetitions.","coachingCues":[],"primaryEquipment":["Kettlebell"],"muscleGroups":["back","glutes","hamstrings","quadriceps","shoulders"],"imageUrl":"https://img.youtube.com/vi/KKumMhxKapw/hqdefault.jpg","videoId":"KKumMhxKapw","videoUrl":"https://www.youtube.com/watch?v=KKumMhxKapw","videoThumbnailUrl":"https://img.youtube.com/vi/KKumMhxKapw/hqdefault.jpg","candidatePhotoUrl":"/images/exercises/hand-to-hand-kettlebell-swing.jpg","hasCandidatePhoto":true,"warnings":[],"ytTitle":"How to do a Hand-to-Hand Kettlebell Swing","ytAuthor":"National Academy of Sports Medicine (NASM)","ytStatus":"OK","card":{"category":"Back","phase":"Phase 1: Stabilization · Phase 2: Strength Endurance · Phase 3: Hypertrophy","primeMover":"Latissimus Dorsi, Rhomboids & Middle Trapezius","kineticCheckpoints":{"feetAnkles":"Shoulder-width, firmly planted on ground.","knees":"Aligned with second and third toes.","lphc":"Neutral lumbar spine; core braced.","shoulders":"Retracted and depressed into athletic posture.","headNeck":"Neutral cervical spine, chin packed."},"clinicalCues":["Maintain neutral kinetic chain checkpoints throughout.","Control the 2-second eccentric lowering phase.","Exhale on exertion while maintaining intra-abdominal brace."],"howToSteps":["1. Setup Stand with feet shoulder-width apart, holding a kettlebell in one hand with a neutral grip, arms extended in front of you.","2. Brace/Position Engage your core, hinge at the hips, and slightly bend your knees while allowing the kettlebell to swing back between your legs.","3. Execute Drive through your hips to propel the kettlebell forward, swinging it to shoulder height while switching hands at the top of the movement.","4. Return/Repeat Allow the kettlebell to swing back down between your legs, switch hands again, and repeat the movement for the desired number of repetitions."]}},{"id":"775c55b1-c479-46bf-b1cf-f965b20796b5","name":"How To Foam Roll Adductors","slug":"how-to-foam-roll-adductors-0224","description":"Step 1: Setup Sit on the floor with your legs extended in front of you, placing a foam roller horizontally under your inner thighs.\n\nStep 2: Brace/Position Lean back slightly on your hands for support, keeping your elbows slightly bent and your core engaged.\n\nStep 3: Execute Slowly roll the foam roller from your groin down to your knees, applying pressure to the adductor muscles, and pause on any tight spots for 15-30 seconds.\n\nStep 4: Return/Repeat Reverse the movement, rolling back up to the groin, and repeat the process for 2-3 sets on each leg.","coachingCues":[],"primaryEquipment":["Foam Roller"],"muscleGroups":["glutes","hamstrings","quadriceps"],"imageUrl":"https://img.youtube.com/vi/Nqol0T6rKDg/hqdefault.jpg","videoId":"Nqol0T6rKDg","videoUrl":"https://www.youtube.com/watch?v=Nqol0T6rKDg","videoThumbnailUrl":"https://img.youtube.com/vi/Nqol0T6rKDg/hqdefault.jpg","candidatePhotoUrl":"/images/exercises/foam-roll-adductors.jpg","hasCandidatePhoto":true,"warnings":[],"ytTitle":"How to Foam Roll: Adductors","ytAuthor":"National Academy of Sports Medicine (NASM)","ytStatus":"OK","card":{"category":"Flexibility/SMR","phase":"Phase 1: Stabilization · Phase 2: Strength Endurance · Phase 3: Hypertrophy","primeMover":"Target Neuromuscular / Fascial System","kineticCheckpoints":{"feetAnkles":"Shoulder-width, firmly planted on ground.","knees":"Aligned with second and third toes.","lphc":"Neutral lumbar spine; core braced.","shoulders":"Retracted and depressed into athletic posture.","headNeck":"Neutral cervical spine, chin packed."},"clinicalCues":["Maintain neutral kinetic chain checkpoints throughout.","Control the 2-second eccentric lowering phase.","Exhale on exertion while maintaining intra-abdominal brace."],"howToSteps":["1. Setup Sit on the floor with your legs extended in front of you, placing a foam roller horizontally under your inner thighs.","2. Brace/Position Lean back slightly on your hands for support, keeping your elbows slightly bent and your core engaged.","3. Execute Slowly roll the foam roller from your groin down to your knees, applying pressure to the adductor muscles, and pause on any tight spots for 15-30 seconds.","4. Return/Repeat Reverse the movement, rolling back up to the groin, and repeat the process for 2-3 sets on each leg."]}},{"id":"407941bf-8ee5-471b-8f5b-2b9b3075365e","name":"Ice Skater With Stabilization","slug":"ice-skater-with-stabilization-0128","description":"Step 1: Setup Stand on your right leg with your left leg slightly behind you, arms at your sides, and your core engaged.\n\nStep 2: Brace/Position Shift your weight onto your right leg, bending your knee slightly while keeping your torso upright and your hips level.\n\nStep 3: Execute Jump laterally to your left, landing softly on your left leg while extending your right leg behind you and swinging your arms for balance.\n\nStep 4: Return/Repeat Stabilize on your left leg for a moment, then jump back to the right leg, continuing to alternate sides for the desired repetitions.","coachingCues":[],"primaryEquipment":[],"muscleGroups":["core","glutes"],"imageUrl":"https://img.youtube.com/vi/ViVoHbYwT-Y/hqdefault.jpg","videoId":"ViVoHbYwT-Y","videoUrl":"https://www.youtube.com/watch?v=ViVoHbYwT-Y","videoThumbnailUrl":"https://img.youtube.com/vi/ViVoHbYwT-Y/hqdefault.jpg","candidatePhotoUrl":"/images/exercises/ice-skater-with-stabilization.jpg","hasCandidatePhoto":true,"warnings":[],"ytTitle":"How to do a Ice Skater with Stabilization","ytAuthor":"National Academy of Sports Medicine (NASM)","ytStatus":"OK","card":{"category":"Core","phase":"Phase 1: Stabilization · Phase 2: Strength Endurance · Phase 3: Hypertrophy","primeMover":"Transverse Abdominis & Deep Core Stabilizers","kineticCheckpoints":{"feetAnkles":"Shoulder-width, firmly planted on ground.","knees":"Aligned with second and third toes.","lphc":"Neutral lumbar spine; core braced.","shoulders":"Retracted and depressed into athletic posture.","headNeck":"Neutral cervical spine, chin packed."},"clinicalCues":["Maintain neutral kinetic chain checkpoints throughout.","Control the 2-second eccentric lowering phase.","Exhale on exertion while maintaining intra-abdominal brace."],"howToSteps":["1. Setup Stand on your right leg with your left leg slightly behind you, arms at your sides, and your core engaged.","2. Brace/Position Shift your weight onto your right leg, bending your knee slightly while keeping your torso upright and your hips level.","3. Execute Jump laterally to your left, landing softly on your left leg while extending your right leg behind you and swinging your arms for balance.","4. Return/Repeat Stabilize on your left leg for a moment, then jump back to the right leg, continuing to alternate sides for the desired repetitions."]}},{"id":"9fe59f5e-e3ee-4140-878b-f389e0beb46e","name":"In In Out Out Crossover Ladder Drill","slug":"in-in-out-out-crossover-ladder-drill-0154","description":"Step 1: Setup Stand with your feet shoulder-width apart at one end of the agility ladder, facing forward.\n\nStep 2: Brace/Position Engage your core and slightly bend your knees, preparing to move quickly through the ladder.\n\nStep 3: Execute Step into the first square with your right foot, then your left foot, followed by stepping out to the right side with your right foot and then your left foot, continuing this pattern down the ladder.\n\nStep 4: Return/Repeat Once you reach the end, turn around and repeat the drill, focusing on speed and precision with each step.","coachingCues":[],"primaryEquipment":[],"muscleGroups":["full body"],"imageUrl":"https://img.youtube.com/vi/HibORUkPckg/hqdefault.jpg","videoId":"HibORUkPckg","videoUrl":"https://www.youtube.com/watch?v=HibORUkPckg","videoThumbnailUrl":"https://img.youtube.com/vi/HibORUkPckg/hqdefault.jpg","candidatePhotoUrl":"/images/exercises/in-in-out-out-crossover-ladder-drill.jpg","hasCandidatePhoto":true,"warnings":[],"ytTitle":"How to do an In-In-Out-Out-Crossover (Ladder Drill)","ytAuthor":"National Academy of Sports Medicine (NASM)","ytStatus":"OK","card":{"category":"Core","phase":"Phase 1: Stabilization · Phase 2: Strength Endurance · Phase 3: Hypertrophy","primeMover":"Core Musculature","kineticCheckpoints":{"feetAnkles":"Shoulder-width, firmly planted on ground.","knees":"Aligned with second and third toes.","lphc":"Neutral lumbar spine; core braced.","shoulders":"Retracted and depressed into athletic posture.","headNeck":"Neutral cervical spine, chin packed."},"clinicalCues":["Maintain neutral kinetic chain checkpoints throughout.","Control the 2-second eccentric lowering phase.","Exhale on exertion while maintaining intra-abdominal brace."],"howToSteps":["1. Setup Stand with your feet shoulder-width apart at one end of the agility ladder, facing forward.","2. Brace/Position Engage your core and slightly bend your knees, preparing to move quickly through the ladder.","3. Execute Step into the first square with your right foot, then your left foot, followed by stepping out to the right side with your right foot and then your left foot, continuing this pattern down the ladder.","4. Return/Repeat Once you reach the end, turn around and repeat the drill, focusing on speed and precision with each step."]}},{"id":"f22b416a-ddd4-4eff-94ba-9ff1e2585464","name":"In In Out Out Ladder Drill","slug":"in-in-out-out-ladder-drill-0153","description":"Step 1: Setup Stand facing the agility ladder with your feet shoulder-width apart, ensuring the ladder is flat on the ground.\n\nStep 2: Brace/Position Begin with your knees slightly bent and your core engaged, ready to move quickly.\n\nStep 3: Execute Step into the first square of the ladder with your right foot, followed by your left foot, then step out to the right side, and back in, alternating feet as you progress through the ladder.\n\nStep 4: Return/Repeat Once you reach the end of the ladder, turn around and repeat the drill, maintaining a quick pace and proper foot placement.","coachingCues":[],"primaryEquipment":[],"muscleGroups":["back"],"imageUrl":"https://img.youtube.com/vi/SybJ4cCnR64/hqdefault.jpg","videoId":"SybJ4cCnR64","videoUrl":"https://www.youtube.com/watch?v=SybJ4cCnR64","videoThumbnailUrl":"https://img.youtube.com/vi/SybJ4cCnR64/hqdefault.jpg","candidatePhotoUrl":"/images/exercises/in-in-out-out-ladder-drill.jpg","hasCandidatePhoto":true,"warnings":[],"ytTitle":"How to do an In-In-Out-Out (Ladder Drill)","ytAuthor":"National Academy of Sports Medicine (NASM)","ytStatus":"OK","card":{"category":"Back","phase":"Phase 1: Stabilization · Phase 2: Strength Endurance · Phase 3: Hypertrophy","primeMover":"Latissimus Dorsi, Rhomboids & Middle Trapezius","kineticCheckpoints":{"feetAnkles":"Shoulder-width, firmly planted on ground.","knees":"Aligned with second and third toes.","lphc":"Neutral lumbar spine; core braced.","shoulders":"Retracted and depressed into athletic posture.","headNeck":"Neutral cervical spine, chin packed."},"clinicalCues":["Maintain neutral kinetic chain checkpoints throughout.","Control the 2-second eccentric lowering phase.","Exhale on exertion while maintaining intra-abdominal brace."],"howToSteps":["1. Setup Stand facing the agility ladder with your feet shoulder-width apart, ensuring the ladder is flat on the ground.","2. Brace/Position Begin with your knees slightly bent and your core engaged, ready to move quickly.","3. Execute Step into the first square of the ladder with your right foot, followed by your left foot, then step out to the right side, and back in, alternating feet as you progress through the ladder.","4. Return/Repeat Once you reach the end of the ladder, turn around and repeat the drill, maintaining a quick pace and proper foot placement."]}},{"id":"a5e198f2-6604-407d-85f1-d99fb5fc4a4b","name":"Incline Barbell Bench Press","slug":"incline-barbell-bench-press","description":"Step 1: Lie supine on your back with neutral spine on an incline bench with your feet straight and flat on the floor. Draw in and brace the abs and lock the shoulders blades back and down on the bench. Grasp the barbell at about 1.5 - 2x shoulder width ensuring the hands are evenly distributed on the bar.\n\nStep 2: Unrack the bar (always use a spotter if you are able) bringing it directly above the shoulders.\n\nStep 3: Starting with arms extended, slowly lower the bar toward the chest moving through the maximum comfortable range.\n\nStep 4: Reverse the pattern and return the starting position. Repeat. Maintain posture throughout. Do not arch the back or jut the head forward. Avoid letting the shoulders round, posture shift or feet lift in the air. Keep the elbows under the bar to maintain balance at all times.","coachingCues":[],"primaryEquipment":["Bench","Barbell","Plates","Safety Collars"],"muscleGroups":["chest","triceps"],"imageUrl":"https://img.youtube.com/vi/BjGLs6KGWUc/hqdefault.jpg","videoId":"BjGLs6KGWUc","videoUrl":"https://www.youtube.com/watch?v=BjGLs6KGWUc","videoThumbnailUrl":"https://img.youtube.com/vi/BjGLs6KGWUc/hqdefault.jpg","candidatePhotoUrl":"/images/exercises/incline-barbell-bench-press.jpg","hasCandidatePhoto":true,"warnings":[],"ytTitle":"How to do a Incline Barbell Bench Press  | Proper Form & Technique | NASM","ytAuthor":"National Academy of Sports Medicine (NASM)","ytStatus":"OK","card":{"category":"Chest","phase":"Phase 2 (Strength Endurance), Phase 3 (Hypertrophy), Phase 4 (Max Strength)","primeMover":"Pectoralis Major (Sternal & Clavicular Heads)","kineticCheckpoints":{"feetAnkles":"Flat on floor, hip-width apart, driving down into the ground.","knees":"Flexed at 90°, aligned with second and third toes.","lphc":"Neutral pelvis with natural lumbar arch; glutes stay firmly on pad.","shoulders":"Retracted and depressed (pinched back and down) into the bench.","headNeck":"Neutral cervical spine resting flat on the bench pad; eyes under bar."},"clinicalCues":["Pin shoulder blades into back pockets throughout the entire lift.","Maintain 45° elbow flare to prevent subacromial shoulder impingement.","Drive heels into floor to create total-body kinetic chain tension."],"howToSteps":["1. Lie supine on your back with neutral spine on an incline bench with your feet straight and flat on the floor. Draw in and brace the abs and lock the shoulders blades back and down on the bench. Grasp the barbell at about 1.5 - 2x shoulder width ensuring the hands are evenly distributed on the bar.","2. Unrack the bar (always use a spotter if you are able) bringing it directly above the shoulders.","3. Starting with arms extended, slowly lower the bar toward the chest moving through the maximum comfortable range.","4. Reverse the pattern and return the starting position. Repeat. Maintain posture throughout. Do not arch the back or jut the head forward. Avoid letting the shoulders round, posture shift or feet lift in the air. Keep the elbows under the bar to maintain balance at all times."]}},{"id":"c71d5c4a-8151-4809-bb9e-13acb432ae62","name":"Incline Dumbbell Bench Press","slug":"incline-dumbbell-bench-press-0100","description":"Step 1: Setup Lie back on an incline bench set at a 30-45 degree angle, holding a dumbbell in each hand at shoulder level with palms facing forward.\n\nStep 2: Brace/Position Engage your core, keep your feet flat on the floor, and ensure your shoulder blades are retracted and pressed against the bench.\n\nStep 3: Execute Press the dumbbells upward until your arms are fully extended, maintaining a slight bend in your elbows at the top of the movement.\n\nStep 4: Return/Repeat Lower the dumbbells back to the starting position at shoulder level, controlling the movement and keeping your elbows at a 45-degree angle to your body.","coachingCues":[],"primaryEquipment":["Dumbbells","Bench"],"muscleGroups":["chest","triceps"],"imageUrl":"https://img.youtube.com/vi/_NrQUYg7Nlc/hqdefault.jpg","videoId":"_NrQUYg7Nlc","videoUrl":"https://www.youtube.com/watch?v=_NrQUYg7Nlc","videoThumbnailUrl":"https://img.youtube.com/vi/_NrQUYg7Nlc/hqdefault.jpg","candidatePhotoUrl":"/images/exercises/incline-dumbbell-bench-press.jpg","hasCandidatePhoto":true,"warnings":[],"ytTitle":"How to do a Incline Dumbbell Bench Press","ytAuthor":"National Academy of Sports Medicine (NASM)","ytStatus":"OK","card":{"category":"Chest","phase":"Phase 2 (Strength Endurance), Phase 3 (Hypertrophy)","primeMover":"Pectoralis Major (Clavicular Upper Head)","kineticCheckpoints":{"feetAnkles":"Firmly planted on floor, shoulder-width apart.","knees":"Stacked over ankles at 90° angle.","lphc":"Glutes and hips pressed firmly against seat and back rest.","shoulders":"Scapulae retracted and depressed into inclined pad.","headNeck":"Head resting gently on pad with neutral chin."},"clinicalCues":["Avoid setting bench angle above 45° to prevent shifting load to anterior deltoids.","Control the descent to avoid hyperextending anterior shoulder capsule.","Keep wrists straight and directly above elbows."],"howToSteps":["1. Setup Lie back on an incline bench set at a 30-45 degree angle, holding a dumbbell in each hand at shoulder level with palms facing forward.","2. Brace/Position Engage your core, keep your feet flat on the floor, and ensure your shoulder blades are retracted and pressed against the bench.","3. Execute Press the dumbbells upward until your arms are fully extended, maintaining a slight bend in your elbows at the top of the movement.","4. Return/Repeat Lower the dumbbells back to the starting position at shoulder level, controlling the movement and keeping your elbows at a 45-degree angle to your body."]}},{"id":"d790bfcb-2712-4a85-9fbb-32dde8b5a334","name":"Incline Dumbbell Curl","slug":"incline-dumbbell-curl-0101","description":"Step 1: Setup Sit on an incline bench with your back supported, holding a dumbbell in each hand at arm's length, palms facing forward.\n\nStep 2: Brace/Position Keep your elbows close to your torso and engage your core to maintain stability throughout the movement.\n\nStep 3: Execute Curl the dumbbells upward by flexing your elbows, bringing them towards your shoulders while keeping your upper arms stationary.\n\nStep 4: Return/Repeat Lower the dumbbells back to the starting position in a controlled manner, fully extending your arms before repeating the movement.","coachingCues":[],"primaryEquipment":["Dumbbells"],"muscleGroups":["biceps","chest","triceps"],"imageUrl":"https://img.youtube.com/vi/0dT4L6Lsi80/hqdefault.jpg","videoId":"0dT4L6Lsi80","videoUrl":"https://www.youtube.com/watch?v=0dT4L6Lsi80","videoThumbnailUrl":"https://img.youtube.com/vi/0dT4L6Lsi80/hqdefault.jpg","candidatePhotoUrl":"/images/exercises/incline-dumbbell-curl.jpg","hasCandidatePhoto":true,"warnings":[],"ytTitle":"How to do a Incline Dumbbell Curl","ytAuthor":"National Academy of Sports Medicine (NASM)","ytStatu rl":"https://img.youtube.com/vi/Gvm5Q29UHbk/hqdefault.jpg","videoId":"Gvm5Q29UHbk","videoUrl":"https://www.youtube.com/watch?v=Gvm5Q29UHbk","videoThumbnailUrl":"https://img.youtube.com/vi/Gvm5Q29UHbk/hqdefault.jpg","candidatePhotoUrl":"/images/exercises/incline-push-up.jpg","hasCandidatePhoto":true,"warnings":[],"ytTitle":"How to do an Incline Push-Up","ytAuthor":"National Academy of Sports Medicine (NASM)","ytStatus":"OK","card":{"category":"Chest","phase":"Phase 1 (Stabilization Endurance), Phase 2 (Strength Endurance)","primeMover":"Pectoralis Major","kineticCheckpoints":{"feetAnkles":"Together or hip-width apart, dorsiflexed on balls of feet.","knees":"Fully extended with active quadriceps contraction.","lphc":"Neutral pelvis; no sagging hips (anterior tilt) or pike (excessive flexion).","shoulders":"Hands placed slightly wider than shoulder-width, fingers pointing forward.","headNeck":"Neutral cervical spine, chin tucked, gaze looking 6 inches ahead."},"clinicalCues":["Engage glutes and brace core to maintain rigid plank posture.","Do not allow lower back to sag or head to jut forward toward the floor.","Push the ground away at the top of the rep to engage serratus anterior."],"howToSteps":["1. Setup Position your hands on an elevated surface, such as a bench or sturdy table, slightly wider than shoulder-width apart.","2. Brace/Position Engage your core and keep your body in a straight line from head to heels, with your feet together or slightly apart for stability.","3. Execute Lower your chest toward the elevated surface by bending your elbows, keeping them at a 45-degree angle to your body.","4. Return/Repeat Push through your palms to extend your elbows and return to the starting position, maintaining a straight body alignment throughout the movement."]}},{"id":"3a873b3d-89b9-4e23-b5cc-eb8668b0465a","name":"Incline Push Up With Rotation","slug":"incline-push-up-with-rotation-0197","description":"Step 1: Setup Position your hands on an elevated surface, such as a bench or step, slightly wider than shoulder-width apart.\n\nStep 2: Brace/Position Engage your core and maintain a straight line from your head to your heels, keeping your feet together or slightly apart for stability.\n\nStep 3: Execute Lower your chest towards the elevated surface by bending your elbows, then push back up while rotating your torso to one side, extending the opposite arm upwards.\n\nStep 4: Return/Repeat Lower back to the starting position and repeat the movement, alternating the rotation to the opposite side with each repetition.","coachingCues":[],"primaryEquipment":[],"muscleGroups":["chest","triceps"],"imageUrl":"https://img.youtube.com/vi/Yylb-sLWdm8/hqdefault.jpg","videoId":"Yylb-sLWdm8","videoUrl":"https://www.youtube.com/watch?v=Yylb-sLWdm8","videoThumbnailUrl":"https://img.youtube.com/vi/Yylb-sLWdm8/hqdefault.jpg","candidatePhotoUrl":"/images/exercises/incline-push-up-with-rotation.jpg","hasCandidatePhoto":true,"warnings":[],"ytTitle":"How to do an Incline Push-Up with Rotation","ytAuthor":"National Academy of Sports Medicine (NASM)","ytStatus":"OK","card":{"category":"Chest","phase":"Phase 1 (Stabilization Endurance), Phase 2 (Strength Endurance)","primeMover":"Pectoralis Major","kineticCheckpoints":{"feetAnkles":"Together or hip-width apart, dorsiflexed on balls of feet.","knees":"Fully extended with active quadriceps contraction.","lphc":"Neutral pelvis; no sagging hips (anterior tilt) or pike (excessive flexion).","shoulders":"Hands placed slightly wider than shoulder-width, fingers pointing forward.","headNeck":"Neutral cervical spine, chin tucked, gaze looking 6 inches ahead."},"clinicalCues":["Engage glutes and brace core to maintain rigid plank posture.","Do not allow lower back to sag or head to jut forward toward the floor.","Push the ground away at the top of the rep to engage serratus anterior."],"howToSteps":["1. Setup Position your hands on an elevated surface, such as a bench or step, slightly wider than shoulder-width  starting position in a controlled manner, fully extending your arms before repeating the movement.","coachingCues":[],"primaryEquipment":[],"muscleGroups":["back","biceps","chest","triceps"],"imageUrl":"https://img.youtube.com/vi/Od9m9NVkA8g/hqdefault.jpg","videoId":"Od9m9NVkA8g","videoUrl":"https://www.youtube.com/watch?v=Od9m9NVkA8g","videoThumbnailUrl":"https://img.youtube.com/vi/Od9m9NVkA8g/hqdefault.jpg","candidatePhotoUrl":"/images/exercises/incline-stance-row.jpg","hasCandidatePhoto":true,"warnings":[],"ytTitle":"How to do a Incline Stance Row","ytAuthor":"National Academy of Sports Medicine (NASM)","ytStatus":"OK","card":{"category":"Back","phase":"Phase 1: Stabilization · Phase 2: Strength Endurance · Phase 3: Hypertrophy","primeMover":"Latissimus Dorsi, Rhomboids & Middle Trapezius","kineticCheckpoints":{"feetAnkles":"Shoulder-width, firmly planted on ground.","knees":"Aligned with second and third toes.","lphc":"Neutral lumbar spine; core braced.","shoulders":"Retracted and depressed into athletic posture.","headNeck":"Neutral cervical spine, chin packed."},"clinicalCues":["Maintain neutral kinetic chain checkpoints throughout.","Control the 2-second eccentric lowering phase.","Exhale on exertion while maintaining intra-abdominal brace."],"howToSteps":["1. Setup Stand with your feet shoulder-width apart, holding a dumbbell in each hand, and hinge at your hips to lean forward while keeping your back straight.","2. Brace/Position Engage your core and maintain a neutral spine, allowing your arms to hang straight down from your shoulders, palms facing each other.","3. Execute Pull the dumbbells towards your lower ribcage, squeezing your shoulder blades together at the top of the movement while keeping your elbows close to your body.","4. Return/Repeat Lower the dumbbells back to the starting position in a controlled manner, fully extending your arms before repeating the movement."]}},{"id":"c147cca8-b0bd-4343-830a-e2f9a95a87e6","name":"Incline Stance Single rt, holding a dumbbell in one hand, and hinge at the hips to create a 45-degree incline with your torso.","2. Brace/Position Engage your core and maintain a neutral spine, allowing the opposite arm to rest on your thigh for support while the dumbbell hangs straight down.","3. Execute Pull the dumbbell towards your hip, keeping your elbow close to your body and squeezing your shoulder blade towards your spine at the top of the movement.","4. Return/Repeat Lower the dumbbell back to the starting position in a controlled manner, then repeat for the desired number of repetitions before switching arms."]}},{"id":"d9aa2845-fdfa-444c-8f9b-5a49fa9fd842","name":"Inverted Push Up","slug":"inverted-push-up-0198","description":"Step 1: Setup Position your feet on an elevated surface, such as a bench or box, and place your hands shoulder-width apart on the ground, ensuring your body forms a straight line from head to heels.\n\nStep 2: Brace/Position Engage your core and glutes, keeping your body rigid while lowering your chest towards the ground, maintaining a neutral spine throughout the movement.\n\nStep 3: Execute Press through your palms to lift your body back to the starting position, fully extending your arms while keeping your feet elevated.\n\nStep 4: Return/Repeat Lower your body again in a controlled manner, ensuring proper form is maintained, and repeat for the desired number of repetitions.","coachingCues":[],"primaryEquipment":[],"muscleGroups":["chest","shoulders","triceps"],"imageUrl":"https://img.youtube.com/vi/M0hMndCrkI4/hqdefault.jpg","videoId":"M0hMndCrkI4","videoUrl":"https://www.youtube.com/watch?v=M0hMndCrkI4","videoThumbnailUrl":"https://img.youtube.com/vi/M0hMndCrkI4/hqdefault.jpg","candidatePhotoUrl":"/images/exercises/inverted-push-up.jpg","hasCandidatePhoto":true,"warnings":[],"ytTitle":"How to do an Inverted Push-Up","ytAuthor":"National Academy of Sports Medicine (NASM)","ytStatus":"OK","card":{"category":"Chest","phase":"Phase 1 (Stabilization Endurance), Phase 2 (Strength Endurance)","primeMover":"Pectoralis Major","kineticCheckpoints":{"feetAnkles":"Together or hip-width apart, dorsiflexed on balls of feet.","knees":"Fully extended with active quadriceps contraction.","lphc":"Neutral pelvis; no sagging hips (anterior tilt) or pike (excessive flexion).","shoulders":"Hands placed slightly wider than shoulder-width, fingers pointing forward.","headNeck":"Neutral cervical spine, chin tucked, gaze looking 6 inches ahead."},"clinicalCues":["Engage glutes and brace core to maintain rigid plank posture.","Do not allow lower back to sag or head to jut forward toward the floor.","Push the ground away at the top of the rep to engage serratus anterior."],"howToSteps":["1. Setup Position your feet on an elevated surface, such as a bench or box, and place your hands shoulder-width apart on the ground, ensuring your body forms a straight line from head to heels.","2. Brace/Position Engage your core and glutes, keeping your body rigid while lowering your chest towards the ground, maintaining a neutral spine throughout the movement.","3. Execute Press through your palms to lift your body back to the starting position, fully extending your arms while keeping your feet elevated.","4. Return/Repeat Lower your body again in a controlled manner, ensuring proper form is maintained, and repeat for the desired number of repetitions."]}},{"id":"0719e25a-a570-4cac-a2aa-ff9c50cf8407","name":"Iron Cross","slug":"iron-cross","description":"Step 1: Lie supine with the arms stretched to the side, palms up, and the feet together with legs straight. Draw in the abs.\n\nStep 2: Using momentum, bring one foot across the body toward the opposite hand through maximum range of motion.\n\nStep 3: Reverse the pattern and return to the starting position.\n\nStep 4: Repeat with the other leg. Maintain posture throughout. Avoid letting the shoulders pull up off the floor, holding the breath, or back excessively round.","coachingCues":[],"primaryEquip y away from the kettlebell, allowing your arm to lower towards the floor while keeping your elbow slightly bent and your shoulder packed.\n\nStep 4: Return/Repeat Reverse the motion by rotating your torso back to the starting position, maintaining control of the kettlebell, and repeat for the desired number of repetitions before switching sides.","coachingCues":[],"primaryEquipment":["Kettlebell"],"muscleGroups":["back"],"imageUrl":"https://img.youtube.com/vi/WtqAD5-Re18/hqdefault.jpg","videoId":"WtqAD5-Re18","videoUrl":"https://www.youtube.com/watch?v=WtqAD5-Re18","videoThumbnailUrl":"https://img.youtube.com/vi/WtqAD5-Re18/hqdefault.jpg","candidatePhotoUrl":"/images/exercises/kettlebell-arm-bar.jpg","hasCandidatePhoto":true,"warnings":[],"ytTitle":"How to do a Kettlebell Arm Bar","ytAuthor":"National Academy of Sports Medicine (NASM)","ytStatus":"OK","card":{"category":"Back","phase":"Phase 1: Stabilization · Phase 2: Strength Endurance · Phase 3: Hypertrophy","primeMover":"Latissimus Dorsi, Rhomboids & Middle Trapezius","kineticCheckpoints":{"feetAnkles":"Shoulder-width, firmly planted on ground.","knees":"Aligned with second and third toes.","lphc":"Neutral lumbar spine; core braced.","shoulders":"Retracted and depressed into athletic posture.","headNeck":"Neutral cervical spine, chin packed."},"clinicalCues":["Maintain neutral kinetic chain checkpoints throughout.","Control the 2-second eccentric lowering phase.","Exhale on exertion while maintaining intra-abdominal brace."],"howToSteps":["1. Setup Lie on your back on a flat surface, holding a kettlebell in one hand with your arm extended straight up towards the ceiling.","2. Brace/Position Bend your knees and place your feet flat on the ground, ensuring your shoulder blades are retracted and your core is engaged.","3. Execute Slowly rotate your body away from the kettlebell, allowing your arm to lower towards the floor while keeping your elbow slightly bent and your shoulder packed.","4. Return/Repeat Reverse the motion by rotating your torso back to the starting position, maintaining control of the kettlebell, and repeat for the desired number of repetitions before switching sides."]}},{"id":"8bb0b786-e555-43be-85c6-1f426b527bd9","name":"Kettlebell Clean","slug":"kettlebell-clean-0133","description":"Step 1: Setup Stand with your feet shoulder-width apart, kettlebell positioned on the floor between your feet, with your toes slightly pointed out.\n\nStep 2: Brace/Position Hinge at the hips, bend your knees, and grasp the kettlebell with one hand, keeping your back straight and core engaged.\n\nStep 3: Execute Drive through your heels, extend your hips, and pull the kettlebell upward, keeping it close to your body, rotating your wrist to catch it at shoulder height.\n\nStep 4: Return/Repeat Lower the kettlebell back to the starting position by reversing the movement, ensuring control, and repeat for the desired number of repetitions.","coachingCues":[],"primaryEquipment":["Kettlebell"],"muscleGroups":["back","glutes","hamstrings","quadriceps","shoulders"],"imageUrl":"https://img.youtube.com/vi/aoCikYYQ6pI/hqdefault.jpg","videoId":"aoCikYYQ6pI","videoUrl":"https://www.youtube.com/watch?v=aoCikYYQ6pI","videoThumbnailUrl":"https://img.youtube.com/vi/aoCikYYQ6pI/hqdefault.jpg","candidatePhotoUrl":"/images/exercises/kettlebell-clean.jpg","hasCandidatePhoto":true,"warnings":[],"ytTitle":"How to do a Kettlebell Clean","ytAuthor":"National Academy of Sports Medicine (NASM)","ytStatus":"OK","card":{"category":"Plyometrics","phase":"Phase 1: Stabilization · Phase 2: Strength Endurance · Phase 3: Hypertrophy","primeMover":"Quadriceps, Gluteus Maximus & Gastrocnemius (Triple Extension)","kineticCheckpoints":{"feetAnkles":"Shoulder-width, firmly planted on ground.","knees":"Aligned with second and third toes.","lphc":"Neutral lumbar spine; core braced.","shoulders":"Retracted and depressed into athletic posture.","headNeck":"Neutral cervical spine, chin packed."},"clinicalCues":["Maintain neutral kinetic chain checkpoints throughout.","Control the 2-second eccentric lowering phase.","Exhale on exertion while maintaining intra-abdominal brace."],"howToSteps":["1. Setup Stand with your feet shoulder-width apart, kettlebell positioned on the floor between your feet, with your toes slightly pointed out.","2. Brace/Position Hinge at the hips, bend your knees, and grasp the kettlebell with one hand, keeping your back straight and core engaged.","3. Execute Drive through your heels, extend your hips, and pull the kettlebell upward, keeping it close to your body, rotating your wrist to catch it at shoulder height.","4. Return/Repeat Lower the kettlebell back to the starting position by reversing the movement, ensuring control, and repeat for the desired number of repetitions."]}},{"id":"74092cef-9579-46e2-8a09-73be638650e8","name":"Kettlebell Clean To Press","slug":"kettlebell-clean-to-press-0001","description":"Step 1: Setup Stand with your feet shoulder-width apart, holding a kettlebell in one hand with a neutral grip, positioned between your feet.\n\nStep 2: Brace/Position Hinge at your hips to lower your torso slightly, keeping your back straight and core engaged, while positioning the kettlebell close to your body.\n\nStep 3: Execute Drive through your heels to extend your hips and knees, pulling the kettlebell upward in a clean motion, rotating your wrist to bring it to shoulder height.\n\nStep 4: Return/Repeat From the shoulder position, press the kettlebell overhead until your arm is fully extended, then lower it back to the starting position and repeat for the desired number of repetitions.","coachingCues":[],"primaryEquipment":["Kettlebell"],"muscleGroups":["back","glutes","hamstrings","quadriceps","shoulders"],"imageUrl":"https://img.youtube.com/vi/km3f8_rpDdg/hqdefault.jpg","videoId":"km3f8_rpDdg","videoUrl":"https://www.youtube.com/watch?v=km3f8_rpDdg","videoThumbnailUrl":"https://img.youtube.com/vi/km3f8_rpDdg/hqdefault.jpg","candidatePhoto
