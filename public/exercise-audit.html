etup Stand in front of a box or bench with feet shoulder-width apart and toes slightly pointed out.","2. Brace/Position Engage your core, maintain a neutral spine, and hinge at the hips while lowering into a squat position, ensuring your knees track over your toes.","3. Execute Lower your body until your glutes lightly touch the box, keeping your weight distributed evenly through your heels.","4. Return/Repeat Push through your heels to stand back up, fully extending your hips and knees, then repeat the movement."]}},{"id":"af79b829-81b4-43bc-8122-8d12964c3cc6","name":"Box Squat Curl To Overhead Press","slug":"box-squat-curl-to-overhead-press-0066","description":"Step 1: Setup Stand with feet shoulder-width apart, holding a dumbbell in each hand at your sides, and position a sturdy box behind you.\n\nStep 2: Brace/Position Engage your core, hinge at the hips, and lower your body into a squat while keeping your chest up and back straight, allowing your thighs to touch the box lightly.\n\nStep 3: Execute Push through your heels to stand back up, simultaneously curling the dumbbells to shoulder height, then press them overhead until your arms are fully extended.\n\nStep 4: Return/Repeat Lower the dumbbells back to shoulder height, then return to the squat position, lightly touching the box before repeating the movement.","coachingCues":[],"primaryEquipment":["Box or Step"],"muscleGroups":["biceps","glutes","hamstrings","quadriceps","shoulders","triceps"],"imageUrl":"https://img.youtube.com/vi/ZrOgsfSPpC8/hqdefault.jpg","videoId":"ZrOgsfSPpC8","videoUrl":"https://www.youtube.com/watch?v=ZrOgsfSPpC8","videoThumbnailUrl":"https://img.youtube.com/vi/ZrOgsfSPpC8/hqdefault.jpg","candidatePhotoUrl":"/images/exercises/box-squat-curl-to-overhead-press.jpg","hasCandidatePhoto":true,"warnings":[],"ytTitle":"How to do a Box Squat, Curl to Overhead Press","ytAuthor":"National Academy of Sports Medicine (NASM)","ytStatus":"OK","card":{"category":"Shoulders","phase":"Phase 2 (Strength Endurance), Phase 4 (Max Strength)","primeMover":"Anterior Deltoid & Middle Deltoid","kineticCheckpoints":{"feetAnkles":"Hip-width apart, firmly rooted.","knees":"Soft extension without locking or hyperextending.","lphc":"Glutes and abs fully engaged to prevent lumbar hyperextension.","shoulders":"Elbows positioned slightly in front of bar in starting rack position.","headNeck":"Head tilts slightly back to clear bar path, then returns neutral under bar at top."},"clinicalCues":["Squeeze glutes hard to create a solid pelvic foundation and protect lumbar spine.","Do not lean backward or hyperextend lower back to press heavy loads.","Finish lockout with biceps next to ears."],"howToSteps":["1. Setup Stand with feet shoulder-width apart, holding a dumbbell in each hand at your sides, and position a sturdy box behind you.","2. Brace/Position Engage your core, hinge at the hips, and lower your body into a squat while keeping your chest up and back straight, allowing your thighs to touch the box lightly.","3. Execute Push through your heels to stand back up, simultaneously curling the dumbbells to shoulder height, then press them overhead until your arms are fully extended.","4. Return/Repeat Lower the dumbbells back to shoulder height, then return to the squat position, lightly touching the box before repeating the movement."]}},{"id":"47f9866c-bfee-40bc-bf7c-9fc025b86ea7","name":"Bulgarian Split Squat","slug":"bulgarian-split-squat","description":"Step 1: Stand with feet hip width apart and approximately 2 shoulder widths in length with shoelaces down on a bench. Set spine in neutral, dumbbells at your sides and core braced.\n\nStep 2: Drop the trailing knee down until it is 1-2 inches off the ground maintaining a slight forward torso angle. Strive to achieve a 90˚ knee angle or thigh parallel at the bottom of the movement.\n\nStep 3: Reverse the pattern and return to the starting position. Maintain posture throughout.\n\nStep 4: Repeat for the desired number of repetitions. Ensure knee tracks in line with toes. Avoid lifting the front heel, allowing the knee to collapse inward while lowering. Keep laces flat on the bench (make sure the bench or box is the correct height to allow for this).","coachingCues":[],"primaryEquipment":["Bench","Dumbbells"],"muscleGroups":["glutes","hamstrings","quadriceps"],"imageUrl":"https://img.youtube.com/vi/hbw7hdyOpq0/hqdefault.jpg","videoId":"hbw7hdyOpq0","videoUrl":"https://www.youtube.com/watch?v=hbw7hdyOpq0","videoThumbnailUrl":"https://img.youtube.com/vi/hbw7hdyOpq0/hqdefault.jpg","candidatePhotoUrl":"/images/exercises/bulgarian-split-squat.jpg","hasCandidatePhoto":true,"warnings":[],"ytTitle":"How to do a Bulgarian Split Squat  | Proper Form & Technique | NASM","ytAuthor":"National Academy of Sports Medicine (NASM)","ytStatus":"OK","card":{"category":"Legs","phase":"Phase 1 (Stabilization Endurance), Phase 2 (Strength Endurance), Phase 3 (Hypertrophy)","primeMover":"Quadriceps & Gluteus Maximus","kineticCheckpoints":{"feetAnkles":"Front foot flat and pointing straight forward; rear foot elevated on bench.","knees":"Front knee stays aligned with second toe; does not cave inward (valgus).","lphc":"Hips square facing forward; pelvis level without lateral hip drop (Trendelenburg).","shoulders":"Shoulders back and down with tall, upright or slight forward torso posture.","headNeck":"Neutral head looking straight ahead."},"clinicalCues":["Maintain 80% of body weight on the front leg; rear leg is only for balance.","Keep front knee tracking in line with front ankle and middle toes.","Squeeze front glute at top of each repetition."],"howToSteps":["1. Stand with feet hip width apart and approximately 2 shoulder widths in length with shoelaces down on a bench. Set spine in neutral, dumbbells at your sides and core braced.","2. Drop the trailing knee down until it is 1-2 inches off the ground maintaining a slight forward torso angle. Strive to achieve a 90˚ knee angle or thigh parallel at the bottom of the movement.","3. Reverse the pattern and return to the starting position. Maintain posture throughout.","4. Repeat for the desired number of repetitions. Ensure knee tracks in line with toes. Avoid lifting the front heel, allowing the knee to collapse inward while lowering. Keep laces flat on the bench (make sure the bench or box is the correct height to allow for this)."]}},{"id":"3f03eba2-b1fd-4d59-9424-5922f46f46bf","name":"Cable Crossover","slug":"cable-crossover","description":"Step 1: Ensure cables are adjusted at chest height. Stand with your back toward the cable machine. Grab the handles and hold them out to the side of your body with your palms facing forward. Draw in and brace your abs. Lock shoulder blades back and down.\n\nStep 2: Drive the hands forward and together in an arcing motion allowing the hands to pass with one hand above and one below.\n\nStep 3: Reverse the pattern and return to the starting position moving through a maximum range of motion that technique can be maintained.\n\nStep 4: Repeat, alternating the top/bottom hand. Maintain posture throughout. Avoid arching or slouching the back, jutting the chin forward, slouching or shrugging the shoulders.","coachingCues":[],"primaryEquipment":["Cable Machine"],"muscleGroups":["chest","shoulders","triceps"],"imageUrl":"https://img.youtube.com/vi/XY6JrX1wyxk/hqdefault.jpg","videoId":"XY6JrX1wyxk","videoUrl":"https://www.youtube.com/watch?v=XY6JrX1wyxk","videoThumbnailUrl":"https://img.youtube.com/vi/XY6JrX1wyxk/hqdefault.jpg","candidatePhotoUrl":"/images/exercises/cable-crossover.jpg","hasCandidatePhoto":true,"warnings":[],"ytTitle":"How to do a Cable Crossover  | Proper Form & Technique | NASM","ytAuthor":"National Academy of Sports Medicine (NASM)","ytStatus":"OK","card":{"category":"Chest","phase":"Phase 2 (Strength Endurance), Phase 3 (Hypertrophy)","primeMover":"Pectoralis Major (Sternal & Costal Heads)","kineticCheckpoints":{"feetAnkles":"Staggered athletic stance with bodyweight centered.","knees":"Soft bend in both knees.","lphc":"Slight forward torso lean (15°) with flat neutral spine.","shoulders":"Elbows maintain a fixed slight bend (15°–20°) throughout the arc.","headNeck":"Neutral cervical spine in line with angled torso."},"clinicalCues":["Maintain a fixed elbow bend throughout; do not turn the fly into a press.","Think of bringing the inner biceps together to maximize chest contraction.","Keep shoulders packed down away from ears during the entire sweep."],"howToSteps":["1. Ensure cables are adjusted at chest height. Stand with your back toward the cable machine. Grab the handles and hold them out to the side of your body with your palms facing forward. Draw in and brace your abs. Lock shoulder blades back and down.","2. Drive the hands forward and together in an arcing motion allowing the hands to pass with one hand above and one below.","3. Reverse the pattern and return to the starting position moving through a maximum range of motion that technique can be maintained.","4. Repeat, alternating the top/bottom hand. Maintain posture throughout. Avoid arching or slouching the back, jutting the chin forward, slouching or shrugging the shoulders."]}},{"id":"84ee4846-4058-4322-839f-32ba3216bf36","name":"Chest Press Machine","slug":"chest-press-machine","description":"Step 1: Adjust the seat height so that the handles are at chest level when seated.\n\nStep 2: Sit down and firmly grip the handles with your palms facing forward.\n\nStep 3: Press the handles forward until your arms are fully extended, keeping your elbows slightly bent.\n\nStep 4: Slowly return to the starting position, controlling the weight as you bring the handles back to your chest.","coachingCues":[],"primaryEquipment":["Chest Press Machine"],"muscleGroups":["chest","shoulders","triceps"],"imageUrl":"https://img.youtube.com/vi/lRo9zZ7EwpM/hqdefault.jpg","videoId":"lRo9zZ7EwpM","videoUrl":"https://www.youtube.com/watch?v=lRo9zZ7EwpM","videoThumbnailUrl":"https://img.youtube.com/vi/lRo9zZ7EwpM/hqdefault.jpg","candidatePhotoUrl":"/images/exercises/chest-press-machine.jpg","hasCandidatePhoto":true,"warnings":[],"ytTitle":"How to do a Chest Press on a Machine | Proper Form & Technique | NASM","ytAuthor":"National Academy of Sports Medicine (NASM)","ytStatus":"OK","card":{"category":"Back","phase":"Phase 1: Stabilization · Phase 2: Strength Endurance · Phase 3: Hypertrophy","primeMover":"Latissimus Dorsi, Rhomboids & Middle Trapezius","kineticCheckpoints":{"feetAnkles":"Shoulder-width, firmly planted on ground.","knees":"Aligned with second and third toes.","lphc":"Neutral lumbar spine; core braced.","shoulders":"Retracted and depressed into athletic posture.","headNeck":"Neutral cervical spine, chin packed."},"clinicalCues":["Maintain neutral kinetic chain checkpoints throughout.","Control the 2-second eccentric lowering phase.","Exhale on exertion while maintaining intra-abdominal brace."],"howToSteps":["1. Adjust the seat height so that the handles are at chest level when seated.","2. Sit down and firmly grip the handles with your palms facing forward.","3. Press the handles forward until your arms are fully extended, keeping your elbows slightly bent.","4. Slowly return to the starting position, controlling the weight as you bring the handles back to your chest."]}},{"id":"c4dd8a74-bbb9-4b36-8045-bceae6527e45","name":"Child's Pose","slug":"child-s-pose","description":"Step 1: Start on your hands and knees in a tabletop position with your wrists aligned under your shoulders and knees under your hips.\n\nStep 2: Exhale and sit back on your heels, extending your arms forward and lowering your chest toward the floor.\n\nStep 3: Relax your forehead on the ground and breathe deeply, allowing your body to sink into the stretch.\n\nStep 4: Hold the position for 30 seconds to 1 minute, focusing on releasing tension in your back and shoulders.","coachingCues":[],"primaryEquipment":["None"],"muscleGroups":["back"],"imageUrl":"https://img.youtube.com/vi/_ZX_zTOBgp8/hqdefault.jpg","videoId":"_ZX_zTOBgp8","videoUrl":"https://www.youtube.com/watch?v=_ZX_zTOBgp8","videoThumbnailUrl":"https://img.youtube.com/vi/_ZX_zTOBgp8/hqdefault.jpg","candidatePhotoUrl":"/images/exercises/childs-pose.jpg","hasCandidatePhoto":true,"warnings":[],"ytTitle":"How to do a Child's Pose Stretch | Proper Form & Technique | NASM","ytAuthor":"National Academy of Sports Medicine (NASM)","ytStatus":"OK","card":{"category":"Back","phase":"Phase 1: Stabilization · Phase 2: Strength Endurance · Phase 3: Hypertrophy","primeMover":"Latissimus Dorsi, Rhomboids & Middle Trapezius","kineticCheckpoints":{"feetAnkles":"Shoulder-width, firmly planted on ground.","knees":"Aligned with second and third toes.","lphc":"Neutral lumbar spine; core braced.","shoulders":"Retracted and depressed into athletic posture.","headNeck":"Neutral cervical spine, chin packed."},"clinicalCues":["Maintain neutral kinetic chain checkpoints throughout.","Control the 2-second eccentric lowering phase.","Exhale on exertion while maintaining intra-abdominal brace."],"howToSteps":["1. Start on your hands and knees in a tabletop position with your wrists aligned under your shoulders and knees under your hips.","2. Exhale and sit back on your heels, extending your arms forward and lowering your chest toward the floor.","3. Relax your forehead on the ground and breathe deeply, allowing your body to sink into the stretch.","4. Hold the position for 30 seconds to 1 minute, focusing on releasing tension in your back and shoulders."]}},{"id":"93cad0bc-b091-421a-bcce-493bc90b8ba9","name":"Clamshells","slug":"clamshells-0067","description":"Step 1: Setup Lie on your side with your legs stacked, knees bent at a 90-degree angle, and feet together.\n\nStep 2: Brace/Position Engage your core and keep your hips stacked to maintain proper alignment throughout the movement.\n\nStep 3: Execute Lift your top knee away from the bottom knee while keeping your feet together, focusing on activating the gluteus medius.\n\nStep 4: Return/Repeat Lower your top knee back to the starting position and repeat for the desired number of repetitions before switching sides.","coachingCues":[],"primaryEquipment":[],"muscleGroups":["glutes","legs"],"imageUrl":"https://img.youtube.com/vi/V_AnVxKPFlY/hqdefault.jpg","videoId":"V_AnVxKPFlY","videoUrl":"https://www.youtube.com/watch?v=V_AnVxKPFlY","videoThumbnailUrl":"https://img.youtube.com/vi/V_AnVxKPFlY/hqdefault.jpg","candidatePhotoUrl":"/images/exercises/clamshells.jpg","hasCandidatePhoto":true,"warnings":[],"ytTitle":"How to do Clamshells","ytAuthor":"National Academy of Sports Medicine (NASM)","ytStatus":"OK","card":{"category":"Legs","phase":"Phase 1: Stabilization · Phase 2: Strength Endurance · Phase 3: Hypertrophy","primeMover":"Quadriceps & Gluteus Maximus","kineticCheckpoints":{"feetAnkles":"Shoulder-width, firmly planted on ground.","knees":"Aligned with second and third toes.","lphc":"Neutral lumbar spine; core braced.","shoulders":"Retracted and depressed into athletic posture.","headNeck":"Neutral cervical spine, chin packed."},"clinicalCues":["Maintain neutral kinetic chain checkpoints throughout.","Control the 2-second eccentric lowering phase.","Exhale on exertion while maintaining intra-abdominal brace."],"howToSteps":["1. Setup Lie on your side with your legs stacked, knees bent at a 90-degree angle, and feet together.","2. Brace/Position Engage your core and keep your hips stacked to maintain proper alignment throughout the movement.","3. Execute Lift your top knee away from the bottom knee while keeping your feet together, focusing on activating the gluteus medius.","4. Return/Repeat Lower your top knee back to the starting position and repeat for the desired number of repetitions before switching sides."]}},{"id":"e27ef731-876a-414b-933e-d925156ef8ae","name":"Close Grip Bench Press","slug":"close-grip-bench-press","description":"Step 1: Setup Lie flat on the bench with feet flat on the floor, grasping the barbell with a shoulder-width or slightly narrower-than-shoulder-width grip.\n\nStep 2: Brace/Position Unrack the barbell directly over your shoulders with straight arms, retract and depress your shoulder blades, and brace your core.\n\nStep 3: Execute Inhale and lower the barbell under control to your lower sternum, keeping your elbows tucked tightly against your ribs at a 30-degree to 45-degree angle.\n\nStep 4: Return/Repeat Exhale and press the bar forcefully upward by extending your elbows, contracting your triceps at the top without flaring your shoulders, then repeat.","coachingCues":[],"primaryEquipment":["Bench"],"muscleGroups":["chest","shoulders","triceps"],"imageUrl":"https://img.youtube.com/vi/LJeqLAmJLfs/hqdefault.jpg","videoId":"LJeqLAmJLfs","videoUrl":"https://www.youtube.com/watch?v=LJeqLAmJLfs","videoThumbnailUrl":"https://img.youtube.com/vi/LJeqLAmJLfs/hqdefault.jpg","candidatePhotoUrl":"/images/exercises/close-grip-bench-press.jpg","hasCandidatePhoto":true,"warnings":[],"ytTitle":"How to do a Close Grip Bench Press  | Proper Form & Technique | NASM","ytAuthor":"National Academy of Sports Medicine (NASM)","ytStatus":"OK","card":{"category":"Chest","phase":"Phase 2 (Strength Endurance), Phase 3 (Hypertrophy), Phase 4 (Max Strength)","primeMover":"Pectoralis Major (Sternal & Clavicular Heads)","kineticCheckpoints":{"feetAnkles":"Flat on floor, hip-width apart, driving down into the ground.","knees":"Flexed at 90°, aligned with second and third toes.","lphc":"Neutral pelvis with natural lumbar arch; glutes stay firmly on pad.","shoulders":"Retracted and depressed (pinched back and down) into the bench.","headNeck":"Neutral cervical spine resting flat on the bench pad; eyes under bar."},"clinicalCues":["Pin shoulder blades into back pockets throughout the entire lift.","Maintain 45° elbow flare to prevent subacromial shoulder impingement.","Drive heels into floor to create total-body kinetic chain tension."],"howToSteps":["1. Setup Lie flat on the bench with feet flat on the floor, grasping the barbell with a shoulder-width or slightly narrower-than-shoulder-width grip.","2. Brace/Position Unrack the barbell directly over your shoulders with straight arms, retract and depress your shoulder blades, and brace your core.","3. Execute Inhale and lower the barbell under control to your lower sternum, keeping your elbows tucked tightly against your ribs at a 30-degree to 45-degree angle.","4. Return/Repeat Exhale and press the bar forcefully upward by extending your elbows, contracting your triceps at the top without flaring your shoulders, then repeat."]}},{"id":"c28c4002-3195-4c94-9e34-62ddb1f759bd","name":"Core Ball Crunch","slug":"core-ball-crunch-0069","description":"Step 1: Setup Sit on a stability ball with your feet flat on the floor, hip-width apart, and your lower back supported by the ball.\n\nStep 2: Brace/Position Engage your core by pulling your navel towards your spine and lean back slightly, ensuring your head, neck, and shoulders are aligned with your spine.\n\nStep 3: Execute Contract your abdominal muscles to lift your torso off the ball, curling your upper body towards your hips while exhaling.\n\nStep 4: Return/Repeat Slowly lower your torso back to the starting position, maintaining control, and repeat for the desired number of repetitions.","coachingCues":[],"primaryEquipment":[],"muscleGroups":["core"],"imageUrl":"https://img.youtube.com/vi/lrqfw0n_GXI/hqdefault.jpg","videoId":"lrqfw0n_GXI","videoUrl":"https://www.youtube.com/watch?v=lrqfw0n_GXI","videoThumbnailUrl":"https://img.youtube.com/vi/lrqfw0n_GXI/hqdefault.jpg","candidatePhotoUrl":"/images/exercises/core-ball-crunch.jpg","hasCandidatePhoto":true,"warnings":[],"ytTitle":"How to do a Core Ball Crunch","ytAuthor":"National Academy of Sports Medicine (NASM)","ytStatus":"OK","card":{"category":"Core","phase":"Phase 1: Stabilization · Phase 2: Strength Endurance · Phase 3: Hypertrophy","primeMover":"Transverse Abdominis & Deep Core Stabilizers","kineticCheckpoints":{"feetAnkles":"Shoulder-width, firmly planted on ground.","knees":"Aligned with second and third toes.","lphc":"Neutral lumbar spine; core braced.","shoulders":"Retracted and depressed into athletic posture.","headNeck":"Neutral cervical spine, chin packed."},"clinicalCues":["Maintain neutral kinetic chain checkpoints throughout.","Control the 2-second eccentric lowering phase.","Exhale on exertion while maintaining intra-abdominal brace."],"howToSteps":["1. Setup Sit on a stability ball with your feet flat on the floor, hip-width apart, and your lower back supported by the ball.","2. Brace/Position Engage your core by pulling your navel towards your spine and lean back slightly, ensuring your head, neck, and shoulders are aligned with your spine.","3. Execute Contract your abdominal muscles to lift your torso off the ball, curling your upper body towards your hips while exhaling.","4. Return/Repeat Slowly lower your torso back to the starting position, maintaining control, and repeat for the desired number of repetitions."]}},{"id":"662dd925-bea0-4a2b-b273-d3514d077cbf","name":"Dead Bug","slug":"dead-bug","description":"Step 1: Lie supine on the floor with your arms and legs extended behind and in front of you. Draw in your abs.\n\nStep 2: Slowly and simultaneously lift your opposite arm and leg bringing the arm above the shoulder and knee above your hip at 90˚ angles.\n\nStep 3: Reverse the pattern and return to the starting position.\n\nStep 4: Repeat on the other side. Maintain posture throughout. Avoid arching the back, letting the ribs flare or body rotate.","coachingCues":[],"primaryEquipment":["None"],"muscleGroups":["core"],"imageUrl":"https://img.youtube.com/vi/bxn9FBrt4-A/hqdefault.jpg","videoId":"bxn9FBrt4-A","videoUrl":"https://www.youtube.com/watch?v=bxn9FBrt4-A","videoThumbnailUrl":"https://img.youtube.com/vi/bxn9FBrt4-A/hqdefault.jpg","candidatePhotoUrl":"/images/exercises/dead-bug.jpg","hasCandidatePhoto":true,"warnings":[],"ytTitle":"How to do a Dead Bug | Proper Form & Technique | NASM","ytAuthor":"National Academy of Sports Medicine (NASM)","ytStatus":"OK","card":{"category":"Core","phase":"Phase 1 (Stabilization Endurance)","primeMover":"Transverse Abdominis & Rectus Abdominis","kineticCheckpoints":{"feetAnkles":"Dorsiflexed at 90° angle.","knees":"Stacked directly above hips at 90° tabletop position.","lphc":"Lower back pressed flat into floor with zero arching / daylight.","shoulders":"Arms pointed straight up toward ceiling, scapulae flat against floor.","headNeck":"Head resting comfortably on floor, chin neutral."},"clinicalCues":["The lower back must stay glued to the floor at all times; if it arches, shorten limb reach.","Move slowly and deliberately (3 seconds down, 1 second return).","Maintain smooth diaphragmatic breathing while keeping abdominal brace engaged."],"howToSteps":["1. Lie supine on the floor with your arms and legs extended behind and in front of you. Draw in your abs.","2. Slowly and simultaneously lift your opposite arm and leg bringing the arm above the shoulder and knee above your hip at 90˚ angles.","3. Reverse the pattern and return to the starting position.","4. Repeat on the other side. Maintain posture throughout. Avoid arching the back, letting the ribs flare or body rotate."]}},{"id":"4490f474-6e9a-4339-9a3d-984c84331655","name":"Decline Push Up","slug":"decline-push-up-0195","description":"Step 1: Setup Position your feet on an elevated surface, such as a bench or step, and place your hands shoulder-width apart on the floor, ensuring your body forms a straight line from head to heels.\n\nStep 2: Brace/Position Engage your core and glutes, keeping your elbows slightly tucked in towards your body as you lower your chest towards the floor.\n\nStep 3: Execute Inhale as you lower your body until your chest nearly touches the ground, maintaining a straight line from your head to your feet.\n\nStep 4: Return/Repeat Exhale as you push through your palms to return to the starting position, fully extending your arms and repeating for the desired number of repetitions.","coachingCues":[],"primaryEquipment":[],"muscleGroups":["chest","triceps"],"imageUrl":"https://img.youtube.com/vi/aq2xZxfrQlM/hqdefault.jpg","videoId":"aq2xZxfrQlM","videoUrl":"https://www.youtube.com/watch?v=aq2xZxfrQlM","videoThumbnailUrl":"https://img.youtube.com/vi/aq2xZxfrQlM/hqdefault.jpg","candidatePhotoUrl":"/images/exercises/decline-push-up.jpg","hasCandidatePhoto":true,"warnings":[],"ytTitle":"How to do a Decline Push-Up","ytAuthor":"National Academy of Sports Medicine (NASM)","ytStatus":"OK","card":{"category":"Chest","phase":"Phase 1 (Stabilization Endurance), Phase 2 (Strength Endurance)","primeMover":"Pectoralis Major","kineticCheckpoints":{"feetAnkles":"Together or hip-width apart, dorsiflexed on balls of feet.","knees":"Fully extended with active quadriceps contraction.","lphc":"Neutral pelvis; no sagging hips (anterior tilt) or pike (excessive flexion).","shoulders":"Hands placed slightly wider than shoulder-width, fingers pointing forward.","headNeck":"Neutral cervical spine, chin tucked, gaze looking 6 inches ahead."},"clinicalCues":["Engage glutes and brace core to maintain rigid plank posture.","Do not allow lower back to sag or head to jut forward toward the floor.","Push the ground away at the top of the rep to engage serratus anterior."],"howToSteps":["1. Setup Position your feet on an elevated surface, such as a bench or step, and place your hands shoulder-width apart on the floor, ensuring your body forms a straight line from head to heels.","2. Brace/Position Engage your core and glutes, keeping your elbows slightly tucked in towards your body as you lower your chest towards the floor.","3. Execute Inhale as you lower your body until your chest nearly touches the ground, maintaining a straight line from your head to your feet.","4. Return/Repeat Exhale as you push through your palms to return to the starting position, fully extending your arms and repeating for the desired number of repetitions."]}},{"id":"0addf908-beff-460f-99d9-cc7ece1afc4a","name":"Depth Jump","slug":"depth-jump-0173","description":"Step 1: Stand on a sturdy platform or box that is 12-24 inches high with your feet shoulder-width apart.\n\nStep 2: Step off the platform and allow your body to fall freely towards the ground.\n\nStep 3: Upon landing, absorb the impact by bending your knees and hips while keeping your feet flat on the ground.\n\nStep 4: Immediately jump vertically as high as possible after landing, using the momentum from the fall.","coachingCues":[],"primaryEquipment":[],"muscleGroups":["calves","glutes","hamstrings","quadriceps"],"imageUrl":"https://img.youtube.com/vi/bMHL5xqKn3E/hqdefault.jpg","videoId":"bMHL5xqKn3E","videoUrl":"https://www.youtube.com/watch?v=bMHL5xqKn3E","videoThumbnailUrl":"https://img.youtube.com/vi/bMHL5xqKn3E/hqdefault.jpg","candidatePhotoUrl":"/images/exercises/depth-jump.jpg","hasCandidatePhoto":true,"warnings":[],"ytTitle":"How to do a Depth Jump","ytAuthor":"National Academy of Sports Medicine (NASM)","ytStatus":"OK","card":{"category":"Plyometrics","phase":"Phase 1: Stabilization · Phase 2: Strength Endurance · Phase 3: Hypertrophy","primeMover":"Quadriceps, Gluteus Maximus & Gastrocnemius (Triple Extension)","kineticCheckpoints":{"feetAnkles":"Shoulder-width, firmly planted on ground.","knees":"Aligned with second and third toes.","lphc":"Neutral lumbar spine; core braced.","shoulders":"Retracted and depressed into athletic posture.","headNeck":"Neutral cervical spine, chin packed."},"clinicalCues":["Maintain neutral kinetic chain checkpoints throughout.","Control the 2-second eccentric lowering phase.","Exhale on exertion while maintaining intra-abdominal brace."],"howToSteps":["1. Stand on a sturdy platform or box that is 12-24 inches high with your feet shoulder-width apart.","2. Step off the platform and allow your body to fall freely towards the ground.","3. Upon landing, absorb the impact by bending your knees and hips while keeping your feet flat on the ground.","4. Immediately jump vertically as high as possible after landing, using the momentum from the fall."]}},{"id":"eaadcb60-0de9-474d-a8b4-7012a3100eb1","name":"Depth Jump Frontal","slug":"depth-jump-frontal-0174","description":"Step 1: Stand on a sturdy platform or box that is 12-24 inches high, with your feet shoulder-width apart.\n\nStep 2: Step off the platform and allow your body to fall freely, maintaining a straight posture.\n\nStep 3: Upon landing, absorb the impact by bending your knees and hips, keeping your feet flat on the ground.\n\nStep 4: Immediately jump vertically as high as possible, extending your arms overhead for momentum.","coachingCues":[],"primaryEquipment":[],"muscleGroups":["calves","glutes","hamstrings","quadriceps"],"imageUrl":"https://img.youtube.com/vi/-jUndEGjpig/hqdefault.jpg","videoId":"-jUndEGjpig","videoUrl":"https://www.youtube.com/watch?v=-jUndEGjpig","videoThumbnailUrl":"https://img.youtube.com/vi/-jUndEGjpig/hqdefault.jpg","candidatePhotoUrl":"/images/exercises/depth-jump.jpg","hasCandidatePhoto":true,"warnings":[],"ytTitle":"How to do a Depth Jump Frontal","ytAuthor":"National Academy of Sports Medicine (NASM)","ytStatus":"OK","card":{"category":"Plyometrics","phase":"Phase 1: Stabilization · Phase 2: Strength Endurance · Phase 3: Hypertrophy","primeMover":"Quadriceps, Gluteus Maximus & Gastrocnemius (Triple Extension)","kineticCheckpoints":{"feetAnkles":"Shoulder-width, firmly planted on ground.","knees":"Aligned with second and third toes.","lphc":"Neutral lumbar spine; core braced.","shoulders":"Retracted and depressed into athletic posture.","headNeck":"Neutral cervical spine, chin packed."},"clinicalCues":["Maintain neutral kinetic chain checkpoints throughout.","Control the 2-second eccentric lowering phase.","Exhale on exertion while maintaining intra-abdominal brace."],"howToSteps":["1. Stand on a sturdy platform or box that is 12-24 inches high, with your feet shoulder-width apart.","2. Step off the platform and allow your body to fall freely, maintaining a straight posture.","3. Upon landing, absorb the impact by bending your knees and hips, keeping your feet flat on the ground.","4. Immediately jump vertically as high as possible, extending your arms overhead for momentum."]}},{"id":"2a9fe1e5-acb8-491e-bc2f-2c0b03fa6a1e","name":"Depth Jump Transverse","slug":"depth-jump-transverse-0175","description":"Step 1: Stand on a stable platform or box at a height of 12-24 inches.\n\nStep 2: Step off the platform and land softly on the ground with your feet shoulder-width apart.\n\nStep 3: Immediately rotate your torso to one side and jump laterally as high as possible.\n\nStep 4: Land softly on the opposite foot, absorbing the impact with your knees slightly bent.","coachingCues":[],"primaryEquipment":[],"muscleGroups":["calves","glutes","hamstrings","quadriceps"],"imageUrl":"https://img.youtube.com/vi/1gwF8c3ZlD0/hqdefault.jpg","videoId":"1gwF8c3ZlD0","videoUrl":"https://www.youtube.com/watch?v=1gwF8c3ZlD0","videoThumbnailUrl":"https://img.youtube.com/vi/1gwF8c3ZlD0/hqdefault.jpg","candidatePhotoUrl":"/images/exercises/depth-jump-transverse.jpg","hasCandidatePhoto":true,"warnings":[],"ytTitle":"How to do a Depth Jump Transverse","ytAuthor":"National Academy of Sports Medicine (NASM)","ytStatus":"OK","card":{"category":"Plyometrics","phase":"Phase 1: Stabilization · Phase 2: Strength Endurance · Phase 3: Hypertrophy","primeMover":"Quadriceps, Gluteus Maximus & Gastrocnemius (Triple Extension)","kineticCheckpoints":{"feetAnkles":"Shoulder-width, firmly planted on ground.","knees":"Aligned with second and third toes.","lphc":"Neutral lumbar spine; core braced.","shoulders":"Retracted and depressed into athletic posture.","headNeck":"Neutral cervical spine, chin packed."},"clinicalCues":["Maintain neutral kinetic chain checkpoints throughout.","Control the 2-second eccentric lowering phase.","Exhale on exertion while maintaining intra-abdominal brace."],"howToSteps":["1. Stand on a stable platform or box at a height of 12-24 inches.","2. Step off the platform and land softly on the ground with your feet shoulder-width apart.","3. Immediately rotate your torso to one side and jump laterally as high as possible.","4. Land softly on the opposite foot, absorbing the impact with your knees slightly bent."]}},{"id":"1e676b47-4fdf-491e-83b3-d1fe407c6c85","name":"Double Kettlebell Clean","slug":"double-kettlebell-clean-0134","description":"Step 1: Setup Stand with feet shoulder-width apart, holding a kettlebell in each hand with palms facing your body, and kettlebells positioned between your feet.\n\nStep 2: Brace/Position Hinge at the hips, slightly bend your knees, and maintain a neutral spine while engaging your core to prepare for the lift.\n\nStep 3: Execute Drive through your heels, extend your hips and knees, and pull the kettlebells upward, keeping them close to your body as you rotate your wrists to catch them at shoulder height.\n\nStep 4: Return/Repeat Lower the kettlebells back to the starting position by reversing the movement, ensuring to maintain control and proper form before repeating the exercise.","coachingCues":[],"primaryEquipment":["Kettlebell"],"muscleGroups":["back","glutes","hamstrings","quadriceps","shoulders"],"imageUrl":"https://img.youtube.com/vi/Yaelrl1VN20/hqdefault.jpg","videoId":"Yaelrl1VN20","videoUrl":"https://www.youtube.com/watch?v=Yaelrl1VN20","videoThumbnailUrl":"https://img.youtube.com/vi/Yaelrl1VN20/hqdefault.jpg","candidatePhotoUrl":"/images/exercises/double-kettlebell-clean.jpg","hasCandidatePhoto":true,"warnings":[],"ytTitle":"How to do a Double Kettlebell Clean","ytAuthor":"National Academy of Sports Medicine (NASM)","ytStatus":"OK","card":{"category":"Plyometrics","phase":"Phase 1: Stabilization · Phase 2: Strength Endurance · Phase 3: Hypertrophy","primeMover":"Quadriceps, Gluteus Maximus & Gastrocnemius (Triple Extension)","kineticCheckpoints":{"feetAnkles":"Shoulder-width, firmly planted on ground.","knees":"Aligned with second and third toes.","lphc":"Neutral lumbar spine; core braced.","shoulders":"Retracted and depressed into athletic posture.","headNeck":"Neutral cervical spine, chin packed."},"clinicalCues":["Maintain neutral kinetic chain checkpoints throughout.","Control the 2-second eccentric lowering phase.","Exhale on exertion while maintaining intra-abdominal brace."],"howToSteps":["1. Setup Stand with feet shoulder-width apart, holding a kettlebell in each hand with palms facing your body, and kettlebells positioned between your feet.","2. Brace/Position Hinge at the hips, slightly bend your knees, and maintain a neutral spine while engaging your core to prepare for the lift.","3. Execute Drive through your heels, extend your hips and knees, and pull the kettlebells upward, keeping them close to your body as you rotate your wrists to catch them at shoulder height.","4. Return/Repeat Lower the kettlebells back to the starting position by reversing the movement, ensuring to maintain control and proper form before repeating the exercise."]}},{"id":"4e9fad51-3c1d-4966-8cd5-369dede24e4f","name":"Double Kettlebell Snatch","slug":"double-kettlebell-snatch-0135","description":"Step 1: Setup Stand with feet shoulder-width apart, holding a kettlebell in each hand with a neutral grip, positioned between your legs.\n\nStep 2: Brace/Position Hinge at the hips, slightly bend your knees, and engage your core while keeping your back straight and chest up.\n\nStep 3: Execute Forcefully extend your hips and knees, driving the kettlebells upward, and pull them close to your body as you transition into an overhead position.\n\nStep 4: Return/Repeat Lower the kettlebells back to the starting position by reversing the movement, ensuring control throughout, and repeat for the desired number of repetitions.","coachingCues":[],"primaryEquipment":["Kettlebell"],"muscleGroups":["back","glutes","hamstrings","quadriceps","shoulders"],"imageUrl":"https://img.youtube.com/vi/p7Evs2D5aZc/hqdefault.jpg","videoId":"p7Evs2D5aZc","videoUrl":"https://www.youtube.com/watch?v=p7Evs2D5aZc","videoThumbnailUrl":"https://img.youtube.com/vi/p7Evs2D5aZc/hqdefault.jpg","candidatePhotoUrl":"/images/exercises/double-kettlebell-snatch.jpg","hasCandidatePhoto":true,"warnings":[],"ytTitle":"How to do a Double Kettlebell Snatch","ytAuthor":"National Academy of Sports Medicine (NASM)","ytStatus":"OK","card":{"category":"Plyometrics","phase":"Phase 1: Stabilization · Phase 2: Strength Endurance · Phase 3: Hypertrophy","primeMover":"Quadriceps, Gluteus Maximus & Gastrocnemius (Triple Extension)","kineticCheckpoints":{"feetAnkles":"Shoulder-width, firmly planted on ground.","knees":"Aligned with second and third toes.","lphc":"Neutral lumbar spine; core braced.","shoulders":"Retracted and depressed into athletic posture.","headNeck":"Neutral cervical spine, chin packed."},"clinicalCues":["Maintain neutral kinetic chain checkpoints throughout.","Control the 2-second eccentric lowering phase.","Exhale on exertion while maintaining intra-abdominal brace."],"howToSteps":["1. Setup Stand with feet shoulder-width apart, holding a kettlebell in each hand with a neutral grip, positioned between your legs.","2. Brace/Position Hinge at the hips, slightly bend your knees, and engage your core while keeping your back straight and chest up.","3. Execute Forcefully extend your hips and knees, driving the kettlebells upward, and pull them close to your body as you transition into an overhead position.","4. Return/Repeat Lower the kettlebells back to the starting position by reversing the movement, ensuring control throughout, and repeat for the desired number of repetitions."]}},{"id":"21c977b5-1ba0-4627-aa43-db3e5fb26f1d","name":"Dumbbell Ball Combo Ii","slug":"dumbbell-ball-combo-ii-0093","description":"Step 1: Setup Hold a dumbbell in each hand, standing with your feet shoulder-width apart and a stability ball positioned against a wall at chest height.\n\nStep 2: Brace/Position Engage your core, maintain a neutral spine, and position the dumbbells at shoulder height with elbows bent.\n\nStep 3: Execute Press the dumbbells overhead while simultaneously pushing the stability ball away from your chest, extending your arms fully.\n\nStep 4: Return/Repeat Lower the dumbbells back to shoulder height and pull the stability ball back to your chest, maintaining control throughout the movement.","coachingCues":[],"primaryEquipment":["Dumbbells"],"muscleGroups":["back"],"imageUrl":"https://img.youtube.com/vi/Ok46ZtftfhU/hqdefault.jpg","videoId":"Ok46ZtftfhU","videoUrl":"https://www.youtube.com/watch?v=Ok46ZtftfhU","videoThumbnailUrl":"https://img.youtube.com/vi/Ok46ZtftfhU/hqdefault.jpg","candidatePhotoUrl":"/images/exercises/dumbbell-ball-combo-ii.jpg","hasCandidatePhoto":true,"warnings":[],"ytTitle":"How to do a Dumbbell Ball Combo II","ytAuthor":"National Academy of Sports Medicine (NASM)","ytStatus":"OK","card":{"category":"Back","phase":"Phase 1: Stabilization · Phase 2: Strength Endurance · Phase 3: Hypertrophy","primeMover":"Latissimus Dorsi, Rhomboids & Middle Trapezius","kineticCheckpoints":{"feetAnkles":"Shoulder-width, firmly planted on ground.","knees":"Aligned with second and third toes.","lphc":"Neutral lumbar spine; core braced.","shoulders":"Retracted and depressed into athletic posture.","headNeck":"Neutral cervical spine, chin packed."},"clinicalCues":["Maintain neutral kinetic chain checkpoints throughout.","Control the 2-second eccentric lowering phase.","Exhale on exertion while maintaining intra-abdominal brace."],"howToSteps":["1. Setup Hold a dumbbell in each hand, standing with your feet shoulder-width apart and a stability ball positioned against a wall at chest height.","2. Brace/Position Engage your core, maintain a neutral spine, and position the dumbbells at shoulder height with elbows bent.","3. Execute Press the dumbbells overhead while simultaneously pushing the stability ball away from your chest, extending your arms fully.","4. Return/Repeat Lower the dumbbells back to shoulder height and pull the stability ball back to your chest, maintaining control throughout the movement."]}},{"id":"71f66836-2bf6-4039-bb2b-2949e8c93498","name":"Dumbbell Bench Press","slug":"dumbbell-bench-press-0094","description":"Step 1: Setup Lie on a flat bench with a dumbbell in each hand, arms fully extended above your chest, and feet flat on the floor.\n\nStep 2: Brace/Position Engage your core and retract your shoulder blades, ensuring your back remains flat against the bench.\n\nStep 3: Execute Lower the dumbbells slowly to the sides of your chest, keeping your elbows at a 45-degree angle to your torso.\n\nStep 4: Return/Repeat Press the dumbbells back up to the starting position, fully extending your arms while maintaining control throughout the movement.","coachingCues":[],"primaryEquipment":["Dumbbells","Bench"],"muscleGroups":["chest","shoulders","triceps"],"imageUrl":"https://img.youtube.com/vi/4_QuyfOCI5U/hqdefault.jpg","videoId":"4_QuyfOCI5U","videoUrl":"https://www.youtube.com/watch?v=4_QuyfOCI5U","videoThumbnailUrl":"https://img.youtube.com/vi/4_QuyfOCI5U/hqdefault.jpg","candidatePhotoUrl":"/images/exercises/dumbbell-bench-press.jpg","hasCandidatePhoto":true,"warnings":[],"ytTitle":"How to do a Dumbbell Bench Press","ytAuthor":"National Academy of Sports Medicine (NASM)","ytStatus":"OK","card":{"category":"Chest","phase":"Phase 1 (Stabilization Endurance), Phase 2 (Strength Endurance), Phase 3 (Hypertrophy)","primeMover":"Pectoralis Major (Sternal & Clavicular Heads)","kineticCheckpoints":{"feetAnkles":"Planted firmly on floor, shoulder-width apart, driving into ground.","knees":"Flexed at 90°, aligned with second/third toes.","lphc":"Glutes and hips pressed firmly into bench; maintain natural lumbar arch.","shoulders":"Scapulae retracted and depressed into bench pad; 45° elbow flare.","headNeck":"Resting flat on bench pad with chin neutral."},"clinicalCues":["Do not allow dumbbells to collide at the top; maintain active tension.","Keep shoulder blades pinched together into the bench throughout the lift.","Maintain 45° angle between upper arms and torso to protect rotator cuff."],"howToSteps":["1. Setup Lie on a flat bench with a dumbbell in each hand, arms fully extended above your chest, and feet flat on the floor.","2. Brace/Position Engage your core and retract your shoulder blades, ensuring your back remains flat against the bench.","3. Execute Lower the dumbbells slowly to the sides of your chest, keeping your elbows at a 45-degree angle to your torso.","4. Return/Repeat Press the dumbbells back up to the starting position, fully extending your arms while maintaining control throughout the movement."]}},{"id":"d0973d9c-d32e-4f99-9171-41f102785498","name":"Dumbbell Bent Over Extention","slug":"dumbbell-bent-over-extention-0095","description":"Step 1: Setup Stand with your feet shoulder-width apart, holding a dumbbell in each hand, palms facing your body.\n\nStep 2: Brace/Position Hinge at your hips, bending your knees slightly, and lower your torso until it's nearly parallel to the ground, keeping your back flat and core engaged.\n\nStep 3: Execute With a controlled motion, extend your arms straight back, squeezing your shoulder blades together at the top of the movement.\n\nStep 4: Return/Repeat Lower the dumbbells back to the starting position, maintaining control, and repeat for the desired number of repetitions.","coachingCues":[],"primaryEquipment":["Dumbbells"],"muscleGroups":["back"],"imageUrl":"https://img.youtube.com/vi/sTkMVkTwcSk/hqdefault.jpg","videoId":"sTkMVkTwcSk","videoUrl":"https://www.youtube.com/watch?v=sTkMVkTwcSk","videoThumbnailUrl":"https://img.youtube.com/vi/sTkMVkTwcSk/hqdefault.jpg","candidatePhotoUrl":"/images/exercises/dumbbell-bent-over-extension.jpg","hasCandidatePhoto":true,"warnings":[],"ytTitle":"How to do a Dumbbell Bent-Over Extention","ytAuthor":"National Academy of Sports Medicine (NASM)","ytStatus":"OK","card":{"category":"Back","phase":"Phase 1: Stabilization · Phase 2: Strength Endurance · Phase 3: Hypertrophy","primeMover":"Latissimus Dorsi, Rhomboids & Middle Trapezius","kineticCheckpoints":{"feetAnkles":"Shoulder-width, firmly planted on ground.","knees":"Aligned with second and third toes.","lphc":"Neutral lumbar spine; core braced.","shoulders":"Retracted and depressed into athletic posture.","headNeck":"Neutral cervical spine, chin packed."},"clinicalCues":["Maintain neutral kinetic chain checkpoints throughout.","Control the 2-second eccentric lowering phase.","Exhale on exertion while maintaining intra-abdominal brace."],"howToSteps":["1. Setup Stand with your feet shoulder-width apart, holding a dumbbell in each hand, palms facing your body.","2. Brace/Position Hinge at your hips, bending your knees slightly, and lower your torso until it's nearly parallel to the ground, keeping your back flat and core engaged.","3. Execute With a controlled motion, extend your arms straight back, squeezing your shoulder blades together at the top of the movement.","4. Return/Repeat Lower the dumbbells back to the starting position, maintaining control, and repeat for the desired number of repetitions."]}},{"id":"cb486a8a-4ecd-4532-8e8c-d6d71cb57dfd","name":"Dumbbell Bent Over Row","slug":"dumbbell-bent-over-row-0096","description":"Step 1: Setup Stand with feet hip-width apart, holding a dumbbell in each hand with a neutral grip, and hinge at the hips to lower your torso until it's nearly parallel to the ground.\n\nStep 2: Brace/Position Engage your core, keep your back straight, and allow your arms to hang straight down from your shoulders, with a slight bend in your elbows.\n\nStep 3: Execute Pull the dumbbells towards your lower ribcage by bending your elbows and squeezing your shoulder blades together, keeping your elbows close to your body.\n\nStep 4: Return/Repeat Slowly lower the dumbbells back to the starting position, fully extending your arms while maintaining a stable torso, and repeat for the desired number of repetitions.","coachingCues":[],"primaryEquipment":["Dumbbells"],"muscleGroups":["back","biceps"],"imageUrl":"https://img.youtube.com/vi/DJfQN6xJL28/hqdefault.jpg","videoId":"DJfQN6xJL28","videoUrl":"https://www.youtube.com/watch?v=DJfQN6xJL28","videoThumbnailUrl":"https://img.youtube.com/vi/DJfQN6xJL28/hqdefault.jpg","candidatePhotoUrl":"/images/exercises/dumbbell-bent-over-row.jpg","hasCandidatePhoto":true,"warnings":[],"ytTitle":"How to do a Dumbbell Bent Over Row","ytAuthor":"National Academy of Sports Medicine (NASM)","ytStatus":"OK","card":{"category":"Back","phase":"Phase 1: Stabilization · Phase 2: Strength Endurance · Phase 3: Hypertrophy","primeMover":"Latissimus Dorsi, Rhomboids & Middle Trapezius","kineticCheckpoints":{"feetAnkles":"Shoulder-width, firmly planted on ground.","knees":"Aligned with second and third toes.","lphc":"Neutral lumbar spine; core braced.","shoulders":"Retracted and depressed into athletic posture.","headNeck":"Neutral cervical spine, chin packed."},"clinicalCues":["Maintain neutral kinetic chain checkpoints throughout.","Control the 2-second eccentric lowering phase.","Exhale on exertion while maintaining intra-abdominal brace."],"howToSteps":["1. Setup Stand with feet hip-width apart, holding a dumbbell in each hand with a neutral grip, and hinge at the hips to lower your torso until it's nearly parallel to the ground.","2. Brace/Position Engage your core, keep your back straight, and allow your arms to hang straight down from your shoulders, with a slight bend in your elbows.","3. Execute Pull the dumbbells towards your lower ribcage by bending your elbows and squeezing your shoulder blades together, keeping your elbows close to your body.","4. Return/Repeat Slowly lower the dumbbells back to the starting position, fully extending your arms while maintaining a stable torso, and repeat for the desired number of repetitions."]}},{"id":"0a2436c3-f21d-4ab3-bb26-98db6d7668f2","name":"Dumbbell Combination Curl","slug":"dumbbell-combination-curl-0097","description":"Step 1: Setup Stand with feet shoulder-width apart, holding a dumbbell in each hand at your sides with palms facing forward.\n\nStep 2: Brace/Position Engage your core and maintain a neutral spine, keeping your elbows close to your torso.\n\nStep 3: Execute Curl the dumbbells up towards your shoulders, rotating your wrists so that your palms face your shoulders at the top of the movement.\n\nStep 4: Return/Repeat Lower the dumbbells back to the starting position, rotating your wrists back to the original position, and repeat for the desired number of repetitions.","coachingCues":[],"primaryEquipment":["Dumbbells"],"muscleGroups":["biceps"],"imageUrl":"https://img.youtube.com/vi/5l9fg7Cml0Y/hqdefault.jpg","videoId":"5l9fg7Cml0Y","videoUrl":"https://www.youtube.com/watch?v=5l9fg7Cml0Y","videoThumbnailUrl":"https://img.youtube.com/vi/5l9fg7Cml0Y/hqdefault.jpg","candidatePhotoUrl":"/images/exercises/dumbbell-combination-curl.jpg","hasCandidatePhoto":true,"warnings":[],"ytTitle":"How to do a Dumbbell Combination Curl","ytAuthor":"National Academy of Sports Medicine (NASM)","ytStatus":"OK","card":{"category":"Arms","phase":"Phase 1: Stabilization · Phase 2: Strength Endurance · Phase 3: Hypertrophy","primeMover":"Biceps Brachii","kineticCheckpoints":{"feetAnkles":"Shoulder-width, firmly planted on ground.","knees":"Aligned with second and third toes.","lphc":"Neutral lumbar spine; core braced.","shoulders":"Retracted and depressed into athletic posture.","headNeck":"Neutral cervical spine, chin packed."},"clinicalCues":["Maintain neutral kinetic chain checkpoints throughout.","Control the 2-second eccentric lowering phase.","Exhale on exertion while maintaining intra-abdominal brace."],"howToSteps":["1. Setup Stand with feet shoulder-width apart, holding a dumbbell in each hand at your sides with palms facing forward.","2. Brace/Position Engage your core and maintain a neutral spine, keeping your elbows close to your torso.","3. Execute Curl the dumbbells up towards your shoulders, rotating your wrists so that your palms face your shoulders at the top of the movement.","4. Return/Repeat Lower the dumbbells back to the starting position, rotating your wrists back to the original position, and repeat for the desired number of repetitions."]}},{"id":"ac4f63cb-05f4-486a-adcf-bca551fa7a94","name":"Dumbbell Front Squat","slug":"dumbbell-front-squat","description":"Step 1: Stand in athletic posture with feet hip to shoulder width apart and toes forward. Draw in and brace the abs. Pull the shoulder blades back and down and lock the elbows into the side of the body. Balance the dumbbells above the elbows at all times (or set them on the shoulders).\n\nStep 2: Drive the hips back and squat down to a maximum depth that posture and alignment can be maintained (typically between 90˚ at the knee and thigh parallel to the floor). Keep the weight balanced from heel to ball of foot and torso fairly upright.\n\nStep 3: Reverse the pattern and return to the starting position. Maintain posture throughout.\n\nStep 4: Repeat for the desired number of repetitions. Avoid slouching the back or shoulders, letting the elbows flare out, knees caving in or toes turning out.","coachingCues":[],"primaryEquipment":["Dumbbells"],"muscleGroups":["glutes","hamstrings","quadriceps"],"imageUrl":"https://img.youtube.com/vi/hZI8Yy5elZs/hqdefault.jpg","videoId":"hZI8Yy5elZs","videoUrl":"https://www.youtube.com/watch?v=hZI8Yy5elZs","videoThumbnailUrl":"https://img.youtube.com/vi/hZI8Yy5elZs/hqdefault.jpg","candidatePhotoUrl":"/images/exercises/dumbbell-front-squat.jpg","hasCandidatePhoto":true,"warnings":[],"ytTitle":"How to do a Dumbbell Front Squat | Proper Form & Technique | NASM","ytAuthor":"National Academy of Sports Medicine (NASM)","ytStatus":"OK","card":{"category":"Legs","phase":"Phase 2 (Strength Endurance), Phase 3 (Hypertrophy), Phase 4 (Max Strength)","primeMover":"Quadriceps (Vastus Lateralis, Medialis, Intermedius, Rectus Femoris) & Gluteus Maximus","kineticCheckpoints":{"feetAnkles":"Shoulder-width apart, toes forward or slightly flared (5°–10°), heels flat on ground.","knees":"Track directly over second and third toes; avoid valgus collapse.","lphc":"Maintain upright thoracic spine and neutral lumbar lordosis; core braced.","shoulders":"Elbows driven high and forward parallel to floor in front rack position.","headNeck":"Neutral cervical spine, chin packed, eyes looking straight forward."},"clinicalCues":["Drive elbows high toward the ceiling throughout the lift to prevent forward torso dump.","Maintain an upright chest and vertical spine to direct load to quadriceps.","Keep knees tracking over second toes and heels flat on floor."],"howToSteps":["1. Stand in athletic posture with feet hip to shoulder width apart and toes forward. Draw in and brace the abs. Pull the shoulder blades back and down and lock the elbows into the side of the body. Balance the dumbbells above the elbows at all times (or set them on the shoulders).","2. Drive the hips back and squat down to a maximum depth that posture and alignment can be maintained (typically between 90˚ at the knee and thigh parallel to the floor). Keep the weight balanced from heel to ball of foot and torso fairly upright.","3. Reverse the pattern and return to the starting position. Maintain posture throughout.","4. Repeat for the desired number of repetitions. Avoid slouching the back or shoulders, letting the elbows flare out, knees caving in or toes turning out."]}},{"id":"bbc099b2-913d-427a-a885-8c652bd0a19c","name":"Dumbbell Hammer Curl","slug":"dumbbell-hammer-curl-0098","description":"Step 1: Setup Stand with your feet shoulder-width apart, holding a dumbbell in each hand with your arms fully extended at your sides, palms facing each other.\n\nStep 2: Brace/Position Engage your core and maintain a neutral spine, keeping your elbows close to your torso.\n\nStep 3: Execute Curl the dumbbells upward by flexing your elbows, bringing them towards your shoulders while keeping your palms facing each other throughout the movement.\n\nStep 4: Return/Repeat Lower the dumbbells back to the starting position in a controlled manner, fully extending your arms before repeating the movement.","coachingCues":[],"primaryEquipment":["Dumbbells"],"muscleGroups":["biceps"],"imageUrl":"https://img.youtube.com/vi/nL3SedGG7X0/hqdefault.jpg","videoId":"nL3SedGG7X0","videoUrl":"https://www.youtube.com/watch?v=nL3SedGG7X0","videoThumbnailUrl":"https://img.youtube.com/vi/nL3SedGG7X0/hqdefault.jpg","candidatePhotoUrl":"/images/exercises/dumbbell-hammer-curl.jpg","hasCandidatePhoto":true,"warnings":[],"ytTitle":"How to do a Dumbbell Hammer Curl","ytAuthor":"National Academy of Sports Medicine (NASM)","ytStatus":"OK","card":{"category":"Arms","phase":"Phase 1 (Stabilization Endurance), Phase 2 (Strength Endurance), Phase 3 (Hypertrophy)","primeMover":"Brachioradialis & Brachialis","kineticCheckpoints":{"feetAnkles":"Hip-width apart, straight and parallel, weight evenly distributed through tripod foot (heels and midfoot).","knees":"Soft athletic micro-bend (never hyperextended or locked), aligned over second and third toes.","lphc":"Neutral pelvis and lumbar lordosis; core braced to prevent sagittal trunk sway, swinging, or lumbar hyperextension.","shoulders":"Scapulae retracted and depressed; elbows pinned firmly against lateral ribcage as stationary hinges; strict neutral grip (palms facing inward toward each other, thumbs pointing straight up toward ceiling, dumbbell heads vertical, strictly zero supination or twisting).","headNeck":"Neutral cervical spine, chin packed/tucked, gaze directed straight ahead."},"clinicalCues":["Maintain strict neutral grip with palms facing inward and thumbs pointing up—strictly zero wrist twisting or supination.","Dumbbell orientation must remain strictly vertical (top head pointing at ceiling, bottom head at floor).","Lock elbows against lateral ribcage as fixed hinges; avoid elbow flare or anterior drift into shoulder flexion.","Brace core and engage glutes to eliminate backward torso sway or momentum."],"howToSteps":["1. Setup Stand with your feet shoulder-width apart, holding a dumbbell in each hand with your arms fully extended at your sides, palms facing each other.","2. Brace/Position Engage your core and maintain a neutral spine, keeping your elbows close to your torso.","3. Execute Curl the dumbbells upward by flexing your elbows, bringing them towards your shoulders while keeping your palms facing each other throughout the movement.","4. Return/Repeat Lower the dumbbells back to the starting position in a controlled manner, fully extending your arms before repeating the movement."]}},{"id":"3bf3fdac-0012-40d8-9050-0fa92076c30e","name":"Dumbbell Lateral Raise","slug":"dumbbell-lateral-raise-0102","description":"Step 1: Setup Stand with feet shoulder-width apart, holding a dumbbell in each hand at your sides with palms facing your body.\n\nStep 2: Brace/Position Engage your core and maintain a slight bend in your elbows while keeping your arms straight but not locked.\n\nStep 3: Execute Raise the dumbbells out to the sides until they reach shoulder height, keeping your elbows slightly above your wrists and your palms facing down.\n\nStep 4: Return/Repeat Lower the dumbbells back to the starting position with control and repeat for the desired number of repetitions.","coachingCues":[],"primaryEquipment":["Dumbbells"],"muscleGroups":["shoulders"],"imageUrl":"https://img.youtube.com/vi/XPPfnSEATJA/hqdefault.jpg","videoId":"XPPfnSEATJA","videoUrl":"https://www.youtube.com/watch?v=XPPfnSEATJA","videoThumbnailUrl":"https://img.youtube.com/vi/XPPfnSEATJA/hqdefault.jpg","candidatePhotoUrl":"/images/exercises/dumbbell-lateral-raise.jpg","hasCandidatePhoto":true,"warnings":[],"ytTitle":"How to do a Dumbbell Lateral Raise","ytAuthor":"National Academy of Sports Medicine (NASM)","ytStatus":"OK","card":{"category":"Shoulders","phase":"Phase 2 (Strength Endurance), Phase 3 (Hypertrophy)","primeMover":"Middle (Lateral) Deltoid","kineticCheckpoints":{"feetAnkles":"Hip-width apart in athletic stance.","knees":"Soft 10° bend.","lphc":"Neutral pelvis with slight forward torso hinge (5°).","shoulders":"Lead with elbows in the scapular plane (30° anterior to frontal plane).","headNeck":"Neutral neck; avoid shrugging traps up toward ears."},"clinicalCues":["Raise in scapular plane (30° forward) to protect supraspinatus tendon from impingement.","Lead with elbows and keep pinkies slightly higher than thumbs.","Do not shrug traps or swing torso to generate momentum."],"howToSteps":["1. Setup Stand with feet shoulder-width apart, holding a dumbbell in each hand at your sides with palms facing your body.","2. Brace/Position Engage your core and maintain a slight bend in your elbows while keeping your arms straight but not locked.","3. Execute Raise the dumbbells out to the sides until they reach shoulder height, keeping your elbows slightly above your wrists and your palms facing down.","4. Return/Repeat Lower the dumbbells back to the starting position with control and repeat for the desired number of repetitions."]}},{"id":"cc4ff35f-3457-4ad0-a02a-83020d5e72b1","name":"Dumbbell Overhead Press","slug":"dumbbell-overhead-press-0104","description":"Step 1: Setup Stand with your feet shoulder-width apart, holding a dumbbell in each hand at shoulder height with palms facing forward.\n\nStep 2: Brace/Position Engage your core and maintain a neutral spine, ensuring your elbows are slightly in front of your body and your wrists are straight.\n\nStep 3: Execute Press the dumbbells overhead by extending your arms fully while keeping your elbows slightly bent at the top of the movement.\n\nStep 4: Return/Repeat Lower the dumbbells back to shoulder height in a controlled manner, then repeat for the desired number of repetitions.","coachingCues":[],"primaryEquipment":["Dumbbells"],"muscleGroups":["shoulders","triceps"],"imageUrl":"https://img.youtube.com/vi/MMjBnEBnZKM/hqdefault.jpg","videoId":"MMjBnEBnZKM","videoUrl":"https://www.youtube.com/watch?v=MMjBnEBnZKM","videoThumbnailUrl":"https://img.youtube.com/vi/MMjBnEBnZKM/hqdefault.jpg","candidatePhotoUrl":"/images/exercises/dumbbell-overhead-press.jpg","hasCandidatePhoto":true,"warnings":[],"ytTitle":"How to do a Dumbbell Overhead Press","ytAuthor":"National Academy of Sports Medicine (NASM)","ytStatus":"OK","card":{"category":"Shoulders","phase":"Phase 1 (Stabilization Endurance)","primeMover":"Anterior & Medial Deltoids","kineticCheckpoints":{"feetAnkles":"Single-leg stance on balance leg; tripod foot pressure (heel, first MTP, fifth MTP) pointing straight ahead with active arch.","knees":"Soft 10°–15° knee bend on stance leg; knee tracking directly over second and third toes (no valgus collapse).","lphc":"Pelvis level and square; gluteus medius contracted to prevent contralateral hip drop; core engaged to prevent lumbar hyperextension.","shoulders":"Scapulae depressed and retracted; elbows slightly forward in scapular plane (30° anterior); press vertically overhead without trap shrugging.","headNeck":"Cervical spine neutral with chin packed; eyes fixed on an eye-level focal point to preserve vestibular balance."},"clinicalCues":["Strictly avoid arching the lower back or flaring the ribcage as dumbbells reach overhead lockout.","Maintain level hips throughout the entire movement; do not allow the non-standing hip to drop (prevent Trendelenburg sign).","Press through the center of the stance foot tripod with a soft knee to stabilize the lower kinetic chain.","Keep shoulders depressed away from the ears; do not shrug the upper trapezius to finish the press."],"howToSteps":["1. Setup Stand with your feet shoulder-width apart, holding a dumbbell in each hand at shoulder height with palms facing forward.","2. Brace/Position Engage your core and maintain a neutral spine, ensuring your elbows are slightly in front of your body and your wrists are straight.","3. Execute Press the dumbbells overhead by extending your arms fully while keeping your elbows slightly bent at the top of the movement.","4. Return/Repeat Lower the dumbbells back to shoulder height in a controlled manner, then repeat for the desired number of repetitions."]}},{"id":"170ad3b7-bc2c-4d4f-8a84-903f071b26b9","name":"Dumbbell Preacher Curl","slug":"dumbbell-preacher-curl-0105","description":"Step 1: Setup Sit on a preacher bench with your upper arms resting on the pad, holding a dumbbell in one hand with an underhand grip.\n\nStep 2: Brace/Position Keep your back straight and feet flat on the ground, ensuring your elbows are positioned at the edge of the pad.\n\nStep 3: Execute Curl the dumbbell upward towards your shoulder by flexing your elbow, squeezing your bicep at the top of the movement.\n\nStep 4: Return/Repeat Lower the dumbbell back to the starting position in a controlled manner, fully extending your arm before repeating the movement.","coachingCues":[],"primaryEquipment":["Dumbbells"],"muscleGroups":["biceps"],"imageUrl":"https://img.youtube.com/vi/t2BmBSmcjco/hqdefault.jpg","videoId":"t2BmBSmcjco","videoUrl":"https://www.youtube.com/watch?v=t2BmBSmcjco","videoThumbnailUrl":"https://img.youtube.com/vi/t2BmBSmcjco/hqdefault.jpg","candidatePhotoUrl":"/images/exercises/dumbbell-preacher-curl.jpg","hasCandidatePhoto":true,"warnings":[],"ytTitle":"How to do a Dumbbell Preacher Curl","ytAuthor":"National Academy of Sports Medicine (NASM)","ytStatus":"OK","card":{"category":"Arms","phase":"Phase 1: Stabilization · Phase 2: Strength Endurance · Phase 3: Hypertrophy","primeMover":"Biceps Brachii","kineticCheckpoints":{"feetAnkles":"Shoulder-width, firmly planted on ground.","knees":"Aligned with second and third toes.","lphc":"Neutral lumbar spine; core braced.","shoulders":"Retracted and depressed into athletic posture.","headNeck":"Neutral cervical spine, chin packed."},"clinicalCues":["Maintain neutral kinetic chain checkpoints throughout.","Control the 2-second eccentric lowering phase.","Exhale on exertion while maintaining intra-abdominal brace."],"howToSteps":["1. Setup Sit on a preacher bench with your upper arms resting on the pad, holding a dumbbell in one hand with an underhand grip.","2. Brace/Position Keep your back straight and feet flat on the ground, ensuring your elbows are positioned at the edge of the pad.","3. Execute Curl the dumbbell upward towards your shoulder by flexing your elbow, squeezing your bicep at the top of the movement.","4. Return/Repeat Lower the dumbbell back to the starting position in a controlled manner, fully extending your arm before repeating the movement."]}},{"id":"43d0bdec-43e3-46da-bf14-6cb94ad2c973","name":"Dumbbell Push Press","slug":"dumbbell-push-press-0106","description":"Step 1: Setup Stand with your feet shoulder-width apart, holding a dumbbell in each hand at shoulder height with palms facing forward.\n\nStep 2: Brace/Position Engage your core and slightly bend your knees while keeping your chest up and shoulders back.\n\nStep 3: Execute Press the dumbbells overhead by extending your arms and using your legs to generate upward momentum, keeping the dumbbells aligned with your ears.\n\nStep 4: Return/Repeat Lower the dumbbells back to shoulder height in a controlled manner, ensuring to maintain core engagement throughout the movement.","coachingCues":[],"primaryEquipment":["Dumbbells"],"muscleGroups":["deltoids","glutes","hamstrings","quadriceps","shoulders","triceps"],"imageUrl":"https://img.youtube.com/vi/vuaYVK8xyqo/hqdefault.jpg","videoId":"vuaYVK8xyqo","videoUrl":"https://www.youtube.com/watch?v=vuaYVK8xyqo","videoThumbnailUrl":"https://img.youtube.com/vi/vuaYVK8xyqo/hqdefault.jpg","candidatePhotoUrl":"/images/exercises/dumbbell-push-press.jpg","hasCandidatePhoto":true,"warnings":[],"ytTitle":"How to do a Dumbbell Push Press","ytAuthor":"National Academy of Sports Medicine (NASM)","ytStatus":"OK","card":{"category":"Plyometrics","phase":"Phase 5 (Power)","primeMover":"Deltoids & Quadriceps / Gluteals (Triple Extension Transfer)","kineticCheckpoints":{"feetAnkles":"Shoulder-width apart, heels grounded through takeoff and landing.","knees":"Quick 2–3 inch dip tracking directly over second toes; avoid valgus cave.","lphc":"Vertical torso during dip-drive; no forward chest collapse or spinal arching.","shoulders":"Barbell or dumbbells racked securely across anterior deltoids.","headNeck":"Neutral cervical spine; head moves slightly back to clear bar path."},"clinicalCues":["Use explosive leg drive to initiate bar momentum before pressing arms.","Keep torso vertical during the shallow knee dip (avoid forward hinge).","Lock out weight overhead with biceps next to ears and core braced."],"howToSteps":["1. Setup Stand with your feet shoulder-width apart, holding a dumbbell in each hand at shoulder height with palms facing forward.","2. Brace/Position Engage your core and slightly bend your knees while keeping your chest up and shoulders back.","3. Execute Press the dumbbells overhead by extending your arms and using your legs to generate upward momentum, keeping the dumbbells aligned with your ears.","4. Return/Repeat Lower the dumbbells back to shoulder height in a controlled manner, ensuring to maintain core engagement throughout the movement."]}},{"id":"067424d7-272e-4cfd-a2ac-3e218ded2f4a","name":"Dumbbell Rack Carry","slug":"dumbbell-rack-carry-0107","description":"Step 1: Setup Stand upright with a dumbbell in each hand, arms fully extended at your sides, feet shoulder-width apart.\n\nStep 2: Brace/Position Engage your core, keep your shoulders back and down, and maintain a neutral spine.\n\nStep 3: Execute Begin walking forward in a straight line, maintaining an upright posture and controlled pace, while keeping the dumbbells stable at your sides.\n\nStep 4: Return/Repeat Walk for a designated distance or time, then carefully set the dumbbells down on the ground before resting or repeating the exercise.","coachingCues":[],"primaryEquipment":["Dumbbells"],"muscleGroups":["back","shoulders"],"imageUrl":"https://img.youtube.com/vi/IA2tycCS8DI/hqdefault.jpg","videoId":"IA2tycCS8DI","videoUrl":"https://www.youtube.com/watch?v=IA2tycCS8DI","videoThumbnailUrl":"https://img.youtube.com/vi/IA2tycCS8DI/hqdefault.jpg","candidatePhotoUrl":"/images/exercises/dumbbell-rack-carry.jpg","hasCandidatePhoto":true,"warnings":[],"ytTitle":"How to do a Dumbbell Rack Carry","ytAuthor":"National Academy of Sports Medicine (NASM)","ytStatus":"OK","card":{"category":"Back","phase":"Phase 1: Stabilization · Phase 2: Strength Endurance · Phase 3: Hypertrophy","primeMover":"Latissimus Dorsi, Rhomboids & Middle Trapezius","kineticCheckpoints":{"feetAnkles":"Shoulder-width, firmly planted on ground.","knees":"Aligned with second and third toes.","lphc":"Neutral lumbar spine; core braced.","shoulders":"Retracted and depressed into athletic posture.","headNeck":"Neutral cervical spine, chin packed."},"clinicalCues":["Maintain neutral kinetic chain checkpoints throughout.","Control the 2-second eccentric lowering phase.","Exhale on exertion while maintaining intra-abdominal brace."],"howToSteps":["1. Setup Stand upright with a dumbbell in each hand, arms fully extended at your sides, feet shoulder-width apart.","2. Brace/Position Engage your core, keep your shoulders back and down, and maintain a neutral spine.","3. Execute Begin walking forward in a straight line, maintaining an upright posture and controlled pace, while keeping the dumbbells stable at your sides.","4. Return/Repeat Walk for a designated distance or time, then carefully set the dumbbells down on the ground before resting or repeating the exercise."]}},{"id":"413a9fc5-a91c-4d76-a875-db58b877904e","name":"Dumbbell Renegade Row To Push Up","slug":"dumbbell-renegade-row-to-push-up-0111","description":"Step 1: Setup Position two dumbbells on the floor shoulder-width apart and assume a high plank position with your hands gripping the dumbbells, feet hip-width apart, and body in a straight line from head to heels.\n\nStep 2: Brace/Position Engage your core, keep your hips level, and maintain a neutral spine as you prepare to row the dumbbell.\n\nStep 3: Execute Row one dumbbell towards your hip while stabilizing your body, then place it back down and perform a push-up by lowering your chest to the ground and pressing back up.\n\nStep 4: Return/Repeat Alternate rowing the opposite dumbbell and continue the sequence for the desired number of repetitions.","coachingCues":[],"primaryEquipment":["Dumbbells"],"muscleGroups":["back","biceps","chest","shoulders","triceps"],"imageUrl":"https://img.youtube.com/vi/RuJ9a05aa0A/hqdefault.jpg","videoId":"RuJ9a05aa0A","videoUrl":"https://www.youtube.com/watch?v=RuJ9a05aa0A","videoThumbnailUrl":"https://img.youtube.com/vi/RuJ9a05aa0A/hqdefault.jpg","candidatePhotoUrl":"/images/exercises/dumbbell-renegade-row-to-push-up.jpg","hasCandidatePhoto":true,"warnings":[],"ytTitle":"How to do a Dumbbell Renegade Row to Push-Up","ytAuthor":"National Academy of Sports Medicine (NASM)","ytStatus":"OK","card":{"category":"Chest","phase":"Phase 1 (Stabilization Endurance), Phase 2 (Strength Endurance)","primeMover":"Pectoralis Major, Latissimus Dorsi & Deep Core Stabilizers","kineticCheckpoints":{"feetAnkles":"Feet set hip-to-shoulder width apart on balls of feet for anti-rotational stability.","knees":"Fully extended, quadriceps braced.","lphc":"Rigid neutral plank alignment; avoid hip sag or pelvic tilt.","shoulders":"Scapulae protract and retract with control; hands directly under shoulders.","headNeck":"Neutral cervical spine, chin packed, eyes on floor."},"clinicalCues":["Prevent hip rotation by actively driving opposite toes into floor.","Maintain rigid lumbo-pelvic-hip complex alignment throughout.","Perform push-up with elbows at 45 degrees to torso."],"howToSteps":["1. Setup Position two dumbbells on the floor shoulder-width apart and assume a high plank position with your hands gripping the dumbbells, feet hip-width apart, and body in a straight line from head to heels.","2. Brace/Position Engage your core, keep your hips level, and maintain a neutral spine as you prepare to row the dumbbell.","3. Execute Row one dumbbell towards your hip while stabilizing your body, then place it back down and perform a push-up by lowering your chest to the ground and pressing back up.","4. Return/Repeat Alternate rowing the opposite dumbbell and continue the sequence for the desired number of repetitions."]}},{"id":"fc8a4137-a083-41cb-9dc2-dd92c43d32f8","name":"Dumbbell Romanian Deadlift","slug":"dumbbell-romanian-deadlift","description":"Step 1: Stand in athletic posture with your feet hip to shoulder width, toes pointing straight ahead and knees unlocked. Hinge at the hips and bend the knees to grab onto the dumbbells and stand. Brace the abs and lock the shoulder blades back and down.\n\nStep 2: Hold the dumbbells in front of your thighs. Hinge at the hips and lower the dumbbells through a maximum range that you can maintain good posture. Keep the back flat and dumbbells close to the body at all times.\n\nStep 3: Reverse the pattern pushing the hips forward to return to the starting position. Maintain posture throughout.\n\nStep 4: Repeat for the desired number of repetitions. Avoid locking knees, slouching or over arching the lower and upper back. Keep the head in line with the back at all times.","coachingCues":[],"primaryEquipment":["Dumbbells"],"muscleGroups":["back","glutes","hamstrings"],"imageUrl":"https://img.youtube.com/vi/V8Hdl1FiNt4/hqdefault.jpg","videoId":"V8Hdl1FiNt4","videoUrl":"https://www.youtube.com/watch?v=V8Hdl1FiNt4","videoThumbnailUrl":"https://img.youtube.com/vi/V8Hdl1FiNt4/hqdefault.jpg","candidatePhotoUrl":"/images/exercises/dumbbell-romanian-deadlift.jpg","hasCandidatePhoto":true,"warnings":[],"ytTitle":"How to Do a Dumbbell Romanian Deadlift | Proper Form & Technique | NASM","ytAuthor":"National Academy of Sports Medicine (NASM)","ytStatus":"OK","card":{"category":"Back","phase":"Phase 2 (Strength Endurance), Phase 3 (Hypertrophy)","primeMover":"Hamstrings Complex (Biceps Femoris, Semitendinosus, Semimembranosus) & Gluteus Maximus","kineticCheckpoints":{"feetAnkles":"Hip-width apart, feet parallel pointing straight ahead.","knees":"Slight \"soft\" 15°–20° bend maintained statically throughout the hinge.","lphc":"Neutral pelvis; hinge backward from acetabulofemoral hip joints.","shoulders":"Scapulae retracted and depressed, preventing upper back rounding.","headNeck":"Cervical spine aligned with thoracic spine during the entire hinge."},"clinicalCues":["Think \"push hips back\" rather than \"bend forward\".","Keep bar within 1 inch of shins at all times.","Stop descent immediately if lumbar spine begins to round."],"howToSteps":["1. Stand in athletic posture with your feet hip to shoulder width, toes pointing straight ahead and knees unlocked. Hinge at the hips and bend the knees to grab onto the dumbbells and stand. Brace the abs and lock the shoulder blades back and down.","2. Hold the dumbbells in front of your thighs. Hinge at the hips and lower the dumbbells through a maximum range that you can maintain good posture. Keep the back flat and dumbbells close to the body at all times.","3. Reverse the pattern pushing the hips forward to return to the starting position. Maintain posture throughout.","4. Repeat for the desired number of repetitions. Avoid locking knees, slouching or over arching the lower and upper back. Keep the head in line with the back at all times."]}},{"id":"97519c9e-124a-4ee4-8307-d36980b93f4a","name":"Dumbbell Squat To Overhead Press","slug":"dumbbell-squat-to-overhead-press-0115","description":"Step 1: Setup Stand with feet shoulder-width apart, holding a dumbbell in each hand at shoulder height with palms facing forward.\n\nStep 2: Brace/Position Engage your core, keeping your chest up and back straight, while slightly bending your knees in preparation for the squat.\n\nStep 3: Execute Lower your body into a squat by bending at the hips and knees, keeping the dumbbells at shoulder height, then press through your heels to stand up while simultaneously pressing the dumbbells overhead.\n\nStep 4: Return/Repeat Lower the dumbbells back to shoulder height as you descend into the squat again, maintaining control throughout the movement.","coachingCues":[],"primaryEquipment":["Dumbbells"],"muscleGroups":["glutes","hamstrings","quadriceps","shoulders","triceps"],"imageUrl":"https://img.youtube.com/vi/9k6IfkGBAVQ/hqdefault.jpg","videoId":"9k6IfkGBAVQ","videoUrl":"https://www.youtube.com/watch?v=9k6IfkGBAVQ","videoThumbnailUrl":"https://img.youtube.com/vi/9k6IfkGBAVQ/hqdefault.jpg","candidatePhotoUrl":"/images/exercises/dumbbell-squat-to-overhead-press.jpg","hasCandidatePhoto":true,"warnings":[],"ytTitle":"How to do a Dumbbell Squat to Overhead Press","ytAuthor":"National Academy of Sports Medicine (NASM)","ytStatus":"OK","card":{"category":"Legs","phase":"Phase 1 (Stabilization Endurance), Phase 2 (Strength Endurance), Phase 5 (Power)","primeMover":"Quadriceps, Gluteus Maximus & Anterior/Middle Deltoids","kineticCheckpoints":{"feetAnkles":"Shoulder-width apart, parallel, pointing straight ahead.","knees":"Tracking over second and third toes during squat descent and ascent.","lphc":"Maintain neutral spine; brace core to prevent lumbar hyperextension.","shoulders":"Press dumbbells vertically into overhead lockout in plane of scapula.","headNeck":"Cervical spine neutral; eyes looking straight ahead."},"clinicalCues":["Transfer kinetic momentum smoothly from leg drive into overhead press.","Keep knees tracking over second toes throughout squat descent.","Do not arch lower back excessively at overhead lockout."],"howToSteps":["1. Setup Stand with feet shoulder-width apart, holding a dumbbell in each hand at shoulder height with palms facing forward.","2. Brace/Position Engage your core, keeping your chest up and back straight, while slightly bending your knees in preparation for the squat.","3. Execute Lower your body into a squat by bending at the hips and knees, keeping the dumbbells at shoulder height, then press through your heels to stand up while simultaneously pressing the dumbbells overhead.","4. Return/Repeat Lower the dumbbells back to shoulder height as you descend into the squat again, maintaining control throughout the movement."]}},{"id":"e87acc5c-d1fa-4eb4-98b5-78c0be3bf2ee","name":"Face Pull","slug":"face-pull","description":"Step 1: Position the cable slightly above the head and grasp the rope with the thumbs pointing toward you. Stand tall with your feet slightly staggered and toes pointing straight ahead. Draw your abs.\n\nStep 2: Pull the cable toward your face by bending your elbows out to the side and pinching your shoulder blades together attempting to drive your fists by your ears.\n\nStep 3: Reverse the pattern and return to the starting position.\n\nStep 4: Repeat. Maintain posture throughout. Avoid jutting the chin forward, arching the lower back, letting the ribs flare, or shrugging the shoulders.","coachingCues":[],"primaryEquipment":["Cable Machine","Rope"],"muscleGroups":["shoulders"],"imageUrl":"https://img.youtube.com/vi/eTCBSFlCJ_s/hqdefault.jpg","videoId":"eTCBSFlCJ_s","videoUrl":"https://www.youtube.com/watch?v=eTCBSFlCJ_s","videoThumbnailUrl":"https://img.youtube.com/vi/eTCBSFlCJ_s/hqdefault.jpg","candidatePhotoUrl":"/images/exercises/face-pull.jpg","hasCandidatePhoto":true,"warnings":[],"ytTitle":"How to do a Face Pull | Proper Form & Technique | NASM","ytAuthor":"National Academy of Sports Medicine (NASM)","ytStatus":"OK","card":{"category":"Shoulders","phase":"Phase 1 (Stabilization Endurance), Phase 2 (Strength Endurance)","primeMover":"Posterior Deltoid & External Rotators (Infraspinatus, Teres Minor)","kineticC
