, bringing your heel towards your glutes while keeping your left leg straight and engaged.\n\nStep 4: Return/Repeat Slowly lower your right foot back to the starting position and repeat for the desired number of repetitions before switching to the left leg.","coachingCues":[],"primaryEquipment":[],"muscleGroups":["glutes","hamstrings","quadriceps"],"imageUrl":"https://img.youtube.com/vi/A3fmhDWoSm0/hqdefault.jpg","videoId":"A3fmhDWoSm0","videoUrl":"https://www.youtube.com/watch?v=A3fmhDWoSm0","videoThumbnailUrl":"https://img.youtube.com/vi/A3fmhDWoSm0/hqdefault.jpg","candidatePhotoUrl":"/images/exercises/active-supine-biceps-femoris.jpg","hasCandidatePhoto":true,"warnings":[],"ytTitle":"How to do a Active Supine Biceps Femoris","ytAuthor":"National Academy of Sports Medicine (NASM)","ytStatus":"OK","card":{"category":"Flexibility/SMR","phase":"Phase 1: Stabilization · Phase 2: Strength Endurance · Phase 3: Hypertrophy","primeMover":"Target Neuromuscular / Fascial System","kineticCheckpoints":{"feetAnkles":"Shoulder-width, firmly planted on ground.","knees":"Aligned with second and third toes.","lphc":"Neutral lumbar spine; core braced.","shoulders":"Retracted and depressed into athletic posture.","headNeck":"Neutral cervical spine, chin packed."},"clinicalCues":["Maintain neutral kinetic chain checkpoints throughout.","Control the 2-second eccentric lowering phase.","Exhale on exertion while maintaining intra-abdominal brace."],"howToSteps":["1. Setup Lie on your back on a flat surface with your legs extended and feet hip-width apart.","2. Brace/Position Engage your core and press your lower back into the surface while keeping your arms at your sides, palms facing down.","3. Execute Flex your right knee, bringing your heel towards your glutes while keeping your left leg straight and engaged.","4. Return/Repeat Slowly lower your right foot back to the starting position and repeat for the desired number of repetitions before switching to the left leg."]}},{"id":"ca5a1084-a8a1-424f-ab9e-0b69eb8ab786","name":"Ali Shuffle Ladder Drill","slug":"ali-shuffle-ladder-drill-0152","description":"Step 1: Setup Stand beside the agility ladder with your feet shoulder-width apart and knees slightly bent.\n\nStep 2: Brace/Position Position your body in an athletic stance, with your core engaged and arms bent at 90 degrees, ready to move.\n\nStep 3: Execute Step laterally into the first square of the ladder with your right foot, followed quickly by your left foot, then step out of the ladder with your right foot, followed by your left foot.\n\nStep 4: Return/Repeat Continue the lateral movement down the ladder, alternating your lead foot, and maintain a quick pace throughout the drill.","coachingCues":[],"primaryEquipment":[],"muscleGroups":["full body"],"imageUrl":"https://img.youtube.com/vi/_Tc751vW_lM/hqdefault.jpg","videoId":"_Tc751vW_lM","videoUrl":"https://www.youtube.com/watch?v=_Tc751vW_lM","videoThumbnailUrl":"https://img.youtube.com/vi/_Tc751vW_lM/hqdefault.jpg","candidatePhotoUrl":"/images/exercises/ali-shuffle-ladder-drill.jpg","hasCandidatePhoto":true,"warnings":[],"ytTitle":"How to do an Ali Shuffle (Ladder Drill)","ytAuthor":"National Academy of Sports Medicine (NASM)","ytStatus":"OK","card":{"category":"Core","phase":"Phase 1: Stabilization · Phase 2: Strength Endurance · Phase 3: Hypertrophy","primeMover":"Core Musculature","kineticCheckpoints":{"feetAnkles":"Shoulder-width, firmly planted on ground.","knees":"Aligned with second and third toes.","lphc":"Neutral lumbar spine; core braced.","shoulders":"Retracted and depressed into athletic posture.","headNeck":"Neutral cervical spine, chin packed."},"clinicalCues":["Maintain neutral kinetic chain checkpoints throughout.","Control the 2-second eccentric lowering phase.","Exhale on exertion while maintaining intra-abdominal brace."],"howToSteps":["1. Setup Stand beside the agility ladder with your feet shoulder-width apart and knees slightly bent.","2. Brace/Position Position your body in an athletic stance, with your core engaged and arms bent at 90 degrees, ready to move.","3. Execute Step laterally into the first square of the ladder with your right foot, followed quickly by your left foot, then step out of the ladder with your right foot, followed by your left foot.","4. Return/Repeat Continue the lateral movement down the ladder, alternating your lead foot, and maintain a quick pace throughout the drill."]}},{"id":"7dd1b64b-0edf-477d-99fd-f5589171fb1b","name":"Alternating Dumbbell Bench Press","slug":"alternating-dumbbell-bench-press-0092","description":"Step 1: Setup Lie on a flat bench with a dumbbell in each hand, arms extended above your chest, and feet flat on the floor.\n\nStep 2: Brace/Position Engage your core and retract your shoulder blades, ensuring your back is flat against the bench.\n\nStep 3: Execute Lower one dumbbell towards your chest while keeping the other arm extended, maintaining control throughout the movement.\n\nStep 4: Return/Repeat Press the lowered dumbbell back to the starting position and alternate arms, repeating the movement for the desired number of repetitions.","coachingCues":[],"primaryEquipment":["Dumbbells","Bench"],"muscleGroups":["chest","shoulders","triceps"],"imageUrl":"https://img.youtube.com/vi/wOa4YyxyiKI/hqdefault.jpg","videoId":"wOa4YyxyiKI","videoUrl":"https://www.youtube.com/watch?v=wOa4YyxyiKI","videoThumbnailUrl":"https://img.youtube.com/vi/wOa4YyxyiKI/hqdefault.jpg","candidatePhotoUrl":"/images/exercises/alternating-dumbbell-bench-press.jpg","hasCandidatePhoto":true,"warnings":[],"ytTitle":"How to do a Alternating Dumbbell Bench Press","ytAuthor":"National Academy of Sports Medicine (NASM)","ytStatus":"OK","card":{"category":"Chest","phase":"Phase 1 (Stabilization Endurance), Phase 2 (Strength Endurance), Phase 3 (Hypertrophy)","primeMover":"Pectoralis Major (Sternal & Clavicular Heads)","kineticCheckpoints":{"feetAnkles":"Planted firmly on floor, shoulder-width apart, driving into ground.","knees":"Flexed at 90°, aligned with second/third toes.","lphc":"Glutes and hips pressed firmly into bench; maintain natural lumbar arch.","shoulders":"Scapulae retracted and depressed into bench pad; 45° elbow flare.","headNeck":"Resting flat on bench pad with chin neutral."},"clinicalCues":["Do not allow dumbbells to collide at the top; maintain active tension.","Keep shoulder blades pinched together into the bench throughout the lift.","Maintain 45° angle between upper arms and torso to protect rotator cuff."],"howToSteps":["1. Setup Lie on a flat bench with a dumbbell in each hand, arms extended above your chest, and feet flat on the floor.","2. Brace/Position Engage your core and retract your shoulder blades, ensuring your back is flat against the bench.","3. Execute Lower one dumbbell towards your chest while keeping the other arm extended, maintaining control throughout the movement.","4. Return/Repeat Press the lowered dumbbell back to the starting position and alternate arms, repeating the movement for the desired number of repetitions."]}},{"id":"b8734ae0-850f-4596-8df9-9c19d5bf9d34","name":"Archer Push Up","slug":"archer-push-up-0194","description":"Step 1: Setup Begin in a high plank position with your hands wider than shoulder-width apart and feet hip-width apart.\n\nStep 2: Brace/Position Engage your core and maintain a straight line from head to heels, shifting your weight to one side while bending that elbow to lower your body.\n\nStep 3: Execute Push your body back up to the starting position while straightening the bent arm and shifting your weight to the opposite side, lowering your body again.\n\nStep 4: Return/Repeat Continue alternating sides for the desired number of repetitions, ensuring to maintain proper form throughout the movement.","coachingCues":[],"primaryEquipment":[],"muscleGroups":["chest","shoulders","triceps"],"imageUrl":"https://img.youtube.com/vi/IDu6pRAPChg/hqdefault.jpg","videoId":"IDu6pRAPChg","videoUrl":"https://www.youtube.com/watch?v=IDu6pRAPChg","videoThumbnailUrl":"https://img.youtube.com/vi/IDu6pRAPChg/hqdefault.jpg","candidatePhotoUrl":"/images/exercises/archer-push-up.jpg","hasCandidatePhoto":true,"warnings":[],"ytTitle":"How to do an Archer Push-Up","ytAuthor":"National Academy of Sports Medicine (NASM)","ytStatus":"OK","card":{"category":"Chest","phase":"Phase 1 (Stabilization Endurance), Phase 2 (Strength Endurance)","primeMover":"Pectoralis Major","kineticCheckpoints":{"feetAnkles":"Together or hip-width apart, dorsiflexed on balls of feet.","knees":"Fully extended with active quadriceps contraction.","lphc":"Neutral pelvis; no sagging hips (anterior tilt) or pike (excessive flexion).","shoulders":"Hands placed slightly wider than shoulder-width, fingers pointing forward.","headNeck":"Neutral cervical spine, chin tucked, gaze looking 6 inches ahead."},"clinicalCues":["Engage glutes and brace core to maintain rigid plank posture.","Do not allow lower back to sag or head to jut forward toward the floor.","Push the ground away at the top of the rep to engage serratus anterior."],"howToSteps":["1. Setup Begin in a high plank position with your hands wider than shoulder-width apart and feet hip-width apart.","2. Brace/Position Engage your core and maintain a straight line from head to heels, shifting your weight to one side while bending that elbow to lower your body.","3. Execute Push your body back up to the starting position while straightening the bent arm and shifting your weight to the opposite side, lowering your body again.","4. Return/Repeat Continue alternating sides for the desired number of repetitions, ensuring to maintain proper form throughout the movement."]}},{"id":"e4fa58f3-7e1f-45f2-a16b-e6994257dbc1","name":"Assisted Single Leg Squat","slug":"assisted-single-leg-squat-0027","description":"Step 1: Setup Stand on one leg with a slight knee bend, lifting the opposite foot off the floor, Stand facing a sturdy object, such as a bench or wall, and position one foot slightly behind you, resting on the object for support.\n\nStep 2: Brace/Position Engage your core, level your pelvis with your stance glute, and maintain single-leg balance. Engage your core and maintain an upright torso, ensuring your standing foot is flat on the ground and aligned with your knee.\n\nStep 3: Execute Slowly lower your body by bending the standing knee, keeping the other leg elevated and extended behind you, until your thigh is parallel to the ground.\n\nStep 4: Return/Repeat Press through your heel to return to the starting position, then repeat for the desired number of repetitions before switching legs.","coachingCues":[],"primaryEquipment":[],"muscleGroups":["core","glutes","hamstrings","quadriceps"],"imageUrl":"https://img.youtube.com/vi/PkToneYECnY/hqdefault.jpg","videoId":"PkToneYECnY","videoUrl":"https://www.youtube.com/watch?v=PkToneYECnY","videoThumbnailUrl":"https://img.youtube.com/vi/PkToneYECnY/hqdefault.jpg","candidatePhotoUrl":"/images/exercises/assisted-single-leg-squat.jpg","hasCandidatePhoto":true,"warnings":[],"ytTitle":"How to do a Assisted Single Leg Squat","ytAuthor":"National Academy of Sports Medicine (NASM)","ytStatus":"OK","card":{"category":"Legs","phase":"Phase 1: Stabilization · Phase 2: Strength Endurance · Phase 3: Hypertrophy","primeMover":"Quadriceps & Gluteus Maximus","kineticCheckpoints":{"feetAnkles":"Shoulder-width, firmly planted on ground.","knees":"Aligned with second and third toes.","lphc":"Neutral lumbar spine; core braced.","shoulders":"Retracted and depressed into athletic posture.","headNeck":"Neutral cervical spine, chin packed."},"clinicalCues":["Maintain neutral kinetic chain checkpoints throughout.","Control the 2-second eccentric lowering phase.","Exhale on exertion while maintaining intra-abdominal brace."],"howToSteps":["1. Setup Stand on one leg with a slight knee bend, lifting the opposite foot off the floor, Stand facing a sturdy object, such as a bench or wall, and position one foot slightly behind you, resting on the object for support.","2. Brace/Position Engage your core, level your pelvis with your stance glute, and maintain single-leg balance. Engage your core and maintain an upright torso, ensuring your standing foot is flat on the ground and aligned with your knee.","3. Execute Slowly lower your body by bending the standing knee, keeping the other leg elevated and extended behind you, until your thigh is parallel to the ground.","4. Return/Repeat Press through your heel to return to the starting position, then repeat for the desired number of repetitions before switching legs."]}},{"id":"30f4fbef-8d6d-4757-b6c3-29a9b77c2e8e","name":"Ball Cobra","slug":"ball-cobra-0051","description":"Step 1: Setup Lie face down on a stability ball with your hips and abdomen supported, feet shoulder-width apart on the ground, and arms extended straight in front of you.\n\nStep 2: Brace/Position Engage your core, maintain a neutral spine, and keep your head in line with your body while allowing your arms to hang down.\n\nStep 3: Execute Raise your arms and chest off the ball simultaneously, squeezing your shoulder blades together and lifting until your body forms a straight line from head to heels.\n\nStep 4: Return/Repeat Lower your arms and chest back to the starting position with control, then repeat for the desired number of repetitions.","coachingCues":[],"primaryEquipment":[],"muscleGroups":["back"],"imageUrl":"https://img.youtube.com/vi/2CDihCl3wFQ/hqdefault.jpg","videoId":"2CDihCl3wFQ","videoUrl":"https://www.youtube.com/watch?v=2CDihCl3wFQ","videoThumbnailUrl":"https://img.youtube.com/vi/2CDihCl3wFQ/hqdefault.jpg","candidatePhotoUrl":"/images/exercises/ball-cobra.jpg","hasCandidatePhoto":true,"warnings":[],"ytTitle":"How to do a Ball Cobra","ytAuthor":"National Academy of Sports Medicine (NASM)","ytStatus":"OK","card":{"category":"Back","phase":"Phase 1: Stabilization · Phase 2: Strength Endurance · Phase 3: Hypertrophy","primeMover":"Latissimus Dorsi, Rhomboids & Middle Trapezius","kineticCheckpoints":{"feetAnkles":"Shoulder-width, firmly planted on ground.","knees":"Aligned with second and third toes.","lphc":"Neutral lumbar spine; core braced.","shoulders":"Retracted and depressed into athletic posture.","headNeck":"Neutral cervical spine, chin packed."},"clinicalCues":["Maintain neutral kinetic chain checkpoints throughout.","Control the 2-second eccentric lowering phase.","Exhale on exertion while maintaining intra-abdominal brace."],"howToSteps":["1. Setup Lie face down on a stability ball with your hips and abdomen supported, feet shoulder-width apart on the ground, and arms extended straight in front of you.","2. Brace/Position Engage your core, maintain a neutral spine, and keep your head in line with your body while allowing your arms to hang down.","3. Execute Raise your arms and chest off the ball simultaneously, squeezing your shoulder blades together and lifting until your body forms a straight line from head to heels.","4. Return/Repeat Lower your arms and chest back to the starting position with control, then repeat for the desired number of repetitions."]}},{"id":"cfd1f1a5-0775-46aa-930a-34fc07083a91","name":"Ball Combo I","slug":"ball-combo-i-0054","description":"Step 1: Setup Stand with your feet shoulder-width apart, holding a stability ball at chest level with both hands.\n\nStep 2: Brace/Position Engage your core, keeping your back straight and shoulders relaxed, while positioning the ball close to your chest.\n\nStep 3: Execute Press the ball forward, extending your arms fully while simultaneously squatting down into a low position, keeping your knees behind your toes.\n\nStep 4: Return/Repeat Reverse the movement by pulling the ball back to your chest as you rise back to standing, then repeat for the desired number of repetitions.","coachingCues":[],"primaryEquipment":[],"muscleGroups":["glutes","hamstrings","quadriceps"],"imageUrl":"https://img.youtube.com/vi/xb3-dysLHpE/hqdefault.jpg","videoId":"xb3-dysLHpE","videoUrl":"https://www.youtube.com/watch?v=xb3-dysLHpE","videoThumbnailUrl":"https://img.youtube.com/vi/xb3-dysLHpE/hqdefault.jpg","candidatePhotoUrl":"/images/exercises/ball-combo-i.jpg","hasCandidatePhoto":true,"warnings":[],"ytTitle":"How to do a Ball Combo I","ytAuthor":"National Academy of Sports Medicine (NASM)","ytStatus":"OK","card":{"category":"Legs","phase":"Phase 1: Stabilization · Phase 2: Strength Endurance · Phase 3: Hypertrophy","primeMover":"Quadriceps & Gluteus Maximus","kineticCheckpoints":{"feetAnkles":"Shoulder-width, firmly planted on ground.","knees":"Aligned with second and third toes.","lphc":"Neutral lumbar spine; core braced.","shoulders":"Retracted and depressed into athletic posture.","headNeck":"Neutral cervical spine, chin packed."},"clinicalCues":["Maintain neutral kinetic chain checkpoints throughout.","Control the 2-second eccentric lowering phase.","Exhale on exertion while maintaining intra-abdominal brace."],"howToSteps":["1. Setup Stand with your feet shoulder-width apart, holding a stability ball at chest level with both hands.","2. Brace/Position Engage your core, keeping your back straight and shoulders relaxed, while positioning the ball close to your chest.","3. Execute Press the ball forward, extending your arms fully while simultaneously squatting down into a low position, keeping your knees behind your toes.","4. Return/Repeat Reverse the movement by pulling the ball back to your chest as you rise back to standing, then repeat for the desired number of repetitions."]}},{"id":"98271241-d59a-42af-929b-1bfc55ba214f","name":"Ball Crunch","slug":"ball-crunch-0071","description":"Step 1: Setup Sit on a stability ball with your feet flat on the floor, hip-width apart, and your lower back resting against the ball.\n\nStep 2: Brace/Position Engage your core by pulling your navel in towards your spine, and place your hands behind your head or crossed over your chest.\n\nStep 3: Execute Lean back slightly, allowing the ball to roll under your lower back, then curl your torso forward by contracting your abdominal muscles, lifting your shoulders off the ball.\n\nStep 4: Return/Repeat Slowly lower your torso back to the starting position, maintaining control, and repeat for the desired number of repetitions.","coachingCues":[],"primaryEquipment":[],"muscleGroups":["core"],"imageUrl":"https://img.youtube.com/vi/QFLftqPWjoI/hqdefault.jpg","videoId":"QFLftqPWjoI","videoUrl":"https://www.youtube.com/watch?v=QFLftqPWjoI","videoThumbnailUrl":"https://img.youtube.com/vi/QFLftqPWjoI/hqdefault.jpg","candidatePhotoUrl":"/images/exercises/ball-crunch.jpg","hasCandidatePhoto":true,"warnings":[],"ytTitle":"How to do a Ball Crunch","ytAuthor":"National Academy of Sports Medicine (NASM)","ytStatus":"OK","card":{"category":"Core","phase":"Phase 1: Stabilization · Phase 2: Strength Endurance · Phase 3: Hypertrophy","primeMover":"Transverse Abdominis & Deep Core Stabilizers","kineticCheckpoints":{"feetAnkles":"Shoulder-width, firmly planted on ground.","knees":"Aligned with second and third toes.","lphc":"Neutral lumbar spine; core braced.","shoulders":"Retracted and depressed into athletic posture.","headNeck":"Neutral cervical spine, chin packed."},"clinicalCues":["Maintain neutral kinetic chain checkpoints throughout.","Control the 2-second eccentric lowering phase.","Exhale on exertion while maintaining intra-abdominal brace."],"howToSteps":["1. Setup Sit on a stability ball with your feet flat on the floor, hip-width apart, and your lower back resting against the ball.","2. Brace/Position Engage your core by pulling your navel in towards your spine, and place your hands behind your head or crossed over your chest.","3. Execute Lean back slightly, allowing the ball to roll under your lower back, then curl your torso forward by contracting your abdominal muscles, lifting your shoulders off the ball.","4. Return/Repeat Slowly lower your torso back to the starting position, maintaining control, and repeat for the desired number of repetitions."]}},{"id":"d66dbd06-34d8-4fe3-90b4-d7ef2a4649b3","name":"Ball Crunch Arms Crossed","slug":"ball-crunch-arms-crossed-0072","description":"Step 1: Setup Sit on a stability ball with your feet flat on the floor, hip-width apart, and your knees bent at a 90-degree angle.\n\nStep 2: Brace/Position Cross your arms over your chest, engaging your core, and lean back slightly until your lower back is supported by the ball.\n\nStep 3: Execute Contract your abdominal muscles to lift your upper body towards your thighs, exhaling as you crunch up.\n\nStep 4: Return/Repeat Lower your upper body back to the starting position, maintaining control, and repeat for the desired number of repetitions.","coachingCues":[],"primaryEquipment":[],"muscleGroups":["core"],"imageUrl":"https://img.youtube.com/vi/5DKvQPbSHUg/hqdefault.jpg","videoId":"5DKvQPbSHUg","videoUrl":"https://www.youtube.com/watch?v=5DKvQPbSHUg","videoThumbnailUrl":"https://img.youtube.com/vi/5DKvQPbSHUg/hqdefault.jpg","candidatePhotoUrl":"/images/exercises/ball-crunch-arms-crossed.jpg","hasCandidatePhoto":true,"warnings":[],"ytTitle":"How to do a Ball Crunch Arms Crossed","ytAuthor":"National Academy of Sports Medicine (NASM)","ytStatus":"OK","card":{"category":"Core","phase":"Phase 1: Stabilization · Phase 2: Strength Endurance · Phase 3: Hypertrophy","primeMover":"Transverse Abdominis & Deep Core Stabilizers","kineticCheckpoints":{"feetAnkles":"Shoulder-width, firmly planted on ground.","knees":"Aligned with second and third toes.","lphc":"Neutral lumbar spine; core braced.","shoulders":"Retracted and depressed into athletic posture.","headNeck":"Neutral cervical spine, chin packed."},"clinicalCues":["Maintain neutral kinetic chain checkpoints throughout.","Control the 2-second eccentric lowering phase.","Exhale on exertion while maintaining intra-abdominal brace."],"howToSteps":["1. Setup Sit on a stability ball with your feet flat on the floor, hip-width apart, and your knees bent at a 90-degree angle.","2. Brace/Position Cross your arms over your chest, engaging your core, and lean back slightly until your lower back is supported by the ball.","3. Execute Contract your abdominal muscles to lift your upper body towards your thighs, exhaling as you crunch up.","4. Return/Repeat Lower your upper body back to the starting position, maintaining control, and repeat for the desired number of repetitions."]}},{"id":"a75abb96-9d1f-4655-a5e4-eb5d8093d68e","name":"Band Assisted Pull Up","slug":"band-assisted-pull-up","description":"Step 1: Secure the band or tube around the pull-up bar, ensuring it is tightly fastened and hangs down.\n\nStep 2: Place one foot or knee into the band to provide assistance as you grip the pull-up bar with an overhand grip.\n\nStep 3: Engage your core and pull yourself up towards the bar, focusing on using your back and arms.\n\nStep 4: Lower yourself back down in a controlled manner, fully extending your arms before repeating the movement.","coachingCues":[],"primaryEquipment":["Pull-Up Bar","Band or Tube"],"muscleGroups":["back","biceps"],"imageUrl":"https://img.youtube.com/vi/B_VkNQS5YLs/hqdefault.jpg","videoId":"B_VkNQS5YLs","videoUrl":"https://www.youtube.com/watch?v=B_VkNQS5YLs","videoThumbnailUrl":"https://img.youtube.com/vi/B_VkNQS5YLs/hqdefault.jpg","candidatePhotoUrl":"/images/exercises/band-assisted-pull-up.jpg","hasCandidatePhoto":true,"warnings":[],"ytTitle":"How to do a Band Assisted Pull-Up | Proper Form & Technique | NASM","ytAuthor":"National Academy of Sports Medicine (NASM)","ytStatus":"OK","card":{"category":"Back","phase":"Phase 2 (Strength Endurance), Phase 4 (Max Strength)","primeMover":"Latissimus Dorsi","kineticCheckpoints":{"feetAnkles":"Crossed or straight with toes pointed slightly forward.","knees":"Slight bend or extended straight in \"hollow body\" position.","lphc":"Core braced in hollow body position without excessive spinal arching.","shoulders":"Full scapular depression before pulling.","headNeck":"Neutral cervical spine; clear chin over bar without reaching neck up."},"clinicalCues":["Start every repetition from an active dead hang with engaged scapulae.","Drive elbows down toward hip pockets rather than pulling with biceps alone.","Avoid swinging, kicking legs (kipping), or craning neck over bar."],"howToSteps":["1. Secure the band or tube around the pull-up bar, ensuring it is tightly fastened and hangs down.","2. Place one foot or knee into the band to provide assistance as you grip the pull-up bar with an overhand grip.","3. Engage your core and pull yourself up towards the bar, focusing on using your back and arms.","4. Lower yourself back down in a controlled manner, fully extending your arms before repeating the movement."]}},{"id":"f2c746c2-abc1-4df9-9b97-ae03244774d3","name":"Band Push Up","slug":"band-push-up-0055","description":"Step 1: Setup Anchor a resistance band around your upper back and secure the ends under your palms on the floor.\n\nStep 2: Brace/Position Assume a push-up position with your hands slightly wider than shoulder-width apart, feet together, and body in a straight line from head to heels.\n\nStep 3: Execute Engage your core and lower your body towards the floor by bending your elbows, keeping them at a 45-degree angle to your torso.\n\nStep 4: Return/Repeat Push through your palms to extend your arms and return to the starting position, maintaining tension in the band throughout the movement.","coachingCues":[],"primaryEquipment":["Band or Tube"],"muscleGroups":["chest","shoulders","triceps"],"imageUrl":"https://img.youtube.com/vi/7Xu3D-TKKAw/hqdefault.jpg","videoId":"7Xu3D-TKKAw","videoUrl":"https://www.youtube.com/watch?v=7Xu3D-TKKAw","videoThumbnailUrl":"https://img.youtube.com/vi/7Xu3D-TKKAw/hqdefault.jpg","candidatePhotoUrl":"/images/exercises/band-push-up.jpg","hasCandidatePhoto":true,"warnings":[],"ytTitle":"How to do a Band Push up","ytAuthor":"National Academy of Sports Medicine (NASM)","ytStatus":"OK","card":{"category":"Chest","phase":"Phase 1 (Stabilization Endurance), Phase 2 (Strength Endurance)","primeMover":"Pectoralis Major","kineticCheckpoints":{"feetAnkles":"Together or hip-width apart, dorsiflexed on balls of feet.","knees":"Fully extended with active quadriceps contraction.","lphc":"Neutral pelvis; no sagging hips (anterior tilt) or pike (excessive flexion).","shoulders":"Hands placed slightly wider than shoulder-width, fingers pointing forward.","headNeck":"Neutral cervical spine, chin tucked, gaze looking 6 inches ahead."},"clinicalCues":["Engage glutes and brace core to maintain rigid plank posture.","Do not allow lower back to sag or head to jut forward toward the floor.","Push the ground away at the top of the rep to engage serratus anterior."],"howToSteps":["1. Setup Anchor a resistance band around your upper back and secure the ends under your palms on the floor.","2. Brace/Position Assume a push-up position with your hands slightly wider than shoulder-width apart, feet together, and body in a straight line from head to heels.","3. Execute Engage your core and lower your body towards the floor by bending your elbows, keeping them at a 45-degree angle to your torso.","4. Return/Repeat Push through your palms to extend your arms and return to the starting position, maintaining tension in the band throughout the movement."]}},{"id":"db47db4b-79ce-4fcb-a10a-2d2352a0502c","name":"Barbell Back Squat","slug":"barbell-back-squat-0056","description":"Step 1: Setup Stand with your feet shoulder-width apart, barbell resting on your upper traps, and grip the bar with hands slightly wider than shoulder-width.\n\nStep 2: Brace/Position Engage your core, keep your chest up, and pull your shoulder blades together to stabilize your upper body.\n\nStep 3: Execute Lower your body by bending at the hips and knees, keeping your back straight and descending until your thighs are at least parallel to the ground.\n\nStep 4: Return/Repeat Push through your heels to return to the starting position, fully extending your hips and knees, then repeat for the desired number of repetitions.","coachingCues":[],"primaryEquipment":["Barbell"],"muscleGroups":["glutes","hamstrings","quadriceps"],"imageUrl":"https://img.youtube.com/vi/-bJIpOq-LWk/hqdefault.jpg","videoId":"-bJIpOq-LWk","videoUrl":"https://www.youtube.com/watch?v=-bJIpOq-LWk","videoThumbnailUrl":"https://img.youtube.com/vi/-bJIpOq-LWk/hqdefault.jpg","candidatePhotoUrl":"/images/exercises/barbell-back-squat.jpg","hasCandidatePhoto":true,"warnings":[],"ytTitle":"How to do a Barbell Back Squat","ytAuthor":"National Academy of Sports Medicine (NASM)","ytStatus":"OK","card":{"category":"Legs","phase":"Phase 2 (Strength Endurance), Phase 3 (Hypertrophy), Phase 4 (Max Strength)","primeMover":"Quadriceps Complex & Gluteus Maximus","kineticCheckpoints":{"feetAnkles":"Shoulder-width apart, toes pointing straight or slightly turned out 5°–10°.","knees":"Tracking directly over second and third toes; zero inward valgus collapse.","lphc":"Neutral pelvis; maintain lumbar curve without excessive forward lean.","shoulders":"Barbell resting securely across upper trapezius (high bar) or rear delts (low bar).","headNeck":"Neutral cervical spine with eyes focused straight ahead or slightly up."},"clinicalCues":["Spread the floor with feet to recruit gluteus medius and prevent knee valgus.","Keep chest elevated and maintain constant intra-abdominal pressure.","Hit parallel depth with hips level with or slightly below knee joint."],"howToSteps":["1. Setup Stand with your feet shoulder-width apart, barbell resting on your upper traps, and grip the bar with hands slightly wider than shoulder-width.","2. Brace/Position Engage your core, keep your chest up, and pull your shoulder blades together to stabilize your upper body.","3. Execute Lower your body by bending at the hips and knees, keeping your back straight and descending until your thighs are at least parallel to the ground.","4. Return/Repeat Push through your heels to return to the starting position, fully extending your hips and knees, then repeat for the desired number of repetitions."]}},{"id":"a4c58341-0efc-4084-ad04-7123acee3253","name":"Barbell Bench Press","slug":"barbell-bench-press","description":"Step 1: Lie supine on your back with neutral spine on a bench with your feet straight and flat on the floor. Draw in and brace the abs and lock the shoulders blades back and down on the bench. Grasp the barbell at about 1.5 - 2x shoulder width ensuring the hands are evenly distributed on the bar.\n\nStep 2: Unrack the bar (always use a spotter if you are able) bringing it directly above the shoulders. Starting with arms extended, slowly lower the bar toward the mid to lower chest moving through the maximum comfortable range.\n\nStep 3: Reverse the pattern and return the starting position.\n\nStep 4: Repeat. Maintain posture throughout. Do not arch the back or jut the head forward. Avoid letting the shoulders round, posture shift or feet lift in the air. Keep the elbows under the bar to maintain balance at all times.","coachingCues":[],"primaryEquipment":["Bench","Barbell","Plates","Safety Collars"],"muscleGroups":["chest","shoulders","triceps"],"imageUrl":"https://img.youtube.com/vi/CayG6UYqL8g/hqdefault.jpg","videoId":"CayG6UYqL8g","videoUrl":"https://www.youtube.com/watch?v=CayG6UYqL8g","videoThumbnailUrl":"https://img.youtube.com/vi/CayG6UYqL8g/hqdefault.jpg","candidatePhotoUrl":"/images/exercises/barbell-bench-press.jpg","hasCandidatePhoto":true,"warnings":[],"ytTitle":"How to do a Barbell Bench Press | Proper Form & Technique | NASM","ytAuthor":"National Academy of Sports Medicine (NASM)","ytStatus":"OK","card":{"category":"Chest","phase":"Phase 2 (Strength Endurance), Phase 3 (Hypertrophy), Phase 4 (Max Strength)","primeMover":"Pectoralis Major (Sternal & Clavicular Heads)","kineticCheckpoints":{"feetAnkles":"Flat on floor, hip-width apart, driving down into the ground.","knees":"Flexed at 90°, aligned with second and third toes.","lphc":"Neutral pelvis with natural lumbar arch; glutes stay firmly on pad.","shoulders":"Retracted and depressed (pinched back and down) into the bench.","headNeck":"Neutral cervical spine resting flat on the bench pad; eyes under bar."},"clinicalCues":["Pin shoulder blades into back pockets throughout the entire lift.","Maintain 45° elbow flare to prevent subacromial shoulder impingement.","Drive heels into floor to create total-body kinetic chain tension."],"howToSteps":["1. Lie supine on your back with neutral spine on a bench with your feet straight and flat on the floor. Draw in and brace the abs and lock the shoulders blades back and down on the bench. Grasp the barbell at about 1.5 - 2x shoulder width ensuring the hands are evenly distributed on the bar.","2. Unrack the bar (always use a spotter if you are able) bringing it directly above the shoulders. Starting with arms extended, slowly lower the bar toward the mid to lower chest moving through the maximum comfortable range.","3. Reverse the pattern and return the starting position.","4. Repeat. Maintain posture throughout. Do not arch the back or jut the head forward. Avoid letting the shoulders round, posture shift or feet lift in the air. Keep the elbows under the bar to maintain balance at all times."]}},{"id":"90136476-eb11-410f-9be8-d4707a4736e9","name":"Barbell Bench Press With Bands","slug":"barbell-bench-press-with-bands","description":"Step 1: Attach resistance bands or tubes around the barbell and anchor them to heavy dumbbells on the floor. Lie supine on your back with neutral spine on a bench with your feet straight and flat on the floor. Draw in and brace the abs and lock the shoulders blades back and down on the bench. Grasp the barbell at about 1.5 - 2x shoulder width ensuring the hands are evenly distributed on the bar.\n\nStep 2: Unrack the bar (always use a spotter if you are able) bringing it directly above the shoulders. Starting with arms extended, slowly lower the bar toward the mid to lower chest moving through the maximum comfortable range.\n\nStep 3: Reverse the pattern and return the starting position.\n\nStep 4: Repeat. Maintain posture throughout. Do not arch the back or jut the head forward. Avoid letting the shoulders round, posture shift or feet lift in the air. Keep the elbows under the bar to maintain balance at all times.","coachingCues":[],"primaryEquipment":["Bench","Barbell","Plates","Safety Collars","Band or Tube"],"muscleGroups":["chest","shoulders","triceps"],"imageUrl":"https://img.youtube.com/vi/N4H4o8k9WbE/hqdefault.jpg","videoId":"N4H4o8k9WbE","videoUrl":"https://www.youtube.com/watch?v=N4H4o8k9WbE","videoThumbnailUrl":"https://img.youtube.com/vi/N4H4o8k9WbE/hqdefault.jpg","candidatePhotoUrl":"/images/exercises/barbell-bench-press-with-bands.jpg","hasCandidatePhoto":true,"warnings":[],"ytTitle":"How to do a Barbell Bench Press with Bands | Proper Form & Technique | NASM","ytAuthor":"National Academy of Sports Medicine (NASM)","ytStatus":"OK","card":{"category":"Chest","phase":"Phase 2 (Strength Endurance), Phase 3 (Hypertrophy), Phase 4 (Max Strength)","primeMover":"Pectoralis Major (Sternal & Clavicular Heads)","kineticCheckpoints":{"feetAnkles":"Flat on floor, hip-width apart, driving down into the ground.","knees":"Flexed at 90°, aligned with second and third toes.","lphc":"Neutral pelvis with natural lumbar arch; glutes stay firmly on pad.","shoulders":"Retracted and depressed (pinched back and down) into the bench.","headNeck":"Neutral cervical spine resting flat on the bench pad; eyes under bar."},"clinicalCues":["Pin shoulder blades into back pockets throughout the entire lift.","Maintain 45° elbow flare to prevent subacromial shoulder impingement.","Drive heels into floor to create total-body kinetic chain tension."],"howToSteps":["1. Attach resistance bands or tubes around the barbell and anchor them to heavy dumbbells on the floor. Lie supine on your back with neutra /hqdefault.jpg","videoId":"6UKcYcDme-Y","videoUrl":"https://www.youtube.com/watch?v=6UKcYcDme-Y","videoThumbnailUrl":"https://img.youtube.com/vi/6UKcYcDme-Y/hqdefault.jpg","candidatePhotoUrl":"/images/exercises/barbell-bench-press-with-chains.jpg","hasCandidatePhoto":true,"warnings":[],"ytTitle":"How to do a Barbell Bench Press with Chains  | Proper Form & Technique | NASM","ytAuthor":"National Academy of Sports Medicine (NASM)","ytStatus":"OK","card":{"category":"Chest","phase":"Phase 2 (Strength Endurance), Phase 3 (Hypertrophy), Phase 4 (Max Strength)","primeMover":"Pectoralis Major (Sternal & Clavicular Heads)","kineticCheckpoints":{"feetAnkles":"Flat on floor, hip-width apart, driving down into the ground.","knees":"Flexed at 90°, aligned with second and third toes.","lphc":"Neutral pelvis with natural lumbar arch; glutes stay firmly on pad.","shoulders":"Retracted and depressed (pinched back and down) into the bench.","headNeck":"Neutral cervical spine resting flat on the bench pad; eyes under bar."},"clinicalCues":["Pin shoulder blades into back pockets throughout the entire lift.","Maintain 45° elbow flare to prevent subacromial shoulder impingement.","Drive heels into floor to create total-body kinetic chain tension."],"howToSteps":["1. Attach chains that attach to the collars or directly to the barbell. Lie supine on your back with neutral spine on a bench with your feet straight and flat on the floor. Draw in and brace the abs and lock the shoulders blades back and down on the bench. Grasp the barbell at about 1.5 - 2x shoulder width ensuring the hands are evenly distributed on the bar.","2. Unrack the bar (always use a spotter if you are able) bringing it directly above the shoulders. Starting with arms extended, slowly lower the bar toward the mid to lower chest moving through the maximum comfortable range.","3. Reverse the pattern and return the starting position.","4. Repeat. Maintain posture throughout. Do not arch the back or jut the head forward. Avoid letting the shoulders round, posture shift or feet lift in the air. Keep the elbows under the bar to maintain balance at all times."]}},{"id":"9588a84c-1fd7-4ded-95ed-cb54413eaed9","name":"Barbell Bent Over Row Pronated","slug":"barbell-bent-over-row-pronated-0057","description":"Step 1: Setup Stand with your feet shoulder-width apart, holding a barbell with a pronated grip (palms facing down) and arms fully extended in front of you.\n\nStep 2: Brace/Position Hinge at your hips, keeping your back straight and knees slightly bent, until your torso is approximately parallel to the ground.\n\nStep 3: Execute Pull the barbell towards your lower ribcage by retracting your shoulder blades and bending your elbows, keeping your elbows close to your body.\n\nStep 4: Return/Repeat Lower the barbell back to the starting position with control, fully extending your arms while maintaining a stable torso.","coachingCues":[],"primaryEquipment":["Barbell"],"muscleGroups":["back","biceps"],"imageUrl":"https://img.youtube.com/vi/bm0_q9bR_HA/hqdefault.jpg","videoId":"bm0_q9bR_HA","videoUrl":"https://www.youtube.com/watch?v=bm0_q9bR_HA","videoThumbnailUrl":"https://img.youtube.com/vi/bm0_q9bR_HA/hqdefault.jpg","candidatePhotoUrl":"/images/exercises/barbell-bent-over-row-pronated.jpg","hasCandidatePhoto":true,"warnings":[],"ytTitle":"How to do a Barbell Bent Over Row Pronated","ytAuthor":"National Academy of Sports Medicine (NASM)","ytStatus":"OK","card":{"category":"Back","phase":"Phase 1: Stabilization · Phase 2: Strength Endurance · Phase 3: Hypertrophy","primeMover":"Latissimus Dorsi, Rhomboids & Middle Trapezius","kineticCheckpoints":{"feetAnkles":"Shoulder-width, firmly planted on ground.","knees":"Aligned with second and third toes.","lphc":"Neutral lumbar spine; core braced.","shoulders":"Retracted and depressed into athletic posture.","headNeck":"Neutral cervical spine, chin packed."},"clinicalCues":["Maintain neutral kinetic chain checkpoints throughout.","Control the 2-second eccentric lowering phase.","Exhale on exertion while maintaining intra-abdominal brace."],"howToSteps":["1. Setup Stand with your feet shoulder-width apart, holding a barbell with a pronated grip (palms facing down) and arms fully extended in front of you.","2. Brace/Position Hinge at your hips, keeping your back straight and knees slightly bent, until your torso is approximately parallel to the ground.","3. Execute Pull the barbell towards your lower ribcage by retracting your shoulder blades and bending your elbows, keeping your elbows close to your body.","4. Return/Repeat Lower the barbell back to the starting position with control, fully extending your arms while maintaining a stable torso."]}},{"id":"f6dc1e07-99a4-48cd-bfab-b1f50ef62248","name":"Barbell Bicep Curl","slug":"barbell-bicep-curl","description":"Step 1: Stand in athletic posture with feet hip to shoulder width apart, toes pointing forward and abs braced. Place arms comfortably at your side and then grip the bar width hands at that width, palms forward. Keep the head in line with the back and lock the shoulder blades back and down.\n\nStep 2: Curl the barbell forward, up and in toward the chest through a maximum range the does not allow the elbows to swing forward.\n\nStep 3: Reverse the movement to return to the start position. Maintain posture throughout.\n\nStep 4: Repeat for the desired number of repetitions. Do not allow the shoulders to round, back to arch, chin to jut forward or barbell to swing with momentum.","coachingCues":[],"primaryEquipment":["Barbell"],"muscleGroups":["biceps"],"imageUrl":"https://img.youtube.com/vi/pQfJR-sSIvA/hqdefault.jpg","videoId":"pQfJR-sSIvA","videoUrl":"https://www.youtube.com/watch?v=pQfJR-sSIvA","videoThumbnailUrl":"https://img.youtube.com/vi/pQfJR-sSIvA/hqdefault.jpg","candidatePhotoUrl":"/images/exercises/barbell-bicep-curl.jpg","hasCandidatePhoto":true,"warnings":[],"ytTitle":"How to Do a Barbell Bicep Curl | Proper Form & Technique | NASM","ytAuthor":"National Academy of Sports Medicine (NASM)","ytStatus":"OK","card":{"category":"Arms","phase":"Phase 2 (Strength Endurance), Phase 3 (Hypertrophy)","primeMover":"Biceps Brachii (Long & Short Heads)","kineticCheckpoints":{"feetAnkles":"Hip-width apart with equal weight distribution.","knees":"Soft, athletic bend.","lphc":"Neutral spine; no swaying or swinging hips.","shoulders":"Shoulder blades back and down, elbows pinned to ribcage.","headNeck":"Neutral cervical spine, chin tucked."},"clinicalCues":["Pin elbows to sides; do not let elbows drift forward or flare out.","Avoid leaning back or using hip swing to heave the weight up.","Fully extend arms at bottom for complete muscle stretch."],"howToSteps":["1. Stand in athletic posture with feet hip to shoulder width apart, toes pointing forward and abs braced. Place arms comfortably at your side and then grip the bar width hands at that width, palms forward. Keep the head in line with the back and lock the shoulder blades back and down.","2. Curl the barbell forward, up and in toward the chest through a maximum range the does not allow the elbows to swing forward.","3. Reverse the movement to return to the start position. Maintain posture throughout.","4. Repeat for the desired number of repetitions. Do not allow the shoulders to round, back to arch, chin to jut forward or barbell to swing with momentum."]}},{"id":"f636f59a-7671-4f5d-8668-d68bfe6aa3c1","name":"Barbell Deadlift","slug":"barbell-deadlift-0059","description":"Step 1: Setup Stand with your feet hip-width apart, barbell positioned over the midfoot, and your shins close to the bar.\n\nStep 2: Brace/Position Bend at the hips and knees to grip the barbell with both hands just outside your legs, keeping your back flat and chest up.\n\nStep 3: Execute Drive through your heels, extending your hips and knees simultaneously to lift the barbell off the ground, keeping it close to your body.\n\nStep 4: Return/Repeat Lower the barbell by hinging at the hips and bending the knees, maintaining a flat back until the bar reaches the ground, then reset for the next repetition.","coachingCues":[],"primaryEquipment":["Barbell"],"muscleGroups":["back","glutes","hamstrings"],"imageUrl":"https://img.youtube.com/vi/yPqv3ejnZvc/hqdefault.jpg","videoId":"yPqv3ejnZvc","videoUrl":"https://www.youtube.com/watch?v=yPqv3ejnZvc","videoThumbnailUrl":"https://img.youtube.com/vi/yPqv3ejnZvc/hqdefault.jpg","candidatePhotoUrl":"/images/exercises/barbell-deadlift.jpg","hasCandidatePhoto":true,"warnings":[],"ytTitle":"How to do a Barbell Deadlift","ytAuthor":"National Academy of Sports Medicine (NASM)","ytStatus":"OK","card":{"category":"Back","phase":"Phase 2 (Strength Endurance), Phase 4 (Max Strength)","primeMover":"Gluteus Maximus & Hamstrings Complex","kineticCheckpoints":{"feetAnkles":"Hip-width apart with bar positioned directly over midfoot.","knees":"Tracking in line with second/third toes, flexed at ~110° in starting pull.","lphc":"Hips higher than knees, lower than shoulders; neutral lordotic spine.","shoulders":"Shoulder blades retracted and packed over or slightly in front of bar.","headNeck":"Neutral cervical spine packed with chin tucked (gaze 6-8 ft ahead)."},"clinicalCues":["Maintain barbell contact with legs (shins then thighs) throughout the entire path.","Hips and chest must rise at the exact same rate off the floor.","Squeeze glutes at top lockout rather than overarching lumbar spine."],"howToSteps":["1. Setup Stand with your feet hip-width apart, barbell positioned over the midfoot, and your shins close to the bar.","2. Brace/Position Bend at the hips and knees to grip the barbell with both hands just outside your legs, keeping your back flat and chest up.","3. Execute Drive through your heels, extending your hips and knees simultaneously to lift the barbell off the ground, keeping it close to your body.","4. Return/Repeat Lower the barbell by hinging at the hips and bending the knees, maintaining a flat back until the bar reaches the ground, then reset for the next repetition."]}},{"id":"9da43698-14eb-4609-a9a8-caa7197799fb","name":"Barbell Front Squat With Clean Position","slug":"barbell-front-squat-with-clean-position-0060","description":"Step 1: Setup Position the barbell on your front deltoids, using a clean grip with your elbows high and hands just outside shoulder-width.\n\nStep 2: Brace/Position Stand with your feet shoulder-width apart, toes slightly pointed out, and engage your core while maintaining an upright torso.\n\nStep 3: Execute Lower your body by bending at the knees and hips, keeping your chest up and elbows high, until your thighs are at least parallel to the ground.\n\nStep 4: Return/Repeat Push through your heels to return to the starting position, fully extending your hips and knees, and repeat for the desired number of repetitions.","coachingCues":[],"primaryEquipment":["Barbell"],"muscleGroups":["back","glutes","hamstrings","quadriceps","shoulders"],"imageUrl":"https://img.youtube.com/vi/yr_8VuSqhmM/hqdefault.jpg","videoId":"yr_8VuSqhmM","videoUrl":"https://www.youtube.com/watch?v=yr_8VuSqhmM","videoThumbnailUrl":"https://img.youtube.com/vi/yr_8VuSqhmM/hqdefault.jpg","candidatePhotoUrl":"/images/exercises/barbell-front-squat-with-clean-position.jpg","hasCandidatePhoto":true,"warnings":[],"ytTitle":"How to do a Barbell Front Squat with Clean Position","ytAuthor":"National Academy of Sports Medicine (NASM)","ytStatus":"OK","card":{"category":"Legs","phase":"Phase 2 (Strength Endurance), Phase 3 (Hypertrophy), Phase 4 (Max Strength)","primeMover":"Quadriceps (Vastus Lateralis, Medialis, Intermedius, Rectus Femoris) & Gluteus Maximus","kineticCheckpoints":{"feetAnkles":"Shoulder-width apart, toes forward or slightly flared (5°–10°), heels flat on ground.","knees":"Track directly over second and third toes; avoid valgus collapse.","lphc":"Maintain upright thoracic spine and neutral lumbar lordosis; core braced.","shoulders":"Elbows driven high and forward parallel to floor in front rack position.","headNeck":"Neutral cervical spine, chin packed, eyes looking straight forward."},"clinicalCues":["Drive elbows high toward the ceiling throughout the lift to prevent forward torso dump.","Maintain an upright chest and vertical spine to direct load to quadriceps.","Keep knees tracking over second toes and heels flat on floor."],"howToSteps":["1. Setup Position the barbell on your front deltoids, using a clean grip with your elbows high and hands just outside shoulder-width.","2. Brace/Position Stand with your feet shoulder-width apart, toes slightly pointed out, and engage your core while maintaining an upright torso.","3. Execute Lower your body by bending at the knees and hips, keeping your chest up and elbows high, until your thighs are at least parallel to the ground.","4. Return/Repeat Push through your heels to return to the starting position, fully extending your hips and knees, and repeat for the desired number of repetitions."]}},{"id":"3ec7a823-6eaa-4a52-b8b1-2fa35cf965da","name":"Barbell Front Squat With Crossed Arms","slug":"barbell-front-squat-with-crossed-arms-0061","description":"Step 1: Setup Position the barbell across the front of your shoulders, crossing your arms to hold the bar in place.\n\nStep 2: Brace/Position Stand with your feet shoulder-width apart, toes slightly pointed out, and engage your core while maintaining a neutral spine.\n\nStep 3: Execute Lower your body by bending at the hips and knees, keeping your elbows high and chest up, until your thighs are parallel to the ground.\n\nStep 4: Return/Repeat Push through your heels to return to the starting position, fully extending your hips and knees, and repeat for the desired number of repetitions.","coachingCues":[],"primaryEquipment":["Barbell"],"muscleGroups":["glutes","hamstrings","quadriceps"],"imageUrl":"https://img.youtube.com/vi/W9jJaI4cHJU/hqdefault.jpg","videoId":"W9jJaI4cHJU","videoUrl":"https://www.youtube.com/watch?v=W9jJaI4cHJU","videoThumbnailUrl":"https://img.youtube.com/vi/W9jJaI4cHJU/hqdefault.jpg","candidatePhotoUrl":"/images/exercises/barbell-front-squat-with-crossed-arms.jpg","hasCandidatePhoto":true,"warnings":[],"ytTitle":"How to do a Barbell Front Squat with Crossed Arms","ytAuthor":"National Academy of Sports Medicine (NASM)","ytStatus":"OK","card":{"category":"Legs","phase":"Phase 2 (Strength Endurance), Phase 3 (Hypertrophy), Phase 4 (Max Strength)","primeMover":"Quadriceps (Vastus Lateralis, Medialis, Intermedius, Rectus Femoris) & Gluteus Maximus","kineticCheckpoints":{"feetAnkles":"Shoulder-width apart, toes forward or slightly flared (5°–10°), heels flat on ground.","knees":"Track directly over second and third toes; avoid valgus collapse.","lphc":"Maintain upright thoracic spine and neutral lumbar lordosis; core braced.","shoulders":"Elbows driven high and forward parallel to floor in front rack position.","headNeck":"Neutral cervical spine, chin packed, eyes looking straight forward."},"clinicalCues":["Drive elbows high toward the ceiling throughout the lift to prevent forward torso dump.","Maintain an upright chest and vertical spine to direct load to quadriceps.","Keep knees tracking over second toes and heels flat on floor."],"howToSteps":["1. Setup Position the barbell across the front of your shoulders, crossing your arms to hold the bar in place.","2. Brace/Position Stand with your feet shoulder-width apart, toes slightly pointed out, and engage your core while maintaining a neutral spine.","3. Execute Lower your body by bending at the hips and knees, keeping your elbows high and chest up, until your thighs are parallel to the ground.","4. Return/Repeat Push through your heels to return to the starting position, fully extending your hips and knees, and repeat for the desired number of repetitions."]}},{"id":"133e8ba9-e2ae-4b40-8915-023b3d7620ac","name":"Barbell Overhead Press","slug":"barbell-overhead-press-0062","description":"Step 1: Setup Stand with your feet shoulder-width apart, grasp the barbell with an overhand grip slightly wider than shoulder-width, and position it at shoulder height.\n\nStep 2: Brace/Position Engage your core, retract your shoulder blades, and ensure your elbows are slightly in front of the barbell while keeping your wrists straight.\n\nStep 3: Execute Press the barbell overhead by extending your arms, keeping the bar in line with your head and maintaining a neutral spine throughout the movement.\n\nStep 4: Return/Repeat Lower the barbell back to shoulder height with control, ensuring your elbows remain slightly in front, and repeat for the desired number of repetitions.","coachingCues":[],"primaryEquipment":["Barbell"],"muscleGroups":["shoulders","triceps"],"imageUrl":"https://img.youtube.com/vi/cGnhixvC8uA/hqdefault.jpg","videoId":"cGnhixvC8uA","videoUrl":"https://www.youtube.com/watch?v=cGnhixvC8uA","videoThumbnailUrl":"https://img.youtube.com/vi/cGnhixvC8uA/hqdefault.jpg","candidatePhotoUrl":"/images/exercises/barbell-overhead-press.jpg","hasCandidatePhoto":true,"warnings":[],"ytTitle":"How to do a Barbell Overhead Press","ytAuthor":"National Academy of Sports Medicine (NASM)","ytStatus":"OK","card":{"category":"Shoulders","phase":"Phase 2 (Strength Endurance), Phase 4 (Max Strength)","primeMover":"Anterior Deltoid & Middle Deltoid","kineticCheckpoints":{"feetAnkles":"Hip-width apart, firmly rooted.","knees":"Soft extension without locking or hyperextending.","lphc":"Glutes and abs fully engaged to prevent lumbar hyperextension.","shoulders":"Elbows positioned slightly in front of bar in starting rack position.","headNeck":"Head tilts slightly back to clear bar path, then returns neutral under bar at top."},"clinicalCues":["Squeeze glutes hard to create a solid pelvic foundation and protect lumbar spine.","Do not lean backward or hyperextend lower back to press heavy loads.","Finish lockout with biceps next to ears."],"howToSteps":["1. Setup Stand with your feet shoulder-width apart, grasp the barbell with an overhand grip slightly wider than shoulder-width, and position it at shoulder height.","2. Brace/Position Engage your core, retract your shoulder blades, and ensure your elbows are slightly in front of the barbell while keeping your wrists straight.","3. Execute Press the barbell overhead by extending your arms, keeping the bar in line with your head and maintaining a neutral spine throughout the movement.","4. Return/Repeat Lower the barbell back to shoulder height with control, ensuring your elbows remain slightly in front, and repeat for the desired number of repetitions."]}},{"id":"cd6207bd-ce8d-4710-b01d-0d537137569b","name":"Bench Dips","slug":"bench-dips","description":"Step 1: Sit on the edge of the bench with your hands placed shoulder-width apart, fingers facing forward.\n\nStep 2: Extend your legs out in front of you, keeping your heels on the ground or elevated on another bench.\n\nStep 3: Lower your body by bending your elbows until your upper arms are parallel to the ground.\n\nStep 4: Push through your palms to return to the starting position, fully extending your arms.","coachingCues":[],"primaryEquipment":["Bench"],"muscleGroups":["chest","shoulders","triceps"],"imageUrl":"https://img.youtube.com/vi/WVeZDBhZwLA/hqdefault.jpg","videoId":"WVeZDBhZwLA","videoUrl":"https://www.youtube.com/watch?v=WVeZDBhZwLA","videoThumbnailUrl":"https://img.youtube.com/vi/WVeZDBhZwLA/hqdefault.jpg","candidatePhotoUrl":"/images/exercises/bench-dips.jpg","hasCandidatePhoto":true,"warnings":[],"ytTitle":"How to do a Bench Dip  | Proper Form & Technique | NASM","ytAuthor":"National Academy of Sports Medicine (NASM)","ytStatus":"OK","card":{"category":"Shoulders","phase":"Phase 1: Stabilization · Phase 2: Strength Endurance · Phase 3: Hypertrophy","primeMover":"Deltoids & Upper Trapezius","kineticCheckpoints":{"feetAnkles":"Shoulder-width, firmly planted on ground.","knees":"Aligned with second and third toes.","lphc":"Neutral lumbar spine; core braced.","shoulders":"Retracted and depressed into athletic posture.","headNeck":"Neutral cervical spine, chin packed."},"clinicalCues":["Maintain neutral kinetic chain checkpoints throughout.","Control the 2-second eccentric lowering phase.","Exhale on exertion while maintaining intra-abdominal brace."],"howToSteps":["1. Sit on the edge of the bench with your hands placed shoulder-width apart, fingers facing forward.","2. Extend your legs out in front of you, keeping your heels on the ground or elevated on another bench.","3. Lower your body by bending your elbows until your upper arms are parallel to the ground.","4. Push through your palms to return to the starting position, fully extending your arms."]}},{"id":"a9b3d200-1db8-4fe2-9377-4fdc99d17e8f","name":"Bent Elbow Dumbbell Lateral Raise","slug":"bent-elbow-dumbbell-lateral-raise-0103","description":"Step 1: Setup Stand with your feet shoulder-width apart, holding a dumbbell in each hand at your sides with a slight bend in your elbows.\n\nStep 2: Brace/Position Engage your core and maintain a neutral spine, keeping your elbows slightly bent throughout the movement.\n\nStep 3: Execute Raise the dumbbells out to the sides until they reach shoulder height, keeping your elbows at a 90-degree angle and palms facing down.\n\nStep 4: Return/Repeat Lower the dumbbells back to the starting position with control and repeat for the desired number of repetitions.","coachingCues":[],"primaryEquipment":["Dumbbells"],"muscleGroups":["shoulders"],"imageUrl":"https://img.youtube.com/vi/21NdvM9pY9g/hqdefault.jpg","videoId":"21NdvM9pY9g","videoUrl":"https://www.youtube.com/watch?v=21NdvM9pY9g","videoThumbnailUrl":"https://img.youtube.com/vi/21NdvM9pY9g/hqdefault.jpg","candidatePhotoUrl":"/images/exercises/bent-elbow-dumbbell-lateral-raise.jpg","hasCandidatePhoto":true,"warnings":[],"ytTitle":"How to do a Bent-Elbow Dumbbell Lateral Raise","ytAuthor":"National Academy of Sports Medicine (NASM)","ytStatus":"OK","card":{"category":"Shoulders","phase":"Phase 2 (Strength Endurance), Phase 3 (Hypertrophy)","primeMover":"Middle (Lateral) Deltoid","kineticCheckpoints":{"feetAnkles":"Hip-width apart in athletic stance.","knees":"Soft 10° bend.","lphc":"Neutral pelvis with slight forward torso hinge (5°).","shoulders":"Lead with elbows in the scapular plane (30° anterior to frontal plane).","headNeck":"Neutral neck; avoid shrugging traps up toward ears."},"clinicalCues":["Raise in scapular plane (30° forward) to protect supraspinatus tendon from impingement.","Lead with elbows and keep pinkies slightly higher than thumbs.","Do not shrug traps or swing torso to generate momentum."],"howToSteps":["1. Setup Stand with your feet shoulder-width apart, holding a dumbbell in each hand at your sides with a slight bend in your elbows.","2. Brace/Position Engage your core and maintain a neutral spine, keeping your elbows slightly bent throughout the movement.","3. Execute Raise the dumbbells out to the sides until they reach shoulder height, keeping your elbows at a 90-degree angle and palms facing down.","4. Return/Repeat Lower the dumbbells back to the starting position with control and repeat for the desired number of repetitions."]}},{"id":"3d9b8bb2-d328-4ec4-9760-fe3fd05be99a","name":"Bent Over Barbel Row Supinated","slug":"bent-over-barbel-row-supinated-0058","description":"Step 1: Setup Stand with your feet shoulder-width apart, holding a barbell with an underhand (supinated) grip, and hinge at the hips to lower your torso until it's nearly parallel to the ground.\n\nStep 2: Brace/Position Engage your core, maintain a neutral spine, and let the barbell hang at arm's length in front of you, with your elbows slightly bent.\n\nStep 3: Execute Pull the barbell towards your lower ribcage by bending your elbows and squeezing your shoulder blades together, keeping your elbows close to your body.\n\nStep 4: Return/Repeat Lower the barbell back to the starting position in a controlled manner, fully extending your arms, and repeat for the desired number of repetitions.","coachingCues":[],"primaryEquipment":[],"muscleGroups":["back","biceps"],"imageUrl":"https://img.youtube.com/vi/ZuC7ma4ktm0/hqdefault.jpg","videoId":"ZuC7ma4ktm0","videoUrl":"https://www.youtube.com/watch?v=ZuC7ma4ktm0","videoThumbnailUrl":"https://img.youtube.com/vi/ZuC7ma4ktm0/hqdefault.jpg","candidatePhotoUrl":"/images/exercises/bent-over-barbel-row-supinated.jpg","hasCandidatePhoto":true,"warnings":[],"ytTitle":"How to do a Bent-Over Barbel Row Supinated","ytAuthor":"National Academy of Sports Medicine (NASM)","ytStatus":"OK","card":{"category":"Back","phase":"Phase 1: Stabilization · Phase 2: Strength Endurance · Phase 3: Hypertrophy","primeMover":"Latissimus Dorsi, Rhomboids & Middle Trapezius","kineticCheckpoints":{"feetAnkles":"Shoulder-width, firmly planted on ground.","knees":"Aligned with second and third toes.","lphc":"Neutral lumbar spine; core braced.","shoulders":"Retracted and depressed into athletic posture.","headNeck":"Neutral cervical spine, chin packed."},"clinicalCues":["Maintain neutral kinetic chain checkpoints throughout.","Control the 2-second eccentric lowering phase.","Exhale on exertion while maintaining intra-abdominal brace."],"howToSteps":["1. Setup Stand with your feet shoulder-width apart, holding a barbell with an underhand (supinated) grip, and hinge at the hips to lower your torso until it's nearly parallel to the ground.","2. Brace/Position Engage your core, maintain a neutral spine, and let the barbell hang at arm's length in front of you, with your elbows slightly bent.","3. Execute Pull the barbell towards your lower ribcage by bending your elbows and squeezing your shoulder blades together, keeping your elbows close to your body.","4. Return/Repeat Lower the barbell back to the starting position in a controlled manner, fully extending your arms, and repeat for the desired number of repetitions."]}},{"id":"3cfb7e0a-7dc7-4321-9536-3613d23786b5","name":"Bent Over Dumbbell Rear Fly","slug":"bent-over-dumbbell-rear-fly-0108","description":"Step 1: Setup Stand with feet shoulder-width apart, holding a dumbbell in each hand, and hinge at the hips to bend forward while keeping your back straight and knees slightly bent.\n\nStep 2: Brace/Position Engage your core and allow the dumbbells to hang directly below your shoulders, palms facing each other, with a slight bend in your elbows.\n\nStep 3: Execute Raise the dumbbells out to the sides in a wide arc until they are in line with your shoulders, squeezing your shoulder blades together at the top of the movement.\n\nStep 4: Return/Repeat Lower the dumbbells back to the starting position in a controlled manner, maintaining tension in your back and core, and repeat for the desired number of repetitions.","coachingCues":[],"primaryEquipment":["Dumbbells"],"muscleGroups":["back"],"imageUrl":"https://img.youtube.com/vi/kLW7nbw4lcY/hqdefault.jpg","videoId":"kLW7nbw4lcY","videoUrl":"https://www.youtube.com/watch?v=kLW7nbw4lcY","videoThumbnailUrl":"https://img.youtube.com/vi/kLW7nbw4lcY/hqdefault.jpg","candidatePhotoUrl":"/images/exercises/bent-over-dumbbell-rear-fly.jpg","hasCandidatePhoto":true,"warnings":[],"ytTitle":"How to do a Bent-Over Dumbbell Rear Fly","ytAuthor":"National Academy of Sports Medicine (NASM)","ytStatus":"OK","card":{"category":"Back","phase":"Phase 1: Stabilization · Phase 2: Strength Endurance · Phase 3: Hypertrophy","primeMover":"Latissimus Dorsi, Rhomboids & Middle Trapezius","kineticCheckpoints":{"feetAnkles":"Shoulder-width, firmly planted on ground.","knees":"Aligned with second and third toes.","lphc":"Neutral lumbar spine; core braced.","shoulders":"Retracted and depressed into athletic posture.","headNeck":"Neutral cervical spine, chin packed."},"clinicalCues":["Maintain neutral kinetic chain checkpoints throughout.","Control the 2-second eccentric lowering phase.","Exhale on exertion while maintaining intra-abdominal brace."],"howToSteps":["1. Setup Stand with feet shoulder-width apart, holding a dumbbell in each hand, and hinge at the hips to bend forward while keeping your back straight and knees slightly bent.","2. Brace/Position Engage your core and allow the dumbbells to hang directly below your shoulders, palms facing each other, with a slight bend in your elbows.","3. Execute Raise the dumbbells out to the sides in a wide arc until they are in line with your shoulders, squeezing your shoulder blades together at the top of the movement.","4. Return/Repeat Lower the dumbbells back to the starting position in a controlled manner, maintaining tension in your back and core, and repeat for the desired number of repetitions."]}},{"id":"94c7ea81-a922-4841-85a8-0c0fc03da9af","name":"Bent Over Dumbbell Rear Fly With Neutral Grip","slug":"bent-over-dumbbell-rear-fly-with-neutral-grip-0110","description":"Step 1: Setup Stand with feet hip-width apart, holding a dumbbell in each hand with a neutral grip, and hinge at the hips until your torso is nearly parallel to the ground.\n\nStep 2: Brace/Position Engage your core and maintain a flat back, allowing your arms to hang straight down from your shoulders, palms facing each other.\n\nStep 3: Execute With a slight bend in your elbows, lift the dumbbells out to the sides, squeezing your shoulder blades together at the top of the movement.\n\nStep 4: Return/Repeat Lower the dumbbells back to the starting position with control, ensuring to maintain tension in your back muscles, and repeat for the desired number of repetitions.","coachingCues":[],"primaryEquipment":["Dumbbells"],"muscleGroups":["back"],"imageUrl":"https://img.youtube.com/vi/aCi_ZhmPQCQ/hqdefault.jpg","videoId":"aCi_ZhmPQCQ","videoUrl":"https://www.youtube.com/watch?v=aCi_ZhmPQCQ","videoThumbnailUrl":"https://img.youtube.com/vi/aCi_ZhmPQCQ/hqdefault.jpg","candidatePhotoUrl":"/images/exercises/bent-over-dumbbell-rear-fly-with-neutral-grip.jpg","hasCandidatePhoto":true,"warnings":[],"ytTitle":"How to do a Bent-Over Dumbbell Rear Fly with Neutral Grip","ytAuthor":"National Academy of Sports Medicine (NASM)","ytStatus":"OK","card":{"category":"Back","phase":"Phase 1: Stabilization · Phase 2: Strength Endurance · Phase 3: Hypertrophy","primeMover":"Latissimus Dorsi, Rhomboids & Middle Trapezius","kineticCheckpoints":{"feetAnkles":"Shoulder-width, firmly planted on ground.","knees":"Aligned with second and third toes.","lphc":"Neutral lumbar spine; core braced.","shoulders":"Retracted and depressed into athletic posture.","headNeck":"Neutral cervical spine, chin packed."},"clinicalCues":["Maintain neutral kinetic chain checkpoints throughout.","Control the 2-second eccentric lowering phase.","Exhale on exertion while maintaining intra-abdominal brace."],"howToSteps":["1. Setup Stand with feet hip-width apart, holding a dumbbell in each hand with a neutral grip, and hinge at the hips until your torso is nearly parallel to the ground.","2. Brace/Position Engage your core and maintain a flat back, allowing your arms to hang straight down from your shoulders, palms facing each other.","3. Execute With a slight bend in your elbows, lift the dumbbells out to the sides, squeezing your shoulder blades together at the top of the movement.","4. Return/Repeat Lower the dumbbells back to the starting position with control, ensuring to maintain tension in your back muscles, and repeat for the desired number of repetitions."]}},{"id":"102555ec-dfea-411f-a79b-5ed8d064be73","name":"Bird Dog","slug":"bird-dog","description":"Step 1: Get into quadruped position (on all fours) with the hands under the shoulders and knees under the hips. Press away from the floor with the arms to stabilize shoulder girdle. Draw the abs in. Position spine in neutral.\n\nStep 2: Slowly reach one arm and the opposite leg with toes pointed away from the body. Reach long for the walls attempting to get the body in a straight line.\n\nStep 3: Reverse the pattern and return the starting position sweeping the hand and knee into position.\n\nStep 4: Repeat with the other side. Maintain posture throughout. Avoid letting the head fall to the ground, back arch or slouch, shoulder collapse or torso rotate.","coachingCues":[],"primaryEquipment":["None"],"muscleGroups":["core"],"imageUrl":"https://img.youtube.com/vi/ZdAHe9_HeEw/hqdefault.jpg","videoId":"ZdAHe9_HeEw","videoUrl":"https://www.youtube.com/watch?v=ZdAHe9_HeEw","videoThumbnailUrl":"https://img.youtube.com/vi/ZdAHe9_HeEw/hqdefault.jpg","candidatePhotoUrl":"/images/exercises/bird-dog.jpg","hasCandidatePhoto":true,"warnings":[],"ytTitle":"How to do a Bird Dog | Proper Form & Technique | NASM","ytAuthor":"National Academy of Sports Medicine (NASM)","ytStatus":"OK","card":{"category":"Core","phase":"Phase 1: Stabilization · Phase 2: Strength Endurance · Phase 3: Hypertrophy","primeMover":"Transverse Abdominis & Deep Core Stabilizers","kineticCheckpoints":{"feetAnkles":"Shoulder-width, firmly planted on ground.","knees":"Aligned with second and third toes.","lphc":"Neutral lumbar spine; core braced.","shoulders":"Retracted and depressed into athletic posture.","headNeck":"Neutral cervical spine, chin packed."},"clinicalCues":["Maintain neutral kinetic chain checkpoints throughout.","Control the 2-second eccentric lowering phase.","Exhale on exertion while maintaining intra-abdominal brace."],"howToSteps":["1. Get into quadruped position (on all fours) with the hands under the shoulders and knees under the hips. Press away from the floor with the arms to stabilize shoulder girdle. Draw the abs in. Position spine in neutral.","2. Slowly reach one arm and the opposite leg with toes pointed away from the body. Reach long for the walls attempting to get the body in a straight line.","3. Reverse the pattern and return the starting position sweeping the hand and knee into position.","4. Repeat with the other side. Maintain posture throughout. Avoid letting the head fall to the ground, back arch or slouch, shoulder collapse or torso rotate."]}},{"id":"e096247c-374f-4172-9f9a-87e0a61fa058","name":"Box Jump Down To Tuck Jump","slug":"box-jump-down-to-tuck-jump-0167","description":"Step 1: Stand in front of the box with your feet shoulder-width apart and knees slightly bent.\n\nStep 2: Jump onto the box, landing softly with your knees bent and feet flat.\n\nStep 3: Step back down from the box with control, landing softly on the ground.\n\nStep 4: Immediately perform a tuck jump by jumping up and bringing your knees towards your chest.","coachingCues":[],"primaryEquipment":["Box or Step"],"muscleGroups":["calves","glutes","hamstrings","quadriceps"],"imageUrl":"https://img.youtube.com/vi/eCTwe-Szf8U/hqdefault.jpg","videoId":"eCTwe-Szf8U","videoUrl":"https://www.youtube.com/watch?v=eCTwe-Szf8U","videoThumbnailUrl":"https://img.youtube.com/vi/eCTwe-Szf8U/hqdefault.jpg","candidatePhotoUrl":"/images/exercises/frontal-box-jump-down-to-tuck-jump.jpg","hasCandidatePhoto":true,"warnings":[],"ytTitle":"How to do a Box Jump-Down to Tuck Jump","ytAuthor":"National Academy of Sports Medicine (NASM)","ytStatus":"OK","card":{"category":"Plyometrics","phase":"Phase 5 (Power) or Phase 1 (Stabilization hold)","primeMover":"Quadriceps, Gluteus Maximus & Gastrocnemius / Soleus (Explosive Triple Extension)","kineticCheckpoints":{"feetAnkles":"Shoulder-width takeoff; land softly with entire foot (heels and forefeet) on box.","knees":"Drive knees straight forward over toes; strictly avoid knee valgus (caving inward) on landing.","lphc":"Absorb landing force in a quarter-to-half squat with neutral spine and chest proud.","shoulders":"Arms swing aggressively upward to generate vertical momentum.","headNeck":"Gaze focused on landing zone on top of box, chin neutral."},"clinicalCues":["Land as softly and quietly as possible to absorb impact through muscles rather than joints.","Always step down one foot at a time; never jump backward down from the box.","Ensure knees track directly in line with middle toes upon landing without caving inward (valgus)."],"howToSteps":["1. Stand in front of the box with your feet shoulder-width apart and knees slightly bent.","2. Jump onto the box, landing softly with your knees bent and feet flat.","3. Step back down from the box with control, landing softly on the ground.","4. Immediately perform a tuck jump by jumping up and bringing your knees towards your chest."]}},{"id":"27532143-da51-4dcf-9a36-b4b652b0bb72","name":"Box Jump Up With Stabilization","slug":"box-jump-up-with-stabilization-0170","description":"Step 1: Stand in front of the box with your feet shoulder-width apart and knees slightly bent.\n\nStep 2: Bend your knees and swing your arms back to generate momentum as you prepare to jump.\n\nStep 3: Explode upward, driving your knees towards your chest, and land softly on the box with your feet flat.\n\nStep 4: Stabilize your position for a moment, then step back down carefully to the starting position.","coachingCues":[],"primaryEquipment":["Box or Step"],"muscleGroups":["calves","core","glutes","hamstrings","quadriceps"],"imageUrl":"https://img.youtube.com/vi/757ht_Y-fY0/hqdefault.jpg","videoId":"757ht_Y-fY0","videoUrl":"https://www.youtube.com/watch?v=757ht_Y-fY0","videoThumbnailUrl":"https://img.youtube.com/vi/757ht_Y-fY0/hqdefault.jpg","candidatePhotoUrl":"/images/exercises/box-jump-up-with-stabilization.jpg","hasCandidatePhoto":true,"warnings":[],"ytTitle":"How to do a Box Jump-Up with Stabilization","ytAuthor":"National Academy of Sports Medicine (NASM)","ytStatus":"OK","card":{"category":"Plyometrics","phase":"Phase 5 (Power) or Phase 1 (Stabilization hold)","primeMover":"Quadriceps, Gluteus Maximus & Gastrocnemius / Soleus (Explosive Triple Extension)","kineticCheckpoints":{"feetAnkles":"Shoulder-width takeoff; land softly with entire foot (heels and forefeet) on box.","knees":"Drive knees straight forward over toes; strictly avoid knee valgus (caving inward) on landing.","lphc":"Absorb landing force in a quarter-to-half squat with neutral spine and chest proud.","shoulders":"Arms swing aggressively upward to generate vertical momentum.","headNeck":"Gaze focused on landing zone on top of box, chin neutral."},"clinicalCues":["Land as softly and quietly as possible to absorb impact through muscles rather than joints.","Always step down one foot at a time; never jump backward down from the box.","Ensure knees track directly in line with middle toes upon landing without caving inward (valgus)."],"howToSteps":["1. Stand in front of the box with your feet shoulder-width apart and knees slightly bent.","2. Bend your knees and swing your arms back to generate momentum as you prepare to jump.","3. Explode upward, driving your knees towards your chest, and land softly on the box with your feet flat.","4. Stabilize your position for a moment, then step back down carefully to the starting position."]}},{"id":"674b5e6a-43bb-4a06-ba89-7381182e54f4","name":"Box Jump Up With Stabilization Frontal","slug":"box-jump-up-with-stabilization-frontal-0171","description":"Step 1: Stand in front of the box with your feet shoulder-width apart and knees slightly bent.\n\nStep 2: Bend your knees and swing your arms back to generate momentum.\n\nStep 3: Jump explosively onto the box, landing softly with your knees slightly bent and feet flat.\n\nStep 4: Stabilize your position for a moment before stepping back down to the starting position.","coachingCues":[],"primaryEquipment":["Box or Step"],"muscleGroups":["calves","core","glutes","hamstrings","quadriceps"],"imageUrl":"https://img.youtube.com/vi/624ARptOVDM/hqdefault.jpg","videoId":"624ARptOVDM","videoUrl":"https://www.youtube.com/watch?v=624ARptOVDM","videoThumbnailUrl":"https://img.youtube.com/vi/624ARptOVDM/hqdefault.jpg","candidatePhotoUrl":"/images/exercises/box-jump-up-with-stabilization.jpg","hasCandidatePhoto":true,"warnings":[],"ytTitle":"How to do a Box Jump-Up with Stabilization Frontal","ytAuthor":"National Academy of Sports Medicine (NASM)","ytStatus":"OK","card":{"category":"Plyometrics","phase":"Phase and in front of the box with your feet shoulder-width apart and knees slightly bent.\n\nStep 2: Bend your knees and swing your arms back to generate momentum.\n\nStep 3: Explode upward, driving your knees toward your chest as you jump onto the box.\n\nStep 4: Land softly with your knees slightly bent, then step back down to repeat.","coachingCues":[],"primaryEquipment":["Box or Step"],"muscleGroups":["calves","glutes","hamstrings","quadriceps"],"imageUrl":"https://img.youtube.com/vi/DXu-8TAJwi4/hqdefault.jpg","videoId":"DXu-8TAJwi4","videoUrl":"https://www.youtube.com/watch?v=DXu-8TAJwi4","videoThumbnailUrl":"https://img.youtube.com/vi/DXu-8TAJwi4/hqdefault.jpg","candidatePhotoUrl":"/images/exercises/box-jumps.jpg","hasCandidatePhoto":true,"warnings":[],"ytTitle":"How to do Box Jumps | Proper Form & Technique | NASM","ytAuthor":"National Academy of Sports Medicine (NASM)","ytStatus":"OK","card":{"category":"Plyometrics","phase":"Phase 5 (Power) or Phase 1 (Stabilization hold)","primeMover":"Quadriceps, Gluteus Maximus & Gastrocnemius / Soleus (Explosive Triple Extension)","kineticCheckpoints":{"feetAnkles":"Shoulder-width takeoff; land softly with entire foot (heels and forefeet) on box.","knees":"Drive knees straight forward over toes; strictly avoid knee valgus (caving inward) on landing.","lphc":"Absorb landing force in a quarter-to-half squat with neutral spine and chest proud.","shoulders":"Arms swing aggressively upward to generate vertical momentum.","headNeck":"Gaze focused on landing zone on top of box, chin neutral."},"clinicalCues":["Land as softly and quietly as possible to absorb impact through muscles rather than joints.","Always step down one foot at a time; never jump backward down from the box.","Ensure knees track directly in line with middle toes upon landing without caving inward (valgus)."],"howToSteps":["1. Stand in front of the box with your feet shoulder-width apart and knees slightly bent.","2. Bend your knees and swing your arms back to generate momentum.","3. Explode upward, driving your knees toward your chest as you jump onto the box.","4. Land softly with your knees slightly bent, then step back down to repeat."]}},{"id":"3231ee9e-ed64-49f5-a85f-fecab5cd43f5","name":"Box Squat","slug":"box-squat-0065","description":"Step 1: Setup Stand in front of a box or bench with feet shoulder-width apart and toes slightly pointed out.\n\nStep 2: Brace/Position Engage your core, maintain a neutral spine, and hinge at the hips while lowering into a squat position, ensuring your knees track over your toes.\n\nStep 3: Execute Lower your body until your glutes lightly touch the box, keeping your weight distributed evenly through your heels.\n\nStep 4: Return/Repeat Push through your heels to stand back up, fully extending your hips and knees, then repeat the movement.","coachingCues":[],"primaryEquipment":["Box or Step"],"muscleGroups":["glutes","hamstrings","quadriceps"],"imageUrl":"https://img.youtube.com/vi/-GaRp6_b2vk/hqdefault.jpg","videoId":"-GaRp6_b2vk","videoUrl":"https://www.youtube.com/watch?v=-GaRp6_b2vk","videoThumbnailUrl":"https://img.youtube.com/vi/-GaRp6_b2vk/hqdefault.jpg","candidatePhotoUrl":"/images/exercises/box-squat.jpg","hasCandidatePhoto":true,"warnings":[],"ytTitle":"How to do a Box Squat","ytAuthor":"National Academy of Sports Medicine (NASM)","ytStatus":"OK","card":{"category":"Legs","phase":"Phase 1: Stabilization · Phase 2: Strength Endurance · Phase 3: Hypertrophy","primeMover":"Quadriceps & Gluteus Maximus","kineticCheckpoints":{"feetAnkles":"Shoulder-width, firmly planted on ground.","knees":"Aligned with second and third toes.","lphc":"Neutral lumbar spine; core braced.","shoulders":"Retracted and depressed into athletic posture.","headNeck":"Neutral cervical spine, chin packed."},"clinicalCues":["Maintain neutral kinetic chain checkpoints throughout.","Control the 2-second eccentric lowering phase.","Exhale on exertion while maintaining intra-abdominal brace."],"howToSteps":["1. S
