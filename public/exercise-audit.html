kcho/hqdefault.jpg","videoId":"Q2MbIzmkcho","videoUrl":"https://www.youtube.com/watch?v=Q2MbIzmkcho","videoThumbnailUrl":"https://img.youtube.com/vi/Q2MbIzmkcho/hqdefault.jpg","candidatePhotoUrl":"/images/exercises/plank-with-knees-down.jpg","hasCandidatePhoto":true,"warnings":[],"ytTitle":"How to do a Plank with Knees Down","ytAuthor":"National Academy of Sports Medicine (NASM)","ytStatus":"OK","card":{"category":"Core","phase":"Phase 1 (Stabilization Endurance)","primeMover":"Transverse Abdominis & Rectus Abdominis","kineticCheckpoints":{"feetAnkles":"Dorsiflexed on balls of feet, hip-width apart.","knees":"Locked straight with active quadriceps contraction.","lphc":"Neutral pelvis with posterior pelvic tilt; zero sagging in lumbar spine.","shoulders":"Elbows directly under shoulders; push floor away to avoid winging.","headNeck":"Neutral cervical spine; chin tucked gazing at hands."},"clinicalCues":["Pull navel to spine and squeeze glutes hard to lock pelvis in neutral position.","Push floor away with forearms to prevent shoulder blades from collapsing.","Do not hold breath; breathe smoothly into abdomen."],"howToSteps":["1. Setup Begin in a kneeling position on a mat, with your hands placed directly under your shoulders and your knees hip-width apart.","2. Brace/Position Engage your core by pulling your belly button towards your spine and maintain a neutral spine position, keeping your head aligned with your back.","3. Execute Slowly extend your body forward, lifting your torso while keeping your knees on the ground, forming a straight line from your head to your knees.","4. Return/Repeat Hold the plank position for the desired duration, then gently lower your torso back to the starting position and repeat."]}},{"id":"3826e0d7-9753-48a3-aca2-190dcfdf83c1","name":"Plyometric Push Up","slug":"plyometric-push-up","description":"Step 1: Start in a standard push-up position with your hands slightly wider than shoulder-width apart and your body in a straight line from head to heels.\n\nStep 2: Lower your chest towards the ground by bending your elbows while keeping your core engaged.\n\nStep 3: Explode upward by pushing through your palms, allowing your hands to leave the ground.\n\nStep 4: Land softly back in the starting push-up position, absorbing the impact with your arms and legs.","coachingCues":[],"primaryEquipment":["None"],"muscleGroups":["chest","shoulders","triceps"],"imageUrl":"https://img.youtube.com/vi/MH4gcTKQiEc/hqdefault.jpg","videoId":"MH4gcTKQiEc","videoUrl":"https://www.youtube.com/watch?v=MH4gcTKQiEc","videoThumbnailUrl":"https://img.youtube.com/vi/MH4gcTKQiEc/hqdefault.jpg","candidatePhotoUrl":"/images/exercises/plyometric-push-up.jpg","hasCandidatePhoto":true,"warnings":[],"ytTitle":"How to do a Plyometric Push-Up | Proper Form & Technique | NASM","ytAuthor":"National Academy of Sports Medicine (NASM)","ytStatus":"OK","card":{"category":"Chest","phase":"Phase 1 (Stabilization Endurance), Phase 2 (Strength Endurance)","primeMover":"Pectoralis Major","kineticCheckpoints":{"feetAnkles":"Together or hip-width apart, dorsiflexed on balls of feet.","knees":"Fully extended with active quadriceps contraction.","lphc":"Neutral pelvis; no sagging hips (anterior tilt) or pike (excessive flexion).","shoulders":"Hands placed slightly wider than shoulder-width, fingers pointing forward.","headNeck":"Neutral cervical spine, chin tucked, gaze looking 6 inches ahead."},"clinicalCues":["Engage glutes and brace core to maintain rigid plank posture.","Do not allow lower back to sag or head to jut forward toward the floor.","Push the ground away at the top of the rep to engage serratus anterior."],"howToSteps":["1. Start in a standard push-up position with your hands slightly wider than shoulder-width apart and your body in a straight line from head to heels.","2. Lower your chest towards the ground by bending your elbows while keeping your core engaged.","3. Explode upward by pushing through your palms, allowing your hands to leave the ground.","4. Land softly back in the starting push-up position, absorbing the impact with your arms and legs."]}},{"id":"bf07feae-17af-4720-b8e4-0e5c1d80634d","name":"Power Step Up","slug":"power-step-up-0176","description":"Step 1: Stand facing the box or step with your feet hip-width apart and your core engaged.\n\nStep 2: Shift your weight onto one foot and place the other foot firmly on the box or step.\n\nStep 3: Push through the heel of the foot on the box to lift your body up, bringing the opposite knee toward your chest.\n\nStep 4: Lower yourself back down to the starting position with control and repeat on the other side.","coachingCues":[],"primaryEquipment":["Box or Step"],"muscleGroups":["glutes","hamstrings","quadriceps"],"imageUrl":"https://img.youtube.com/vi/UCsdLEqtWSg/hqdefault.jpg","videoId":"UCsdLEqtWSg","videoUrl":"https://www.youtube.com/watch?v=UCsdLEqtWSg","videoThumbnailUrl":"https://img.youtube.com/vi/UCsdLEqtWSg/hqdefault.jpg","candidatePhotoUrl":"/images/exercises/power-step-up.jpg","hasCandidatePhoto":true,"warnings":[],"ytTitle":"How to do a Power Step-Up","ytAuthor":"National Academy of Sports Medicine (NASM)","ytStatus":"OK","card":{"category":"Legs","phase":"Phase 1: Stabilization · Phase 2: Strength Endurance · Phase 3: Hypertrophy","primeMover":"Quadriceps & Gluteus Maximus","kineticCheckpoints":{"feetAnkles":"Shoulder-width, firmly planted on ground.","knees":"Aligned with second and third toes.","lphc":"Neutral lumbar spine; core braced.","shoulders":"Retracted and depressed into athletic posture.","headNeck":"Neutral cervical spine, chin packed."},"clinicalCues":["Maintain neutral kinetic chain checkpoints throughout.","Control the 2-second eccentric lowering phase.","Exhale on exertion while maintaining intra-abdominal brace."],"howToSteps":["1. Stand facing the box or step with your feet hip-width apart and your core engaged.","2. Shift your weight onto one foot and place the other foot firmly on the box or step.","3. Push through the heel of the foot on the box to lift your body up, bringing the opposite knee toward your chest.","4. Lower yourself back down to the starting position with control and repeat on the other side."]}},{"id":"e369704b-3ab4-4c2a-93d0-7f8581f57b97","name":"Prisoner Squat","slug":"prisoner-squat-0122","description":"Step 1: Setup Stand with your feet shoulder-width apart, toes slightly pointed out, and place your hands behind your head, interlocking your fingers.\n\nStep 2: Brace/Position Engage your core, keeping your chest up and shoulders back while maintaining a neutral spine.\n\nStep 3: Execute Lower your body by bending at the hips and knees, keeping your elbows inside your knees and lowering until your thighs are parallel to the ground.\n\nStep 4: Return/Repeat Push through your heels to return to the starting position, fully extending your hips and knees, and repeat for the desired number of repetitions.","coachingCues":[],"primaryEquipment":[],"muscleGroups":["glutes","hamstrings","quadriceps"],"imageUrl":"https://img.youtube.com/vi/dC0yGLZwxas/hqdefault.jpg","videoId":"dC0yGLZwxas","videoUrl":"https://www.youtube.com/watch?v=dC0yGLZwxas","videoThumbnailUrl":"https://img.youtube.com/vi/dC0yGLZwxas/hqdefault.jpg","candidatePhotoUrl":"/images/exercises/prisoner-squat.jpg","hasCandidatePhoto":true,"warnings":[],"ytTitle":"How to do a Prisoner Squat","ytAuthor":"National Academy of Sports Medicine (NASM)","ytStatus":"OK","card":{"category":"Legs","phase":"Phase 1: Stabilization · Phase 2: Strength Endurance · Phase 3: Hypertrophy","primeMover":"Quadriceps & Gluteus Maximus","kineticCheckpoints":{"feetAnkles":"Shoulder-width, firmly planted on ground.","knees":"Aligned with second and third toes.","lphc":"Neutral lumbar spine; core braced.","shoulders":"Retracted and depressed into athletic posture.","headNeck":"Neutral cervical spine, chin packed."},"clinicalCues":["Maintain neutral kinetic chain checkpoints throughout.","Control the 2-second eccentric lowering phase.","Exhale on exertion while maintaining intra-abdominal brace."],"howToSteps":["1. Setup Stand with your feet shoulder-width apart, toes slightly pointed out, and place your hands behind your head, interlocking your fingers.","2. Brace/Position Engage your core, keeping your chest up and shoulders back while maintaining a neutral spine.","3. Execute Lower your body by bending at the hips and knees, keeping your elbows inside your knees and lowering until your thighs are parallel to the ground.","4. Return/Repeat Push through your heels to return to the starting position, fully extending your hips and knees, and repeat for the desired number of repetitions."]}},{"id":"a4dd5d3d-64b6-42bc-aaa7-8febe1db7af9","name":"Prisoner Squat Calf Raise","slug":"prisoner-squat-calf-raise-0123","description":"Step 1: Setup Stand with your feet shoulder-width apart, toes slightly pointed out, and place your hands behind your head with elbows flared out.\n\nStep 2: Brace/Position Engage your core, keeping your chest up and back straight, while maintaining a neutral spine.\n\nStep 3: Execute Lower your body into a squat by bending at the knees and hips, then rise back up to standing while simultaneously lifting your heels off the ground into a calf raise.\n\nStep 4: Return/Repeat Lower your heels back to the ground, return to the starting squat position, and repeat the movement for the desired number of repetitions.","coachingCues":[],"primaryEquipment":[],"muscleGroups":["calves","glutes","hamstrings","quadriceps"],"imageUrl":"https://img.youtube.com/vi/Xz0PPBZO2xc/hqdefault.jpg","videoId":"Xz0PPBZO2xc","videoUrl":"https://www.youtube.com/watch?v=Xz0PPBZO2xc","videoThumbnailUrl":"https://img.youtube.com/vi/Xz0PPBZO2xc/hqdefault.jpg","candidatePhotoUrl":"/images/exercises/prisoner-squat-calf-raise.jpg","hasCandidatePhoto":true,"warnings":[],"ytTitle":"How to do a Prisoner Squat Calf Raise","ytAuthor":"National Academy of Sports Medicine (NASM)","ytStatus":"OK","card":{"category":"Legs","phase":"Phase 1: Stabilization · Phase 2: Strength Endurance · Phase 3: Hypertrophy","primeMover":"Quadriceps & Gluteus Maximus","kineticCheckpoints":{"feetAnkles":"Shoulder-width, firmly planted on ground.","knees":"Aligned with second and third toes.","lphc":"Neutral lumbar spine; core braced.","shoulders":"Retracted and depressed into athletic posture.","headNeck":"Neutral cervical spine, chin packed."},"clinicalCues":["Maintain neutral kinetic chain checkpoints throughout.","Control the 2-second eccentric lowering phase.","Exhale on exertion while maintaining intra-abdominal brace."],"howToSteps":["1. Setup Stand with your feet shoulder-width apart, toes slightly pointed out, and place your hands behind your head with elbows flared out.","2. Brace/Position Engage your core, keeping your chest up and back straight, while maintaining a neutral spine.","3. Execute Lower your body into a squat by bending at the knees and hips, then rise back up to standing while simultaneously lifting your heels off the ground into a calf raise.","4. Return/Repeat Lower your heels back to the ground, return to the starting squat position, and repeat the movement for the desired number of repetitions."]}},{"id":"3ec8001e-6413-4b2a-b1b3-565a41156725","name":"Pull Up","slug":"pull-up","description":"Step 1: Grab the pull-up bar with a 1-1.5x shoulder width grip, palms facing away from you. Draw in and brace the abs. Slightly pack the shoulders back and down.\n\nStep 2: Pull the body upward driving the chest toward the bar/handles until the arms/elbows are packed into the side of the body. Drive the shoulder blades back and down as you do.\n\nStep 3: Reverse the pattern and return to starting position.\n\nStep 4: Repeat. Maintain posture throughout. Avoid shrugging the shoulders, arching the lower back, swinging, jutting the head forward or not fully extending the elbows on the descent.","coachingCues":[],"primaryEquipment":["Pull-Up Bar"],"muscleGroups":["back","biceps"],"imageUrl":"https://img.youtube.com/vi/9yVGh3XbJ34/hqdefault.jpg","videoId":"9yVGh3XbJ34","videoUrl":"https://www.youtube.com/watch?v=9yVGh3XbJ34","videoThumbnailUrl":"https://img.youtube.com/vi/9yVGh3XbJ34/hqdefault.jpg","candidatePhotoUrl":"/images/exercises/pull-up.jpg","hasCandidatePhoto":true,"warnings":[],"ytTitle":"How to do a Pull-Up | Proper Form & Technique | NASM","ytAuthor":"National Academy of Sports Medicine (NASM)","ytStatus":"OK","card":{"category":"Back","phase":"Phase 2 (Strength Endurance), Phase 4 (Max Strength)","primeMover":"Latissimus Dorsi","kineticCheckpoints":{"feetAnkles":"Crossed or straight with toes pointed slightly forward.","knees":"Slight bend or extended straight in \"hollow body\" position.","lphc":"Core braced in hollow body position without excessive spinal arching.","shoulders":"Full scapular depression before pulling.","headNeck":"Neutral cervical spine; clear chin over bar without reaching neck up."},"clinicalCues":["Start every repetition from an active dead hang with engaged scapulae.","Drive elbows down toward hip pockets rather than pulling with biceps alone.","Avoid swinging, kicking legs (kipping), or craning neck over bar."],"howToSteps":["1. Grab the pull-up bar with a 1-1.5x shoulder width grip, palms facing away from you. Draw in and brace the abs. Slightly pack the shoulders back and down.","2. Pull the body upward driving the chest toward the bar/handles until the arms/elbows are packed into the side of the body. Drive the shoulder blades back and down as you do.","3. Reverse the pattern and return to starting position.","4. Repeat. Maintain posture throughout. Avoid shrugging the shoulders, arching the lower back, swinging, jutting the head forward or not fully extending the elbows on the descent."]}},{"id":"d1445efb-b5df-415c-b8a9-933b11a68620","name":"Push Press","slug":"push-press-0063","description":"Step 1: Setup Stand with your feet shoulder-width apart, holding a barbell at shoulder height with an overhand grip, elbows slightly in front of the bar.\n\nStep 2: Brace/Position Engage your core, keep your chest up, and maintain a neutral spine while positioning your feet firmly on the ground.\n\nStep 3: Execute Press the barbell overhead by extending your arms while simultaneously driving through your legs, using a slight dip in your knees for momentum.\n\nStep 4: Return/Repeat Lower the barbell back to shoulder height in a controlled manner, ensuring your elbows remain in front of the bar before repeating the movement.","coachingCues":[],"primaryEquipment":["Barbell"],"muscleGroups":["deltoids","glutes","hamstrings","quadriceps","shoulders","triceps"],"imageUrl":"https://img.youtube.com/vi/ODwyDtlXnXk/hqdefault.jpg","videoId":"ODwyDtlXnXk","videoUrl":"https://www.youtube.com/watch?v=ODwyDtlXnXk","videoThumbnailUrl":"https://img.youtube.com/vi/ODwyDtlXnXk/hqdefault.jpg","candidatePhotoUrl":"/images/exercises/push-press.jpg","hasCandidatePhoto":true,"warnings":[],"ytTitle":"How to do a Push Press","ytAuthor":"National Academy of Sports Medicine (NASM)","ytStatus":"OK","card":{"category":"Plyometrics","phase":"Phase 5 (Power)","primeMover":"Deltoids & Quadriceps / Gluteals (Triple Extension Transfer)","kineticCheckpoints":{"feetAnkles":"Shoulder-width apart, heels grounded through takeoff and landing.","knees":"Quick 2–3 inch dip tracking directly over second toes; avoid valgus cave.","lphc":"Vertical torso during dip-drive; no forward chest collapse or spinal arching.","shoulders":"Barbell or dumbbells racked securely across anterior deltoids.","headNeck":"Neutral cervical spine; head moves slightly back to clear bar path."},"clinicalCues":["Use explosive leg drive to initiate bar momentum before pressing arms.","Keep torso vertical during the shallow knee dip (avoid forward hinge).","Lock out weight overhead with biceps next to ears and core braced."],"howToSteps":["1. Setup Stand with your feet shoulder-width apart, holding a barbell at shoulder height with an overhand grip, elbows slightly in front of the bar.","2. Brace/Position Engage your core, keep your chest up, and maintain a neutral spine while positioning your feet firmly on the ground.","3. Execute Press the barbell overhead by extending your arms while simultaneously driving through your legs, using a slight dip in your knees for momentum.","4. Return/Repeat Lower the barbell back to shoulder height in a controlled manner, ensuring your elbows remain in front of the bar before repeating the movement."]}},{"id":"c3ab32b1-4fbd-42e3-96f4-f3945a5063fa","name":"Push Up","slug":"push-up-0192","description":"Step 1: Setup Begin in a high plank position with your hands placed slightly wider than shoulder-width apart and your feet together.\n\nStep 2: Brace/Position Engage your core, keep your body in a straight line from head to heels, and tuck your elbows close to your body.\n\nStep 3: Execute Lower your body towards the ground by bending your elbows, keeping them at a 45-degree angle, until your chest nearly touches the floor.\n\nStep 4: Return/Repeat Push through your palms to extend your arms and return to the starting position, then repeat for the desired number of repetitions.","coachingCues":[],"primaryEquipment":[],"muscleGroups":["chest","shoulders","triceps"],"imageUrl":"https://img.youtube.com/vi/7NUICnha_Hk/hqdefault.jpg","videoId":"7NUICnha_Hk","videoUrl":"https://www.youtube.com/watch?v=7NUICnha_Hk","videoThumbnailUrl":"https://img.youtube.com/vi/7NUICnha_Hk/hqdefault.jpg","candidatePhotoUrl":"/images/exercises/push-up.jpg","hasCandidatePhoto":true,"warnings":[],"ytTitle":"How to do a Push-Up","ytAuthor":"National Academy of Sports Medicine (NASM)","ytStatus":"OK","card":{"category":"Chest","phase":"Phase 1 (Stabilization Endurance), Phase 2 (Strength Endurance)","primeMover":"Pectoralis Major","kineticCheckpoints":{"feetAnkles":"Together or hip-width apart, dorsiflexed on balls of feet.","knees":"Fully extended with active quadriceps contraction.","lphc":"Neutral pelvis; no sagging hips (anterior tilt) or pike (excessive flexion).","shoulders":"Hands placed slightly wider than shoulder-width, fingers pointing forward.","headNeck":"Neutral cervical spine, chin tucked, gaze looking 6 inches ahead."},"clinicalCues":["Engage glutes and brace core to maintain rigid plank posture.","Do not allow lower back to sag or head to jut forward toward the floor.","Push the ground away at the top of the rep to engage serratus anterior."],"howToSteps":["1. Setup Begin in a high plank position with your hands placed slightly wider than shoulder-width apart and your feet together.","2. Brace/Position Engage your core, keep your body in a straight line from head to heels, and tuck your elbows close to your body.","3. Execute Lower your body towards the ground by bending your elbows, keeping them at a 45-degree angle, until your chest nearly touches the floor.","4. Return/Repeat Push through your palms to extend your arms and return to the starting position, then repeat for the desired number of repetitions."]}},{"id":"7512458f-639d-451d-8940-dbc004c0dd3a","name":"Push Up Plus","slug":"push-up-plus-0202","description":"Step 1: Setup Begin in a high plank position with your hands slightly wider than shoulder-width apart and your feet hip-width apart, ensuring your body forms a straight line from head to heels.\n\nStep 2: Brace/Position Engage your core and glutes, keeping your shoulders directly over your wrists and your neck neutral.\n\nStep 3: Execute Lower your body towards the ground by bending your elbows while keeping them close to your sides, then push back up to the starting position. At the top, protract your shoulder blades by pushing through your palms, rounding your upper back slightly.\n\nStep 4: Return/Repeat Lower back into the push-up position, then repeat the movement for the desired number of repetitions, maintaining proper form throughout.","coachingCues":[],"primaryEquipment":[],"muscleGroups":["chest","shoulders","tric away at the top of the rep to engage serratus anterior."],"howToSteps":["1. Setup Begin in a high plank position with your hands slightly wider than shoulder-width apart and your feet hip-width apart.","2. Brace/Position Engage your core, keeping your body in a straight line from head to heels, and ensure your shoulders are directly over your wrists.","3. Execute Lower your body towards the ground by bending your elbows, keeping them close to your sides, then push back up to the starting position.","4. Return/Repeat After returning to the starting position, lift one foot off the ground and extend it out to the side, holding for a moment before returning to the plank and repeating the push-up."]}},{"id":"7f1723c1-48e9-4fb8-9af5-1d8c75fe2850","name":"Push Up With Rotation","slug":"push-up-with-rotation-0125","description":"Step 1: Setup Begin in a high plank position with your hands slightly wider than shoulder-width apart and your feet hip-width apart.\n\nStep 2: Brace/Position Engage your core and maintain a straight line from your head to your heels, ensuring your hips are neither sagging nor elevated.\n\nStep 3: Execute Lower your body towards the floor by bending your elbows, keeping them at a 45-degree angle to your torso. As you push back up, rotate your torso to one side, extending the opposite arm towards the ceiling.\n\nStep 4: Return/Repeat Return to the starting plank position and repeat the movement, alternating the rotation to the opposite side with each repetition.","coachingCues":[],"primaryEquipment":[],"muscleGroups":["chest","shoulders","triceps"],"imageUrl":"https://img.youtube.com/vi/miN74vJbE_w/hqdefault.jpg","videoId":"miN74vJbE_w","videoUrl":"https://www.youtube.com/watch?v=miN74vJbE_w","videoThumbnailUrl":"https://img.youtube.com/vi/miN74vJbE_w/hqdefault.jpg","candidatePhotoUrl":"/images/exercises/push-up-with-rotation.jpg","hasCandidatePhoto":true,"warnings":[],"ytTitle":"How to do a Push-Up with Rotation","ytAuthor":"National Academy of Sports Medicine (NASM)","ytStatus":"OK","card":{"category":"Chest","phase":"Phase 1 (Stabilization Endurance), Phase 2 (Strength Endurance)","primeMover":"Pectoralis Major","kineticCheckpoints":{"feetAnkles":"Together or hip-width apart, dorsiflexed on balls of feet.","knees":"Fully extended with active quadriceps contraction.","lphc":"Neutral pelvis; no sagging hips (anterior tilt) or pike (excessive flexion).","shoulders":"Hands placed slightly wider than shoulder-width, fingers pointing forward.","headNeck":"Neutral cervical spine, chin tucked, gaze looking 6 inches ahead."},"clinicalCues":["Engage glutes and brace core to maintain rigid plank posture.","Do not allow lower back to sag or head to jut forward toward the floor.","Push the ground away at the top of the rep to engage serratus anterior."],"howToSteps":["1. Setup Begin in a high plank position with your hands slightly wider than shoulder-width apart and your feet hip-width apart.","2. Brace/Position Engage your core and maintain a straight line from your head to your heels, ensuring your hips are neither sagging nor elevated.","3. Execute Lower your body towards the floor by bending your elbows, keeping them at a 45-degree angle to your torso. As you push back up, rotate your torso to one side, extending the opposite arm towards the ceiling.","4. Return/Repeat Return to the starting plank position and repeat the movement, alternating the rotation to the opposite side with each repetition."]}},{"id":"d1bcc326-e2c4-403e-ac0b-2087d08a1a2e","name":"Push Up With Staggered Hands","slug":"push-up-with-staggered-hands-0203","description":"Step 1: Setup Place your hands on the floor, staggered with one hand positioned slightly forward and the other hand slightly back, shoulder-width apart.\n\nStep 2: Brace/Position Engage your core, keep your body in a straight line from head to heels, and position your feet together or slightly apart for stability.\n\nStep 3: Execute Lower your body towards the floor by bending your elbows, keeping them close to your sides, until your chest nearly touches the ground.\n\nStep 4: Return/Repeat Push through your palms to extend your arms, returning to the starting position, and repeat for the desired number of repetitions.","coachingCues":[],"primaryEquipment":[],"muscleGroups":["chest","shoulders","triceps"],"imageUrl":"https://img.youtube.com/vi/miMPlHvDwxc/hqdefault.jpg","videoId":"miMPlHvDwxc","videoUrl":"https://www.youtube.com/watch?v=miMPlHvDwxc","videoThumbnailUrl":"https://img.youtube.com/vi/miMPlHvDwxc/hqdefault.jpg","candidatePhotoUrl":"/images/exercises/push-up-with-staggered-hands.jpg","hasCandidatePhoto":true,"warnings":[],"ytTitle":"How to do a Push-Up with Staggered Hands","ytAuthor":"National Academy of Sports Medicine (NASM)","ytStatus":"OK","card":{"category":"Chest","phase":"Phase 1 (Stabilization Endurance), Phase 2 (Strength Endurance)","primeMover":"Pectoralis Major","kineticCheckpoints":{"feetAnkles":"Together or hip-width apart, dorsiflexed on balls of feet.","knees":"Fully extended with active quadriceps contraction.","lphc":"Neutral pelvis; no sagging hips (anterior tilt) or pike (excessive flexion).","shoulders":"Hands placed slightly wider than shoulder-width, fingers pointing forward.","headNeck":"Neutral cervical spine, chin tucked, gaze looking 6 inches ahead."},"clinicalCues":["Engage glutes and brace core to maintain rigid plank posture.","Do not allow lower back to sag or head to jut forward toward the floor.","Push the ground away at the top of the rep to engage serratus anterior."],"howToSteps":["1. Setup Place your hands on the floor, staggered with one hand positioned slightly forward and the other hand slightly back, shoulder-width apart.","2. Brace/Position Engage your core, keep your body in a straight line from head to heels, and position your feet together or slightly apart for stability.","3. Execute Lower your body towards the floor by bending your elbows, keeping them close to your sides, until your chest nearly touches the ground.","4. Return/Repeat Push through your palms to extend your arms, returning to the starting position, and repeat for the desired number of repetitions."]}},{"id":"471dfd56-713b-4895-9fb5-6c854eeaac9b","name":"Quadruped Arm Raise","slug":"quadruped-arm-raise-0083","description":"Step 1: Setup Begin in a quadruped position on all fours, with your hands directly under your shoulders and knees under your hips.\n\nStep 2: Brace/Position Engage your core, keeping your back flat and neck neutral, while maintaining a stable base with your hands and knees.\n\nStep 3: Execute Slowly raise your right arm straight out in front of you, keeping it in line with your shoulder, while maintaining balance and stability in your torso.\n\nStep 4: Return/Repeat Lower your right arm back to the starting position and repeat the movement with your left arm, alternating sides for the desired number of repetitions.","coachingCues":[],"primaryEquipment":[],"muscleGroups":["quadriceps"],"imageUrl":"https://img.youtube.com/vi/PSytregUBZY/hqdefault.jpg","videoId":"PSytregUBZY","videoUrl":"https://www.youtube.com/watch?v=PSytregUBZY","videoThumbnailUrl":"https://img.youtube.com/vi/PSytregUBZY/hqdefault.jpg","candidatePhotoUrl":"/images/exercises/quadruped-arm-raise.jpg","hasCandidatePhoto":true,"warnings":[],"ytTitle":"How to do a Quadruped Arm Raise","ytAuthor":"National Academy of Sports Medicine (NASM)","ytStatus":"OK","card":{"category":"Legs","phase":"Phase 1: Stabilization · Phase 2: Strength Endurance · Phase 3: Hypertrophy","primeMover":"Quadriceps & Gluteus Maximus","kineticCheckpoints":{"feetAnkles":"Shoulder-width, firmly planted on ground.","knees":"Aligned with second and third toes.","lphc":"Neutral lumbar spine; core braced.","shoulders":"Retracted and depressed into athletic posture.","headNeck":"Neutral cervical spine, chin packed."},"clinicalCues":["Maintain neutral kinetic chain checkpoints throughout.","Control the 2-second eccentric lowering phase.","Exhale on exertion while maintaining intra-abdominal brace."],"howToSteps":["1. Setup Begin in a quadruped position on all fours, with your hands directly under your shoulders and knees under your hips.","2. Brace/Position Engage your core, keeping your back flat and neck neutral, while maintaining a stable base with your hands and knees.","3. Execute Slowly raise your right arm straight out in front of you, keeping it in line with your shoulder, while maintaining balance and stability in your torso.","4. Return/Repeat Lower your right arm back to the starting position and repeat the movement with your left arm, alternating sides for the desired number of repetitions."]}},{"id":"262d3002-c12e-49a6-86d0-ab677aa2904a","name":"Quadruped Leg Raise","slug":"quadruped-leg-raise-0084","description":"Step 1: Setup Begin in a quadruped position on all fours, with your hands directly under your shoulders and knees under your hips.\n\nStep 2: Brace/Position Engage your core and maintain a neutral spine, ensuring your head is in line with your back and your gaze is directed towards the floor.\n\nStep 3: Execute Lift your right leg towards the ceiling, keeping your knee bent at 90 degrees and your foot flexed, while maintaining stability in your core and hips.\n\nStep 4: Return/Repeat Lower your right leg back to the starting position and repeat for the desired number of repetitions before switching to the left leg.","coachingCues":[],"primaryEquipment":[],"muscleGroups":["core","quadriceps"],"imageUrl":"https://img.youtube.com/vi/TJbnvoFkLKI/hqdefault.jpg","videoId":"TJbnvoFkLKI","videoUrl":"https://www.youtube.com/watch?v=TJbnvoFkLKI","videoThumbnailUrl":"https://img.youtube.com/vi/TJbnvoFkLKI/hqdefault.jpg","candidatePhotoUrl":"/images/exercises/quadruped-leg-raise.jpg","hasCandidatePhoto":true,"warnings":[],"ytTitle":"How to do a Quadruped Leg Raise","ytAuthor":"National Academy of Sports Medicine (NASM)","ytStatus":"OK","card":{"category":"Legs","phase":"Phase 1: Stab {"id":"b308a3b4-d902-4428-b48d-49cd79acd8e0","name":"Reciprocating Kettlebell Overhead Press","slug":"reciprocating-kettlebell-overhead-press-0146","description":"Step 1: Setup Stand with feet shoulder-width apart, holding a kettlebell in one hand at shoulder height with your elbow tucked in and palm facing forward.\n\nStep 2: Brace/Position Engage your core, maintain a neutral spine, and press your shoulder down away from your ear while stabilizing the kettlebell overhead.\n\nStep 3: Execute Press the kettlebell directly overhead until your arm is fully extended, keeping your wrist straight and elbow locked out.\n\nStep 4: Return/Repeat Lower the kettlebell back to shoulder height in a controlled manner, then switch to the opposite arm and repeat the movement.","coachingCues":[],"primaryEquipment":["Kettlebell"],"muscleGroups":["shoulders","triceps"],"imageUrl":"https://img.youtube.com/vi/1nem81AsHC4/hqdefault.jpg","videoId":"1nem81AsHC4","videoUrl":"https://www.youtube.com/watch?v=1nem81AsHC4","videoThumbnailUrl":"https://img.youtube.com/vi/1nem81AsHC4/hqdefault.jpg","candidatePhotoUrl":"/images/exercises/reciprocating-kettlebell-overhead-press.jpg","hasCandidatePhoto":true,"warnings":[],"ytTitle":"How to do a Reciprocating Kettlebell Overhead Press","ytAuthor":"National Academy of Sports Medicine (NASM)","ytStatus":"OK","card":{"category":"Shoulders","phase":"Phase 2 (Strength Endurance), Phase 4 (Max Strength)","primeMover":"Anterior Deltoid & Middle Deltoid","kineticCheckpoints":{"feetAnkles":"Hip-width apart, firmly rooted.","knees":"Soft extension without locking or hyperextending.","lphc":"Glutes and abs fully engaged to prevent lumbar hyperextension.","shoulders":"Elbows positioned slightly in front of bar in starting rack position.","headNeck":"Head tilts slightly back to clear bar path, then returns neutral under bar at top."},"clinicalCues":["Squeeze glutes hard to create a solid pelvic foundation and protect lumbar spine.","Do not lean backward or hyper cond/third toes; rear knee hovers 2–3 inches above ground.","lphc":"Hips level and square; slight forward torso lean (20°–30°) shortens knee moment arm and protects patellofemoral joint.","shoulders":"Shoulders retracted and depressed; chest proud with active postural control.","headNeck":"Cervical spine neutral, gaze straight ahead."},"clinicalCues":["Step straight back without letting the pelvis rotate or drop.","Maintain front knee tracking over second toe; strictly eliminate any inward valgus collapse.","Keep 70% of bodyweight loaded through the front heel and midfoot.","A slight forward torso lean shifts ground reaction shear from the patellofemoral joint to the hip extensors."],"howToSteps":["1. Setup Stand tall with your feet hip-width apart, engaging your core and maintaining a neutral spine.","2. Brace/Position Step back with your right foot, lowering into a lunge while keeping your left knee aligned over your left ankle and your torso upright.","3. Execute Push through your left heel to return to a standing position, bringing your right knee up towards your chest to balance on your left leg.","4. Return/Repeat Lower your right foot back to the ground, step back into the lunge again, and alternate legs for the desired number of repetitions."]}},{"id":"ced8c37d-8d2a-420e-b576-801803cbdb64","name":"Reverse Lunge To Row","slug":"reverse-lunge-to-row-0205","description":"Step 1: Setup Stand with feet hip-width apart, holding a dumbbell in each hand at your sides.\n\nStep 2: Brace/Position Engage your core, step back with your right foot into a lunge, keeping your left knee aligned over your left ankle.\n\nStep 3: Execute As you lower into the lunge, pull the dumbbells towards your ribcage, squeezing your shoulder blades together.\n\nStep 4: Return/Repeat Push through your left heel to return to standing, lowering the dumbbells back to your sides, and repeat on the opposite leg.","coachingCues":[],"primaryEquipment":[],"muscleGroups":["back","biceps","glutes","hamstrings","quadriceps"],"imageUrl":"https://img.youtube.com/vi/dcs7-vejMAY/hqdefault.jpg","videoId":"dcs7-vejMAY","videoUrl":"https://www.youtube.com/watch?v=dcs7-vejMAY","videoThumbnailUrl":"https://img.youtube.com/vi/dcs7-vejMAY/hqdefault.jpg","candidatePhotoUrl":"/images/exercises/reverse-lunge-to-row.jpg","hasCandidatePhoto":true,"warnings":[],"ytTitle":"How to do a Reverse Lunge to Row","ytAuthor":"National Academy of Sports Medicine (NASM)","ytStatus":"OK","card":{"category":"Legs","phase":"Phase 1 (Stabilization Endurance), Phase 2 (Strength Endurance)","primeMover":"Gluteus Maximus & Quadriceps (Vastus Medialis, Vastus Lateralis)","kineticCheckpoints":{"feetAnkles":"Front foot points straight ahead; rear foot lands smoothly on ball of foot with heel elevated.","knees":"Front knee stays aligned directly over second/third toes; rear knee hovers 2–3 inches above ground.","lphc":"Hips level and square; slight forward torso lean (20°–30°) shortens knee moment arm and protects patellofemoral joint.","shoulders":"Shoulders retracted and depressed; chest proud with active postural control.","headNeck":"Cervical spine neutral, gaze straight ahead."},"clinicalCues":["Step straight back without letting the pelvis rotate or drop.","Maintain front knee tracking over second toe; strictly eliminate any inward valgus collapse.","Keep 70% of bodyweight loaded through the front heel and midfoot.","A slight forward torso lean shifts ground reaction shear from the patellofemoral joint to the hip extensors."],"howToSteps":["1. Setup Stand with feet hip-width apart, holding a dumbbell in each hand at your sides.","2. Brace/Position Engage your core, step back with your right foot into a lunge, keeping your left knee aligned over your left ankle.","3. Execute As you lower into the lunge, pull the dumbbells towards your ribcage, squeezing your shoulder blades together.","4. Return/Repeat Push through your left heel to return to standing, lowering the dumbbells back to your sides, and repeat on the opposite leg."]}},{"id":"44574460-a398-49b6-a943-7a4464b1664f","name":"Reverse Lunge To Single Arm Row","slug":"reverse-lunge-to-single-arm-row-0206","description":"Step 1: Setup Stand with feet hip-width apart, holding a dumbbell in your right hand with your arm extended down by your side.\n\nStep 2: Brace/Position Engage your core, step back with your left foot into a lunge, ensuring your right knee stays aligned over your right ankle while your left knee hovers just above the ground.\n\nStep 3: Execute As you lower into the lunge, pull the dumbbell towards your hip with your right arm, squeezing your shoulder blade at the top of the movement.\n\nStep 4: Return/Repeat Push through your right heel to return to the starting position, lowering the dumbbell back to your side, and repeat for the desired number of repetitions before switching arms.","coachingCues":[],"primaryEquipment":[],"muscleGroups":["back","biceps","glutes","hamstrings","quadriceps"],"imageUrl":"https://img.youtube.com/vi/erYh7wR3P2Y/hqdefault.jpg","videoId":"erYh7wR3P2Y","videoUrl":"https://www.youtube.com/watch?v=erYh7wR3P2Y","videoThumbnailUrl":"https://img.youtube.com/vi/erYh7wR3P2Y/hqdefault.jpg","candidatePhotoUrl":"/images/exercises/reverse-lunge-to-single-arm-row.jpg","hasCandidatePhoto":true,"warnings":[],"ytTitle":"How to do a Reverse Lunge to Single-Arm Row","ytAuthor":"National Academy of Sports Medicine (NASM)","ytStatus":"OK","card":{"category":"Legs","phase":"Phase 1 (Stabilization Endurance), Phase 2 (Strength Endurance)","primeMover":"Gluteus Maximus & Quadriceps (Vastus Medialis, Vastus Lateralis)","kineticCheckpoints":{"feetAnkles":"Front foot points straight ahead; rear foot lands smoothly on ball of foot with heel elevated.","knees":"Front knee stays aligned directly over second/third toes; rear knee hovers 2–3 inches above ground.","lphc":"Hips level and square; slight forward torso lean (20°–30°) shortens knee moment arm and protects patellofemoral joint.","shoulders":"Shoulders retracted and depressed; chest proud with active postural control.","headNeck":"Cervical spine neutral, gaze straight ahead."},"clinicalCues":["Step straight back without letting the pelvis rotate or drop.","Maintain front knee tracking over second toe; strictly eliminate any inward valgus collapse.","Keep 70% of bodyweight loaded through the front heel and midfoot.","A slight forward torso lean shifts ground reaction shear from the patellofemoral joint to the hip extensors."],"howToSteps":["1. Setup Stand with feet hip-width apart, holding a dumbbell in your right hand with your arm extended down by your side.","2. Brace/Position Engage your core, step back with your left foot into a lunge, ensuring your right knee stays aligned over your right ankle while your left knee hovers just above the ground.","3. Execute As you lower into the lunge, pull the dumbbell towards your hip with your right arm, squeezing your shoulder blade at the top of the movement.","4. Return/Repeat Push through your right heel to return to the starting position, lowering the dumbbell back to your side, and repeat for the desired number of repetitions before switching arms."]}},{"id":"3d5b3ce1-d5ec-4768-b649-3f8a0367f912","name":"Romanian Deadlift","slug":"romanian-deadlift-0064","description":"Step 1: Setup Stand with your feet hip-width apart, holding a barbell or dumbbells in front of your thighs with an overhand grip.\n\nStep 2: Brace/Position Engage your core and hinge at your hips, keeping a slight bend in your knees as you lower the weights along your legs, maintaining a neutral spine.\n\nStep 3: Execute Drive through your heels to extend your hips forward, lifting the weights back to the starting position while squeezing your glutes at the top.\n\nStep 4: Return/Repeat Lower the weights back down in a controlled manner, keeping your back straight and repeating for the desired number of repetitions.","coachingCues":[],"primaryEquipment":[],"muscleGroups":["back","glutes","hamstrings"],"imageUrl":"https://img.youtube.com/vi/2bmuYtv4HbQ/hqdefault.jpg","videoId":"2bmuYtv4HbQ","videoUrl":"https://www.youtube.com/watch?v=2bmuYtv4HbQ","videoThumbnailUrl":"https://img.youtube.com/vi/2bmuYtv4HbQ/hqdefault.jpg","candidatePhotoUrl":"/images/exercises/dumbbell-romanian-deadlift.jpg","hasCandidatePhoto":true,"warnings":[],"ytTitle":"How to do a Romanian Deadlift","ytAuthor":"National Academy of Sports Medicine (NASM)","ytStatus":"OK","card":{"category":"Back","phase":"Phase 2 (Strength Endurance), Phase 3 (Hypertrophy)","primeMover":"Hamstrings Complex (Biceps Femoris, Semitendinosus, Semimembranosus) & Gluteus Maximus","kineticCheckpoints":{"feetAnkles":"Hip-width apart, feet parallel pointing straight ahead.","knees":"Slight \"soft\" 15°–20° bend maintained statically throughout the hinge.","lphc":"Neutral pelvis; hinge backward from acetabulofemoral hip joints.","shoulders":"Scapulae retracted and depressed, preventing upper back rounding.","headNeck":"Cervical spine aligned with thoracic spine during the entire hinge."},"clinicalCues":["Think \"push hips back\" rather than \"bend forward\".","Keep bar within 1 inch of shins at all times.","Stop descent immediately if lumbar spine begins to round."],"howToSteps":["1. Setup Stand with your feet hip-width apart, holding a barbell or dumbbells in front of your thighs with an overhand grip.","2. Brace/Position Engage your core and hinge at your hips, keeping a slight bend in your knees as you lower the weights along your legs, maintaining a neutral spine.","3. Execute Drive through your heels to extend your hips forward, lifting the weights back to the starting position while squeezing your glutes at the top.","4. Return/Repeat Lower the weights back down in a controlled manner, keeping your back straight and repeating for the desired number of repetitions."]}},{"id":"e6197915-d387-44c8-8501-41a7a0526437","name":"Russian Twist","slug":"russian-twist","description":"Step 1: Lie with upper back and head supported on a stability ball with good posture and feet hip width apart. Extend arms overhead and place hands together.\n\nStep 2: Starting in a bridged position, lock the arms and shoulder together as a unit and drive the hands and chest to the side rotating the body and rolling the ball backwards until you are on the side of your shoulder. Keep the hips bridged at all times.\n\nStep 3: Reverse the pattern and return to the starting position.\n\nStep 4: Repeat on the other side. Maintain posture throughout. Ensure balance, posture and control of the stability ball are maintained. Avoid turning the feet, dropping the hips, or using momentum.","coachingCues":[],"primaryEquipment":["Stability Ball"],"muscleGroups":["core"],"imageUrl":"https://img.youtube.com/vi/s0kT80JLCfA/hqdefault.jpg","videoId":"s0kT80JLCfA","videoUrl":"https://www.youtube.com/watch?v=s0kT80JLCfA","videoThumbnailUrl":"https://img.youtube.com/vi/s0kT80JLCfA/hqdefault.jpg","candidatePhotoUrl":"/images/exercises/russian-twist.jpg","hasCandidatePhoto":true,"warnings":[],"ytTitle":"How to do a Russian Twist  | Proper Form & Technique | NASM","ytAuthor":"National Academy of Sports Medicine (NASM)","ytStatus":"OK","card":{"category":"Core","phase":"Phase 1 (Stabilization Endurance), Phase 2 (Strength Endurance)","primeMover":"Internal & External Obliques","kineticCheckpoints":{"feetAnkles":"Heels lightly touching floor or elevated 2 inches for increased demand.","knees":"Bent at 90° angle.","lphc":"Torso leaned back 45° with a straight, tall spine (avoid rounded slumping).","shoulders":"Chest open, shoulders back and down.","headNeck":"Head and eyes follow hands during rotation."},"clinicalCues":["Rotate from the thoracic spine and ribcage, not just swinging your arms.","Keep chest proud and prevent lower back from rounding into a slumped position.","Control each twist with active oblique contraction rather than momentum."],"howToSteps":["1. Lie with upper back and head supported on a stability ball with good posture and feet hip width apart. Extend arms overhead and place hands together.","2. Starting in a bridged position, lock the arms and shoulder together as a unit and drive the hands and chest to the side rotating the body and rolling the ball backwards until you are on the side of your shoulder. Keep the hips bridged at all times.","3. Reverse the pattern and return to the starting position.","4. Repeat on the other side. Maintain posture throughout. Ensure balance, posture and control of the stability ball are maintained. Avoid turning the feet, dropping the hips, or using momentum."]}},{"id":"68aef686-12f0-470d-bcb2-abab20c82fbb","name":"Seated Leg Curl","slug":"seated-leg-curl","description":"Step 1: Sit in the leg curl machine with feet hip width apart, abs drawn in and braced and toes pulled toward the nose. Ensure setup positions knee close to hinge on the machine and pad resting on lower calf/achilles.\n\nStep 2: Position head in line with the back and lock shoulder blades back and down. Drive the heels down toward the glutes as far as possible without arching the lower back.\n\nStep 3: Reverse the pattern and lower the weight back to the starting position. Maintain posture throughout.\n\nStep 4: Repeat for the desired number of repetitions. Avoid overarching the lower back, pointing or turning the toes out or jutting the chin forward.","coachingCues":[],"primaryEquipment":["Leg Curl Machine"],"muscleGroups":["glutes","hamstrings"],"imageUrl":"https://img.youtube.com/vi/_2Kd0d-JEUM/hqdefault.jpg","videoId":"_2Kd0d-JEUM","videoUrl":"https://www.youtube.com/watch?v=_2Kd0d-JEUM","videoThumbnailUrl":"https://img.youtube.com/vi/_2Kd0d-JEUM/hqdefault.jpg","candidatePhotoUrl":"/images/exercises/seated-leg-curl.jpg","hasCandidatePhoto":true,"warnings":[],"ytTitle":"How to do a Seated Leg Curl  | Proper Form & Technique | NASM","ytAuthor":"National Academy of Sports Medicine (NASM)","ytStatus":"OK","card":{"category":"Arms","phase":"Phase 1: Stabilization · Phase 2: Strength Endurance · Phase 3: Hypertrophy","primeMover":"Biceps Brachii","kineticCheckpoints":{"feetAnkles":"Shoulder-width, firmly planted on ground.","knees":"Aligned with second and third toes.","lphc":"Neutral lumbar spine; core braced.","shoulders":"Retracted and depressed into athletic posture.","headNeck":"Neutral cervical spine, chin packed."},"clinicalCues":["Maintain neutral kinetic chain checkpoints throughout.","Control the 2-second eccentric lowering phase.","Exhale on exertion while maintaining intra-abdominal brace."],"howToSteps":["1. Sit in the leg curl machine with feet hip width apart, abs drawn in and braced and toes pulled toward the nose. Ensure setup positions knee close to hinge on the machine and pad resting on lower calf/achilles.","2. Position head in line with the back and lock shoulder blades back and down. Drive the heels down toward the glutes as far as possible without arching the lower back.","3. Reverse the pattern and lower the weight back to the starting position. Maintain posture throughout.","4. Repeat for the desired number of repetitions. Avoid overarching the lower back, pointing or turning the toes out or jutting the chin forward."]}},{"id":"500d28b2-dc9d-402b-9c0f-48f399ccd61d","name":"Seated Machine Row Close Grip","slug":"seated-machine-row-close-grip","description":"Step 1: Sit tall with good posture on the bench and place your feet on the platform with a slight bend in the knee. Grip handles so palms face one another. Draw in and brace the abs. Lock the shoulder blades back and down and align the head with the spine.\n\nStep 2: Slowly pull the handles back to a comfortable range of motion driving the hands toward the lower ribs and pinching the shoulder blades together.\n\nStep 3: Reverse the pattern and return to the starting position.\n\nStep 4: Repeat. Maintain posture throughout. Avoid jutting the chin forward, arching or slouching the lower back, letting the shoulders round or shrug, or leaning forward at the waist/spine and creating momentum.","coachingCues":[],"primaryEquipment":["Seated Cable Row Machine"],"muscleGroups":["back","biceps","triceps"],"imageUrl":"https://img.youtube.com/vi/k0cTJCfxa0Y/hqdefault.jpg","videoId":"k0cTJCfxa0Y","videoUrl":"https://www.youtube.com/watch?v=k0cTJCfxa0Y","videoThumbnailUrl":"https://img.youtube.com/vi/k0cTJCfxa0Y/hqdefault.jpg","candidatePhotoUrl":"/images/exercises/seated-machine-row-close-grip.jpg","hasCandidatePhoto":true,"warnings":[],"ytTitle":"How to Do a Seated Machine Row: Close Grip","ytAuthor":"National Academy of Sports Medicine (NASM)","ytStatus":"OK","card":{"category":"Back","phase":"Phase 1: Stabilization · Phase 2: Strength Endurance · Phase 3: Hypertrophy","primeMover":"Latissimus Dorsi, Rhomboids & Middle Trapezius","kineticCheckpoints":{"feetAnkles":"Shoulder-width, firmly planted on ground.","knees":"Aligned with second and third toes.","lphc":"Neutral lumbar spine; core braced.","shoulders":"Retracted and depressed into athletic posture.","headNeck":"Neutral cervical spine, chin packed."},"clinicalCues":["Maintain neutral kinetic chain checkpoints throughout.","Control the 2-second eccentric lowering phase.","Exhale on exertion while maintaining intra-abdominal brace."],"howToSteps":["1. Sit tall with good posture on the bench and place your feet on the platform with a slight bend in the knee. Grip handles so palms face one another. Draw in and brace the abs. Lock the shoulder blades back and down and align the head with the spine.","2. Slowly pull the handles back to a comfortable range of motion driving the hands toward the lower ribs and pinching the shoulder blades together.","3. Reverse the pattern and return to the starting position.","4. Repeat. Maintain posture throughout. Avoid jutting the chin forward, arching or slouching the lower back, letting the shoulders round or shrug, or leaning forward at the waist/spine and creating momentum."]}},{"id":"fdc31a21-db47-47dd-a795-1df00cdf9550","name":"Seated Row","slug":"seated-row-0210","description":"Step 1: Setup Sit on the seated row machine with your feet flat on the footrests and knees slightly bent.\n\nStep 2: Brace/Position Grasp the handles with an overhand grip, keeping your back straight and shoulders retracted.\n\nStep 3: Execute Pull the handles towards your torso, squeezing your shoulder blades together while keeping your elbows close to your body.\n\nStep 4: Return/Repeat Slowly extend your arms back to the starting position, maintaining control throughout the movement.","coachingCues":[],"primaryEquipment":[],"muscleGroups":["back","biceps"],"imageUrl":"https://img.youtube.com/vi/0R9ZQd3aM6s/hqdefault.jpg","videoId":"0R9ZQd3aM6s","videoUrl":"https://www.youtube.com/watch?v=0R9ZQd3aM6s","videoThumbnailUrl":"https://img.youtube.com/vi/0R9ZQd3aM6s/hqdefault.jpg","candidatePhotoUrl":"/images/exercises/seated-row.jpg","hasCandidatePhoto":true,"warnings":[],"ytTitle":"How to do a Seated Row","ytAuthor":"National Academy of Sports Medicine (NASM)","ytStatus":"OK","card":{"category":"Back","phase":"Phase 1 (Stabilization Endurance), Phase 2 (Strength Endurance), Phase 3 (Hypertrophy)","primeMover":"Latissimus Dorsi, Rhomboids, Middle Trapezius","kineticCheckpoints":{"feetAnkles":"Placed firmly against footplates with knees softly bent.","knees":"Soft 15°–20° bend; never hyper-extended or locked out.","lphc":"Upright vertical spine; zero slumping or excessive backward lean.","shoulders":"Shoulder blades retracted and depressed into back pockets.","headNeck":"Neutral neck in line with tall spine."},"clinicalCues":["Maintain an upright vertical torso throughout; avoid leaning back past 10°.","Lead with elbows and initiate with scapular retraction before bending arms.","Keep shoulders depressed down away from ears."],"howToSteps":["1. Setup Sit on the seated row machine with your feet flat on the footrests and knees slightly bent.","2. Brace/Position Grasp the handles with an overhand grip, keeping your back straight and shoulders retracted.","3. Execute Pull the handles towards your torso, squeezing your shoulder blades together while keeping your elbows close to your body.","4. Return/Repeat Slowly extend your arms back to the starting position, maintaining control throughout the movement."]}},{"id":"c4d741bc-93c2-468e-8167-9c84d73db6e3","name":"Seated Single Arm Dumbbell Tricep Extension","slug":"seated-single-arm-dumbbell-tricep-extension-0112","description":"Step 1: Setup Sit on a bench or chair with your feet flat on the floor, holding a dumbbell in one hand.\n\nStep 2: Brace/Position Raise the dumbbell overhead with your elbow close to your ear, keeping your core engaged and back straight.\n\nStep 3: Execute Lower the dumbbell behind your head by bending your elbow, ensuring your upper arm remains stationary.\n\nStep 4: Return/Repeat Extend your arm back to the starting position, then repeat for the desired number of repetitions before switching arms.","coachingCues":[],"primaryEquipment":["Dumbbells"],"muscleGroups":["triceps"],"imageUrl":"https://img.youtube.com/vi/kZ-ReOdn2qk/hqdefault.jpg","videoId":"kZ-ReOdn2qk","videoUrl":"https://www.youtube.com/watch?v=kZ-ReOdn2qk","videoThumbnailUrl":"https://img.youtube.com/vi/kZ-ReOdn2qk/hqdefault.jpg","candidatePhotoUrl":"/images/exercises/overhead-triceps-extension.jpg","hasCandidatePhoto":true,"warnings":[],"ytTitle":"How to do a Seated Single-Arm Dumbbell Tricep Extension","ytAuthor":"National Academy of Sports Medicine (NASM)","ytStatus":"OK","card":{"category":"Arms","phase":"Phase 1: Stabilization · Phase 2: Strength Endurance · Phase 3: Hypertrophy","primeMover":"Triceps Brachii","kineticCheckpoints":{"feetAnkles":"Shoulder-width, firmly planted on ground.","knees":"Aligned with second and third toes.","lphc":"Neutral lumbar spine; core braced.","shoulders":"Retracted and depressed into athletic posture.","headNeck":"Neutral cervical spine, chin packed."},"clinicalCues":["Maintain neutral kinetic chain checkpoints throughout.","Control the 2-second eccentric lowering phase.","Exhale on exertion while maintaining intra-abdominal brace."],"howToSteps":["1. Setup Sit on a bench or chair with your feet flat on the floor, holding a dumbbell in one hand.","2. Brace/Position Raise the dumbbell overhead with your elbow close to your ear, keeping your core engaged and back straight.","3. Execute Lower the dumbbell behind your head by bending your elbow, ensuring your upper arm remains stationary.","4. Return/Repeat Extend your arm back to the starting position, then repeat for the desired number of repetitions before switching arms."]}},{"id":"2c5e5351-a02f-49ba-8c39-e311279276aa","name":"Self Myofascial Release Smr Hamstrings","slug":"self-myofascial-release-smr-hamstrings-0226","description":"Step 1: Setup Sit on the floor with your legs extended straight in front of you, placing a foam roller under your hamstrings.\n\nStep 2: Brace/Position Engage your core and maintain a neutral spine while positioning your hands behind you for support.\n\nStep 3: Execute Slowly roll the foam roller from the back of your knees to the glutes, applying pressure to the hamstrings for 30 seconds to 2 minutes.\n\nStep 4: Return/Repeat Reverse the movement, rolling back down to the knees, then repeat the process for additional time as needed.","coachingCues":[],"primaryEquipment":[],"muscleGroups":["glutes","hamstrings","quadriceps"],"imageUrl":"https://img.youtube.com/vi/_M29fhv3LoI/hqdefault.jpg","videoId":"_M29fhv3LoI","videoUrl":"https://www.youtube.com/watch?v=_M29fhv3LoI","videoThumbnailUrl":"https://img.youtube.com/vi/_M29fhv3LoI/hqdefault.jpg","candidatePhotoUrl":"/images/exercises/self-myofascial-release-smr-hamstrings.jpg","hasCandidatePhoto":true,"warnings":[],"ytTitle":"How to do Self Myofascial Release (SMR) Hamstrings","ytAuthor":"National Academy of Sports Medicine (NASM)","ytStatus":"OK","card":{"category":"Flexibility/SMR","phase":"Phase 1: Stabilization · Phase 2: Strengt ush floor away to avoid winging.","headNeck":"Neutral cervical spine; chin tucked gazing at hands."},"clinicalCues":["Pull navel to spine and squeeze glutes hard to lock pelvis in neutral position.","Push floor away with forearms to prevent shoulder blades from collapsing.","Do not hold breath; breathe smoothly into abdomen."],"howToSteps":["1. Setup Lie on your side with your legs extended straight, stacking your feet on top of each other, and place your elbow directly under your shoulder.","2. Brace/Position Engage your core and lift your hips off the ground, forming a straight line from your head to your feet.","3. Execute Hold the position, ensuring your shoulder is aligned with your elbow and your body remains straight without sagging or twisting.","4. Return/Repeat Lower your hips back to the ground to rest, then repeat for the desired number of repetitions before switching sides."]}},{"id":"13c261b3-5fec-4e1e-8622-221a669581bc","name":"Single Arm Dumbbell Chest Press","slug":"single-arm-dumbbell-chest-press","description":"Step 1: Lie supine with neutral spine on a bench with your feet straight and flat on the floor. Draw in and brace the abs and lock the shoulders blades back and down on the bench. Hold the dumbbell at approximately shoulder level to begin slightly out to the sides of the body in line with the chest.\n\nStep 2: Press the dumbbell up and in until the arm is completely extended ending with it directly above the shoulder.\n\nStep 3: Reverse the pattern and return the starting position.\n\nStep 4: Repeat. Maintain posture throughout. Do not arch the back or jut the head forward. Avoid letting the shoulders round, posture shift or feet lift in the air. Keep the elbow under the dumbbell to maintain balance at all times.","coachingCues":[],"primaryEquipment":["Bench","Dumbbells"],"muscleGroups":["chest","shoulders","triceps"],"imageUrl":"https://img.youtube.com/vi/qFTnmyC-nf4/hqdefault.jpg","videoId":"qFTnmyC-nf4","videoUrl":"https://www.youtube.co ck the shoulders blades back and down on the bench. Hold the dumbbell at approximately shoulder level to begin slightly out to the sides of the body in line with the chest.","2. Press the dumbbell up and in until the arm is completely extended ending with it directly above the shoulder.","3. Reverse the pattern and return the starting position.","4. Repeat. Maintain posture throughout. Do not arch the back or jut the head forward. Avoid letting the shoulders round, posture shift or feet lift in the air. Keep the elbow under the dumbbell to maintain balance at all times."]}},{"id":"40cb1549-060d-4b6d-8798-6e2f14a954da","name":"Single Arm Kettlebell High Pull","slug":"single-arm-kettlebell-high-pull-0148","description":"Step 1: Setup Stand with your feet shoulder-width apart, holding a kettlebell in one hand with a neutral grip, positioned between your feet.\n\nStep 2: Brace/Position Hinge at your hips while keeping your back straight, allowing the kettlebell to swing slightly back between your legs, and engage your core.\n\nStep 3: Execute Drive through your hips to propel the kettlebell upward, pulling it towards your shoulder while keeping your elbow above your wrist and your arm close to your body.\n\nStep 4: Return/Repeat Lower the kettlebell back down in a controlled manner, allowing it to swing back between your legs before repeating the movement for the desired number of repetitions.","coachingCues":[],"primaryEquipment":["Kettlebell"],"muscleGroups":["glutes","hamstrings","quadriceps"],"imageUrl":"https://img.youtube.com/vi/mP1BHxBeAEM/hqdefault.jpg","videoId":"mP1BHxBeAEM","videoUrl":"https://www.youtube.com/watch?v=mP1BHxBeAEM","videoThumbnailUrl":"https://img.youtube.com/vi/mP1BHxBeAEM/hqdefault.jpg","candidatePhotoUrl":"/images/exercises/single-arm-kettlebell-high-pull.jpg","hasCandidatePhoto":true,"warnings":[],"ytTitle":"How to do a Single-Arm Kettlebell High Pull","ytAuthor":"National Academy of Sports Medicine (NASM)","ytStatus":"OK","card":{"category":"Back","phase":"Phase 1: Stabilization · Phase 2: Strength Endurance · Phase 3: Hypertrophy","primeMover":"Latissimus Dorsi, Rhomboids & Middle Trapezius","kineticCheckpoints":{"feetAnkles":"Shoulder-width, firmly planted on ground.","knees":"Aligned with second and third toes.","lphc":"Neutral lumbar spine; core braced.","shoulders":"Retracted and depressed into athletic posture.","headNeck":"Neutral cervical spine, chin packed."},"clinicalCues":["Maintain neutral kinetic chain checkpoints throughout.","Control the 2-second eccentric lowering phase.","Exhale on exertion while maintaining intra-abdominal brace."],"howToSteps":["1. Setup Stand with your feet shoulder-width apart, holding a kettlebell in one hand with a neutral grip, positioned between your feet.","2. Brace/Position Hinge at your hips while keeping your back straight, allowing the kettlebell to swing slightly back between your legs, and engage your core.","3. Execute Drive through your hips to propel the kettlebell upward, pulling it towards your shoulder while keeping your elbow above your wrist and your arm close to your body.","4. Return/Repeat Lower the kettlebell back down in a controlled manner, allowing it to swing back between your legs before repeating the movement for the desired number of repetitions."]}},{"id":"edeb2418-0ff6-4280-bab8-6387209df81e","name":"Single Arm Kettlebell Swing","slug":"single-arm-kettlebell-swing-0149","description":"Step 1: Setup Stand with your feet shoulder-width apart, holding a kettlebell in one hand with a neutral grip, and position it slightly in front of you.\n\nStep 2: Brace/Position Hinge at the hips, keeping your back flat and core engaged, while allowing the kettlebell to swing back between your legs.\n\nStep 3: Execute Forcefully drive your hips forward, swinging the kettlebell upward to shoulder height while keeping your arm straight and your core tight.\n\nStep 4: Return/Repeat Allow the kettlebell to swing back down between your legs, maintaining control, and repeat the movement for the desired number of repetitions.","coachingCues":[],"primaryEquipment":["Kettlebell"],"muscleGroups":["back","glutes","hamstrings","quadriceps","shoulders"],"imageUrl":"https://img.youtube.com/vi/r777bo9KuY4/hqdefault.jpg","videoId":"r777bo9KuY4","videoUrl":"https://www.youtube.com/watch?v=r777bo9KuY4","videoThumbnailUrl":"https://img.youtube.com/vi/r777bo9KuY4/hqdefault.jpg","candidatePhotoUrl":"/images/exercises/single-arm-kettlebell-swing.jpg","hasCandidatePhoto":true,"warnings":[],"ytTitle":"How to do a Single-Arm Kettlebell Swing","ytAuthor":"National Academy of Sports Medicine (NASM)","ytStatus":"OK","card":{"category":"Back","phase":"Phase 1: Stabilization · Phase 2: Strength Endurance · Phase 3: Hypertrophy","primeMover":"Latissimus Dorsi, Rhomboids & Middle Trapezius","kineticCheckpoints":{"feetAnkles":"Shoulder-width, firmly planted on ground.","knees":"Aligned with second and third toes.","lphc":"Neutral lumbar spine; core braced.","shoulders":"Retracted and depressed into athletic posture.","headNeck":"Neutral cervical spine, chin packed."},"clinicalCues":["Maintain neutral kinetic chain checkpoints throughout.","Control the 2-second eccentric lowering phase.","Exhale on exertion while maintaining intra-abdominal brace."],"howToSteps":["1. Setup Stand with your feet shoulder-width apart, holding a kettlebell in one hand with a neutral grip, and position it slightly in front of you.","2. Brace/Position Hinge at the hips, keeping your back flat and core engaged, while allowing the kettlebell to swing back between your legs.","3. Execute Forcefully drive your hips forward, swinging the kettlebell upward to shoulder height while keeping your arm straight and your core tight.","4. Return/Repeat Allow the kettlebell to swing back down between your legs, maintaining control, and repeat the movement for the desired number of repetitions."]}},{"id":"8959e7d1-cbd7-41e6-8ce6-31f47f9856b2","name":"Single Arm Standing Chest Press","slug":"single-arm-standing-chest-press-0208","description":"Step 1: Setup Stand with your feet shoulder-width apart, holding a dumbbell in one hand at chest level with your elbow bent and palm facing forward.\n\nStep 2: Brace/Position Engage your core and maintain a neutral spine, ensuring your shoulder is down and back to stabilize your upper body.\n\nStep 3: Execute Press the dumbbell forward until your arm is fully extended, keeping your wrist straight and elbow slightly bent at the top of the movement.\n\nStep 4: Return/Repeat Slowly return the dumbbell to the starting position at chest level, maintaining control throughout the movement, and repeat for the desired number of repetitions.","coachingCues":[],"primaryEquipment":[],"muscleGroups":["chest","shoulders","triceps"],"imageUrl":"https://img.youtube.com/vi/K88He59YVto/hqdefault.jpg","videoId":"K88He59YVto","videoUrl":"https://www.youtube.com/watch?v=K88He59YVto","videoThumbnailUrl":"https://img.youtube.com/vi/K88He59YVto/hqdefault.jpg","candidatePhotoUrl":"/images/exercises/single-arm-standing-chest-press.jpg","hasCandidatePhoto":true,"warnings":[],"ytTitle":"How to do a Single-Arm Standing Chest Press","ytAuthor":"National Academy of Sports Medicine (NASM)","ytStatus":"OK","card":{"category":"Chest","phase":"Phase 1: Stabilization · Phase 2: Strength Endurance · Phase 3: Hypertrophy","primeMover":"Pectoralis Major / Anterior Deltoid","kineticCheckpoints":{"feetAnkles":"Shoulder-width, firmly planted on ground.","knees":"Aligned with second and third toes.","lphc":"Neutral lumbar spine; core braced.","shoulders":"Retracted and depressed into athletic posture.","headNeck":"Neutral cervical spine, chin packed."},"clinicalCues":["Maintain neutral kinetic chain checkpoints throughout.","Control the 2-second eccentric lowering phase.","Exhale on exertion while maintaining intra-abdominal brace."],"howToSteps":["1. Setup Stand with your feet shoulder-width apart, holding a dumbbell in one hand at chest level with your elbow bent and palm facing forward.","2. Brace/Position Engage your core and maintain a neutral spine, ensuring your shoulder is down and back to stabilize your upper body.","3. Execute Press the dumbbell forward until your arm is fully extended, keeping your wrist straight and elbow slightly bent at the top of the movement.","4. Return/Repeat Slowly return the dumbbell to the starting position at chest level, maintaining control throughout the movement, and repeat for the desired number of repetitions."]}},{"id":"b6587b7d-98fb-4020-b3e2-06f1efc1192f","name":"Single Arm Standing Row With Rotation","slug":"single-arm-standing-row-with-rotation-0209","description":"Step 1: Setup Stand with feet hip-width apart, holding a dumbbell in one hand, and hinge slightly at the hips while keeping your back straight.\n\nStep 2: Brace/Position Engage your core and rotate your torso towards the side holding the dumbbell, ensuring your shoulder is down and back.\n\nStep 3: Execute Pull the dumbbell towards your hip while rotating your torso back to the starting position, squeezing your shoulder blade at the top of the movement.\n\nStep 4: Return/Repeat Lower the dumbbell back to the starting position with control, then repeat for the desired number of repetitions before switching sides.","coachingCues":[],"primaryEquipment":[],"muscleGroups":["back","biceps"],"imageUrl":"https://img.youtube.com/vi/8fAJEs3L110/hqdefault.jpg","videoId":"8fAJEs3L110","videoUrl":"https://www.youtube.com/watch?v=8fAJEs3L110","videoThumbnailUrl":"https://img.youtube.com/vi/8fAJEs3L110/hqdefault.jpg","candidatePhotoUrl":"/images/exercises/single-arm-standing-row-with-rotation.jpg","hasCandidatePhoto":true,"warnings":[],"ytTitle":"How to do a Single-Arm Standing Row with Rotation","ytAuthor":"National Academy of Sports Medicine (NASM)","ytStatus":"OK","card":{"category":"Back","phase":"Phase 1: Stabilization · Phase 2: Strength Endurance · Phase 3: Hypertrophy","primeMover":"Latissimus Dorsi, Rhomboids & Middle Trapezius","kineticCheckpoints":{"feetAnkles":"Shoulder-width, firmly planted on ground.","knees":"Aligned with second and third toes.","lphc":"Neutral lumbar spine; core braced.","shoulders":"Retracted and depressed into athletic posture.","headNeck":"Neutral cervical spine, chin packed."},"clinicalCues":["Maintain neutral kinetic chain checkpoints throughout.","Control the 2-second eccentric lowering phase.","Exhale on exertion while maintaining intra-abdominal brace."],"howToSteps":["1. Setup Stand with feet hip-width apart, holding a dumbbell in one hand, and hinge slightly at the hips while keeping your back straight.","2. Brace/Position Engage your core and rotate your torso towards the side holding the dumbbell, ensuring your shoulder is down and back.","3. Execute Pull the dumbbell towards your hip while rotating your torso back to the starting position, squeezing your shoulder blade at the top of the movement.","4. Return/Repeat Lower the dumbbell back to the starting position with control, then repeat for the desired number of repetitions before switching sides."]}},{"id":"b27e0212-e95e-4fa7-bb08-159108200451","name":"Single Leg Balance Reach Frontal Plane","slug":"single-leg-balance-reach-frontal-plane","description":"Step 1: Setup Stand on one leg with a slight knee bend, lifting the opposite foot off the floor, Stand in athletic posture on one foot with hands on hips, toe pointed straight forward, neutral spine, and abs drawn in.\n\nStep 2: Brace/Position Engage your core, level your pelvis with your stance glute, and maintain single-leg balance. Move the floating foot to the side as far as possible without compromising posture.\n\nStep 3: Reverse the movement and return to starting position.\n\nStep 4: Repeat. Maintain posture throughout. Ensure toes are forward at all times, hips stay level and balance is maintained.","coachingCues":[],"primaryEquipment":["None"],"muscleGroups":["core","glutes"],"imageUrl":"https://img.youtube.com/vi/UrB5wA7B3hI/hqdefault.jpg","videoId":"UrB5wA7B3hI","videoUrl":"https://www.youtube.com/watch?v=UrB5wA7B3hI","videoThumbnailUrl":"https://img.youtube.com/vi/UrB5wA7B3hI/hqdefault.jpg","candidatePhotoUrl":"/images/exercises/single-leg-balance-reach-frontal-plane.jpg","hasCandidatePhoto":true,"warnings":[],"ytTitle":"Single-Leg Balance Reach: Frontal Plane","ytAuthor":"National Academy of Sports Medicine (NASM)","ytStatus":"OK","card":{"category":"Legs","phase":"Phase 1: Stabilization · Phase 2: Strength Endurance · Phase 3: Hypertrophy","primeMover":"Quadriceps & Gluteus Maximus","kineticCheckpoints":{"feetAnkles":"Shoulder-width, firmly planted on ground.","knees":"Aligned with second and third toes.","lphc":"Neutral lumbar spine; core braced.","shoulders":"Retracted and depressed into athletic posture.","headNeck":"Neutral cervical spine, chin packed."},"clinicalCues":["Maintain neutral kinetic chain checkpoints throughout.","Control the 2-second eccentric lowering phase.","Exhale on exertion while maintaining intra-abdominal brace."],"howToSteps":["1. Setup Stand on one leg with a slight knee bend, lifting the opposite foot off the floor, Stand in athletic posture on one foot with hands on hips, toe pointed straight forward, neutral spine, and abs drawn in.","2. Brace/Position Engage your core, level your pelvis with your stance glute, and maintain single-leg balance. Move the floating foot to the side as far as possible without compromising posture.","3. Reverse the movement and return to starting position.","4. Repeat. Maintain posture throughout. Ensure toes are forward at all times, hips stay level and balance is maintained."]}},{"id":"3e514855-e4eb-4e27-b39a-084dfc5f3add","name":"Single Leg Balance Reach Multiplanar","slug":"single-leg-balance-reach-multiplanar-0031","description":"Step 1: Setup Stand on your right leg with a slight bend in the knee, keeping your left leg lifted behind you and your arms at your sides.\n\nStep 2: Brace/Position Engage your core, maintain an upright posture, and focus your gaze on a fixed point in front of you to enhance stability.\n\nStep 3: Execute Slowly reach your left leg out to the side, forward, and then backward while maintaining balance on your right leg, keeping your torso upright throughout the movement.\n\nStep 4: Return/Repeat Return to the starting position after each reach, then repeat the sequence for the desired number of repetitions before switching to the left leg.","coachingCues":[],"primaryEquipment":[],"muscleGroups":["core","glutes"],"imageUrl":"https://img.youtube.com/vi/Mo4P9Y_AQt8/hqdefault.jpg","videoId":"Mo4P9Y_AQt8","videoUrl":"https://www.youtube.com/watch?v=Mo4P9Y_AQt8","videoThumbnailUrl":"https://img.youtube.com/vi/Mo4P9Y_AQt8/hqdefault.jpg","candidatePhotoUrl":"/images/exercises/single-leg-balance-reach-multiplanar.jpg","hasCandidatePhoto":true,"warnings":[],"ytTitle":"How to do a  Single Leg Balance Reach Multiplanar","ytAuthor":"National Academy of Sports Medicine (NASM)","ytStatus":"OK","card":{"category":"Legs","phase":"Phase 1: Stabilization · Phase 2: Strength Endurance · Phase 3: Hypertrophy","primeMover":"Quadriceps & Gluteus Maximus","kineticCheckpoints":{"feetAnkles":"Shoulder-width, firmly planted on ground.","knees":"Aligned with second and third toes.","lphc":"Neutral lumbar spine; core braced.","shoulders":"Retracted and depressed into athletic posture.","headNeck":"Neutral cervical spine, chin packed."},"clinicalCues":["Maintain neutral kinetic chain checkpoints throughout.","Control the 2-second eccentric lowering phase.","Exhale on exertion while maintaining intra-abdominal brace."],"howToSteps":["1. Setup Stand on your right leg with a slight bend in the knee, keeping your left leg lifted behind you and your arms at your sides.","2. Brace/Position Engage your core, maintain an upright posture, and focus your gaze on a fixed point in front of you to enhance stability.","3. Execute Slowly reach your left leg out to the side, forward, and then backward while maintaining balance on your right leg, keeping your torso upright throughout the movement.","4. Return/Repeat Return to the starting position after each reach, then repeat the sequence for the desired number of repetitions before switching to the left leg."]}},{"id":"4fbd7757-c680-4f4d-a1ac-f2d3e9e2e808","name":"Single Leg Balance Reach Transverse","slug":"single-leg-balance-reach-transverse-0035","description":"Step 1: Setup Stand on your right leg with a slight bend in the knee, keeping your left leg lifted behind you and your arms at your sides.\n\nStep 2: Brace/Position Engage your core and maintain an upright posture, ensuring your hips are level and your shoulders are back.\n\nStep 3: Execute Reach your left leg out to the side while bending at the hip and extending your torso forward, keeping your right leg stable and your arms extended in front for balance.\n\nStep 4: Return/Repeat Return to the starting position by driving your left leg back and raising your torso, then repeat for the desired number of repetitions before switching to the left leg.","coachingCues":[],"primaryEquipment":[],"muscleGroups":["core","glutes"],"imageUrl":"https://img.youtube.com/vi/V8n50DGrxfI/hqdefault.jpg","videoId":"V8n50DGrxfI","videoUrl":"https://www.youtube.com/watch?v=V8n50DGrxfI","videoThumbnailUrl":"https://img.youtube.com/vi/V8n50DGrxfI/hqdefault.jpg","candidatePhotoUrl":"/images/exercises/single-leg-balance-reach-transverse.jpg","hasCandidatePhoto":true,"warnings":[],"ytTitle":"How to do a Single Leg Balance Reach Transverse","ytAuthor":"National Academy of Sports Medicine (NASM)","ytStatus":"OK","card":{"category":"Legs","phase":"Phase 1: Stabilization · Phase 2: Strength Endurance · Phase 3: Hypertrophy","primeMover":"Quadriceps & Gluteus Maximus","kineticCheckpoints":{"feetAnkles":"Shoulder-width, firmly planted on ground.","knees":"Aligned with second and third toes.","lphc":"Neutral lumbar spine; core braced.","shoulders":"Retracted and depressed into athletic posture.","headNeck":"Neutral cervical spine, chin packed."},"clinicalCues":["Maintain neutral kinetic chain checkpoints throughout.","Control the 2-second eccentric lowering phase.","Exhale on exertion while maintaining intra-abdominal brace."],"howToSteps":["1. Setup Stand on your right leg with a slight bend in the knee, keeping your left leg lifted behind you and your arms at your sides.","2. Brace/Position Engage your core and maintain an upright posture, ensuring your hips are level and your shoulders are back.","3. Execute Reach your left leg out to the side while bending at the hip and extending your torso forward, keeping your right leg stable and your arms extended in front for balance.","4. Return/Repeat Return to the starting position by driving your left leg back and raising your torso, then repeat for the desired number of repetitions before switching to the left leg."]}},{"id":"64be99d5-c183-4327-975d-27f2d161416a","name":"Single Leg Cobra To Hip Extension","slug":"single-leg-cobra-to-hip-extension-0028","description":"Step 1: Setup Lie face down on a mat with your arms extended in front of you and legs straight, engaging your core.\n\nStep 2: Brace/Position Bend your right knee and lift your right foot off the ground, keeping your left leg extended and your hips square to the floor.\n\nStep 3: Execute Raise your chest and right leg off the ground simultaneously, extending your right hip and squeezing your glutes at the top of the movement.\n\nStep 4: Return/Repeat Lower your chest and right leg back to the starting position, then switch to the left leg and repeat the movement.","coachingCues":[],"primaryEquipment":[],"muscleGroups":["core","glutes","hamstrings"],"imageUrl":"https://img.youtube.com/vi/fY64Qk6IfMk/hqdefault.jpg","videoId":"fY64Qk6IfMk","videoUrl":"https://www.youtube.com/watch?v=fY64Qk6IfMk","videoThumbnailUrl":"https://img.youtube.com/vi/fY64Qk6IfMk/hqdefault.jpg","candidatePhotoUrl":"/images/exercises/single-leg-cobra-to-
