<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Gordon Athletic Advisory</title>
    <meta name="theme-color" content="#0A0E18" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <style>
      :root {
        --navy: #0A0E18;
        --gold: #D4AF37;
        --white: #F5F0E8;
        --gray: #8A99AA;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        background: #0A0E18;
        color: var(--white);
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 24px;
        text-align: center;
        -webkit-font-smoothing: antialiased;
      }
      .container {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 18px;
        max-width: 360px;
      }
      .logo {
        width: 100px;
        height: 100px;
        border-radius: 22px;
        box-shadow: 0 16px 40px rgba(212, 175, 55, 0.25);
        border: 1.5px solid rgba(212, 175, 55, 0.4);
      }
      h1 {
        font-size: 24px;
        letter-spacing: 0.08em;
        margin: 0;
        color: #FFFFFF;
        text-transform: uppercase;
        font-weight: 800;
      }
      .subtitle {
        color: var(--gray);
        font-size: 13px;
        margin: 0;
        line-height: 1.5;
        letter-spacing: 0.02em;
      }
      .spinner {
        width: 32px;
        height: 32px;
        border: 3px solid rgba(212, 175, 55, 0.2);
        border-top-color: var(--gold);
        border-radius: 50%;
        animation: spin 0.75s linear infinite;
        margin-top: 12px;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <img src="favicon.png" alt="Gordon Athletic Advisory" class="logo" />
      <h1>Gordon Athletic Advisory</h1>
      <p class="subtitle">Autonomous Sports Science, HealthKit Telemetry &amp; Biomechanical Intelligence</p>
      <div class="spinner"></div>
    </div>

    <script>
      const PRODUCTION_URL = 'https://gordonathleticadvisory.com';
      setTimeout(() => {
        window.location.replace(PRODUCTION_URL);
      }, 100);
    </script>
  </body>
</html>
